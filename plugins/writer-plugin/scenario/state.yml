initial: __start__

transitions:
  __start__:
    - to: build_context

  build_context:
    - to: generate_outline

  generate_outline:
    - to: plan_sections

  plan_sections:
    - to: generate_draft

  generate_draft:
    - to: finalize_report

  finalize_report:
    - to: __end__

steps:
  build_context:
    label: Build Context
    prompt: |
      {{runtime_instruction}}

      This step produces three artifacts: writing_task, resource_profiles, and writing_context.

      Step 1: Call writer_build_writing_task(query="{{user_input}}") to get the writing_task path, then persist it with save_artifact(content_type='file', key='writing_task').

      Step 2: Call writer_profile_resources(writing_task_path=<writing_task path>, user_input="{{user_input}}") to get the resource_profiles path, then persist it with save_artifact(content_type='file', key='resource_profiles').

      Step 3: Call writer_create_writing_context(writing_task_path=<writing_task path>, resource_profiles_path=<resource_profiles path>) to get the writing_context path, then persist it with save_artifact(content_type='file', key='writing_context').

      If any of the above tool calls fails, do not perform any extra fallback — stop the step immediately. In particular, do not write content yourself to persist.
    tools:
      - writer_build_writing_task
      - writer_profile_resources
      - writer_create_writing_context
    outputs:
      - material: writing_task
      - material: resource_profiles
      - material: writing_context
    acceptance_criteria: |
      All three artifacts present: writing_task, resource_profiles, writing_context.

  generate_outline:
    label: Generate Outline
    prompt: |
      {{runtime_instruction}}

      This step generates a structured outline from writing_task + writing_context, then syncs the outline content back into the writing context. Call get_artifact to retrieve writing_task and writing_context, pass them to writer_generate_outline(writing_task_path=<writing_task path>, writing_context_path=<writing_context path>), and obtain the outline path.

      After the outline is generated, call writer_update_writing_context(content_artifact_path=<outline path>, writing_context_path=<original writing_context path>) and obtain the updated writing_context path.

      Once all generation operations in this step are complete, call save_artifact(content_type='file', key='outline') to save the outline path, then call save_artifact(content_type='file', key='writing_context_after_outline') to save the updated context as a new material.

      If any of the above tool calls fails, do not perform any extra fallback — stop the step immediately. In particular, do not write content yourself to persist.
    tools:
      - writer_generate_outline
      - writer_update_writing_context
    inputs:
      - material: writing_task
        required: true
      - material: writing_context
        required: true
    outputs:
      - material: outline
      - material: writing_context_after_outline
    acceptance_criteria: |
      Both artifacts present: outline, writing_context_after_outline.

  plan_sections:
    label: Plan Sections
    prompt: |
      {{runtime_instruction}}

      This step generates writing instructions for every top-level section in the outline in a single batch. Call get_artifact to retrieve writing_context_after_outline and outline, and pass writing_context_after_outline wherever the tool expects writing_context_path. When this step is rerun, use the runtime instruction as additional planning guidance.

      Then call writer_generate_section_instructions(outline_path=<outline path>, writing_context_path=<writing_context_after_outline path>) and persist the returned path with save_artifact(content_type='file', key='section_instructions').

      If any of the above tool calls fails, do not perform any extra fallback — stop the step immediately. In particular, do not write content yourself to persist.
    tools:
      - writer_generate_section_instructions
    inputs:
      - material: outline
        required: true
      - material: writing_context_after_outline
        required: true
    outputs:
      - material: section_instructions
    acceptance_criteria: |
      Artifact present: section_instructions.

  generate_draft:
    label: Generate Draft
    prompt: |
      {{runtime_instruction}}

      This step writes the draft body as WriterBlock artifacts, then combines them into a draft-stage WriterDocument.

      Call get_artifact to retrieve the file paths of writing_task, writing_context_after_outline, outline, and section_instructions. Use writing_context_after_outline wherever a tool expects writing_context_path. Prepare a draft_block_paths list to record every non-empty block path returned by the tool.

      Call writer_generate_draft_block(writing_task_path=<writing_task path>, section_instructions_path=<section_instructions path>, writing_context_path=<writing_context path>) to produce the next draft WriterBlock. Internally, the tool decides which block to write based on the block files already produced. When the tool returns a non-empty path, append it to draft_block_paths and continue calling the same tool to produce the next block.

      When the tool returns an empty string, all draft blocks have been generated. Take the last path in draft_block_paths and call writer_generate_draft_document(draft_blocks_anchor_path=<last draft block path>, writing_context_path=<writing_context path>, outline_path=<outline path>) to obtain the draft_document path.

      After the draft document is generated, call writer_update_writing_context(content_artifact_path=<draft_document path>, writing_context_path=<original writing_context path>) and obtain the updated writing_context path.

      Once all generation operations in this step are complete, in the order of draft_block_paths, call save_artifact(content_type='file', key='draft_blocks') for each block path, then call save_artifact(content_type='file', key='draft_document') to save the draft WriterDocument path, and finally call save_artifact(content_type='file', key='writing_context_after_draft') to save the updated context as a new material.

      If any of the above tool calls fails, stop the step and preserve the tool error message for outer-layer retry handling.
    tools:
      - writer_generate_draft_block
      - writer_generate_draft_document
      - writer_update_writing_context
    inputs:
      - material: writing_task
        required: true
      - material: writing_context_after_outline
        required: true
      - material: outline
        required: true
      - material: section_instructions
        required: true
    outputs:
      - material: draft_blocks
      - material: draft_document
      - material: writing_context_after_draft
    acceptance_criteria: |
      All three artifacts present: draft_blocks, draft_document, writing_context_after_draft.

  finalize_report:
    label: Finalize Report
    prompt: |
      {{runtime_instruction}}

      This step converts the draft WriterDocument into a final-stage WriterDocument and renders its Markdown file. Retrieve draft_document and writing_context_after_draft, then call writer_generate_final_document(draft_path=<draft path>, writing_context_path=<context path>). The tool returns final_document and final_document_md. This workflow intentionally performs no separate audit or revision pass.

      Once generation is complete, call save_artifact(content_type='file', key='final_document') and save_artifact(content_type='file', key='final_document_md') for the two paths.

      If any of the above tool calls fails, stop the step and preserve the tool error message for outer-layer retry handling.
    tools:
      - writer_generate_final_document
    inputs:
      - material: draft_document
        required: true
      - material: writing_context_after_draft
        required: true
    outputs:
      - material: final_document
      - material: final_document_md
    acceptance_criteria: |
      Both artifacts present: final_document, final_document_md.
