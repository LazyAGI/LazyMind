id: writer-plugin
name: AI Writer
description: >
  Compose structured long-form writing, including articles, reports, technical
  documents, creative stories, fiction, short stories, and novel-style drafts.
  The workflow parses the writing intent and scope, generates
  an outline, plans per-section writing instructions, drafts the full text once,
  and renders the final document. Retry and rewind are runtime commands; revision
  of an existing document belongs to the dedicated document-revision workflow.

when_to_use: >
  Use this plugin only when the user explicitly requests it, or when the user
  requests a complete, complex writing deliverable that depends materially on
  existing knowledge or source materials and requires a multi-stage workflow
  such as context building, outlining, section planning, and drafting.
  Do not invoke it for everyday conversation, simple document generation,
  short-form writing, rewriting, summarization, translation, brainstorming,
  outlining alone, or tasks that can be answered directly. This is a fallback
  writing plugin: if a more specific skill or plugin matches the task, such as
  proposal, academic, or product-document writing, use that instead.

tool_scripts:
  - path: scripts/tools.py
    functions:
      - writer_build_writing_task
      - writer_profile_resources
      - writer_create_writing_context
      - writer_generate_outline
      - writer_generate_section_instructions
      - writer_generate_draft_block
      - writer_generate_draft_document
      - writer_update_writing_context
      - writer_generate_final_document

steps:
  - id: build_context
  - id: generate_outline
  - id: plan_sections
  - id: generate_draft
  - id: finalize_report

slots:
  - id: writing_task
    label: Writing Task
    type: text
    cardinality: single
  - id: resource_profiles
    label: Resource Profiles
    type: text
    cardinality: single
  - id: writing_context
    label: Writing Context
    type: text
    cardinality: single
    summary_max_chars: 600
  - id: writing_context_after_outline
    label: Writing Context After Outline
    type: text
    cardinality: single
    summary_max_chars: 600
  - id: writing_context_after_draft
    label: Writing Context After Draft
    type: text
    cardinality: single
    summary_max_chars: 600
  - id: outline
    label: Outline
    type: text
    cardinality: single
  - id: section_instructions
    label: Section Instructions
    type: text
    cardinality: single
  - id: draft_blocks
    label: Draft Blocks
    type: text
    cardinality: list
    ordered: true
  - id: draft_document
    label: Full Draft
    type: text
    cardinality: single
  - id: final_document
    label: Final Document
    type: text
    cardinality: single
  - id: final_document_md
    label: Final Document (Markdown)
    type: file
    cardinality: single

ui:
  tabs:
    - id: context
      step_id: build_context
      label: Context
      layout: list
      slots:
        - id: writing_context

    - id: outline
      step_id: generate_outline
      label: Outline
      layout: list
      slots:
        - id: outline

    - id: plan_sections
      step_id: plan_sections
      label: Plan Sections
      layout: list
      slots:
        - id: section_instructions

    - id: draft
      step_id: generate_draft
      label: Draft
      layout: list
      slots:
        - id: draft_document

    - id: result
      step_id: finalize_report
      label: Final Report
      layout: list
      slots:
        - id: final_document_md

