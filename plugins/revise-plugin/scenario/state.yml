initial: __start__

transitions:
  __start__:
    - to: load_document

  load_document:
    - to: build_context

  build_context:
    - to: revise_document

  revise_document:
    - to: write_back

  write_back:
    - to: __end__

steps:
  load_document:
    label: Load Feishu Document
    prompt: |
      {{runtime_instruction}}

      Read the Feishu document URL from the user's request and establish the immutable
      source WriterDocument. Do not build revision context in this
      step; build_context is a separate user-visible step.

      Call revise_load_document(user_input="{{user_input}}"). The tool directly calls
      LazyLLM WriterResourceTools.document_to_docir through the existing chat-enabled
      Feishu credential and returns the source_ir file path.

      Persist source_ir with content_type='file'.

      Never ask the model to copy or reconstruct document content. Preserve LazyLLM/FS
      authorization and access errors unchanged so the platform authorization layer can
      handle them. After authorization or document access is fixed, retry this step.
    tools:
      - revise_load_document
    outputs:
      - material: source_ir
    acceptance_criteria: |
      source_ir is present and contains a WriterDocument.

  build_context:
    label: Build Revision Context
    prompt: |
      {{runtime_instruction}}

      Retrieve source_ir, then call
      revise_build_context(user_input="{{user_input}}", source_ir_path=<source_ir path>).
      Persist revision_context with content_type='file'. This is a separate visible
      step so the user can see that the source has been understood before revision.

      Do not revise the document and do not write to Feishu in this step.
    tools:
      - revise_build_context
    inputs:
      - material: source_ir
        required: true
    outputs:
      - material: revision_context
    acceptance_criteria: |
      revision_context is present and was built from the loaded source IR.

  revise_document:
    label: Generate Revision
    prompt: |
      {{runtime_instruction}}

      Retrieve source_ir and revision_context. Call
      revise_generate_revision(base_ir_path=<source_ir path>,
      revision_context_path=<revision_context path>, query="{{user_input}}").

      Persist every returned value under its exact key in one save_artifacts call.
      Use content_type='file' for revise_task, locate_result, modify_plan, patch_set,
      patch_result, and candidate_ir. Do not save them through separate tool calls.

      candidate_ir is a preview of applying patch_set to source_ir. Do not treat edits to
      candidate_ir as write-back instructions; this version writes only the generated
      PatchSet and then advances directly to write_back.
    tools:
      - revise_generate_revision
    inputs:
      - material: source_ir
        required: true
      - material: revision_context
        required: true
    outputs:
      - material: revise_task
      - material: locate_result
      - material: modify_plan
      - material: patch_set
      - material: patch_result
      - material: candidate_ir
    acceptance_criteria: |
      All revision artifacts through candidate_ir are present and patch_set targets source_ir.

  write_back:
    label: Apply PatchSet to Feishu
    prompt: |
      {{runtime_instruction}}

      This is the only step allowed to mutate the Feishu document. Retrieve source_ir and
      patch_set. Call revise_write_back(source_ir_path=<source_ir path>,
      patch_set_path=<patch_set path>).

      LazyLLM translates each PatchHunk through the provider adapter, writes supported
      structured blocks without flattening them, and re-reads the persisted WriterDocument.
      Persist write_result and synced_snapshot together in one save_artifacts call with
      content_type='file'.

      On a remote conflict, do not overwrite the document; stop and ask the user to
      restart from the latest Feishu content.
    tools:
      - revise_write_back
    inputs:
      - material: source_ir
        required: true
      - material: patch_set
        required: true
    outputs:
      - material: write_result
      - material: synced_snapshot
    acceptance_criteria: |
      write_result reports success and synced_snapshot represents the Feishu state after
      all changed blocks were written.
