initial: __start__

transitions:
  __start__:
    - to: load_document

  load_document:
    - to: build_context

  build_context:
    - to: revise_document

  revise_document:
    - to: __end__

steps:
  load_document:
    label: Load Feishu Document
    prompt: |
      {{runtime_instruction}}

      Read the Feishu document URL from the user's request and establish the immutable
      source WriterDocument. Do not build revision context in this
      step; build_context is a separate user-visible step.

      Call revise_load_document(user_input="{{user_input}}"). The tool directly calls
      LazyLLM WriterResourceTools.document_to_docir through the existing chat-enabled
      Feishu credential and returns the source_ir file path.

      Persist source_ir with content_type='file'.

      Never ask the model to copy or reconstruct document content. Preserve LazyLLM/FS
      authorization and access errors unchanged so the platform authorization layer can
      handle them. After authorization or document access is fixed, retry this step.
    tools:
      - revise_load_document
    outputs:
      - material: source_ir
    acceptance_criteria: |
      source_ir is present and contains a WriterDocument.

  build_context:
    label: Build Context
    prompt: |
      {{runtime_instruction}}

      Retrieve source_ir, then call
      revise_build_context(user_input="{{user_input}}", source_ir_path=<source_ir path>).
      Persist revision_context and revision_context_ir under their exact keys with
      content_type='file'. revision_context_ir is the UI-visible WriterDocument for
      this step.

      Do not revise the document and do not write to Feishu in this step.
    tools:
      - revise_build_context
    inputs:
      - material: source_ir
        required: true
    outputs:
      - material: revision_context
      - material: revision_context_ir
    acceptance_criteria: |
      revision_context and revision_context_ir are present, and the context was built
      from the loaded source IR.

  revise_document:
    label: Revise Document
    prompt: |
      {{runtime_instruction}}

      Retrieve source_ir and revision_context. Call
      revise_generate_revision(base_ir_path=<source_ir path>,
      revision_context_path=<revision_context path>, query="{{user_input}}").

      The tool locates and modifies the requested content, applies the PatchSet locally,
      writes the same PatchSet back to Feishu, and re-reads the persisted document before
      returning. This is the only step allowed to mutate the Feishu document.

      Persist every returned value under its exact key in one save_artifacts call.
      Use content_type='file' for revise_task, locate_result, modify_plan, patch_set,
      patch_result, candidate_ir, write_result, and synced_snapshot.
      Do not save them through separate tool calls.

      candidate_ir is the local result kept for internal traceability and is not displayed.
      The automatic Feishu write-back uses only the generated PatchSet. The UI displays
      synced_snapshot, which is re-read from Feishu after the write succeeds and therefore
      always represents the synchronized remote IR.

      On a remote conflict, do not overwrite the document; stop and ask the user to
      restart from the latest Feishu content.
    tools:
      - revise_generate_revision
    inputs:
      - material: source_ir
        required: true
      - material: revision_context
        required: true
    outputs:
      - material: revise_task
      - material: locate_result
      - material: modify_plan
      - material: patch_set
      - material: patch_result
      - material: candidate_ir
      - material: write_result
      - material: synced_snapshot
    acceptance_criteria: |
      All local revision artifacts are present, write_result reports success,
      and synced_snapshot represents the persisted Feishu state.
