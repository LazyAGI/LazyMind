# Runtime model config for ECS/internal services (static, all endpoints pre-configured).
# yaml key = AutoModel(model=...) lookup name; name field = actual model name sent to the API.

llm:
  - source: openai
    type: llm
    name: minimax-m27
    url: http://host.docker.internal:9000/v1/
    api_key: sk-maas-GDZmEQsilc4uGXXTaWnIHmET9V0eenZ8F6eWk3LaPzE

evo_llm:
  - source: openai
    type: llm
    name: lazyllm
    url: http://host.docker.internal:8000/v1/
    skip_auth: true

reranker:
  - source: openai
    type: rerank
    name: Qwen3-Reranker-8B
    url: http://host.docker.internal:8331/v1
    skip_auth: true

embed_main:
  - source: openai
    type: embed
    name: lazyllm
    url: http://host.docker.internal:9800/v1/embeddings
    skip_auth: true

# Cross-modal (image) embed shared by image nodes and image-only retrieval branch.
embed_image:
  - source: openai
    type: cross_modal_embed
    name: siglip
    url: http://host.docker.internal:34335/embeddings
    skip_auth: true

# Vision-language model for image-aware query rewriting and vision_extractor tool.
vlm:
  - source: openai
    type: vlm
    name: lazyllm
    url: http://host.docker.internal:36517/v1/
    skip_auth: true
