# Runtime model config for ECS/internal services (static, all endpoints pre-configured).
# yaml key = AutoModel(model=...) lookup name; name field = actual model name sent to the API.
#
# Local Docker access: intranet endpoints are SSH-tunneled via ECS_01 and exposed
# on the host. Containers must call host.docker.internal (not 10.119.x.x).
# Tunnel mapping (keep ssh -L alive while this file is in use):
#   19000 -> 106.75.235.251:9000   minimax (optional; requires LAZYLLM_MINIMAX_API_KEY)
#   19001 -> 10.119.21.177:8000    llm / evo_llm
#   19002 -> 10.119.17.248:8331    reranker
#   19003 -> 10.119.29.245:9800    embed_main
#   19004 -> 10.119.16.203:8004    embed_image
#   19005 -> 10.119.21.233:25120   vlm

llm:
  - source: openai
    type: llm
    name: lazyllm
    url: http://host.docker.internal:19001/v1/
    skip_auth: true

evo_llm:
  - source: openai
    type: llm
    name: lazyllm
    url: http://host.docker.internal:19001/v1/
    skip_auth: true

reranker:
  - source: openai
    type: rerank
    name: Qwen3-Reranker-8B
    url: http://host.docker.internal:19002/v1
    skip_auth: true

embed_main:
  - source: openai
    type: embed
    name: lazyllm
    url: http://host.docker.internal:19003/v1/embeddings
    skip_auth: true

# Cross-modal (image) embed shared by image nodes and image-only retrieval branch.
embed_image:
  - source: openai
    type: cross_modal_embed
    name: siglip
    url: http://host.docker.internal:19004/embeddings
    skip_auth: true

# Vision-language model for image-aware query rewriting and vision_extractor tool.
vlm:
  - source: openai
    type: vlm
    name: lazyllm
    url: http://host.docker.internal:19005/v1/
    skip_auth: true

speech_to_text:
  - source: siliconflow
    type: stt
    name: FunAudioLLM/SenseVoiceSmall
    api_key: ${LAZYLLM_SILICONFLOW_API_KEY}

image_generator:
  - source: siliconflow
    type: text2image
    name: Kwai-Kolors/Kolors
    api_key: ${LAZYLLM_SILICONFLOW_API_KEY}

image_editor:
  - source: siliconflow
    type: image_editing
    name: Kwai-Kolors/Kolors
    api_key: ${LAZYLLM_SILICONFLOW_API_KEY}

video_generator:
  - source: doubao
    type: text2video
    name: doubao-seedance-1-0-pro-fast-251015
    api_key: ${LAZYLLM_DOUBAO_API_KEY}
