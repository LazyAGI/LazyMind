name: Finalize macOS Notarization

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID from the macOS Desktop Installer workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: macos-notarization-finalize-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    name: Check, staple, and publish notarized DMG
    environment: mac_dev
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout smoke test scripts
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Validate inputs and credentials
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::source_run_id must be the numeric GitHub Actions run ID"
            exit 1
          fi
          missing=()
          for variable in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${variable}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing mac_dev environment secrets: ${missing[*]}"
            exit 1
          fi
          if [[ ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID"
            exit 1
          fi
          xcrun notarytool --version

      - name: Download pending DMG
        uses: actions/download-artifact@v8
        with:
          pattern: "LazyMind-macos-arm64-pending"
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: pending

      - name: Download notarization submission record
        uses: actions/download-artifact@v8
        with:
          pattern: "LazyMind-macos-notarization-submission"
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: submission

      - name: Check Apple notarization status
        id: status
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          submission_json="$(find submission -type f -name '*.json' -print -quit)"
          pending_dmg="$(find pending -type f -name '*.dmg' -print -quit)"
          if [[ -z "${submission_json}" || -z "${pending_dmg}" ]]; then
            echo "::error::The source run does not contain the expected pending DMG and submission record"
            exit 1
          fi
          submission_id="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value.id) process.exit(1);
              process.stdout.write(value.id);
            ' "${submission_json}"
          )"
          release_tag="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value.releaseTag) process.exit(1);
              process.stdout.write(value.releaseTag);
            ' "${submission_json}"
          )"
          if [[ ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Submission record has invalid formal release tag: ${release_tag}"
            exit 1
          fi
          xcrun notarytool info "${submission_id}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --output-format json > notarization-status.json
          notarization_status="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value.status) process.exit(1);
              process.stdout.write(value.status);
            ' notarization-status.json
          )"
          echo "submission_id=${submission_id}" >> "${GITHUB_OUTPUT}"
          echo "notarization_status=${notarization_status}" >> "${GITHUB_OUTPUT}"
          echo "pending_dmg=${pending_dmg}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Apple notarization status"
            echo
            echo "- Source run: \`${{ inputs.source_run_id }}\`"
            echo "- Submission ID: \`${submission_id}\`"
            echo "- Status: **${notarization_status}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Download Apple rejection log
        if: steps.status.outputs.notarization_status == 'Invalid'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.status.outputs.submission_id }}
        run: |
          xcrun notarytool log "${SUBMISSION_ID}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            notarization-log.json

      - name: Upload Apple rejection diagnostics
        if: steps.status.outputs.notarization_status == 'Invalid'
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-notarization-diagnostics
          path: |
            notarization-status.json
            notarization-log.json
          if-no-files-found: error
          retention-days: 30

      - name: Staple and validate accepted installer
        if: steps.status.outputs.notarization_status == 'Accepted'
        id: package
        env:
          PENDING_DMG: ${{ steps.status.outputs.pending_dmg }}
        run: |
          set -euo pipefail

          final_dir="${GITHUB_WORKSPACE}/final"
          pending_name="$(basename "${PENDING_DMG}")"
          final_name="${pending_name/.pending.dmg/.dmg}"
          final_path="${final_dir}/${final_name}"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-final-dmg.XXXXXX")"

          mkdir -p "${final_dir}"
          cp "${PENDING_DMG}" "${final_path}"
          codesign --verify --strict --verbose=2 "${final_path}"
          xcrun stapler staple "${final_path}"
          xcrun stapler validate "${final_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${final_path}"

          hdiutil attach "${final_path}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/LazyMind.app"
          spctl --assess --type execute --verbose=4 "${mount_dir}/LazyMind.app"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          sha256="$(shasum -a 256 "${final_path}" | awk '{print $1}')"
          echo "installer_path=${final_path}" >> "${GITHUB_OUTPUT}"
          {
            echo
            echo "## Final macOS installer"
            echo
            echo "- File: \`${final_name}\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- Notarization: accepted and stapled"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload final notarized installer
        if: steps.status.outputs.notarization_status == 'Accepted'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-arm64-notarized
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Install application from finalized DMG
        if: steps.status.outputs.notarization_status == 'Accepted'
        id: install
        env:
          INSTALLER_PATH: ${{ steps.package.outputs.installer_path }}
        run: |
          set -euo pipefail
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-install-test-mount.XXXXXX")"
          install_root="${RUNNER_TEMP}/lazymind-install-test-applications"
          installed_app="${install_root}/LazyMind.app"
          mkdir -p "${install_root}"
          hdiutil attach "${INSTALLER_PATH}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          ditto "${mount_dir}/LazyMind.app" "${installed_app}"
          hdiutil detach "${mount_dir}"
          trap - EXIT
          echo "app=${installed_app}" >> "${GITHUB_OUTPUT}"

      - name: Verify and smoke-test installed application
        if: steps.status.outputs.notarization_status == 'Accepted'
        env:
          INSTALLED_APP: ${{ steps.install.outputs.app }}
        run: |
          set -euo pipefail
          test -x "${INSTALLED_APP}/Contents/MacOS/LazyMind"
          codesign --verify --deep --strict --verbose=2 "${INSTALLED_APP}"
          spctl --assess --type execute --verbose=4 "${INSTALLED_APP}"
          node desktop/scripts/packaged-app-smoke.mjs \
            --app "${INSTALLED_APP}" \
            --runtime-root "${RUNNER_TEMP}/lazymind-installed-smoke" \
            --platform darwin \
            --timeout-ms 300000

      - name: Remove installed application
        if: always() && steps.install.outcome == 'success'
        env:
          INSTALLED_APP: ${{ steps.install.outputs.app }}
        run: |
          rm -rf "${INSTALLED_APP}"
          test ! -e "${INSTALLED_APP}"

      - name: Upload tested installer to draft release
        if: steps.status.outputs.notarization_status == 'Accepted'
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_PATH: ${{ steps.package.outputs.installer_path }}
          RELEASE_TAG: ${{ steps.status.outputs.release_tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          if [[ "${is_draft}" != "true" ]]; then
            echo "::error::Release ${RELEASE_TAG} is not a draft"
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${INSTALLER_PATH}" --clobber

      - name: Add final download link
        if: steps.status.outputs.notarization_status == 'Accepted'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo
            echo "[Download the notarized macOS installer](${ARTIFACT_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Stop when Apple has not accepted the submission
        if: steps.status.outputs.notarization_status != 'Accepted'
        env:
          NOTARIZATION_STATUS: ${{ steps.status.outputs.notarization_status }}
        run: |
          if [[ "${NOTARIZATION_STATUS}" == "In Progress" ]]; then
            echo "::error::Apple is still processing this submission. Run this workflow again later with the same source_run_id."
          else
            echo "::error::Apple notarization status is ${NOTARIZATION_STATUS}. Review the uploaded diagnostics if available."
          fi
          exit 1
