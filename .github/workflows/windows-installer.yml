name: Windows Desktop Installer

on:
  workflow_call:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build"
        required: false
        type: string
    outputs:
      artifact_name:
        value: ${{ jobs.build-windows-installer.outputs.artifact_name }}
      release_tag:
        value: ${{ jobs.build-windows-installer.outputs.release_tag }}
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build; leave empty to build the selected workflow branch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  MIRROR_PROFILE: intl
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  GOPROXY: https://proxy.golang.org,direct
  PIP_INDEX_URL: https://pypi.org/simple
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  build-windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      artifact_name: lazymind-windows-x64-installer
      release_tag: ${{ steps.release.outputs.release_tag }}
      installer_sha256: ${{ steps.package.outputs.installer_sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Detect release tag
        id: release
        shell: pwsh
        env:
          EXPLICIT_REF: ${{ inputs.git_ref }}
          REQUESTED_REF: ${{ inputs.git_ref || github.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = $null
          if ($env:REQUESTED_REF.StartsWith('refs/tags/')) {
            $tag = $env:REQUESTED_REF.Substring(10)
          } elseif ($env:EXPLICIT_REF -and -not $env:REQUESTED_REF.StartsWith('refs/')) {
            git show-ref --verify --quiet "refs/tags/$($env:REQUESTED_REF)"
            if ($LASTEXITCODE -eq 0) {
              $tag = $env:REQUESTED_REF
            }
          }

          $isTag = $false
          if ($tag) {
            $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve release tag $tag"
            }
            $headCommit = (git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve the checked-out commit"
            }
            $isTag = $tagCommit -eq $headCommit
          }
          "is_tag=$($isTag.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_tag=$(if ($isTag) { $tag } else { '' })" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Initialize development submodules
        if: steps.release.outputs.is_tag != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              git submodule update --init algorithm/lazyllm
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "Submodule checkout attempt $attempt/3 failed; retrying in $($attempt * 5) seconds."
              Start-Sleep -Seconds ($attempt * 5)
            }
          }

      - name: Normalize Electron pnpm workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $workspacePath = Join-Path $env:GITHUB_WORKSPACE "desktop\electron\pnpm-workspace.yaml"
          $workspace = Get-Content -LiteralPath $workspacePath -Raw
          if ($workspace -notmatch '(?m)^packages:\s*$') {
            $workspace = @(
              'packages:'
              '  - "."'
              ''
              $workspace
            ) -join "`n"
            Set-Content -LiteralPath $workspacePath -Value $workspace -NoNewline
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Inject release version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "desktop\electron\package.json"
          if ($env:RELEASE_TAG) {
            node desktop/scripts/resolve-release-version.mjs `
              --tag $env:RELEASE_TAG `
              --package $packagePath `
              --github-output $env:GITHUB_OUTPUT
          } else {
            $package = Get-Content -LiteralPath $packagePath -Raw | ConvertFrom-Json
            "release_tag=" >> $env:GITHUB_OUTPUT
            "package_version=$($package.version)" >> $env:GITHUB_OUTPUT
            "artifact_version=$($package.version)" >> $env:GITHUB_OUTPUT
          }

      - name: Enable pnpm
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          corepack enable
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              corepack prepare pnpm@10.0.0 --activate
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "pnpm activation attempt $attempt/3 failed; retrying in $($attempt * 5) seconds."
              Start-Sleep -Seconds ($attempt * 5)
            }
          }
          pnpm --version

      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            desktop/cache/electron
            desktop/cache/electron-builder
            desktop/cache/history-injection
          key: windows-x64-electron-${{ hashFiles('desktop/electron/pnpm-lock.yaml', 'desktop/history-injection-package.json') }}
          restore-keys: |
            windows-x64-electron-

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: false

      - name: Show build environment
        shell: pwsh
        env:
          REQUESTED_REF: ${{ inputs.git_ref || github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true

          git --version
          pwsh --version
          node --version
          pnpm --version
          go version
          uv --version

          Write-Host "Runner architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Requested ref: $env:REQUESTED_REF"
          Write-Host "Checked out commit: $(git rev-parse HEAD)"
          Get-PSDrive -Name C |
            Select-Object Name,
              @{Name="UsedGB"; Expression={[math]::Round($_.Used / 1GB, 2)}},
              @{Name="FreeGB"; Expression={[math]::Round($_.Free / 1GB, 2)}} |
            Format-Table

      - name: Run Desktop tests
        shell: bash
        run: |
          node --test desktop/scripts/*.test.mjs

      - name: Check Windows build prerequisites
        shell: pwsh
        run: |
          pwsh `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File desktop/scripts/build-windows-x64.ps1 `
            doctor

      - name: Build Windows installer
        env:
          LAZYMIND_RELEASE_BUILD: ${{ steps.release.outputs.is_tag }}
        shell: pwsh
        run: |
          pwsh `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File desktop/scripts/build-windows-x64.ps1 `
            installer

      - name: Validate and stage installer
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $distDir = Join-Path $env:GITHUB_WORKSPACE "desktop\dist"
          $publishDir = Join-Path $distDir "publish"
          $installers = @(
            Get-ChildItem `
              -LiteralPath $distDir `
              -File `
              -Filter "LazyMind-windows-x64-installer-*.exe"
          )

          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)"
          }

          $sourceInstaller = $installers[0]
          $shortSha = (& git rev-parse --short=8 HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $shortSha -notmatch '^[0-9a-fA-F]{7,}$') {
            throw "Could not resolve the checked out commit"
          }
          $outputName = "LazyMind-windows-x64-installer-${{ steps.version.outputs.artifact_version }}-$shortSha.exe"

          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          $outputPath = Join-Path $publishDir $outputName
          Copy-Item -LiteralPath $sourceInstaller.FullName -Destination $outputPath

          $outputFile = Get-Item -LiteralPath $outputPath
          if ($outputFile.Length -le 0) {
            throw "Generated installer is empty"
          }

          $hash = Get-FileHash -LiteralPath $outputPath -Algorithm SHA256
          $signature = Get-AuthenticodeSignature -LiteralPath $outputPath
          "installer_path=$outputPath" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "artifact_name=$outputName" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "installer_sha256=$($hash.Hash.ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

          @"
          ## Windows installer

          - File: `$outputName`
          - Size: $([math]::Round($outputFile.Length / 1MB, 2)) MiB
          - SHA-256: `$($hash.Hash.ToLowerInvariant())`
          - Signature: `$($signature.Status)`
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          Get-ChildItem -LiteralPath $publishDir | Format-Table Name, Length

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: lazymind-windows-x64-installer
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Add download link to summary
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          @"
          ## Download

          [Download the Windows installer]($env:ARTIFACT_URL)
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Show final disk usage
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive -Name C |
            Select-Object Name,
              @{Name="UsedGB"; Expression={[math]::Round($_.Used / 1GB, 2)}},
              @{Name="FreeGB"; Expression={[math]::Round($_.Free / 1GB, 2)}} |
            Format-Table

  test-windows-installer:
    name: Install, verify, and uninstall (${{ matrix.os }})
    needs: build-windows-installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025

    steps:
      - name: Checkout smoke test scripts
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download the exact installer built above
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-windows-installer.outputs.artifact_name }}
          path: installer-under-test

      - name: Resolve installer under test
        id: installer
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build-windows-installer.outputs.installer_sha256 }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = @(Get-ChildItem -LiteralPath installer-under-test -File -Filter "*.exe")
          if ($installer.Count -ne 1) {
            throw "Expected exactly one downloaded installer; found $($installer.Count)"
          }

          $actualHash = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:EXPECTED_SHA256) {
            throw "Downloaded installer hash mismatch: expected $env:EXPECTED_SHA256, got $actualHash"
          }
          "path=$($installer[0].FullName)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Install
        id: install
        continue-on-error: true
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = "Stop"
          $install = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList "/S --full-install" -Wait -PassThru
          "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) {
            $unsignedExitCode = [uint32]$install.ExitCode
            throw "Installer exited with code $($install.ExitCode) (0x$($unsignedExitCode.ToString('X8')))"
          }

      - name: Verify installed files and registry
        id: verify
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.build-windows-installer.outputs.package_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\LazyMind"
          $app = Join-Path $installDir "LazyMind.exe"
          $uninstaller = Join-Path $installDir "Uninstall LazyMind.exe"
          foreach ($requiredFile in @($app, $uninstaller)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Installed file is missing: $requiredFile"
            }
          }

          $uninstallEntries = @()
          foreach ($view in @([Microsoft.Win32.RegistryView]::Registry64, [Microsoft.Win32.RegistryView]::Registry32)) {
            $baseKey = [Microsoft.Win32.RegistryKey]::OpenBaseKey([Microsoft.Win32.RegistryHive]::CurrentUser, $view)
            try {
              $uninstallKey = $baseKey.OpenSubKey("Software\Microsoft\Windows\CurrentVersion\Uninstall")
              if ($null -eq $uninstallKey) {
                "HKCU $view uninstall key does not exist"
                continue
              }
              try {
                foreach ($subkeyName in $uninstallKey.GetSubKeyNames()) {
                  $subkey = $uninstallKey.OpenSubKey($subkeyName)
                  try {
                    $displayName = [string]$subkey.GetValue("DisplayName", "")
                    $displayVersion = [string]$subkey.GetValue("DisplayVersion", "")
                    $uninstallString = [string]$subkey.GetValue("UninstallString", "")
                    if ($displayName -like "*LazyMind*") {
                      "Found uninstall entry: view=$view key=$subkeyName name=$displayName version=$displayVersion command=$uninstallString"
                    }
                    if ($displayName -eq "LazyMind") {
                      $uninstallEntries += [pscustomobject]@{
                        View = $view
                        Key = $subkeyName
                        DisplayVersion = $displayVersion
                        UninstallString = $uninstallString
                      }
                    }
                  } finally {
                    if ($null -ne $subkey) { $subkey.Dispose() }
                  }
                }
              } finally {
                $uninstallKey.Dispose()
              }
            } finally {
              $baseKey.Dispose()
            }
          }
          $uninstallEntries = @($uninstallEntries | Sort-Object Key -Unique)
          if ($uninstallEntries.Count -ne 1) {
            throw "Expected one LazyMind uninstall registry entry; found $($uninstallEntries.Count)"
          }
          if ([string]$uninstallEntries[0].DisplayVersion -ne $env:EXPECTED_VERSION) {
            throw "Registry version mismatch: expected $env:EXPECTED_VERSION, got $($uninstallEntries[0].DisplayVersion)"
          }

          $productVersion = (Get-Item -LiteralPath $app).VersionInfo.ProductVersion
          if ($env:EXPECTED_VERSION -notmatch '^(\d+)\.(\d+)\.(\d+)') {
            throw "Cannot derive Windows ProductVersion from release version: $env:EXPECTED_VERSION"
          }
          $expectedProductVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          if ($productVersion -ne $expectedProductVersion) {
            throw "Executable ProductVersion mismatch: expected $expectedProductVersion, got $productVersion"
          }

      - name: Verify installer warmup result
        id: installer_warmup
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metricsPath = Join-Path $env:LOCALAPPDATA "LazyMind\Logs\desktop\startup-metrics-latest.json"
          if (-not (Test-Path -LiteralPath $metricsPath -PathType Leaf)) {
            throw "Installer warmup metrics are missing: $metricsPath"
          }
          $metrics = Get-Content -LiteralPath $metricsPath -Raw | ConvertFrom-Json
          if ($metrics.launchKind -ne "installer-warmup") {
            throw "Unexpected installer warmup launch kind: $($metrics.launchKind)"
          }
          if ($metrics.outcome -ne "success") {
            throw "Installer warmup failed: outcome=$($metrics.outcome), failureCode=$($metrics.failureCode)"
          }
          "Installer warmup completed successfully in $($metrics.completedMs)ms"

      - name: Run packaged application smoke
        id: smoke
        if: steps.installer_warmup.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:LOCALAPPDATA "Programs\LazyMind\LazyMind.exe"
          node desktop/scripts/packaged-app-smoke.mjs `
            --app $app `
            --runtime-root (Join-Path $env:LOCALAPPDATA "LazyMind") `
            --platform win32 `
            --timeout-ms 300000

      - name: Uninstall
        id: uninstall
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\LazyMind"
          $app = Join-Path $installDir "LazyMind.exe"
          $uninstaller = Join-Path $installDir "Uninstall LazyMind.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)"
          }
          if (Test-Path -LiteralPath $app) {
            throw "LazyMind.exe remains after uninstall: $app"
          }

      - name: Collect installer diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $diagnostics = Join-Path $PWD "installer-diagnostics"
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $roots = @(
            (Join-Path $env:LOCALAPPDATA "LazyMind"),
            (Join-Path $env:APPDATA "LazyMind"),
            (Join-Path $env:TEMP "LazyMind")
          )
          foreach ($root in $roots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            "Diagnostic root: $root"
            Get-ChildItem -LiteralPath $root -Recurse -Force -ErrorAction Continue |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
            $safeName = ($root -replace '[:\\/ ]', '_').Trim('_')
            Copy-Item -LiteralPath $root -Destination (Join-Path $diagnostics $safeName) -Recurse -Force -ErrorAction Continue
          }
          Get-Process | Where-Object { $_.ProcessName -match 'LazyMind|electron|python|node' } |
            Select-Object ProcessName, Id, Path, StartTime |
            Format-Table -AutoSize |
            Out-String |
            Set-Content -LiteralPath (Join-Path $diagnostics "processes.txt")

      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-diagnostics-${{ matrix.os }}
          path: installer-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Report installer test result
        if: always()
        shell: pwsh
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          INSTALLER_WARMUP_OUTCOME: ${{ steps.installer_warmup.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          UNINSTALL_OUTCOME: ${{ steps.uninstall.outcome }}
        run: |
          $outcomes = [ordered]@{
            install = $env:INSTALL_OUTCOME
            verify = $env:VERIFY_OUTCOME
            installer_warmup = $env:INSTALLER_WARMUP_OUTCOME
            smoke = $env:SMOKE_OUTCOME
            uninstall = $env:UNINSTALL_OUTCOME
          }
          $outcomes.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value)" }
          $failures = @($outcomes.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($failures.Count -gt 0) {
            throw "Installer test stages failed or were skipped: $($failures.Key -join ', ')"
          }
