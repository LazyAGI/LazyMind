name: Diagnose PR 913 Windows owner restart tests

on:
  push:
    branches: [feat-v05-1019]
    paths: ['.github/workflows/diagnose-pr913-windows.yml']

permissions:
  contents: read

jobs:
  owner-restart-tests:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Install Desktop test dependencies
        working-directory: desktop/electron
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
      - name: Run the Windows owner restart tests
        shell: bash
        timeout-minutes: 2
        env:
          OWNER_RESTART_TRACE: ${{ runner.temp }}/owner-restart.log
        run: |
          set -uo pipefail
          node --version
          node --test --test-reporter=tap desktop/scripts/update-v1-owner-restart.test.mjs
          status=$?
          echo "Node exited with status $status"
          exit "$status"
      - name: Read the trace if the test process did not finish successfully
        if: ${{ failure() || cancelled() }}
        shell: pwsh
        run: |
          $trace = Join-Path $env:RUNNER_TEMP 'owner-restart.log'
          if (Test-Path $trace) { Get-Content $trace }
