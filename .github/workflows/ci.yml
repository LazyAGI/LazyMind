# CI: run lint, documentation checks, and tests for pushes and pull requests.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"
  pull_request:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Lint
        run: make lint

  doc_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Doc check
        run: pip install pytest && python -m pytest tests/doc_check/ -v

  test-frontend:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test
        run: cd tests/frontend && npm install && npm test

  test-auth-service:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r backend/auth-service/requirements.txt
          pip install -r tests/backend/auth-service/requirements-test.txt
          pip install 'httpx<0.28' 'anyio<4.5'

      - name: Test
        run: python -m pytest tests/backend/auth-service/ -v

  test-backend-core:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Verify migration paths
        env:
          MIGRATION_TEST_POSTGRES_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        run: cd backend/core && go test ./migrate -v

      - name: Test backend core
        run: cd backend/core && go test ./... -v

      - name: Test backend core integration module
        run: cd tests/backend/core && go mod tidy && go test ./... -v

  test-evo-cli:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          pip install scikit-build-core pybind11
          CMAKE_POLICY_VERSION_MINIMUM=3.5 pip install --no-cache-dir algorithm/lazyllm
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"
          pip install -r evo/requirements.txt
          pip install pytest httpx

      - name: Test
        run: python -m pytest tests/evo/ tests/test_cli.py -v

  test-algorithm:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          pip install scikit-build-core pybind11
          CMAKE_POLICY_VERSION_MINIMUM=3.5 pip install --no-cache-dir algorithm/lazyllm
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"
          pip install -r algorithm/requirements.txt
          pip install -r tests/algorithm/requirements-test.txt

      - name: Verify lazyllm install
        run: |
          python -c "from lazyllm.tools.agent.skill_manager import SkillManager; print('tools OK')"
          python -c "from lazyllm.module import ModuleBase; print('module OK')"
          python -c "from lazyllm import fc_register; print('fc_register OK')"

      - name: Test
        env:
          LAZYLLM_INIT_DOC: "1"
        run: python -m pytest tests/algorithm/ -v
