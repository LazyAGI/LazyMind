# CI: run lint, documentation checks, and tests for pull requests.
# Retry CI after the transient PyPI download timeout.
name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-skill-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: backend/core/go.sum
      - name: Test Skill lock verification selection
        run: python3 -m unittest discover -s scripts/tests -p test_skill_lock_verification_mode.py
      - name: Verify pinned SkillHub packages and lock artifacts
        working-directory: backend/core
        run: |
          verify_args=(--verify-lock-artifacts)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Checkout tests a synthetic merge commit. Its first parent is the
            # actual target revision, which may be newer than the event base.
            base_sha=$(git rev-parse HEAD^1)
            # An unrelated PR cannot change the pinned Skill archives. Keep
            # Featured Workflow validation, without downloading every remote
            # SkillHub package on every CI run.
            if git -C ../.. diff --quiet "$base_sha" HEAD -- \
              skills/builtin-sources.yaml skills/builtin-skills.lock.json \
              skills/patches skills/featured skills/search \
              backend/core/cmd/builtin-skill-bundle \
              backend/core/skillv2/builtin backend/core/skillv2/metadata \
              backend/core/skillv2/skillpackage backend/core/skillv2/skillpatch \
              backend/core/skillv2/sourceurl; then
              go run ./cmd/builtin-skill-bundle \
                --featured-sources ../../skills/featured \
                --check-featured
              exit 0
            fi
            mode=$(python3 ../../scripts/skill_lock_verification_mode.py "$base_sha")
            if [[ "$mode" == "local" ]]; then
              # Rebuild and hash-check local packages using the existing frozen
              # catalog path; unchanged remote packages need no download.
              verify_args=(--catalog-only --frozen-lockfile)
            else
              git show "$base_sha:skills/builtin-skills.lock.json" > /tmp/base-builtin-skills.lock.json
              verify_args+=(--verify-lock-base /tmp/base-builtin-skills.lock.json)
            fi
          fi
          go run ./cmd/builtin-skill-bundle \
            --sources ../../skills/builtin-sources.yaml \
            --lock ../../skills/builtin-skills.lock.json \
            --cache ../../skills/.runtime/cache \
            --output ../../skills/.runtime/builtin-skills \
            --featured-sources ../../skills/featured \
            --featured-output ../../skills/.runtime/featured-skills \
            "${verify_args[@]}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: |
            backend/core/go.sum
            backend/scan-control-plane/go.sum
            backend/file-watcher/go.sum
            local/local-proxy/go.sum
            local/local-runtime-manager/go.sum
            local/lazymind-cli/go.sum
            tests/backend/core/go.sum

      - name: Lint
        run: make lint

  doc_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Doc check
        run: pip install pytest && python -m pytest tests/doc_check/ -v

  test-frontend:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify generated OpenAPI clients
        working-directory: frontend
        run: node scripts/openapi/check-stale.mjs

      - name: Test upstream model catalog generation
        run: python3 -m unittest discover -s scripts/tests -p test_upstream_model_catalog.py

      - name: Install and test with coverage
        run: |
          cd tests/frontend
          npm install
          npm install -D c8
          npx c8 --reporter=html --reporter=cobertura npm test

      - name: Upload HTML coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: tests/frontend/coverage

      - name: Check total coverage ≥10%
        run: |
          cd tests/frontend
          npx c8 check-coverage --lines 10 --functions 10 --branches 10

  test-frontend-shards:
    needs: [lint, doc_check]
    name: Test frontend application (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Type-check workflow panel integration
        if: matrix.shard == 1
        working-directory: frontend
        run: pnpm typecheck
      - name: Test frontend including model settings and workflow boundaries
        working-directory: frontend
        run: pnpm test --shard=${{ matrix.shard }}/4 --maxWorkers=2 --minWorkers=1

  test-workflow-panel:
    needs: [test-frontend-shards]
    if: ${{ always() }}
    name: Test Workflow Panel boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every frontend shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-frontend-shards.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "Frontend test shards did not all pass ($SHARDS_RESULT)."
            exit 1
          fi

  test-local-runtime:
    needs: [lint, doc_check]
    name: Test local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: |
            local/local-proxy/go.sum
            local/local-runtime-manager/go.sum
            local/lazymind-cli/go.sum
      - uses: pnpm/action-setup@v4
        if: runner.os == 'Linux'
        with:
          version: '10.0.0'
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: integrations/dsh-workflow/pnpm-lock.yaml
      - name: Test Local Proxy
        working-directory: local/local-proxy
        run: go test ./... -v
      - name: Test Local Runtime Manager
        working-directory: local/local-runtime-manager
        run: go test ./... -v
      - name: Test LazyMind Agent Connector
        if: runner.os != 'Windows'
        working-directory: local/lazymind-cli
        run: go test ./... -v
      - name: Test LazyMind Agent Connector with build diagnostics
        if: runner.os == 'Windows'
        working-directory: local/lazymind-cli
        shell: pwsh
        env:
          GODEBUG: gocachetest=1
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP 'go-cli-diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          go test ./... -json "-debug-actiongraph=$diagnostics/actions.json" 2> "$diagnostics/cache.log" |
            Tee-Object -FilePath "$diagnostics/tests.jsonl"
          $testExitCode = $LASTEXITCODE
          Get-Content "$diagnostics/cache.log"
          exit $testExitCode
      - name: Upload Windows Go diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: go-cli-diagnostics-windows
          path: ${{ runner.temp }}/go-cli-diagnostics
      - name: Test and verify the bundled DSH plugin
        if: runner.os == 'Linux'
        working-directory: integrations/dsh-workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm bundle
          (cd ../../local/lazymind-cli && go run ./cmd/package-workflow-bundle)
          git diff --exit-code -- lib ../../local/lazymind-cli/internal/adapters/mcpclient/assets/dsh-workflow.tgz

  test-desktop-shell:
    needs: [lint, doc_check]
    name: Test desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        if: runner.os == 'Windows'
        with:
          go-version: '1.25.11'
          cache-dependency-path: local/lazymind-cli/go.sum
      - name: Build native Bridge for lifecycle regression
        if: runner.os == 'Windows'
        shell: powershell
        working-directory: local/lazymind-cli
        run: |
          go build -o "$env:RUNNER_TEMP\lazymind.exe" ./cmd/lazymind
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "LAZYMIND_TEST_BRIDGE_EXE=$env:RUNNER_TEMP\lazymind.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test Desktop shell
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Keep PowerShell lifecycle deadlines independent of concurrent
            # filesystem scans and archive extraction on the shared runner.
            node --test --test-concurrency=1 desktop/scripts/*.test.mjs
          else
            node --test desktop/scripts/*.test.mjs
          fi

  test-auth-service:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps + coverage tools
        run: |
          pip install -r backend/auth-service/requirements.txt
          pip install -r tests/backend/auth-service/requirements-test.txt
          pip install 'httpx<0.28' 'anyio<4.5' coverage diff-cover

      - name: Test with coverage
        run: |
          coverage run --source=backend/auth-service -m pytest tests/backend/auth-service/ -v
          coverage html -d htmlcov-auth
          coverage xml -o coverage-auth.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth
          path: htmlcov-auth

      - name: Check total coverage ≥10%
        run: coverage report --include=backend/auth-service/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-auth.xml --compare-branch=origin/main --fail-under=0

  test-backend-core:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: |
            backend/core/go.sum
            tests/backend/core/go.sum

      - name: Verify migration and target-upgrade paths
        env:
          MIGRATION_TEST_POSTGRES_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        run: bash scripts/test_migration_upgrade.sh

      - name: Test backend core (SQLite) with coverage
        run: cd backend/core && go test ./... -v -timeout 40m -coverprofile=coverage-core.out

      - name: Test backend core (PostgreSQL)
        env:
          TEST_DB_DRIVER: postgres
          TEST_DB_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        # Match SQLite instrumentation to reuse database-independent test results.
        run: cd backend/core && go test ./... -v -timeout 40m -cover

      - name: Test backend core integration module
        run: cd tests/backend/core && go mod tidy && go test ./... -v -timeout 40m

      - name: Generate coverage reports for backend-core
        run: |
          cd backend/core
          go tool cover -html=coverage-core.out -o coverage-core.html
          go tool cover -func=coverage-core.out

      - name: Install gocover-cobertura
        run: go install github.com/boumenot/gocover-cobertura@latest

      - name: Convert Go coverage to cobertura XML
        run: |
          cd backend/core
          gocover-cobertura < coverage-core.out > coverage-core.xml

      - name: Upload Go coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: backend/core/coverage-core.html

      - name: Check total coverage ≥10%
        run: |
          cd backend/core
          COV=$(go tool cover -func=coverage-core.out | awk '/total:/{gsub(/%/,""); print $3}' | cut -d. -f1)
          echo "Total coverage: $COV%"
          if [ "$COV" -lt 10 ]; then
            echo "ERROR: coverage too low ($COV% < 10%)"
            exit 1
          fi

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check incremental coverage ≥0%
        run: |
          cd backend/core
          diff-cover coverage-core.xml --compare-branch=origin/main --fail-under=0

  test-evo-cli:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            algorithm/lazyllm/pyproject.toml
            evo/requirements.txt

      - name: Install deps + coverage tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          CMAKE_POLICY_VERSION_MINIMUM=3.5 python -m pip install algorithm/lazyllm -r evo/requirements.txt scikit-build-core pybind11 coverage diff-cover pytest httpx
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"

      - name: Test with coverage
        run: |
          coverage run --source=evo -m pytest tests/evo/ tests/test_cli.py -v
          coverage html -d htmlcov-evo
          coverage xml -o coverage-evo.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evo
          path: htmlcov-evo

      - name: Check total coverage ≥10%
        run: coverage report --include=evo/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-evo.xml --compare-branch=origin/main --fail-under=0

  test-algorithm:
    needs: [lint, doc_check]
    name: Test algorithm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            algorithm/lazyllm/pyproject.toml
            algorithm/requirements.txt
            tests/algorithm/requirements-test.txt

      - name: Read LazyLLM revision
        id: lazyllm
        run: echo "revision=$(git rev-parse HEAD:algorithm/lazyllm)" >> "$GITHUB_OUTPUT"

      - name: Cache LazyLLM wheel
        uses: actions/cache@v4
        id: lazyllm-wheel
        with:
          path: ${{ runner.temp }}/lazyllm-wheels
          key: lazyllm-wheel-v1-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ steps.lazyllm.outputs.revision }}

      - uses: pandoc/actions/setup@v1
        with:
          version: '3.11'

      - name: Install ripgrep
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update && sudo apt-get install -y ripgrep ;;
              macOS) brew install ripgrep ;;
              Windows)
                # Chocolatey can return success after a transient feed error
                # without installing anything. Verify the executable before
                # accepting the result, and retry temporary download failures.
                for attempt in 1 2 3; do
                  if choco install ripgrep -y --no-progress && command -v rg >/dev/null 2>&1; then
                    break
                  fi
                  if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
                done
                ;;
            esac
          fi
          rg --version

      - name: Build LazyLLM wheel
        if: steps.lazyllm-wheel.outputs.cache-hit != 'true'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/lazyllm-wheels" algorithm/lazyllm

      - name: Install deps + coverage tools
        shell: python
        run: |
          import importlib.util
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys

          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'lazyllm-wheels').glob('lazyllm-*.whl'))
          if len(wheels) != 1:
              raise RuntimeError(f'Expected one LazyLLM wheel, found {len(wheels)}')
          subprocess.run([
              sys.executable, '-m', 'pip', 'install', str(wheels[0]),
              '-r', 'algorithm/requirements.txt', '-r', 'tests/algorithm/requirements-test.txt',
              'scikit-build-core', 'pybind11', 'coverage', 'diff-cover',
          ], check=True)
          package = Path(importlib.util.find_spec('lazyllm').origin).parent
          shutil.copy2('algorithm/lazyllm/pyproject.toml', package / 'pyproject.toml')

      - name: Verify lazyllm install
        run: |
          python -c "from lazyllm.tools.agent.skill_manager import SkillManager; print('tools OK')"
          python -c "from lazyllm.module import ModuleBase; print('module OK')"
          python -c "from lazyllm import fc_register; print('fc_register OK')"

      - name: Test with coverage
        # Git Bash enables Windows backup privileges, bypassing directory ACL tests.
        shell: python
        env:
          LAZYLLM_INIT_DOC: "1"
        run: |
          import subprocess
          import sys

          for arguments in [
              ['run', '--source=algorithm', '-m', 'pytest', 'tests/algorithm/', '-v', '--durations=50'],
              ['html', '-d', 'htmlcov-algorithm'],
              ['xml', '-o', 'coverage-algorithm.xml'],
          ]:
              subprocess.run([sys.executable, '-m', 'coverage', *arguments], check=True)

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-algorithm-${{ matrix.os }}
          path: htmlcov-algorithm

      - name: Check total coverage ≥10%
        run: coverage report --include=algorithm/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-algorithm.xml --compare-branch=origin/main --fail-under=0
  test-channel-gateway:
    name: Test channel gateway (${{ matrix.driver }})
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        driver: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install gateway test dependencies
        run: pip install -r tests/backend/channel-gateway/requirements-test.txt
      - name: Run channel gateway tests
        env:
          CHANNEL_GATEWAY_TEST_DRIVER: ${{ matrix.driver }}
          CHANNEL_GATEWAY_TEST_POSTGRES_DSN: postgres://root:test-password@127.0.0.1:5432/postgres
        run: PYTHONPATH=backend/channel-gateway python -m pytest tests/backend/channel-gateway/ -v --tb=short
