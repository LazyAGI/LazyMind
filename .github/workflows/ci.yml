# CI: run lint, documentation checks, and tests for pushes and pull requests.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"
  pull_request:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Lint
        run: make lint

  doc_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Doc check
        run: pip install pytest && python -m pytest tests/doc_check/ -v

  test-frontend:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Coverage thresholds (≥10%) are enforced by `coverage.thresholds` in
      # frontend/vitest.config.ts, so a shortfall fails this step.
      - name: Test with coverage
        working-directory: frontend
        run: pnpm test:coverage --coverage.reporter=text --coverage.reporter=html --coverage.reporter=cobertura

      - name: Upload HTML coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check incremental coverage ≥0%
        working-directory: frontend
        run: diff-cover coverage/cobertura-coverage.xml --compare-branch=origin/main --fail-under=0

  test-local-runtime:
    needs: [lint, doc_check]
    name: Test local runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
      - name: Test Local Proxy
        working-directory: local/local-proxy
        run: go test ./... -v
      - name: Test Local Runtime Manager
        working-directory: local/local-runtime-manager
        run: go test ./... -v

  test-desktop-shell:
    needs: [lint, doc_check]
    name: Test desktop shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Desktop shell
        shell: bash
        run: node --test desktop/scripts/*.test.mjs

  test-auth-service:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps + coverage tools
        run: |
          pip install -r backend/auth-service/requirements.txt
          pip install -r tests/backend/auth-service/requirements-test.txt
          pip install 'httpx<0.28' 'anyio<4.5' coverage diff-cover

      - name: Test with coverage
        run: |
          coverage run --source=backend/auth-service -m pytest tests/backend/auth-service/ -v
          coverage html -d htmlcov-auth
          coverage xml -o coverage-auth.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth
          path: htmlcov-auth

      - name: Check total coverage ≥10%
        run: coverage report --include=backend/auth-service/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-auth.xml --compare-branch=origin/main --fail-under=0

  test-backend-core:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Verify migration paths
        env:
          MIGRATION_TEST_POSTGRES_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        run: cd backend/core && go test ./migrate -v

      - name: Test backend core (SQLite)
        run: cd backend/core && go test ./... -v

      - name: Test backend core (PostgreSQL)
        env:
          TEST_DB_DRIVER: postgres
          TEST_DB_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        run: cd backend/core && go test ./... -v

      - name: Test backend core integration module
        run: cd tests/backend/core && go mod tidy && go test ./... -v

      - name: Generate coverage for backend-core
        run: |
          cd backend/core
          go test ./... -coverprofile=coverage-core.out
          go tool cover -html=coverage-core.out -o coverage-core.html
          go tool cover -func=coverage-core.out

      - name: Install gocover-cobertura
        run: go install github.com/boumenot/gocover-cobertura@latest

      - name: Convert Go coverage to cobertura XML
        run: |
          cd backend/core
          gocover-cobertura < coverage-core.out > coverage-core.xml

      - name: Upload Go coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: backend/core/coverage-core.html

      - name: Check total coverage ≥10%
        run: |
          cd backend/core
          COV=$(go tool cover -func=coverage-core.out | awk '/total:/{gsub(/%/,""); print $3}' | cut -d. -f1)
          echo "Total coverage: $COV%"
          if [ "$COV" -lt 10 ]; then
            echo "ERROR: coverage too low ($COV% < 10%)"
            exit 1
          fi

      - name: Install diff-cover
        run: pip install diff-cover

      - name: Check incremental coverage ≥0%
        run: |
          cd backend/core
          diff-cover coverage-core.xml --compare-branch=origin/main --fail-under=0

  test-evo-cli:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps + coverage tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          pip install scikit-build-core pybind11 coverage diff-cover
          CMAKE_POLICY_VERSION_MINIMUM=3.5 pip install --no-cache-dir algorithm/lazyllm
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"
          pip install -r evo/requirements.txt
          pip install pytest httpx

      - name: Test with coverage
        run: |
          coverage run --source=evo -m pytest tests/evo/ tests/test_cli.py -v
          coverage html -d htmlcov-evo
          coverage xml -o coverage-evo.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evo
          path: htmlcov-evo

      - name: Check total coverage ≥10%
        run: coverage report --include=evo/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-evo.xml --compare-branch=origin/main --fail-under=0

  test-algorithm:
    needs: [lint, doc_check]
    name: Test algorithm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2025]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps + coverage tools
        env:
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        run: |
          pip install scikit-build-core pybind11 coverage diff-cover
          pip install --no-cache-dir algorithm/lazyllm
          python -c "import lazyllm, pathlib, shutil; shutil.copy2('algorithm/lazyllm/pyproject.toml', pathlib.Path(lazyllm.__path__[0]) / 'pyproject.toml')"
          pip install -r algorithm/requirements.txt
          pip install -r tests/algorithm/requirements-test.txt

      - name: Verify lazyllm install
        run: |
          python -c "from lazyllm.tools.agent.skill_manager import SkillManager; print('tools OK')"
          python -c "from lazyllm.module import ModuleBase; print('module OK')"
          python -c "from lazyllm import fc_register; print('fc_register OK')"

      - name: Test with coverage
        env:
          LAZYLLM_INIT_DOC: "1"
        run: |
          coverage run --source=algorithm -m pytest tests/algorithm/ -v
          coverage html -d htmlcov-algorithm
          coverage xml -o coverage-algorithm.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-algorithm-${{ matrix.os }}
          path: htmlcov-algorithm

      - name: Check total coverage ≥10%
        run: coverage report --include=algorithm/* --fail-under=10

      - name: Check incremental coverage ≥0%
        run: diff-cover coverage-algorithm.xml --compare-branch=origin/main --fail-under=0
