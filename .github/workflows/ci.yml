name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"
  pull_request:
    branches: [main, master, 'dev/*']
    paths-ignore:
      - "**.md"
      - ".git*"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Lint
        run: make lint

  doc_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Doc check
        run: pip install pytest && python -m pytest tests/doc_check/ -v

  # =======================================================================
  # Frontend：先出HTML报告 -> 再卡点
  # =======================================================================
  test-frontend:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and test with coverage
        run: |
          cd tests/frontend
          npm install
          npm install -D c8
          npx c8 --reporter=html --reporter=cobertura npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: tests/frontend/coverage

      - name: Check total coverage ≥80%
        run: |
          cd tests/frontend
          npx c8 check-coverage --lines 80 --functions 80 --branches 80

  # =======================================================================
  # auth-service：先HTML -> 再卡点
  # =======================================================================
  test-auth-service:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r backend/auth-service/requirements.txt
          pip install -r tests/backend/auth-service/requirements-test.txt
          pip install 'httpx<0.28' 'anyio<4.5' coverage diff-cover

      - name: Run tests and generate HTML
        run: |
          coverage run --source=backend/auth-service -m pytest tests/backend/auth-service/ -v
          coverage html -d htmlcov-auth
          coverage xml -o coverage-auth.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth
          path: htmlcov-auth

      - name: Check total coverage ≥80%
        run: coverage report --include=backend/auth-service/* --fail-under=80

      - name: Check incremental coverage ≥80%
        run: |
          diff-cover coverage-auth.xml --compare-branch=origin/main --fail-under=80

  # =======================================================================
  # backend-core (Go)：先HTML -> 再卡点
  # =======================================================================
  test-backend-core:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'

      - name: Verify migration paths
        env:
          MIGRATION_TEST_POSTGRES_DSN: postgres://root:test-password@127.0.0.1:5432/postgres?sslmode=disable
        run: cd backend/core && go test ./migrate -v

      - name: Test with coverage & generate HTML
        run: |
          cd backend/core
          go test ./... -coverprofile=coverage-core.out
          go tool cover -html=coverage-core.out -o coverage-core.html
          go tool cover -func=coverage-core.out

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: backend/core/coverage-core.html

      - name: Check total coverage ≥80%
        run: |
          cd backend/core
          go tool cover -func=coverage-core.out | grep total | awk '{print $2}' | sed 's/%//g' > cov.txt
          if [ $(cat cov.txt | cut -d. -f1) -lt 80 ]; then exit 1; fi

  # =======================================================================
  # evo-cli：先HTML -> 再卡点
  # =======================================================================
  test-evo-cli:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          pip install scikit-build-core pybind11 coverage diff-cover
          CMAKE_POLICY_VERSION_MINIMUM=3.5 pip install --no-cache-dir algorithm/lazyllm
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"
          pip install -r evo/requirements.txt
          pip install pytest httpx

      - name: Run tests and generate HTML
        run: |
          coverage run --source=evo -m pytest tests/evo/ tests/test_cli.py -v
          coverage html -d htmlcov-evo
          coverage xml -o coverage-evo.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-evo
          path: htmlcov-evo

      - name: Check total coverage ≥80%
        run: coverage report --include=evo/* --fail-under=80

      - name: Check incremental coverage ≥80%
        run: |
          diff-cover coverage-evo.xml --compare-branch=origin/main --fail-under=80

  # =======================================================================
  # algorithm：先HTML -> 再卡点
  # =======================================================================
  test-algorithm:
    needs: [lint, doc_check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cmake
          pip install scikit-build-core pybind11 coverage diff-cover
          CMAKE_POLICY_VERSION_MINIMUM=3.5 pip install --no-cache-dir algorithm/lazyllm
          cp algorithm/lazyllm/pyproject.toml "$(python -c 'import lazyllm; print(lazyllm.__path__[0])')/"
          pip install -r algorithm/requirements.txt
          pip install -r tests/algorithm/requirements-test.txt

      - name: Verify lazyllm install
        run: |
          python -c "from lazyllm.tools.agent.skill_manager import SkillManager; print('tools OK')"
          python -c "from lazyllm.module import ModuleBase; print('module OK')"
          python -c "from lazyllm import fc_register; print('fc_register OK')"

      - name: Run tests and generate HTML
        env:
          LAZYLLM_INIT_DOC: "1"
        run: |
          coverage run --source=algorithm -m pytest tests/algorithm/ -v
          coverage html -d htmlcov-algorithm
          coverage xml -o coverage-algorithm.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-algorithm
          path: htmlcov-algorithm

      - name: Check total coverage ≥80%
        run: coverage report --include=algorithm/* --fail-under=80

      - name: Check incremental coverage ≥80%
        run: |
          diff-cover coverage-algorithm.xml --compare-branch=origin/main --fail-under=80

  # =======================================================================
  # 汇总展示
  # =======================================================================
  coverage-report:
    needs:
      - test-frontend
      - test-auth-service
      - test-backend-core
      - test-evo-cli
      - test-algorithm
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: pip install coverage

      - name: Download all reports
        uses: actions/download-artifact@v4

      - name: Show summary
        run: |
          echo "## 📊 覆盖率结果（已生成HTML报告）" > comment.md
          echo "" >> comment.md
          echo "✅ 所有HTML覆盖率报告已上传，可在Artifacts查看" >> comment.md
          echo "" >> comment.md

      - name: Post to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: comment.md
