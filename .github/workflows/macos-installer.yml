name: macOS Desktop Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build; leave empty to build the selected workflow branch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  MIRROR_PROFILE: intl
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  GOPROXY: https://proxy.golang.org,direct
  PIP_INDEX_URL: https://pypi.org/simple
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  build-macos-installer:
    name: Build macOS arm64 DMG
    environment: mac_dev
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Detect release tag
        id: release
        env:
          EXPLICIT_REF: ${{ inputs.git_ref }}
          REQUESTED_REF: ${{ inputs.git_ref || github.ref }}
          REQUESTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          release_tag=""
          tag_candidate=""
          if [[ "${REQUESTED_REF}" == refs/tags/* ]]; then
            tag_candidate="${REQUESTED_REF#refs/tags/}"
          elif [[ "${REQUESTED_REF_TYPE}" == "tag" ]]; then
            tag_candidate="${REQUESTED_REF}"
          elif [[ -n "${EXPLICIT_REF}" ]] && \
               git show-ref --verify --quiet "refs/tags/${REQUESTED_REF}"; then
            tag_candidate="${REQUESTED_REF}"
          fi

          if [[ -n "${tag_candidate}" ]]; then
            tag_commit="$(git rev-parse "refs/tags/${tag_candidate}^{commit}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "::error::Requested tag ${tag_candidate} does not match the checked-out commit"
              exit 1
            fi
            release_tag="${tag_candidate}"
          fi

          if [[ -n "${release_tag}" ]]; then
            echo "is_tag=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
            echo "Release tag detected: ${release_tag}"
          else
            echo "is_tag=false" >> "${GITHUB_OUTPUT}"
            echo "Requested ref is not a tag; notarization will be skipped."
          fi

      - name: Initialize development submodules
        if: steps.release.outputs.is_tag != 'true'
        run: git submodule update --init algorithm/lazyllm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Validate tag and set desktop version
        if: steps.release.outputs.is_tag == 'true'
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          node desktop/scripts/resolve-release-version.mjs \
            --tag "${RELEASE_TAG}" \
            --package desktop/electron/package.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            backend/core/go.sum
            backend/file-watcher/go.sum
            backend/scan-control-plane/go.sum
            local/local-proxy/go.sum
            local/local-runtime-manager/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            algorithm/requirements*.txt
            backend/auth-service/requirements.txt
            backend/channel-gateway/requirements.txt

      - name: Cache pnpm and Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            desktop/cache/history-injection
          key: macos-arm64-desktop-${{ hashFiles('frontend/pnpm-lock.yaml', 'desktop/electron/pnpm-lock.yaml', 'desktop/history-injection-package.json') }}
          restore-keys: |
            macos-arm64-desktop-

      - name: Configure pnpm cache
        run: pnpm config set store-dir "${HOME}/.pnpm-store"

      - name: Show build environment
        env:
          REQUESTED_REF: ${{ inputs.git_ref || github.ref_name }}
        run: |
          git --version
          node --version
          pnpm --version
          go version
          uv --version
          uname -a
          echo "Requested ref: ${REQUESTED_REF}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          df -h /

      - name: Validate signing and notarization inputs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IS_TAG: ${{ steps.release.outputs.is_tag }}
        run: |
          set -euo pipefail

          missing=()
          for variable in CSC_LINK CSC_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${variable}")
            fi
          done
          if [[ "${IS_TAG}" == "true" ]]; then
            for variable in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!variable:-}" ]]; then
                missing+=("${variable}")
              fi
            done
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing mac_dev environment secrets: ${missing[*]}"
            exit 1
          fi
          if [[ "${IS_TAG}" == "true" && ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID"
            exit 1
          fi
          if [[ "${IS_TAG}" == "true" ]]; then
            xcrun notarytool --version
          fi

      - name: Run Desktop tests
        run: |
          node --test desktop/scripts/*.test.mjs

      - name: Build and sign app ZIP
        id: build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          LAZYMIND_DESKTOP_PACKAGE_KIND: zip
          LAZYMIND_DESKTOP_SIGNING_MODE: developer-id
          LAZYMIND_RELEASE_BUILD: ${{ steps.release.outputs.is_tag }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"

          target_open_files=65536
          hard_open_files="$(ulimit -Hn)"
          if [[ "${hard_open_files}" != "unlimited" ]] && \
             (( hard_open_files < target_open_files )); then
            target_open_files="${hard_open_files}"
          fi
          ulimit -n "${target_open_files}"
          actual_open_files="$(ulimit -Sn)"
          echo "Open-file limit: ${actual_open_files}"
          if (( actual_open_files < 8192 )); then
            echo "::error::Open-file limit is too low for the bundled desktop runtime"
            exit 1
          fi

          make desktop-darwin-arm64
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Launch and verify packaged application
        id: packaged_smoke
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/lazymind-packaged-smoke"
          LAZYMIND_DESKTOP_RUNTIME_ROOT="${smoke_root}" node desktop/scripts/packaged-app-smoke.mjs \
            --app "${GITHUB_WORKSPACE}/desktop/dist/mac-arm64/LazyMind.app" \
            --runtime-root "${smoke_root}" \
            --platform darwin \
            --timeout-ms 300000 \
            --leave-running true

      - name: Submit app ZIP for notarization
        if: steps.release.outputs.is_tag == 'true'
        id: zip_submission
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          zip_path="${GITHUB_WORKSPACE}/desktop/dist/LazyMind-darwin-arm64.zip"
          test -f "${zip_path}"
          xcrun notarytool submit "${zip_path}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --output-format json > zip-notarization-submission.json
          submission_id="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value.id) process.exit(1);
              process.stdout.write(value.id);
            ' zip-notarization-submission.json
          )"
          echo "submission_id=${submission_id}" >> "${GITHUB_OUTPUT}"

      - name: Start asynchronous packaged runtime cleanup
        if: steps.packaged_smoke.outcome == 'success' && (steps.release.outputs.is_tag != 'true' || steps.zip_submission.outcome == 'success')
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/lazymind-packaged-smoke"
          app_path="${GITHUB_WORKSPACE}/desktop/dist/mac-arm64/LazyMind.app"
          app_executable="${app_path}/Contents/MacOS/LazyMind"
          resources_root="${app_path}/Contents/Resources/runtime"
          manager="${resources_root}/bin/local-runtime-manager"
          state_file="${smoke_root}/state/runtime-state.json"
          cleanup_log="${RUNNER_TEMP}/lazymind-packaged-cleanup.log"
          cleanup_pid_file="${RUNNER_TEMP}/lazymind-packaged-cleanup.pid"
          owner_token="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).ownerToken' "${state_file}")"

          pkill -9 -f "${app_executable}" 2>/dev/null || true
          nohup env \
            LAZYMIND_LOCAL_DOWN_TIMEOUT=180s \
            LAZYMIND_PROCESS_COMPOSE_DOWN_TIMEOUT=150s \
            "${manager}" down \
              --profile desktop \
              --owner-token "${owner_token}" \
              --runtime-root "${smoke_root}" \
              --resources-root "${resources_root}" \
              --repo-root "${resources_root}/app" \
              > "${cleanup_log}" 2>&1 < /dev/null &
          cleanup_pid="$!"
          echo "${cleanup_pid}" > "${cleanup_pid_file}"
          disown "${cleanup_pid}" 2>/dev/null || true
          echo "Started packaged runtime cleanup as pid ${cleanup_pid}; notarization continues without waiting."

      - name: Wait up to 30 minutes for app ZIP notarization
        if: steps.release.outputs.is_tag == 'true'
        id: zip_notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.zip_submission.outputs.submission_id }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"
          deadline="$(( started_at + 1800 ))"
          status="In Progress"
          while (( $(date +%s) < deadline )); do
            xcrun notarytool info "${SUBMISSION_ID}" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --output-format json > zip-notarization-status.json
            status="$(
              node -e '
                const fs = require("fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (!value.status) process.exit(1);
                process.stdout.write(value.status);
              ' zip-notarization-status.json
            )"
            echo "Apple ZIP notarization status: ${status}"
            if [[ "${status}" != "In Progress" ]]; then
              break
            fi
            sleep 30
          done

          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" == "In Progress" ]]; then
            echo "::warning::ZIP notarization is still in progress after ${duration_seconds}s; continuing directly to DMG packaging."
          fi

      - name: Fail rejected app ZIP notarization
        if: steps.release.outputs.is_tag == 'true' && steps.zip_notarization.outputs.status == 'Invalid'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.zip_submission.outputs.submission_id }}
        run: |
          xcrun notarytool log "${SUBMISSION_ID}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            zip-notarization-log.json
          echo "::error::Apple rejected the app ZIP notarization submission."
          exit 1

      - name: Staple accepted app ticket
        if: steps.release.outputs.is_tag == 'true' && steps.zip_notarization.outputs.status == 'Accepted'
        run: |
          set -euo pipefail
          app_path="${GITHUB_WORKSPACE}/desktop/dist/mac-arm64/LazyMind.app"
          xcrun stapler staple "${app_path}"
          xcrun stapler validate "${app_path}"
          spctl --assess --type execute --verbose=4 "${app_path}"

      - name: Package signed app as DMG
        id: package
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          LAZYMIND_DESKTOP_RUNTIME_STAGE: ${{ github.workspace }}/desktop/build/darwin-arm64/runtime
          LAZYMIND_DESKTOP_OUTPUT_DIR: ${{ github.workspace }}/desktop/dist
          LAZYMIND_DESKTOP_SIGNING_MODE: developer-id
          IS_TAG: ${{ steps.release.outputs.is_tag }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"
          pnpm --dir desktop/electron run dist:mac:arm64:prepackaged
          source_dmg="${GITHUB_WORKSPACE}/desktop/dist/LazyMind-macos-arm64.dmg"
          publish_dir="${GITHUB_WORKSPACE}/desktop/dist/publish"
          package_version="$(node -p 'require("./desktop/electron/package.json").version')"
          short_sha="$(git rev-parse --short=8 HEAD)"
          pending_path="${publish_dir}/LazyMind-macos-arm64-${package_version}-${short_sha}.pending.dmg"
          development_path="${publish_dir}/LazyMind-macos-arm64-${package_version}-${short_sha}.unnotarized.dmg"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-final-dmg.XXXXXX")"

          mkdir -p "${publish_dir}"
          if [[ "${IS_TAG}" == "true" ]]; then
            cp "${source_dmg}" "${pending_path}"
          else
            cp "${source_dmg}" "${development_path}"
          fi
          codesign --verify --strict --verbose=2 "${source_dmg}"
          hdiutil attach "${source_dmg}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/LazyMind.app"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "pending_path=${pending_path}" >> "${GITHUB_OUTPUT}"
          echo "development_path=${development_path}" >> "${GITHUB_OUTPUT}"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Submit DMG for notarization
        if: steps.release.outputs.is_tag == 'true'
        id: dmg_submission
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PENDING_DMG: ${{ steps.package.outputs.pending_path }}
        run: |
          set -euo pipefail
          submission_path="${PENDING_DMG/.pending.dmg/.notarization.json}"
          xcrun notarytool submit "${PENDING_DMG}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --output-format json > "${submission_path}"
          submission_id="$(
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (!value.id) process.exit(1);
              process.stdout.write(value.id);
            ' "${submission_path}"
          )"
          echo "submission_id=${submission_id}" >> "${GITHUB_OUTPUT}"
          echo "submission_path=${submission_path}" >> "${GITHUB_OUTPUT}"

      - name: Wait up to 30 minutes for DMG notarization
        if: steps.release.outputs.is_tag == 'true'
        id: dmg_notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.dmg_submission.outputs.submission_id }}
        run: |
          set -euo pipefail
          started_at="$(date +%s)"
          deadline="$(( started_at + 1800 ))"
          status="In Progress"
          while (( $(date +%s) < deadline )); do
            xcrun notarytool info "${SUBMISSION_ID}" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --output-format json > dmg-notarization-status.json
            status="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).status' dmg-notarization-status.json)"
            echo "Apple DMG notarization status: ${status}"
            [[ "${status}" == "In Progress" ]] || break
            sleep 30
          done
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" == "In Progress" ]]; then
            echo "::warning::DMG notarization timed out. Uploading pending inputs for the manual finalizer."
          fi

      - name: Fail rejected DMG notarization
        if: steps.release.outputs.is_tag == 'true' && steps.dmg_notarization.outputs.status == 'Invalid'
        run: |
          echo "::error::Apple rejected DMG notarization submission ${{ steps.dmg_submission.outputs.submission_id }}."
          exit 1

      - name: Staple and validate accepted DMG
        if: steps.release.outputs.is_tag == 'true' && steps.dmg_notarization.outputs.status == 'Accepted'
        id: final_package
        env:
          PENDING_DMG: ${{ steps.package.outputs.pending_path }}
        run: |
          set -euo pipefail
          final_path="${PENDING_DMG/.pending.dmg/.dmg}"
          mv "${PENDING_DMG}" "${final_path}"
          xcrun stapler staple "${final_path}"
          xcrun stapler validate "${final_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${final_path}"
          echo "installer_path=${final_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload final notarized installer
        if: steps.release.outputs.is_tag == 'true' && steps.dmg_notarization.outputs.status == 'Accepted'
        id: upload_final
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-arm64-notarized
          path: ${{ steps.final_package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload pending DMG after timeout
        if: steps.release.outputs.is_tag == 'true' && steps.dmg_notarization.outputs.status == 'In Progress'
        id: upload_pending
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-arm64-pending
          path: ${{ steps.package.outputs.pending_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload DMG submission record after timeout
        if: steps.release.outputs.is_tag == 'true' && steps.dmg_notarization.outputs.status == 'In Progress'
        id: upload_submission
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-notarization-submission
          path: ${{ steps.dmg_submission.outputs.submission_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload development installer
        if: steps.release.outputs.is_tag != 'true'
        id: upload_development
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-arm64-development
          path: ${{ steps.package.outputs.development_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Add artifact summary
        if: always() && steps.package.outcome == 'success'
        env:
          FINAL_URL: ${{ steps.upload_final.outputs.artifact-url }}
          PENDING_URL: ${{ steps.upload_pending.outputs.artifact-url }}
          SUBMISSION_URL: ${{ steps.upload_submission.outputs.artifact-url }}
          DEVELOPMENT_URL: ${{ steps.upload_development.outputs.artifact-url }}
        run: |
          {
            echo "## macOS installer result"
            echo
            if [[ "${{ steps.release.outputs.is_tag }}" != "true" ]]; then
              echo "[Download the signed but unnotarized development DMG](${DEVELOPMENT_URL})"
            elif [[ "${{ steps.dmg_notarization.outputs.status }}" == "Accepted" ]]; then
              echo "[Download the notarized and stapled DMG](${FINAL_URL})"
            else
              echo "DMG notarization is still processing."
              echo "- [Pending DMG](${PENDING_URL})"
              echo "- [Submission record](${SUBMISSION_URL})"
              echo "- Run **Finalize macOS Notarization** with source run ID \`${GITHUB_RUN_ID}\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Verify packaged runtime cleanup after artifact upload
        if: always() && steps.packaged_smoke.outcome == 'success'
        run: |
          set -euo pipefail
          smoke_root="${RUNNER_TEMP}/lazymind-packaged-smoke"
          app_path="${GITHUB_WORKSPACE}/desktop/dist/mac-arm64/LazyMind.app"
          app_executable="${app_path}/Contents/MacOS/LazyMind"
          resources_root="${app_path}/Contents/Resources/runtime"
          manager="${resources_root}/bin/local-runtime-manager"
          state_file="${smoke_root}/state/runtime-state.json"
          cleanup_log="${RUNNER_TEMP}/lazymind-packaged-cleanup.log"
          cleanup_pid_file="${RUNNER_TEMP}/lazymind-packaged-cleanup.pid"
          owner_token="$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).ownerToken' "${state_file}")"

          runtime_stopped() {
            local status_file="${RUNNER_TEMP}/lazymind-packaged-status.json"
            if ! "${manager}" status \
              --profile desktop \
              --owner-token "${owner_token}" \
              --runtime-root "${smoke_root}" \
              --resources-root "${resources_root}" \
              --repo-root "${resources_root}/app" \
              --json > "${status_file}"; then
              return 1
            fi
            node - "${status_file}" <<'NODE'
          const fs = require("fs");
          const status = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const active = new Set(["ready", "running", "starting", "stale"]);
          const servicesStopped = Object.values(status.services || {})
            .every((service) => !active.has(service?.status));
          process.exit(!active.has(status.overallStatus) && servicesStopped ? 0 : 1);
          NODE
          }

          if runtime_stopped; then
            echo "Asynchronous packaged runtime cleanup completed."
            test ! -f "${cleanup_log}" || tail -n 80 "${cleanup_log}"
            exit 0
          fi

          echo "::warning::Asynchronous packaged runtime cleanup is incomplete; forcing a second bounded cleanup."
          if [[ -f "${cleanup_pid_file}" ]]; then
            cleanup_pid="$(tr -d '[:space:]' < "${cleanup_pid_file}")"
            if [[ "${cleanup_pid}" =~ ^[0-9]+$ ]] && kill -0 "${cleanup_pid}" 2>/dev/null; then
              kill -9 "${cleanup_pid}" 2>/dev/null || true
            fi
          fi
          pkill -9 -f "${app_executable}" 2>/dev/null || true
          supervisor_pid_file="${smoke_root}/run/process-compose.pid"
          if [[ -f "${supervisor_pid_file}" ]]; then
            supervisor_pid="$(tr -d '[:space:]' < "${supervisor_pid_file}")"
            if [[ "${supervisor_pid}" =~ ^[0-9]+$ ]] && kill -0 "${supervisor_pid}" 2>/dev/null; then
              kill -9 -- "-${supervisor_pid}" 2>/dev/null || kill -9 "${supervisor_pid}" 2>/dev/null || true
            fi
          fi

          env \
            LAZYMIND_LOCAL_DOWN_TIMEOUT=120s \
            LAZYMIND_PROCESS_COMPOSE_DOWN_TIMEOUT=1s \
            "${manager}" down \
              --profile desktop \
              --owner-token "${owner_token}" \
              --runtime-root "${smoke_root}" \
              --resources-root "${resources_root}" \
              --repo-root "${resources_root}/app" || true

          if runtime_stopped; then
            echo "Second forced packaged runtime cleanup completed."
            exit 0
          fi
          test ! -f "${cleanup_log}" || tail -n 120 "${cleanup_log}"
          echo "::error::Packaged runtime cleanup remains incomplete after the second forced attempt; installer artifacts were uploaded before this check."
          exit 1

      - name: Show final disk usage
        if: always()
        run: df -h /
