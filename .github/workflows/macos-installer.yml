name: macOS Desktop Installer

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build; leave empty to build the selected workflow branch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  MIRROR_PROFILE: intl
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  GOPROXY: https://proxy.golang.org,direct
  PIP_INDEX_URL: https://pypi.org/simple
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  build-macos-installer:
    name: Build macOS arm64 DMG
    environment: mac_dev
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          submodules: true
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Detect release tag
        id: release
        env:
          EXPLICIT_REF: ${{ inputs.git_ref }}
          REQUESTED_REF: ${{ inputs.git_ref || github.ref }}
          REQUESTED_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          release_tag=""
          tag_candidate=""
          if [[ "${REQUESTED_REF}" == refs/tags/* ]]; then
            tag_candidate="${REQUESTED_REF#refs/tags/}"
          elif [[ "${REQUESTED_REF_TYPE}" == "tag" ]]; then
            tag_candidate="${REQUESTED_REF}"
          elif [[ -n "${EXPLICIT_REF}" ]] && \
               git show-ref --verify --quiet "refs/tags/${REQUESTED_REF}"; then
            tag_candidate="${REQUESTED_REF}"
          fi

          if [[ -n "${tag_candidate}" ]]; then
            tag_commit="$(git rev-parse "refs/tags/${tag_candidate}^{commit}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" ]]; then
              echo "::error::Requested tag ${tag_candidate} does not match the checked-out commit"
              exit 1
            fi
            release_tag="${tag_candidate}"
          fi

          if [[ -n "${release_tag}" ]]; then
            echo "is_tag=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
            echo "Release tag detected: ${release_tag}"
          else
            echo "is_tag=false" >> "${GITHUB_OUTPUT}"
            echo "Requested ref is not a tag; notarization will be skipped."
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Set desktop version from release tag
        if: steps.release.outputs.is_tag == 'true'
        id: version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const packagePath = "desktop/electron/package.json";
          const tag = process.env.RELEASE_TAG.replace(/^v/, "");
          const pythonPrerelease = tag.match(/^(\d+\.\d+\.\d+)(a|b|rc)(\d+)$/);
          const prereleaseNames = { a: "alpha", b: "beta", rc: "rc" };
          const version = pythonPrerelease
            ? `${pythonPrerelease[1]}-${prereleaseNames[pythonPrerelease[2]]}.${pythonPrerelease[3]}`
            : tag;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} cannot be converted to a valid desktop SemVer`);
          }
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          packageJson.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `package_version=${version}\n`);
          console.log(`Desktop package version: ${version} (release tag: ${process.env.RELEASE_TAG})`);
          NODE

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            backend/core/go.sum
            backend/file-watcher/go.sum
            backend/scan-control-plane/go.sum
            local/local-proxy/go.sum
            local/local-runtime-manager/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            algorithm/requirements*.txt
            backend/auth-service/requirements.txt

      - name: Cache pnpm and Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-arm64-desktop-${{ hashFiles('frontend/pnpm-lock.yaml', 'desktop/electron/pnpm-lock.yaml') }}
          restore-keys: |
            macos-arm64-desktop-

      - name: Configure pnpm cache
        run: pnpm config set store-dir "${HOME}/.pnpm-store"

      - name: Show build environment
        env:
          REQUESTED_REF: ${{ inputs.git_ref || github.ref_name }}
        run: |
          git --version
          node --version
          pnpm --version
          go version
          uv --version
          uname -a
          echo "Requested ref: ${REQUESTED_REF}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          df -h /

      - name: Validate signing and notarization inputs
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IS_TAG: ${{ steps.release.outputs.is_tag }}
        run: |
          set -euo pipefail

          missing=()
          for variable in CSC_LINK CSC_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("${variable}")
            fi
          done
          if [[ "${IS_TAG}" == "true" ]]; then
            for variable in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!variable:-}" ]]; then
                missing+=("${variable}")
              fi
            done
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing mac_dev environment secrets: ${missing[*]}"
            exit 1
          fi
          if [[ "${IS_TAG}" == "true" && ! "${APPLE_TEAM_ID}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID"
            exit 1
          fi
          if [[ "${IS_TAG}" == "true" ]]; then
            xcrun notarytool --version
          fi

      - name: Run Desktop tests
        run: |
          node --test \
            desktop/scripts/desktop-build.test.mjs \
            desktop/scripts/desktop-paths.test.mjs \
            desktop/scripts/installer-warmup.test.mjs \
            desktop/scripts/runtime-status.test.mjs

      - name: Build and sign DMG
        id: build
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LAZYMIND_DESKTOP_NOTARIZE: ${{ steps.release.outputs.is_tag }}
          LAZYMIND_RELEASE_BUILD: "true"
        run: |
          set -euo pipefail

          started_at="$(date +%s)"

          target_open_files=65536
          hard_open_files="$(ulimit -Hn)"
          if [[ "${hard_open_files}" != "unlimited" ]] && \
             (( hard_open_files < target_open_files )); then
            target_open_files="${hard_open_files}"
          fi
          ulimit -n "${target_open_files}"
          actual_open_files="$(ulimit -Sn)"
          echo "Open-file limit: ${actual_open_files}"
          if (( actual_open_files < 8192 )); then
            echo "::error::Open-file limit is too low for the bundled desktop runtime"
            exit 1
          fi

          make desktop-darwin-arm64-dmg
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Validate and stage installer
        id: package
        env:
          IS_TAG: ${{ steps.release.outputs.is_tag }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"

          source_dmg="${GITHUB_WORKSPACE}/desktop/dist/LazyMind-macos-arm64.dmg"
          source_submission="${GITHUB_WORKSPACE}/desktop/dist/notarization-submission.json"
          publish_dir="${GITHUB_WORKSPACE}/desktop/dist/publish"
          package_version="$(node -p 'require("./desktop/electron/package.json").version')"
          short_sha="$(git rev-parse --short=8 HEAD)"
          if [[ "${IS_TAG}" == "true" ]]; then
            output_name="LazyMind-macos-arm64-${package_version}-${short_sha}.pending.dmg"
            artifact_name="LazyMind-macos-arm64-pending"
          else
            output_name="LazyMind-macos-arm64-${package_version}-${short_sha}.unnotarized.dmg"
            artifact_name="LazyMind-macos-arm64-development"
          fi
          output_path="${publish_dir}/${output_name}"
          submission_name="LazyMind-macos-arm64-${package_version}-${short_sha}.notarization.json"
          submission_path="${publish_dir}/${submission_name}"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-dmg.XXXXXX")"

          mkdir -p "${publish_dir}"
          cp "${source_dmg}" "${output_path}"
          submission_id=""
          if [[ "${IS_TAG}" == "true" ]]; then
            cp "${source_submission}" "${submission_path}"
            submission_id="$(
              node -e '
                const fs = require("fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (!value.id) process.exit(1);
                process.stdout.write(value.id);
              ' "${submission_path}"
            )"
            echo "submission_path=${submission_path}" >> "${GITHUB_OUTPUT}"
            echo "submission_id=${submission_id}" >> "${GITHUB_OUTPUT}"
          elif [[ -e "${source_submission}" ]]; then
            echo "::error::A non-tag build unexpectedly created a notarization submission"
            exit 1
          fi
          codesign --verify --strict --verbose=2 "${output_path}"

          hdiutil attach "${output_path}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/LazyMind.app"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          sha256="$(shasum -a 256 "${output_path}" | awk '{print $1}')"
          echo "installer_path=${output_path}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

          {
            echo "## macOS installer"
            echo
            echo "- File: \`${output_name}\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- Signature: Developer ID Application"
            echo "- Warmup: runs once on first launch for each app version"
            if [[ "${IS_TAG}" == "true" ]]; then
              echo "- Release tag: \`${RELEASE_TAG}\`"
              echo "- Apple submission ID: \`${submission_id}\`"
              echo "- Notarization: submitted; not yet accepted or stapled"
              echo
              echo "Run **Finalize macOS Notarization** with source run ID \`${GITHUB_RUN_ID}\` after Apple finishes processing."
            else
              echo "- Notarization: skipped because this commit has no Git tag"
              echo
              echo "This development DMG is not a distributable release and may be blocked by Gatekeeper."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installer artifact
        id: upload_installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Upload notarization submission artifact
        if: steps.release.outputs.is_tag == 'true'
        id: upload_submission
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-notarization-submission
          path: ${{ steps.package.outputs.submission_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Wait up to 30 minutes for Apple notarization
        if: steps.release.outputs.is_tag == 'true'
        id: notarization
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.package.outputs.submission_id }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"
          deadline="$(( started_at + 1800 ))"
          status="In Progress"
          while (( $(date +%s) < deadline )); do
            xcrun notarytool info "${SUBMISSION_ID}" \
              --apple-id "${APPLE_ID}" \
              --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
              --team-id "${APPLE_TEAM_ID}" \
              --output-format json > notarization-status.json
            status="$(
              node -e '
                const fs = require("fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                if (!value.status) process.exit(1);
                process.stdout.write(value.status);
              ' notarization-status.json
            )"
            echo "Apple notarization status: ${status}"
            if [[ "${status}" != "In Progress" ]]; then
              break
            fi
            sleep 30
          done

          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" == "In Progress" ]]; then
            echo "::warning::Apple notarization is still in progress after ${duration_seconds}s. The pending artifacts are available; run Finalize macOS Notarization later with source run ID ${GITHUB_RUN_ID}."
          fi

      - name: Download Apple rejection log
        if: steps.release.outputs.is_tag == 'true' && steps.notarization.outputs.status == 'Invalid'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SUBMISSION_ID: ${{ steps.package.outputs.submission_id }}
        run: |
          xcrun notarytool log "${SUBMISSION_ID}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            notarization-log.json

      - name: Upload Apple rejection diagnostics
        if: steps.release.outputs.is_tag == 'true' && steps.notarization.outputs.status == 'Invalid'
        uses: actions/upload-artifact@v7
        with:
          name: LazyMind-macos-notarization-diagnostics
          path: |
            notarization-status.json
            notarization-log.json
          if-no-files-found: error
          retention-days: 30

      - name: Staple and validate accepted installer
        if: steps.release.outputs.is_tag == 'true' && steps.notarization.outputs.status == 'Accepted'
        id: final_package
        env:
          PENDING_DMG: ${{ steps.package.outputs.installer_path }}
        run: |
          set -euo pipefail

          started_at="$(date +%s)"
          final_dir="${GITHUB_WORKSPACE}/desktop/dist/final"
          pending_name="$(basename "${PENDING_DMG}")"
          final_name="${pending_name/.pending.dmg/.dmg}"
          final_path="${final_dir}/${final_name}"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-final-dmg.XXXXXX")"

          mkdir -p "${final_dir}"
          cp "${PENDING_DMG}" "${final_path}"
          codesign --verify --strict --verbose=2 "${final_path}"
          xcrun stapler staple "${final_path}"
          xcrun stapler validate "${final_path}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "${final_path}"

          hdiutil attach "${final_path}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/LazyMind.app"
          spctl --assess --type execute --verbose=4 "${mount_dir}/LazyMind.app"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          sha256="$(shasum -a 256 "${final_path}" | awk '{print $1}')"
          duration_seconds="$(( $(date +%s) - started_at ))"
          echo "installer_path=${final_path}" >> "${GITHUB_OUTPUT}"
          echo "installer_name=${final_name}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Upload final notarized installer
        if: steps.release.outputs.is_tag == 'true' && steps.notarization.outputs.status == 'Accepted'
        id: upload_final
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.final_package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
          archive: false

      - name: Fail rejected notarization
        if: steps.release.outputs.is_tag == 'true' && steps.notarization.outputs.status == 'Invalid'
        run: |
          echo "::error::Apple rejected notarization submission ${{ steps.package.outputs.submission_id }}. Review the uploaded diagnostics."
          exit 1

      - name: Add release artifact links to summary
        if: steps.release.outputs.is_tag == 'true'
        env:
          PENDING_ARTIFACT_URL: ${{ steps.upload_installer.outputs.artifact-url }}
          SUBMISSION_ARTIFACT_URL: ${{ steps.upload_submission.outputs.artifact-url }}
          FINAL_ARTIFACT_URL: ${{ steps.upload_final.outputs.artifact-url }}
          NOTARIZATION_STATUS: ${{ steps.notarization.outputs.status }}
        run: |
          {
            echo "## macOS release result"
            echo
            echo "- Release tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Desktop version: \`${{ steps.version.outputs.package_version }}\`"
            echo "- Apple notarization: **${NOTARIZATION_STATUS}**"
            if [[ "${NOTARIZATION_STATUS}" == "Accepted" ]]; then
              echo "- [Download the notarized and stapled installer](${FINAL_ARTIFACT_URL})"
            else
              echo "- Apple is still processing the submission. This workflow completed successfully with pending artifacts."
              echo "- Run **Finalize macOS Notarization** later with source run ID \`${GITHUB_RUN_ID}\`."
            fi
            echo
            echo "### Pending artifacts"
            echo
            echo "- [Pending DMG](${PENDING_ARTIFACT_URL})"
            echo "- [Notarization submission record](${SUBMISSION_ARTIFACT_URL})"
            echo
            echo "Do not distribute the pending DMG. Use it only as input to the finalizer."
            echo
            echo "### Timings"
            echo
            echo "| Phase | Duration |"
            echo "| --- | ---: |"
            echo "| Build, sign, and submit | ${{ steps.build.outputs.duration_seconds }}s |"
            echo "| Validate and stage | ${{ steps.package.outputs.duration_seconds }}s |"
            echo "| Wait for Apple | ${{ steps.notarization.outputs.duration_seconds }}s |"
            if [[ "${NOTARIZATION_STATUS}" == "Accepted" ]]; then
              echo "| Staple and validate | ${{ steps.final_package.outputs.duration_seconds }}s |"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Add development artifact link to summary
        if: steps.release.outputs.is_tag != 'true'
        env:
          DEVELOPMENT_ARTIFACT_URL: ${{ steps.upload_installer.outputs.artifact-url }}
        run: |
          {
            echo "## Development artifact"
            echo
            echo "[Download the signed but unnotarized DMG](${DEVELOPMENT_ARTIFACT_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show final disk usage
        if: always()
        run: df -h /

  report-timings:
    name: Report step timings
    needs: build-macos-installer
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Add step timings to summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const response = await fetch(
            `https://api.github.com/repos/${process.env.REPOSITORY}/actions/runs/${process.env.RUN_ID}/jobs?filter=latest`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            },
          );
          if (!response.ok) {
            throw new Error(`Unable to load job timings: ${response.status} ${await response.text()}`);
          }
          const payload = await response.json();
          const job = payload.jobs.find((candidate) => candidate.name === "Build macOS arm64 DMG");
          if (!job) {
            throw new Error("Build macOS arm64 DMG job was not found in the current workflow run");
          }

          const lines = [
            "## Step timings",
            "",
            `Build result: **${job.conclusion || job.status}**`,
            "",
            "| Step | Result | Duration |",
            "| --- | --- | ---: |",
          ];
          for (const step of job.steps) {
            const started = Date.parse(step.started_at);
            const completed = Date.parse(step.completed_at);
            const duration = Number.isFinite(started) && Number.isFinite(completed)
              ? `${Math.max(0, Math.round((completed - started) / 1000))}s`
              : "n/a";
            lines.push(`| ${step.name.replaceAll("|", "\\|")} | ${step.conclusion || step.status} | ${duration} |`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE
