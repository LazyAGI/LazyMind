name: macOS Desktop Installer

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch, tag, or commit SHA to build; leave empty to build the selected workflow branch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NODE_OPTIONS: --max-old-space-size=4096
  MIRROR_PROFILE: intl
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  GOPROXY: https://proxy.golang.org,direct
  PIP_INDEX_URL: https://pypi.org/simple
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  build-macos-installer:
    name: Build macOS arm64 DMG
    environment: mac_dev
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
          cache-dependency-path: |
            backend/core/go.sum
            backend/file-watcher/go.sum
            backend/scan-control-plane/go.sum
            local/local-proxy/go.sum
            local/local-runtime-manager/go.sum

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: |
            algorithm/requirements*.txt
            backend/auth-service/requirements.txt

      - name: Cache pnpm and Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-arm64-desktop-${{ hashFiles('frontend/pnpm-lock.yaml', 'desktop/electron/pnpm-lock.yaml') }}
          restore-keys: |
            macos-arm64-desktop-

      - name: Configure pnpm cache
        run: pnpm config set store-dir "${HOME}/.pnpm-store"

      - name: Show build environment
        env:
          REQUESTED_REF: ${{ inputs.git_ref || github.ref_name }}
        run: |
          git --version
          node --version
          pnpm --version
          go version
          uv --version
          uname -a
          echo "Requested ref: ${REQUESTED_REF}"
          echo "Checked out commit: $(git rev-parse HEAD)"
          df -h /

      - name: Run Desktop tests
        run: |
          node --test \
            desktop/scripts/desktop-build.test.mjs \
            desktop/scripts/desktop-paths.test.mjs \
            desktop/scripts/installer-warmup.test.mjs \
            desktop/scripts/runtime-status.test.mjs

      - name: Build, sign, and notarize DMG
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make desktop-darwin-arm64-dmg

      - name: Validate and stage installer
        id: package
        run: |
          set -euo pipefail

          source_dmg="${GITHUB_WORKSPACE}/desktop/dist/LazyMind-macos-arm64.dmg"
          publish_dir="${GITHUB_WORKSPACE}/desktop/dist/publish"
          package_version="$(node -p 'require("./desktop/electron/package.json").version')"
          short_sha="$(git rev-parse --short=8 HEAD)"
          output_name="LazyMind-macos-arm64-${package_version}-${short_sha}.dmg"
          output_path="${publish_dir}/${output_name}"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/lazymind-dmg.XXXXXX")"

          mkdir -p "${publish_dir}"
          cp "${source_dmg}" "${output_path}"
          xcrun stapler validate "${output_path}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${output_path}"

          hdiutil attach "${output_path}" -readonly -nobrowse -mountpoint "${mount_dir}"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/LazyMind.app"
          spctl --assess --type execute --verbose=2 "${mount_dir}/LazyMind.app"
          hdiutil detach "${mount_dir}"
          trap - EXIT

          sha256="$(shasum -a 256 "${output_path}" | awk '{print $1}')"
          echo "installer_path=${output_path}" >> "${GITHUB_OUTPUT}"

          {
            echo "## macOS installer"
            echo
            echo "- File: \`${output_name}\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- Signature: Developer ID Application"
            echo "- Notarization: accepted and stapled"
            echo "- Warmup: runs once on first launch for each app version"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload installer artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Download"
            echo
            echo "[Download the macOS installer](${ARTIFACT_URL})"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Show final disk usage
        if: always()
        run: df -h /
