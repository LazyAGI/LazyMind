name: Publish desktop update policy

on:
  workflow_dispatch:
    inputs:
      build_run_ids:
        description: "Comma-separated successful build run IDs from this repository"
        required: true
        type: string
      plan:
        description: "JSON plan: policySequence, issuedAt, expiresAt, releaseIds, explicit edges, revoked"
        required: true
        type: string
  workflow_call:
    inputs:
      use_current_run:
        required: true
        type: boolean
      platform:
        description: "Official installer to publish (macos or windows); omit for existing joint callers"
        required: false
        type: string
      source_build_run_id:
        required: false
        type: string
      test_signed_updates:
        description: "Use the isolated Windows test signing and publication settings"
        required: false
        type: boolean
        default: false
      unsigned_update_test:
        required: false
        type: boolean
        default: false
    secrets:
      WINDOWS_TEST_UPDATE_POLICY_PRIVATE_KEY:
        required: false
      WINDOWS_TEST_MODELSCOPE_TOKEN:
        required: false
      LAZYMIND_UPDATE_POLICY_PRIVATE_KEY:
        required: false
      MODELSCOPE_UPDATE_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-update-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify ${{ matrix.platform }} upgrade paths
    if: inputs.use_current_run
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((inputs.unsigned_update_test || inputs.platform == 'macos') && '["macos"]' || inputs.platform == 'windows' && '["windows"]' || '["macos","windows"]') }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'windows-latest' }}
    timeout-minutes: 90
    steps:
      - name: Validate publication platform
        shell: bash
        env:
          WINDOWS_TEST_SIGNED: ${{ inputs.test_signed_updates }}
          PLATFORM: ${{ inputs.platform }}
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
        run: |
          if [[ "${WINDOWS_TEST_SIGNED}" == true ]]; then
            [[ "${PLATFORM}" == windows && "${UNSIGNED_TEST}" != true ]]
          fi
          case "${PLATFORM}" in ""|macos) ;; windows) [[ "${UNSIGNED_TEST}" != true ]] ;; *) exit 1 ;; esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: local/local-runtime-manager/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-update-${{ matrix.platform }}-${{ github.run_id }}
          path: publication/current
      - name: Download the source build when available
        if: inputs.source_build_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_build_run_id }}
          PLATFORM: ${{ matrix.platform }}
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE_RUN}" =~ ^published:(legacy|[1-9][0-9]{0,19})$ ]]; then
            [[ "${UNSIGNED_TEST}" == true ]]
            exit 0
          fi
          [[ "${SOURCE_RUN}" =~ ^[0-9]+$ && "${SOURCE_RUN}" != "${GITHUB_RUN_ID}" ]]
          if [[ "$(gh run view "${SOURCE_RUN}" --json conclusion --jq .conclusion)" == success ]]; then
            staging="$(mktemp -d "${RUNNER_TEMP}/source-artifact.XXXXXXXX")"
            if gh run download "${SOURCE_RUN}" --name "desktop-update-${PLATFORM}-${SOURCE_RUN}" --dir "${staging}"; then
              mv "${staging}" publication/source
            else
              echo "Source artifact unavailable; verifying the signed public release."
            fi
          else
            echo "No successful source run available; verifying the signed public release."
          fi
      - uses: actions/download-artifact@v8
        if: inputs.test_signed_updates
        with:
          name: windows-rag-publication
          path: windows-test-components
      - name: Check the Windows test release before native verification
        if: inputs.test_signed_updates
        shell: bash
        env:
          UPDATE_REPO: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_REPO }}
          LAZYMIND_WINDOWS_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_UPDATE_CONFIG_JSON }}
          LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          node desktop/scripts/windows-test-channel.mjs check-release publication/current
          cmp publication/current/*/components.json windows-test-components/python-components.json
      - name: Trust the configured public Windows test certificate
        if: inputs.test_signed_updates && matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_TEST_CERTIFICATE: ${{ vars.LAZYMIND_WINDOWS_TEST_CERT_DER_BASE64 }}
          LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON }}
        run: ./desktop/scripts/windows-test-certificate.ps1

      - name: Verify the published source and the actual target runtime
        shell: bash
        env:
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
          WINDOWS_TEST_SIGNED: ${{ inputs.test_signed_updates }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_RUN: ${{ inputs.source_build_run_id }}
        run: |
          set -euo pipefail
          validator="${RUNNER_TEMP}/update-publisher.exe"
          build_flags=()
          plan_flags=()
          if [[ "${UNSIGNED_TEST}" == true ]]; then
            build_flags=(-tags lazymind_unsigned_test)
            plan_flags=(--unsigned-test)
          fi
          (cd local/local-runtime-manager && go build "${build_flags[@]+"${build_flags[@]}"}" -o "${validator}" ./cmd/update-publisher)
          history=()
          components=()
          if [[ "${WINDOWS_TEST_SIGNED}" == true ]]; then components=(--target-components-dir windows-test-components); fi
          if [[ -d publication/source ]]; then history=(--history publication/source); fi
          uv run --no-project --python 3.11 python desktop/scripts/prepare-update-ci-plan.py \
            --verify-source-only --current publication/current "${history[@]+"${history[@]}"}" \
            --validator "${validator}" --output-dir "${RUNNER_TEMP}/source-verification" "${plan_flags[@]+"${plan_flags[@]}"}"
          if [[ -n "${SOURCE_RUN}" && "$(cat "${RUNNER_TEMP}/source-verification/expected-policy-sha256")" == absent ]]; then
            echo "::error::A continuation requires an existing signed public policy"
            exit 1
          fi
          uv run --no-project --python 3.11 python desktop/scripts/verify-update-ci-pairs.py \
            --plan "${RUNNER_TEMP}/source-verification" --current publication/current --baseline publication/source \
            --platform "${PLATFORM}" --output verification "${plan_flags[@]+"${plan_flags[@]}"}" "${components[@]+"${components[@]}"}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-format-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: verification
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ !cancelled() && !failure() && (!inputs.use_current_run || needs.verify.result == 'success') }}
    environment: ${{ (inputs.unsigned_update_test || inputs.test_signed_updates) && 'desktop_updates_test' || 'desktop_updates' }}
    runs-on: ${{ inputs.unsigned_update_test && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: local/local-runtime-manager/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v8
        if: inputs.use_current_run && inputs.platform != 'windows'
        with:
          name: desktop-update-macos-${{ github.run_id }}
          path: publication/current-macos
      - uses: actions/download-artifact@v8
        if: inputs.use_current_run && !inputs.unsigned_update_test && inputs.platform != 'macos'
        with:
          name: desktop-update-windows-${{ github.run_id }}
          path: publication/current-windows
      - uses: actions/download-artifact@v8
        if: inputs.use_current_run && inputs.platform != 'windows'
        with:
          name: desktop-format-evidence-macos-${{ github.run_id }}
          path: verification
      - uses: actions/download-artifact@v8
        if: inputs.use_current_run && !inputs.unsigned_update_test && inputs.platform != 'macos'
        with:
          name: desktop-format-evidence-windows-${{ github.run_id }}
          path: verification
      - name: Download successful build artifacts
        if: '!inputs.use_current_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN_IDS: ${{ inputs.build_run_ids }}
          UPDATE_PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          [[ "${BUILD_RUN_IDS}" =~ ^[0-9]+(,[0-9]+)*$ ]]
          IFS=',' read -ra run_ids <<< "${BUILD_RUN_IDS}"
          shopt -s nullglob
          for run_id in "${run_ids[@]}"; do
            test "$(gh run view "${run_id}" --json conclusion --jq .conclusion)" = success
            gh run download "${run_id}" --dir "publication/${run_id}" \
              --pattern "desktop-update-macos-${run_id}" --pattern "desktop-update-windows-${run_id}" \
              --pattern "desktop-format-evidence-macos-${run_id}" --pattern "desktop-format-evidence-windows-${run_id}"
            for proof in "publication/${run_id}"/desktop-format-evidence-*; do
              mkdir -p "verification/${run_id}"
              mv "${proof}" "verification/${run_id}/"
            done
          done
          printf '%s' "${UPDATE_PLAN}" | python3 desktop/scripts/bind-manual-update-evidence.py > "${RUNNER_TEMP}/update-plan.json"
      - name: Build the offline update publisher
        env:
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
        run: |
          set -euo pipefail
          build_flags=()
          if [[ "${UNSIGNED_TEST}" == true ]]; then build_flags=(-tags lazymind_unsigned_test); fi
          (cd local/local-runtime-manager && go build "${build_flags[@]+"${build_flags[@]}"}" -o "${RUNNER_TEMP}/update-publisher" ./cmd/update-publisher)
      - name: Check the Windows test release before planning publication
        if: inputs.test_signed_updates
        env:
          UPDATE_REPO: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_REPO }}
          LAZYMIND_WINDOWS_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_UPDATE_CONFIG_JSON }}
          LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON }}
        run: node desktop/scripts/windows-test-channel.mjs check-release publication/current-windows
      - name: Prepare plan from actual releases and signed history
        if: inputs.use_current_run
        env:
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
          PLATFORM: ${{ inputs.platform || '' }}
          UPDATE_REPO: ${{ vars[inputs.test_signed_updates && 'LAZYMIND_WINDOWS_TEST_UPDATE_REPO' || 'LAZYMIND_UPDATE_MODELSCOPE_REPO'] }}
        run: |
          set -euo pipefail
          test -n "${UPDATE_REPO}"
          historical=()
          plan_flags=()
          platforms=(macos windows)
          if [[ "${PLATFORM}" == windows || "${PLATFORM}" == macos ]]; then platforms=("${PLATFORM}"); fi
          if [[ "${UNSIGNED_TEST}" == true ]]; then platforms=(macos); plan_flags=(--unsigned-test); fi
          # A platform joining a previously published channel has an envelope
          # digest but no source App or report. Empty directories do not survive artifact upload.
          if [[ -d verification/records ]]; then historical+=(--history verification/records); fi
          if [[ -d verification/evidence ]]; then historical+=(--evidence verification/evidence); fi
          uv run --no-project --python 3.11 python desktop/scripts/prepare-update-ci-plan.py \
            --current publication "${historical[@]+"${historical[@]}"}" --validator "${RUNNER_TEMP}/update-publisher" --repo "${UPDATE_REPO}" \
            --output-dir "${RUNNER_TEMP}/update-ci-plan" "${plan_flags[@]+"${plan_flags[@]}"}"
          for platform in "${platforms[@]}"; do
            cmp "${RUNNER_TEMP}/update-ci-plan/expected-policy-sha256" "verification/${platform}-policy-sha256"
          done
      - name: Assemble and sign explicit update policy
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets[inputs.test_signed_updates && 'WINDOWS_TEST_UPDATE_POLICY_PRIVATE_KEY' || 'LAZYMIND_UPDATE_POLICY_PRIVATE_KEY'] }}
          UPDATE_KEY_ID: ${{ vars[inputs.test_signed_updates && 'LAZYMIND_WINDOWS_TEST_UPDATE_POLICY_KEY_ID' || 'LAZYMIND_UPDATE_POLICY_KEY_ID'] }}
          USE_CURRENT_RUN: ${{ inputs.use_current_run }}
        run: |
          set -euo pipefail
          test -n "${UPDATE_PRIVATE_KEY}"
          test -n "${UPDATE_KEY_ID}"
          umask 077
          key_path="${RUNNER_TEMP}/desktop-update-private.pem"
          trap 'rm -f "${key_path}"' EXIT
          printf '%s' "${UPDATE_PRIVATE_KEY}" > "${key_path}"
          records=publication
          signing_history=()
          if [[ "${USE_CURRENT_RUN}" == true ]]; then
            plan_dir="${RUNNER_TEMP}/update-ci-plan"
            plan="${plan_dir}/plan.json"
            records="${plan_dir}/records"
            if [[ -f "${plan_dir}/previous-envelope.json" ]]; then
              signing_history=(--previous-envelope "${plan_dir}/previous-envelope.json")
              if [[ -d verification/records/macos && -d verification/records/windows ]]; then
                signing_history+=(--verified-source-records verification/records)
              fi
            fi
          else
            plan="${RUNNER_TEMP}/update-plan.json"
          fi
          "${RUNNER_TEMP}/update-publisher" sign \
            --records "${records}" --plan "${plan}" "${signing_history[@]+"${signing_history[@]}"}" \
            --key-id "${UPDATE_KEY_ID}" --key-file "${key_path}" \
            --output "${RUNNER_TEMP}/update-policy.json" --config-output "${RUNNER_TEMP}/update-config.json"
      - name: Publish isolated ad-hoc components
        if: inputs.unsigned_update_test
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_UPDATE_TOKEN }}
          UPDATE_REPO: ${{ vars.LAZYMIND_UPDATE_MODELSCOPE_REPO }}
          TEST_BASE_URL: ${{ vars.LAZYMIND_UNSIGNED_UPDATE_TEST_BASE_URL }}
          LAZYMIND_DESKTOP_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_MAC_UNSIGNED_UPDATE_TEST_CONFIG_JSON }}
        run: |
          set -euo pipefail
          test -n "${MODELSCOPE_API_TOKEN}"
          test -n "${UPDATE_REPO}"
          component_prefix="$(node desktop/scripts/resolve-unsigned-test-round.mjs --component-prefix "${RUNNER_TEMP}/update-config.json")"
          uv run --no-project --python 3.11 --with modelscope-hub==0.4.6 \
            python desktop/scripts/publish-python-components.py \
            --directory publication/current-macos/python-components --repo "${UPDATE_REPO}" \
            --signing-mode adhoc --prefix "${component_prefix}"
      - uses: actions/download-artifact@v8
        if: inputs.test_signed_updates
        with:
          name: windows-rag-publication
          path: windows-test-components
      - name: Publish components inside the Windows test round
        if: inputs.test_signed_updates
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets.WINDOWS_TEST_MODELSCOPE_TOKEN }}
          UPDATE_REPO: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_REPO }}
          LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON }}
        run: |
          set -euo pipefail
          cmp publication/current-windows/*/components.json windows-test-components/python-components.json
          component_prefix="$(node desktop/scripts/windows-test-channel.mjs component-prefix)"
          uv run --no-project --python 3.11 --with modelscope-hub==0.4.6 \
            python desktop/scripts/publish-python-components.py --directory windows-test-components --repo "${UPDATE_REPO}" \
            --signing-mode windows-test --prefix "${component_prefix}"
      - name: Publish and verify files before policy
        env:
          MODELSCOPE_API_TOKEN: ${{ secrets[inputs.test_signed_updates && 'WINDOWS_TEST_MODELSCOPE_TOKEN' || 'MODELSCOPE_UPDATE_TOKEN'] }}
          UPDATE_REPO: ${{ vars[inputs.test_signed_updates && 'LAZYMIND_WINDOWS_TEST_UPDATE_REPO' || 'LAZYMIND_UPDATE_MODELSCOPE_REPO'] }}
          USE_CURRENT_RUN: ${{ inputs.use_current_run }}
        run: |
          set -euo pipefail
          test -n "${MODELSCOPE_API_TOKEN}"
          test -n "${UPDATE_REPO}"
          expected=()
          if [[ "${USE_CURRENT_RUN}" == true ]]; then
            expected=(--expected-policy-sha256 "$(cat "${RUNNER_TEMP}/update-ci-plan/expected-policy-sha256")")
            if [[ -d verification/records/macos && -d verification/records/windows ]]; then
              expected+=(--verified-source-records verification/records)
            fi
          fi
          uv run --no-project --python 3.11 --with modelscope-hub==0.4.6 \
            python desktop/scripts/publish-desktop-update.py \
            --directory publication --policy "${RUNNER_TEMP}/update-policy.json" \
            --config "${RUNNER_TEMP}/update-config.json" --repo "${UPDATE_REPO}" \
            --validator "${RUNNER_TEMP}/update-publisher" "${expected[@]+"${expected[@]}"}"
      - name: Save public publication records
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-update-policy-${{ inputs.platform && format('{0}-', inputs.platform) || '' }}${{ github.run_id }}
          path: |
            ${{ runner.temp }}/update-policy.json
            ${{ runner.temp }}/update-config.json
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "${RUNNER_TEMP}/desktop-update-private.pem"

  plan_installed_upgrade:
    name: Select the published predecessor for the installed upgrade
    needs: publish
    if: inputs.use_current_run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: inputs.platform != 'windows'
        with:
          name: desktop-format-evidence-macos-${{ github.run_id }}
          path: verification
      - uses: actions/download-artifact@v8
        if: inputs.platform != 'macos' && !inputs.unsigned_update_test
        with:
          name: desktop-format-evidence-windows-${{ github.run_id }}
          path: verification
      - id: select
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
        run: |
          set -euo pipefail
          platforms=(macos windows)
          if [[ -n "${PLATFORM}" ]]; then platforms=("${PLATFORM}"); fi
          if [[ "${UNSIGNED_TEST}" == true ]]; then platforms=(macos); fi
          python3 desktop/scripts/run-published-upgrade-smoke.py matrix verification "${platforms[@]}" >> "${GITHUB_STEP_SUMMARY}"

  test_installed_upgrade:
    name: Verify installed A upgrades to published B (${{ matrix.platform }})
    needs: plan_installed_upgrade
    if: inputs.use_current_run && needs.plan_installed_upgrade.outputs.lanes != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan_installed_upgrade.outputs.lanes) }}
    runs-on: ${{ matrix.platform == 'macos' && 'macos-15' || 'windows-2025' }}
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: local/local-runtime-manager/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v8
        with:
          name: desktop-format-evidence-${{ matrix.platform }}-${{ github.run_id }}
          path: verification
      - name: Trust the configured public Windows test certificate
        if: inputs.test_signed_updates && matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_TEST_CERTIFICATE: ${{ vars.LAZYMIND_WINDOWS_TEST_CERT_DER_BASE64 }}
          LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON: ${{ vars.LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON }}
        run: ./desktop/scripts/windows-test-certificate.ps1

      - name: Install verified A and use its normal updater
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          UNSIGNED_TEST: ${{ inputs.unsigned_update_test }}
          SMOKE_PUBLIC_CONFIG: ${{ vars[inputs.unsigned_update_test && 'LAZYMIND_MAC_UNSIGNED_UPDATE_TEST_CONFIG_JSON' || inputs.test_signed_updates && 'LAZYMIND_WINDOWS_TEST_UPDATE_CONFIG_JSON' || matrix.platform == 'macos' && 'LAZYMIND_MAC_UPDATE_CONFIG_JSON' || 'LAZYMIND_WINDOWS_UPDATE_CONFIG_JSON'] }}
          TEST_BASE_URL: ${{ vars.LAZYMIND_UNSIGNED_UPDATE_TEST_BASE_URL }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${UNSIGNED_TEST}" == true ]]; then flags=(-tags lazymind_unsigned_test); fi
          validator="${RUNNER_TEMP}/native-policy-validator.exe"
          (cd local/local-runtime-manager && go build "${flags[@]+"${flags[@]}"}" -o "${validator}" ./cmd/update-publisher)
          uv run --no-project --python 3.11 --with websockets==15.0.1 python desktop/scripts/run-published-upgrade-smoke.py run \
            --platform "${PLATFORM}" --verification verification --validator "${validator}" --report "${RUNNER_TEMP}/installed-upgrade.json"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installed-upgrade-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-upgrade.json
          if-no-files-found: error
