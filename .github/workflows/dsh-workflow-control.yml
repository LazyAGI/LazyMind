name: DSH workflow control
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master, 'dev/**', workflow/DeepSeekHarness_integration]
    paths:
      - integrations/dsh-workflow/**
      - backend/core/**
      - local/lazymind-cli/**
      - frontend/**
      - .github/workflows/dsh-workflow-control.yml
permissions:
  contents: read
concurrency:
  group: dsh-workflow-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core-and-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: workflow-test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache-dependency-path: |
            backend/core/go.sum
            local/lazymind-cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Workflow transactions and dual database migrations
        working-directory: backend/core
        env:
          MIGRATION_TEST_POSTGRES_DSN: postgres://postgres:workflow-test@localhost:5432/postgres?sslmode=disable
        run: go test ./workflow/... ./migrate -count=1
      - name: Host delivery and fencing on PostgreSQL
        working-directory: backend/core
        env:
          TEST_DB_DRIVER: postgres
          TEST_DB_DSN: postgres://postgres:workflow-test@localhost:5432/postgres?sslmode=disable
        run: go test ./workflow -run 'TestHostBinding|TestHostDelivery|TestStopFences' -count=1
      - name: Connector installation, pairing and offline log recovery
        working-directory: local/lazymind-cli
        run: go test ./... -count=1
  dsh-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: integrations/dsh-workflow/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.11'
          cache: false
      - name: Test against the pinned public DSH SDK
        working-directory: integrations/dsh-workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm bundle
      - name: Verify the shipped plugin matches source
        run: |
          cd local/lazymind-cli
          go run ./cmd/package-workflow-bundle
          git diff --exit-code -- ../../integrations/dsh-workflow/lib internal/adapters/mcpclient/assets/dsh-workflow.tgz
  shared-workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Shared editor and typed control regressions
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/modules/chat/utils/workflowControl.test.ts src/modules/chat/components/WorkflowPanel/SlotText.test.tsx src/modules/chat/components/WorkflowPanel/workflowApproval.test.ts src/modules/chat/components/WorkflowPanel/ppt/exportHtmlToPptx.test.ts
          pnpm build
