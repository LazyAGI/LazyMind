name: Scheduled Agent E2E

on:
  schedule:
    # Tuesday and Thursday, 22:00 Asia/Shanghai (UTC+8).
    - cron: '0 14 * * 2,4'
  workflow_dispatch:

permissions:
  contents: read

# Separate from every other CI and release concurrency group.
concurrency:
  group: agent-e2e-scheduled
  cancel-in-progress: false

jobs:
  snapshot:
    # Each repository opts in only after configuring its own provider secrets.
    if: ${{ vars.LAZYMIND_AGENT_E2E_SCHEDULE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
      tag: ${{ steps.snapshot.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Create immutable CI tag for the main snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          stamp="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)"
          tag="ci-${stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git tag "$tag" "$sha"
          # GITHUB_TOKEN tag pushes do not start push-triggered workflows.
          git push origin "refs/tags/$tag"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          printf 'Agent E2E snapshot: `%s` (`%s`)\n' "$tag" "$sha" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: snapshot
    permissions:
      contents: read
    uses: ./.github/workflows/agent-e2e-hosted.yml
    with:
      git_ref: ${{ needs.snapshot.outputs.sha }}
      agent: all
      case: all
      platform: all
      probe_only: false
      approve_test_reviews: true
    secrets: inherit
