      italian: 意大利语
      duolingo-alternative: 多邻国替代方案
      spaced-repetition: 间隔重复
      immersion: 沉浸学习
      travel: 旅行
      culture: 文化
      pronunciation: 发音
      idioms: 习语
      slang: 俚语
      OPC: 一人公司
