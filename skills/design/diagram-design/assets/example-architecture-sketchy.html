<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sketchy architecture — publishing path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px; background: #f5f5f5; color: #2d3142; font-family: 'Geist', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    main { width: min(100%, 1040px); }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 9px/1.4 'Geist Mono', 'SFMono-Regular', 'Noto Sans Mono CJK SC', monospace; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 24px; font: 400 32px/1.1 'Instrument Serif', 'Songti SC', 'STSong', 'Noto Serif CJK SC', serif; }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Architecture · Sketchy · doc-inline</p>
    <h1>A publishing path, still being shaped</h1>
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="sketchy-architecture-title sketchy-architecture-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="sketchy-architecture-title">Sketchy publishing architecture</title>
      <desc id="sketchy-architecture-desc">An author sends a draft through review and publishing into a content store. Shapes and connectors have a restrained hand-drawn treatment while text remains crisp.</desc>
      <defs>
        <filter id="sketchy-architecture-filter" x="-2%" y="-2%" width="104%" height="104%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
          <feDisplacementMap in="SourceGraphic" scale="1.5"/>
        </filter>
        <marker id="sketchy-architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#4f5d75"/>
        </marker>
      </defs>
      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Only geometry is displaced. Text remains outside this group. -->
      <g filter="url(#sketchy-architecture-filter)">
        <path d="M224 252 H304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#sketchy-architecture-arrow)"/>
        <path d="M464 252 H544" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#sketchy-architecture-arrow)"/>
        <path d="M704 252 H784" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#sketchy-architecture-arrow)"/>
        <rect x="64" y="212" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
        <rect x="304" y="212" width="160" height="80" rx="6" fill="rgba(45,49,66,.04)" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="544" y="212" width="160" height="80" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="784" y="212" width="120" height="80" rx="6" fill="rgba(45,49,66,.06)" stroke="#4f5d75" stroke-width="1.2"/>
        <rect x="246" y="234" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <rect x="486" y="234" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <rect x="726" y="234" width="56" height="16" rx="2" fill="#f5f5f5"/>
      </g>

      <g fill="#2d3142" font-family="'Geist','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" text-anchor="middle">
        <text x="144" y="248" font-size="14" font-weight="600">Author</text>
        <text x="144" y="268" fill="#4f5d75" font-size="10">draft</text>
        <text x="384" y="248" font-size="14" font-weight="600">Editorial review</text>
        <text x="384" y="268" fill="#4f5d75" font-size="10">comments</text>
        <text x="624" y="248" font-size="14" font-weight="600">Publisher</text>
        <text x="624" y="268" fill="#4f5d75" font-size="10">approved</text>
        <text x="844" y="248" font-size="14" font-weight="600">Store</text>
        <text x="844" y="268" fill="#4f5d75" font-size="10">content</text>
      </g>
      <g fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular','Noto Sans Mono CJK SC',monospace" font-size="8" text-anchor="middle">
        <text x="274" y="246">SUBMIT</text>
        <text x="514" y="246" fill="#eb6c36">APPROVE</text>
        <text x="754" y="246">WRITE</text>
      </g>

      <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(45,49,66,.12)"/>
      <text x="40" y="500" fill="#4f5d75" font-family="'Geist Mono','SFMono-Regular','Noto Sans Mono CJK SC',monospace" font-size="9">SKETCH FILTER APPLIES TO GEOMETRY ONLY · TEXT STAYS CRISP</text>
    </svg>
  </main>
</body>
</html>
