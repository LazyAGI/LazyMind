<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海报优化建议</title>
<style>*{box-sizing:border-box}html,body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#212733}body{padding:20px}.doc{max-width:960px;margin:auto;background:#fff;border-radius:10px;padding:26px 30px;box-shadow:0 14px 38px rgba(24,32,48,.09)}
h1{font-size:20px;margin:0 0 4px}.sub{color:#7a8496;font-size:13px;margin:0 0 18px}.layout{display:grid;grid-template-columns:220px 1fr;gap:22px}
.mock{border:1px solid #e6eaf1;border-radius:8px;height:300px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#111;color:#fff;position:relative}.mock .big{font-size:34px;font-weight:800;letter-spacing:1px}.mock .s{font-size:15px;margin-top:8px;color:#cfd3da}.mock .loc{position:absolute;bottom:16px;font-size:11px;color:#8a93a3}
.item{border-bottom:1px solid #eef1f6;padding:12px 0}.item:last-child{border-bottom:0}.item h3{font-size:14px;margin:0 0 5px;display:flex;align-items:center;gap:8px}.p{font-size:11px;padding:1px 8px;border-radius:999px}.hi{background:#fdeceb;color:#e5484d}.mid{background:#fff4e0;color:#b7791f}.lo{background:#eef1f6;color:#5b6473}.item p{margin:0;font-size:13px;line-height:1.7;color:#5b6473}</style></head>
<body><div class="doc"><h1>“周末市集”海报诊断</h1><p class="sub">画布 1080×1440 · 目标：手机信息流吸引年轻上班族 · 保持文案不变</p>
<div class="layout"><div class="mock"><div class="big">周末市集</div><div class="s">10:00-18:00</div><div class="loc">上海静安嘉里中心</div></div>
<div><div class="item"><h3><span class="p hi">高</span>信息层级：时间弱于标题</h3><p>“10:00-18:00”字号过小且与标题粘连，手机缩略图下最关键的时间点读不到。建议时间独立成块、放大到标题的 60%。</p></div>
<div class="item"><h3><span class="p hi">高</span>可读性：纯黑底对比过硬</h3><p>黑底白字在小屏刺眼且缺少焦点色。建议引入一抹暖色作强调，仅用于时间与地点。</p></div>
<div class="item"><h3><span class="p mid">中</span>留白与节奏</h3><p>三行文字挤在中部，上下留白失衡。建议整体下移，顶部留白承载主视觉呼吸感。</p></div>
<div class="item"><h3><span class="p lo">低</span>对齐</h3><p>地点未与标题左边界对齐，建议统一到同一基线网格。</p></div></div></div></div></body></html>
