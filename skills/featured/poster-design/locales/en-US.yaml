locale: en-US

classification:
  category: Design and creativity
  tags:
    - Poster design
    - Visual systems
    - Typography
    - Design philosophy

presentation:
  card:
    title: Poster design methods
    description: Establish a visual philosophy, then apply layout, typography, color, and rhythm to a poster
    output_type: images
    output_label: Poster design
    cover_asset: cover
    result_summary: Begin with concepts and design principles, then deliver a coherent hierarchy, layout, and final direction
  detail:
    title: Poster design methods
    description: Build a coherent design philosophy for a theme, then plan hierarchy, typography, color, negative space, and visual rhythm as an executable poster direction.
    attachment_hint: Theme, copy, dimensions, brand assets, or reference posters

tasks:
  - id: poster-concept
    selector:
      title: Poster concept design
      description: Build a complete visual philosophy and layout direction from a theme and copy
      output_label: Poster design direction
    launch:
      prompt_short: Design a poster from my theme and copy.
      prompt: Based on the theme, core copy, dimensions, audience, and context I provide, first establish a clear design philosophy, then design the information hierarchy, grid, typography, color, negative space, and visual rhythm. Deliver an executable direction, ask for missing details, and avoid unrelated decoration.
    replay:
      steps:
        - title: Extract thematic tension
          description: Define the central idea, mood, and audience
        - title: Establish the design philosophy
          description: Create coherent visual principles, contrasts, and expression logic
        - title: Build the layout system
          description: Design hierarchy, grid, typography, color, and negative space
        - title: Deliver the final direction
          description: Organize renderable visual rules and the poster concept
    result:
      template: generic_report_v1
      eyebrow: Poster design direction
      title: Theme, visual philosophy, and layout system
      summary: Turn the core concept into a coherent, clear, and executable poster direction
      highlights:
        - Core concept and design philosophy
        - Information hierarchy, grid, and typography
        - Color, negative space, and final direction

  - id: poster-critique
    selector:
      title: Poster critique and optimization
      description: Analyze hierarchy, typography, color, and visual consistency in an existing poster
      output_label: Poster improvement plan
    launch:
      prompt_short: Diagnose and improve this poster.
      prompt: Analyze the poster and usage context I provide across theme, information hierarchy, alignment, typography, color, negative space, rhythm, and readability. Explain the highest-impact issues, causes, and priorities, then provide a concrete optimization plan that preserves the core content.
    replay:
      steps:
        - title: Identify the communication goal
          description: Confirm audience, context, viewing distance, and primary message
        - title: Check visual hierarchy
          description: Evaluate the relationship among title, body, supporting details, and focal point
        - title: Diagnose system consistency
          description: Review grid, typography, color, negative space, and rhythm
        - title: Prioritize improvements
          description: Organize concrete changes by their expected impact
    result:
      template: generic_report_v1
      eyebrow: Poster improvement plan
      title: Visual diagnosis and prioritized changes
      summary: Improve hierarchy, readability, and consistency while preserving the core content
      highlights:
        - Communication goal and visual focus
        - Layout, color, and spacing issues
        - Prioritized concrete improvements
