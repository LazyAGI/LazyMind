<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共同预算讨论指南</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#182b59,#465fd0);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #182b5910}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#253b75;border-left:4px solid #6e85df;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>共同预算讨论</small><h1>共同预算讨论指南</h1><div>用金钱偏好作为旅行预算沟通的起点。</div></section><article class="content"><h1>讨论方式</h1><p>两人可分别完成同一份 36 道题，再对照彼此的偏好进行讨论。</p><h2>讨论流程</h2><div class="item">分别作答，不共享账户或账单。</div><div class="item">观察四个维度的偏好差异。</div><div class="item">将结果作为旅行预算沟通的起点，而不是评价对方。</div><h2>隐私与边界</h2><p>无需上传账单、账户或身份信息。测试不是关系结论、心理诊断或财务建议。</p><h2>当前体验边界</h2><p>当前体验不提供二维码功能，也不以其他内容替代。</p></article></main></body></html>
