<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金钱偏好自测指南</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#182b59,#465fd0);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #182b5910}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#253b75;border-left:4px solid #6e85df;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>金钱偏好自测</small><h1>金钱偏好自测指南</h1><div>完成 36 道题，了解自己的金钱行为偏好。</div></section><article class="content"><h1>你的测试路径</h1><p>完成 36 道题后，可从四个金钱行为维度理解自己的偏好。</p><h2>使用方式</h2><p>1. 依次完成题目并按第一直觉选择。</p><p>2. 在四个二元维度中完成题目：安稳/机会、分析/价值、规划/灵活、独立/关系。</p><p>3. 完成后查看对应类型说明，并记录值得继续观察的偏好。</p><h2>解释边界</h2><p>无需上传账单或账户信息；结果用于消费、储蓄与规划倾向的自我反思，不是官方 MBTI、心理诊断或投资风险测评。</p><h2>当前体验边界</h2><p>当前体验不提供二维码功能，也不以其他内容替代。</p></article></main></body></html>
