locale: en-US
classification: {category: Finance & Investment Analysis, tags: [money personality, spending habits, financial planning]}
presentation:
  card: {title: "MBTI Money Personality Test", description: "Complete a 36-question money-behavior test and receive a local result report", output_type: "web", output_label: "Interactive test", cover_asset: "cover", result_summary: "Three real interactive test scenarios"}
  detail: {title: "MBTI Money Personality Test", description: "The source Skill delivers a fixed offline HTML with 36 questions, four dimensions, and 16 result types computed locally. It is not official MBTI, a diagnosis, or an investment assessment.", attachment_hint: "Open the test HTML directly; answers stay in the current browser"}
tasks:
  - id: first-money-profile
    selector: {title: "Establish a money-habit profile", description: "Complete the 36-question offline money-behavior test", output_label: "Offline test"}
    launch: {prompt_short: "I want to understand my spending and saving preferences. Deliver a directly usable 36-question money-personality test page.", prompt: "I am starting to track my spending and want to use 36 money-behavior questions to reflect on security versus opportunity, analysis versus values, planning versus flexibility, and independence versus relationships. Deliver the source Skill's offline test page and explain that it supports self-reflection only, not official MBTI or investment advice."}
    replay: {steps: [{title: "Locate offline assets", description: "Check the bundled index.html, 36 questions, and 16 result records"}, {title: "Preserve content integrity", description: "Do not rewrite questions, option mappings, or result material"}, {title: "Deliver the local page", description: "Provide the HTML that opens without login or network access"}]}
    result: {template: "html_preview_v1", eyebrow: "Self-reflection case", title: "Complete 36 questions and receive a money-personality report", summary: "Answer directly in the page and generate a local result report.", html_asset: "fresh_start"}
  - id: couple-budget-discussion
    selector: {title: "Test before a shared-budget discussion", description: "Each person completes the same offline questionnaire", output_label: "Offline test"}
    launch: {prompt_short: "My partner and I want an offline money-personality test before discussing a shared budget. Deliver a page that requires no login.", prompt: "My partner and I plan to discuss a shared travel budget, but want to complete the same money-personality test separately first. Deliver the source Skill's offline HTML, keep local calculation and progress storage, and state that results support discussion of preferences rather than judging either person or replacing financial advice."}
    replay: {steps: [{title: "Verify offline behavior", description: "Check that the bundled page requires no backend, login, or network request"}, {title: "Preserve test materials", description: "Use the built-in 36 questions, 16 result types, and scoring rules"}, {title: "Explain the boundary", description: "State that separate results can support preference discussion only"}]}
    result: {template: "html_preview_v1", eyebrow: "Shared-budget case", title: "Complete the same test separately before discussing preferences", summary: "Each person answers separately; no relationship conclusion is generated.", html_asset: "couple_budget"}
  - id: yearly-spending-reflection
    selector: {title: "Test before an annual spending review", description: "Use the fixed questionnaire to reflect on planning and flexibility", output_label: "Offline test"}
    launch: {prompt_short: "Before my annual spending review, I want a money-behavior test that does not upload data. Deliver the offline page.", prompt: "I am preparing an annual spending review but do not want to upload bills or personal information. Deliver the source Skill's 36-question offline test page, explain that answers and scoring remain in the browser, and do not present results as investment advice or psychological diagnosis."}
    replay: {steps: [{title: "Confirm privacy boundaries", description: "The page collects no identity or financial-account information"}, {title: "Deliver the fixed question set", description: "Preserve the 36 questions and result material unchanged"}, {title: "State interpretation limits", description: "Results are self-developed behavioral tendencies, not diagnosis or advice"}]}
    result: {template: "html_preview_v1", eyebrow: "Annual-review case", title: "Use test results for annual spending reflection", summary: "Complete questions and view the behavioral-tendency report locally.", html_asset: "annual_review"}
