schema_version: 2
id: test-workflow
type: workflow
version: 1.0.0
status: published
default_locale: zh-CN

workflow:
  workflow_ref: builtin:test-workflow

placement:
  home: true
  gallery: true
  order: 30

classification:
  category: 系统工具
  tags:
    - Workflow
    - 运行时
    - 自检

assets:
  cover:
    file: assets/cover.png
    role: cover

presentation:
  card:
    title: Workflow 运行时自检
    description: 一键运行多阶段测试流程，验证提示词、工具、附件、重写与结果交付
    output_type: report
    output_label: 自检报告
    cover_asset: cover
    result_summary: 通过六个连续步骤验证 Workflow 运行时和多类型产物链路
  detail:
    title: Workflow 运行时端到端自检
    description: 使用内置 test-workflow 依次验证提示词、脚本工具、多类型附件、附件重写、列表附件和最终校验。

tasks:
  - id: runtime-self-test
    selector:
      title: 运行时端到端自检
      description: 执行 test-workflow 的六阶段真实运行测试
      output_label: Workflow 自检报告
    launch:
      prompt_short: 运行一次 Workflow 运行时端到端自检。
      prompt: 请运行 test-workflow，使用“验证 Workflow 运行时、工具调用和多类型附件链路”作为本次自检内容，并完成所有步骤直到输出最终验证报告。
    replay:
      steps:
        - title: 生成提示词结果
          description: 根据用户输入生成简短摘要并保存文本产物
        - title: 调用脚本工具
          description: 生成并保存用于校验的 JSON 元数据
        - title: 创建多类型附件
          description: 同时生成文本文件和图片附件
        - title: 验证附件重写
          description: 对同一附件连续写入两个修订版本
        - title: 验证列表附件
          description: 按顺序生成并保存两个列表文件
        - title: 汇总验证结果
          description: 检查全部产物并生成最终自检报告
    result:
      template: generic_report_v1
      eyebrow: Workflow 自检报告
      title: Workflow 运行时端到端验证结果
      summary: 完成提示词、脚本工具、附件、修订、列表和最终校验的完整运行测试
      highlights:
        - 六阶段 Workflow 连续执行
        - 文本、JSON、文件与图片产物
        - 单附件修订和有序列表附件
        - 最终状态与验证报告
