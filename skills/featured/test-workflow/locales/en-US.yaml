locale: en-US

classification:
  category: System tools
  tags:
    - Workflow
    - Runtime
    - Smoke test

presentation:
  card:
    title: Workflow runtime self-test
    description: Run a multi-stage smoke test for prompts, tools, attachments, rewrites, and final delivery
    output_type: report
    output_label: Self-test report
    cover_asset: cover
    result_summary: Verify the Workflow runtime and typed-artifact path through six consecutive stages
  detail:
    title: Workflow runtime end-to-end self-test
    description: Use the built-in test-workflow to verify prompts, script tools, typed attachments, rewrites, list attachments, and final validation.

tasks:
  - id: runtime-self-test
    selector:
      title: Runtime end-to-end self-test
      description: Execute all six stages of the built-in test-workflow
      output_label: Workflow self-test report
    launch:
      prompt_short: Run the Workflow runtime end-to-end self-test.
      prompt: Run test-workflow using “verify the Workflow runtime, tool calls, and typed-artifact path” as the self-test input, and complete every step through the final validation report.
    replay:
      steps:
        - title: Generate the prompt result
          description: Summarize the user input and save the text artifact
        - title: Call the script tool
          description: Generate and save JSON metadata for validation
        - title: Create typed attachments
          description: Generate a text file and an image attachment together
        - title: Verify attachment rewrites
          description: Save two revisions to the same attachment slot
        - title: Verify list attachments
          description: Generate and save two ordered files
        - title: Summarize validation
          description: Check every artifact and create the final self-test report
    result:
      template: generic_report_v1
      eyebrow: Workflow self-test report
      title: Workflow runtime end-to-end validation
      summary: Complete the prompt, tool, attachment, revision, list, and final-validation path
      highlights:
        - Six consecutive Workflow stages
        - Text, JSON, file, and image artifacts
        - Single-slot revisions and ordered list artifacts
        - Final status and validation report
