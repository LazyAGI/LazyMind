locale: en-US
classification: {category: Prompting & Capability Building, tags: [Skill creation, workflow design, package validation]}
presentation:
  card: {title: "Skill Creator", description: "Plan, initialize, validate, and package reusable agent Skills", output_type: "document", output_label: "Skill design plan", cover_asset: "cover", result_summary: "New workflow, existing-Skill update, and packaging-validation cases"}
  detail: {title: "Skill Creator", description: "Starts with concrete use cases to select workflows, scripts, references, and assets; then initializes, validates, packages, and iterates from real use.", attachment_hint: "User tasks, repeated procedures, existing files, and available tools"}
tasks:
  - id: incident-triage-skill
    selector: {title: "Design an incident-triage Skill", description: "Plan reusable contents from concrete on-call cases", output_label: "Skill blueprint"}
    launch: {prompt_short: "Plan a Kubernetes incident-triage Skill for SRE on-call engineers covering alert classification, evidence collection, and escalation.", prompt: "I want a Kubernetes incident-triage Skill for SRE on-call engineers. It must classify alerts, collect non-destructive evidence, determine escalation conditions, and produce a handoff summary. Start from these concrete tasks and plan the SKILL.md, needed references, and possible read-only scripts; explain which steps need high freedom and which need strict guardrails."}
    replay: {steps: [{title: "Understand concrete cases", description: "Treat alert classification, evidence collection, and handoff as reusable tasks"}, {title: "Plan minimal resources", description: "Separate core instructions, on-demand references, and deterministic scripts"}, {title: "Set freedom and guardrails", description: "Add strict constraints for destructive risk while leaving reasoning flexible"}]}
    result: {template: "html_preview_v1", eyebrow: "New-Skill case", title: "Kubernetes incident-triage Skill blueprint", summary: "Plans resources and safety guardrails from an on-call workflow.", html_asset: "incident_skill"}
  - id: update-knowledge-skill
    selector: {title: "Update a knowledge-heavy Skill", description: "Refactor overlong instructions with progressive disclosure", output_label: "Update plan"}
    launch: {prompt_short: "Refactor a 900-line procurement-policy Skill into core instructions plus on-demand references without losing approval rules.", prompt: "I have a roughly 900-line procurement-policy Skill that puts approval rules, exception processes, and terminology in SKILL.md. Design an update: retain concise trigger metadata and core workflow, move detailed policy into one level of on-demand references, and give a migration checklist that protects approval rules from omission."}
    replay: {steps: [{title: "Audit context load", description: "Identify the problem of mixing a long core instruction with on-demand detail"}, {title: "Apply progressive disclosure", description: "Keep the core flow in SKILL.md and put details in directly linked references"}, {title: "Design migration checks", description: "Verify approval rules, exceptions, and terminology remain discoverable"}]}
    result: {template: "html_preview_v1", eyebrow: "Skill-update case", title: "Progressive-disclosure refactor for a procurement Skill", summary: "Splits material into core instructions and one-level references.", html_asset: "update_skill"}
  - id: package-skill-release
    selector: {title: "Package and quickly validate a Skill", description: "Use bundled scripts for release-ready structure checks", output_label: "Release checklist"}
    launch: {prompt_short: "Validate and package a concrete document-redaction Skill, recording actual output.", prompt: "I completed a document-redaction Skill with SKILL.md, one Python script, and two references. Check the concrete package frontmatter and structure, actually run quick_validate.py, actually package it with package_skill.py, and report the command output, generated artifact, and remaining real-use checks."}
    replay: {steps: [{title: "Check package structure", description: "Verify that SKILL.md and required resources are in expected directories"}, {title: "Use bundled validation", description: "Run quick_validate.py and record its validation output"}, {title: "Package and iterate", description: "Run package_skill.py, verify the generated .skill artifact, and list remaining real-use checks"}]}
    result: {template: "html_preview_v1", eyebrow: "Packaging-validation case", title: "Document-redaction Skill validation and packaging results", summary: "Shows actual structure validation, packaging command, and generated artifact.", html_asset: "package_validation"}
