schema_version: 2
id: skill-creator
type: work
version: 1.0.0
status: published
default_locale: zh-CN
provider: SkillHub
skill: {source_url: https://skillhub.cn/skills/clawhub_chindden/skill-creator, category: development, required_version: 0.1.0}
placement: {home: false, gallery: true, order: 104}
classification: {category: 提示词与能力构建, tags: [Skill 创建, 工作流设计, 打包验证]}
assets:
  cover: {file: assets/cover.png, role: cover}
  incident_skill: {file: assets/incident-skill.html, role: result}
  update_skill: {file: assets/update-skill.html, role: result}
  package_validation: {file: assets/package-validation.html, role: result}
presentation:
  card: {title: Skill Creator, description: 规划、初始化、验证和打包可复用的 Agent Skill, output_type: document, output_label: Skill 设计方案, cover_asset: cover, result_summary: 新建工作流、更新既有 Skill、打包验证三类真实任务}
  detail: {title: Skill Creator, description: 以具体使用案例出发，决定需要的工作流、脚本、参考与资产，随后初始化、验证、打包并从真实使用中迭代。, attachment_hint: 目标用户任务、重复步骤、现有文件与可用工具}
tasks:
  - id: incident-triage-skill
    selector: {title: 设计故障分诊 Skill, description: 从具体值班案例规划可复用 Skill 内容, output_label: Skill 蓝图}
    launch: {prompt_short: 为 SRE 值班工程师规划一个 Kubernetes 事件分诊 Skill，覆盖告警归类、证据收集和升级。, prompt: 我想创建一个供 SRE 值班工程师使用的 Kubernetes 事件分诊 Skill。它要帮助归类告警、收集不破坏现场的证据、判断升级条件，并产出交接摘要。请先基于这些具体任务规划 SKILL.md、需要的 references 和可能的只读脚本；说明哪些步骤必须保留高自由度、哪些应设置严格护栏。}
    replay: {steps: [{title: 从具体案例理解需求, description: 将告警归类、证据收集和交接作为可复用任务}, {title: 规划最小资源, description: 区分核心指令、按需参考和确定性脚本}, {title: 设定自由度与护栏, description: 对破坏性风险设置严格约束，其余推理保持灵活}]}
    result: {template: html_preview_v1, eyebrow: 新建 Skill 案例, title: Kubernetes 事件分诊 Skill 蓝图, summary: 以真实值班任务规划资源与安全护栏。 , html_asset: incident_skill}
  - id: update-knowledge-skill
    selector: {title: 更新知识型 Skill, description: 为过长的现有指令做渐进式披露重构, output_label: 更新方案}
    launch: {prompt_short: 将一个 900 行的采购政策 Skill 重构为核心指令加按需 references，且不丢失审批规则。, prompt: 我有一个约 900 行的采购政策 Skill，审批规则、例外流程和术语都塞在 SKILL.md 中。请设计更新方案：保留触发所需的简短元数据和核心流程，将详细政策按需拆到一层 references，并给出迁移检查清单，确保审批规则不被遗漏。}
    replay: {steps: [{title: 审查上下文负担, description: 识别超长核心指令与按需信息混杂的问题}, {title: 应用渐进式披露, description: 将核心流程保留在 SKILL.md，把细节放在直接引用的 references}, {title: 设计迁移校验, description: 用审批规则、例外流程和术语检查防止信息丢失}]}
    result: {template: html_preview_v1, eyebrow: 更新 Skill 案例, title: 采购政策 Skill 的渐进式披露重构, summary: 将内容拆分为核心指令与一层按需参考。 , html_asset: update_skill}
  - id: package-skill-release
    selector: {title: 打包与快速验证 Skill, description: 用随包脚本完成发布前结构校验, output_label: 发布检查}
    launch: {prompt_short: 我已完成一个文档脱敏 Skill，请给出初始化后应如何快速验证并打包发布的步骤。, prompt: 我已完成一个文档脱敏 Skill，包含 SKILL.md、一个 Python 脚本和两份参考资料。请按照该 Skill 的创建流程说明如何检查 frontmatter、运行 quick_validate.py、使用 package_skill.py 打包，并列出发布前应从真实使用中复核的事项；不要声称已经执行这些命令。}
    replay: {steps: [{title: 核对包结构, description: 检查 SKILL.md 和必要资源在预期目录}, {title: 使用随包验证器, description: 指明 quick_validate.py 用于检查前置元数据与基础结构}, {title: 打包并迭代, description: 使用 package_skill.py 打包，并从真实使用反馈继续改进}]}
    result: {template: html_preview_v1, eyebrow: 打包验证案例, title: 文档脱敏 Skill 发布前检查, summary: 说明实际随包验证与打包路径，不虚称已经发布。 , html_asset: package_validation}
