<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kubernetes 事件分诊 Skill 蓝图</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#182b59,#465fd0);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #182b5910}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#253b75;border-left:4px solid #6e85df;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>Skill 设计蓝图</small><h1>Kubernetes 事件分诊 Skill 蓝图</h1><div>为值班分诊规划资源、边界和交接方式。</div></section><article class="content"><h1>Kubernetes 事件分诊 Skill 蓝图</h1><h2>目标任务</h2><p>告警归类、非破坏性证据收集、升级判断与交接摘要。</p><h2>最小包结构</h2><div class="item">核心说明：触发条件、分诊流程、只读边界与升级决策。</div><div class="item">参考资料：服务目录、告警词典、升级规则和交接格式。</div><div class="item">辅助工具：仅用于可重复的只读证据收集。</div><h2>自由度</h2><p>告警解释可保持高自由度；任何会修改集群或数据的操作必须以低自由度、明确禁止或审批护栏处理。</p><h2>交接输出</h2><p>包含已知影响、已收集证据、未确认项、当前所有者和升级条件。</p></article></main></body></html>
