locale: en-US

classification:
  category: Design & creativity
  tags:
    - UI design
    - SaaS landing page
    - mobile app
    - CRM dashboard

presentation:
  card:
    title: UI design
    description: UI cases for a SaaS landing page, mobile app home, and desktop CRM redesign
    output_type: web
    output_label: UI HTML prototype
    cover_asset: cover
    result_summary: Preview three real design outputs for AI support tickets, AI learning, and CRM sales workflows
  detail:
    title: Multi-format UI design cases
    description: Three cases demonstrate requirement interpretation, design DNA, page structure, and high-fidelity HTML output.
    attachment_hint: Product positioning, target users, core flows, usage scenarios, brand tone, or references

tasks:
  - id: ai-ticket-landing
    selector:
      title: AI ticket analysis landing page
      description: Create a professional landing page for a small-business SaaS product
      output_label: Landing page HTML
    launch:
      prompt_short: Design a landing page for an AI customer-support ticket analysis SaaS for SMBs, including hero, features, workflow, value, pricing, and CTAs.
      prompt: Design a landing page for an AI customer-support ticket analysis SaaS for SMBs, including hero, features, workflow, value, pricing, and CTAs.
    replay:
      steps:
        - title: Clarify positioning
          description: Identify small-business support teams, ticket analysis, efficiency gains, and conversion goals
        - title: Define visual direction
          description: Use a deep-blue primary color, sky-blue accents, and restrained enterprise spacing
        - title: Plan page modules
          description: Arrange hero, feature cards, three-step workflow, value metrics, pricing, and final CTA
        - title: Generate the page
          description: Produce a previewable single-page HTML file with navigation, buttons, data cards, and pricing cards
        - title: Check readiness
          description: Review hierarchy, conversion path, Chinese copy, and launch placeholders
    result:
      template: html_preview_v1
      eyebrow: SaaS landing page case
      title: SmartTicket Analytics - AI Support Ticket Intelligence
      summary: Complete HTML landing page covering hero, features, workflow, value metrics, pricing, and conversion buttons.
      html_asset: landing_demo
  - id: ai-learning-mobile-home
    selector:
      title: AI learning app home
      description: Design a fresh mobile home screen for learners
      output_label: Mobile home HTML
    launch:
      prompt_short: Design a mobile home screen for an AI learning assistant app with tasks, progress, courses, mistake review, and AI Q&A.
      prompt: Design a mobile home screen for an AI learning assistant app with tasks, progress, courses, mistake review, and AI Q&A.
    replay:
      steps:
        - title: Clarify home goals
          description: Cover tasks, progress, courses, review, and AI Q&A
        - title: Define learning tone
          description: Use mint blue-green colors, whitespace, and soft cards
        - title: Organize hierarchy
          description: Prioritize streak, progress, tasks, and AI entry
        - title: Generate mobile UI
          description: Produce phone-preview HTML with interactions and tabs
        - title: Check mobile readability
          description: Review task states, entry weight, and Chinese typography
    result:
      template: html_preview_v1
      eyebrow: Mobile app home case
      title: “Zhiya” AI learning assistant home
      summary: A fresh mint-blue mobile home HTML covering daily tasks, progress, courses, mistake review, and AI Q&A.
      html_asset: learning_home_demo
  - id: crm-customer-dashboard-redesign
    selector:
      title: CRM customer dashboard redesign
      description: Redesign a dense, clear desktop CRM page for sales teams
      output_label: Spec and CRM prototype
    launch:
      prompt_short: Redesign a rough customer-management dashboard with customer list, filters, statuses, follow-ups, and add-customer flow for desktop sales teams.
      prompt: Redesign a rough customer-management dashboard with customer list, filters, statuses, follow-ups, and add-customer flow for desktop sales teams.
    replay:
      steps:
        - title: Diagnose issues
          description: Identify cluttered hierarchy, weak status rules, unclear actions, and low density
        - title: Plan desktop layout
          description: Use sidebar, sticky top bar, metrics, filters, table, and pagination
        - title: Define status system
          description: Assign colors for new, following, won, lost, and overdue risk
        - title: Build interaction prototype
          description: Produce HTML with filters, row actions, drawer, modal, and selection count
        - title: Document design logic
          description: Summarize structure, components, visual style, and key interactions
    result:
      template: html_preview_v1
      eyebrow: Admin UI redesign case
      title: CRM customer management high-fidelity prototype
      summary: Shows the CRM customer-management design spec first, followed by the desktop high-fidelity HTML prototype.
      html_asset: crm_design_spec_demo
