schema_version: 2
id: data-report
type: work
version: 0.1.1
status: published
default_locale: zh-CN
provider: 千问办公

skill:
  source_url: featured/data-report/skill
  required_version: 0.1.0

placement:
  home: true
  gallery: true
  order: 13

classification:
  category: 信息分析
  tags:
    - 数据报告
    - Excel 分析
    - CSV 分析
    - 可视化报告

assets:
  cover:
    file: assets/cover.png
    role: cover
  commerce_dashboard:
    file: assets/commerce-dashboard.png
    role: result
  cockpit_output:
    file: assets/executive-cockpit.html
    role: result
  trend_output:
    file: assets/trend-report.html
    role: result
  dimension_output:
    file: assets/dimension-report.html
    role: result

presentation:
  card:
    title: 数据可视化报告
    description: 把经营明细转成 KPI、趋势、结构对比和行动建议看板
    output_type: dashboard
    output_label: 数据分析报告
    cover_asset: cover
    result_summary: 用电商经营案例展示从数据校验到 KPI 看板和业务结论的完整交付
  detail:
    title: 数据可视化报告
    description: 源自千问办公内置 Skill。上传 Excel 或 CSV 表格，一键生成包含 KPI、图表、明细表和分析洞察的可视化数据报告。
    attachment_hint: Excel、CSV 或 JSON 数据文件

tasks:
  - id: executive-report
    selector:
      title: 电商经营驾驶舱
      description: 用半年收入、利润和订单数据快速生成管理层报告
      output_label: 经营分析报告
    launch:
      prompt_short: 用示例数据生成 2026 上半年电商经营分析报告。
      prompt: 请使用数据报告 Skill 分析以下 2026 年 1-6 月电商数据。收入（万元）：185、196、204、218、230、250；利润（万元）：52、56、59、64、70、82；订单量：7100、7520、7810、8260、8750、10275。生成单文件 HTML 经营报告，包含 KPI 卡片、收入利润趋势、订单变化、利润率、关键异常和 3 条可执行建议。只使用给定数据，明确计算口径，不补造同比数据。
    replay:
      steps:
        - title: 对齐经营口径
          description: 校验六个月收入、利润、订单量与单位
        - title: 计算核心指标
          description: 汇总规模、增长、利润率与单均收入
        - title: 构建经营驾驶舱
          description: 编排 KPI、双指标趋势与订单变化模块
        - title: 提炼业务动作
          description: 说明关键变化、判断限制和下一步建议
    result:
      template: html_preview_v1
      eyebrow: 经营分析报告
      title: 2026 上半年电商经营分析
      summary: 从六个月经营数据生成 KPI 看板、趋势图和可执行建议
      html_asset: cockpit_output

  - id: trend-report
    selector:
      title: 趋势分析报告
      description: 用 1-6 月日活与转化率示例分析趋势和拐点
      output_label: 趋势分析报告
    launch:
      prompt_short: 示例：分析 2026 年 1-6 月日活和转化率的趋势。
      prompt: 请用这组示例数据生成趋势分析报告：月份=2026-01 至 2026-06；日活（人）=1200、1350、1320、1510、1690、1820；转化率（%）=3.2、3.5、3.1、3.9、4.2、4.0。分析趋势、增长率和异常拐点，生成可浏览的 HTML 报告，明确数据范围和判断限制。
    replay:
      steps:
        - title: 对齐时间口径
          description: 确认时间粒度、指标定义和可比区间
        - title: 计算变化指标
          description: 计算增长率、移动变化和主要拐点
        - title: 绘制趋势图表
          description: 用折线图和对比图呈现关键变化
        - title: 输出趋势结论
          description: 总结增长、下滑、波动和后续关注点
    result:
      template: html_preview_v1
      eyebrow: 趋势分析报告
      title: 指标趋势、增长与异常
      summary: 聚焦时间序列变化，呈现增长区间、拐点和需要关注的异常
      html_asset: trend_output

  - id: dimension-report
    selector:
      title: 多维对比报告
      description: 比较自然搜索、直播和社群三个渠道的贡献
      output_label: 多维分析报告
    launch:
      prompt_short: 示例：比较三个渠道的收入、订单和客单价贡献。
      prompt: 请用这组示例数据生成多维分析报告：渠道=自然搜索、直播、社群；收入（万元）=180、150、90；订单量=4200、3900、2100；用户数=3000、2800、1600。按渠道汇总、排名并计算贡献，生成包含对比图表、明细和结论的可视化 HTML 报告。
    replay:
      steps:
        - title: 识别分析维度
          description: 确认可用于分组比较的业务字段
        - title: 聚合与排名
          description: 计算分组指标、贡献占比和排名
        - title: 展示结构差异
          description: 使用对比图和明细表呈现差距
        - title: 形成优化建议
          description: 识别高低表现分组和潜在改善方向
    result:
      template: html_preview_v1
      eyebrow: 多维分析报告
      title: 分组表现与贡献结构
      summary: 比较不同业务维度的表现、贡献和改善机会
      html_asset: dimension_output
