<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多维对比报告</title>
<style>*{box-sizing:border-box}html,body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#212733}body{padding:20px}.doc{max-width:1040px;margin:auto;background:#fff;border-radius:10px;padding:26px 30px;box-shadow:0 14px 38px rgba(24,32,48,.09)}
h1{font-size:20px;margin:0 0 4px}.sub{color:#7a8496;font-size:13px;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.kpi{border:1px solid #e6eaf1;border-radius:8px;padding:14px 16px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:#7a8496}
.chart{border:1px solid #e6eaf1;border-radius:8px;padding:16px}.chart h2{font-size:14px;margin:0 0 10px}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 14px;vertical-align:middle;font-size:12px;color:#7a8496}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:13px}th,td{text-align:right;padding:9px 10px;border-bottom:1px solid #eef1f6}th:first-child,td:first-child{text-align:left}th{color:#7a8496;font-weight:600}.rank{font-weight:700;color:#2f6fed}.note{margin-top:16px;font-size:12px;color:#8a93a3;line-height:1.7}</style></head>
<body><div class="doc"><h1>三渠道经营多维对比</h1><p class="sub">自然搜索 / 直播 / 社群 · 收入、订单与客单价贡献分析</p>
<div class="grid"><div class="kpi"><b>¥420 万</b><span>合计收入</span></div><div class="kpi"><b>10,200</b><span>合计订单</span></div><div class="kpi"><b>¥411.8</b><span>整体客单价</span></div></div>
<div class="chart"><h2>收入与订单量对比</h2><div class="legend"><i style="background:#2f6fed"></i>收入（万元）<i style="background:#12a45c"></i>订单量（百）</div>
<svg viewBox="0 0 940 260" width="100%" height="260" role="img"><g stroke="#eef1f6"><line x1="60" y1="40" x2="900" y2="40"/><line x1="60" y1="110" x2="900" y2="110"/><line x1="60" y1="180" x2="900" y2="180"/><line x1="60" y1="250" x2="900" y2="250"/></g>
<g><rect x="150" y="70" width="60" height="180" fill="#2f6fed"/><rect x="220" y="105" width="60" height="145" fill="#12a45c"/></g>
<g><rect x="430" y="100" width="60" height="150" fill="#2f6fed"/><rect x="500" y="110" width="60" height="140" fill="#12a45c"/></g>
<g><rect x="710" y="160" width="60" height="90" fill="#2f6fed"/><rect x="780" y="175" width="60" height="75" fill="#12a45c"/></g>
<g fill="#7a8496" font-size="13" text-anchor="middle"><text x="215" y="252">自然搜索</text><text x="495" y="252">直播</text><text x="775" y="252">社群</text></g></svg></div>
<table><thead><tr><th>渠道</th><th>收入（万元）</th><th>订单量</th><th>用户数</th><th>客单价</th><th>收入占比</th></tr></thead><tbody>
<tr><td class="rank">① 自然搜索</td><td>180</td><td>4,200</td><td>3,000</td><td>¥428.6</td><td>42.9%</td></tr><tr><td class="rank">② 直播</td><td>150</td><td>3,900</td><td>2,800</td><td>¥384.6</td><td>35.7%</td></tr><tr><td class="rank">③ 社群</td><td>90</td><td>2,100</td><td>1,600</td><td>¥428.6</td><td>21.4%</td></tr></tbody></table>
<p class="note">结论：自然搜索贡献最高且客单价领先；直播订单量接近但客单价偏低，可提升连带；社群规模最小、单位用户产出与自然搜索持平，具备扩量空间。数据为示例，仅用于演示分析结构。</p></div></body></html>
