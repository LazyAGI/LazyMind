    summary: Coordinate Xiaohongshu, WeChat, and short-video publishing; the page is a reproducible sample preview.
    html_asset: launch_plan_demo
- id: growth-review
  selector:
    title: Monthly growth review
    description: Turn content performance into topics and experiments for the next cycle
    output_label: Social operations plan
  launch:
    prompt_short: Turn content performance into topics and experiments for the next cycle
    prompt: 'Review this sample month: 20 posts; checklist content has higher save rates; brand stories have lower completion;
      comments often ask how to obtain templates. Separate facts, hypotheses, and unknowns, then provide keep, stop, and experiment
      actions.'
