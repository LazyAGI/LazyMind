locale: en-US

classification:
  category: Career development
  tags:
    - Resume tailoring
    - Job matching
    - ATS
    - Career transition
    - Resume templates
    - PDF and Word

presentation:
  card:
    title: Resume optimization assistant
    description: Tailor truthful experience, choose one of six layouts and an optional photo, and download PDF and editable Word resumes
    output_type: document
    output_label: Tailored resume
    cover_asset: cover
    result_summary: Choose a template, preview the finished resume, and download PDF and Word files with separate revision notes
  detail:
    title: Resume optimization assistant
    description: Tailor real experience to a role using Business, Modern, Sidebar, Editorial, Campus, or Minimal layouts. Optionally include a photo explicitly chosen by the user, displayed fully or cropped to fit. Generate formatted PDF, editable Word, and preview files, with revision notes outside the resume. Preserve proficiency and contribution boundaries without inventing metrics or responsibilities. Sourced from awesome-claude-skills and adapted for LazyMind.
    attachment_hint: Upload a current resume and target job description, with optional work history, project outcomes, and the portrait you want in the resume

tasks:
  - id: tailor-for-job
    selector:
      title: Tailor a resume for a job
      description: Tailor supported experience, select a layout, and download formatted PDF and Word files
      output_label: PDF / Word resume
    launch:
      prompt_short: Can you tailor my resume for this job?
      prompt: >-
        Use my supplied resume, experience, and target job description to create a tailored resume. Map job requirements to supported experience, then use render_resume to generate a previewable PDF and editable Word file in my selected layout, defaulting to Business. Include only a portrait I explicitly select, and reflow the layout when there is no photo. Preserve the distinction between studied, contributed, and owned work. Keep revision notes and missing evidence in the chat. If I have not supplied my background, ask me to upload or paste it instead of using demonstration candidate data.
    replay:
      steps:
        - title: Read the job requirements
          description: Extract must-have skills, keywords, domain experience, and valued outcomes
        - title: Map the candidate experience
          description: Find direct matches, transferable experience, and unsupported requirements
        - title: Reorder the resume emphasis
          description: Bring the most relevant summary, skills, and achievements forward
        - title: Keep claims truthful
          description: Separate done, contributed, familiar, and unverified experience
        - title: Render the finished resume
          description: Generate PDF, Word, and preview files using the chosen template and photo, with revision notes and gaps kept separate
    result:
      template: html_preview_v1
      eyebrow: Tailored resume
      title: SaaS product manager role match
      summary: Explore a role-matching example; actual results support template selection, optional photos, and PDF / Word downloads.
      html_asset: resume_job_tailoring_demo

  - id: career-transition
    selector:
      title: Reframe a career transition
      description: Reframe supported transferable experience and generate PDF and Word resumes for the target role
      output_label: Transition resume
    launch:
      prompt_short: I want to move into product management. How should I frame my experience?
      prompt: >-
        Use my supplied experience and transition goal to identify transferable skills and their evidence boundaries without presenting them as work I already did in the new role. Use render_resume to create a previewable PDF and editable Word file in my selected layout, defaulting to Business, with only a portrait I explicitly select. Keep missing information and claims not to exaggerate in the chat. If my background or target role is missing, ask me to provide it instead of using demonstration data.
    replay:
      steps:
        - title: Confirm the transition goal
          description: Understand the target role, industry direction, and experience to preserve
        - title: Find transferable evidence
          description: Connect real project, collaboration, analysis, and outcome evidence to the new role
        - title: Reframe the career story
          description: Make the transition and capability connections easier to follow
        - title: Mark the experience boundary
          description: Distinguish owned, contributed, familiar, and not-yet-experienced work
        - title: Deliver the transition resume
          description: Generate PDF and Word files in the chosen layout, with separate suggestions for projects, metrics, or interview stories
    result:
      template: html_preview_v1
      eyebrow: Transition resume
      title: Marketing operations to product management
      summary: Explore a career-transition example; actual results support template selection, optional photos, and PDF / Word downloads.
      html_asset: resume_career_transition_demo

  - id: check-ats-fit
    selector:
      title: Check ATS fit
      description: Check supported keywords and structure, then use a minimal single-column or user-selected layout
      output_label: ATS review report
    launch:
      prompt_short: Can you check whether this resume is ATS-friendly?
      prompt: >-
        Check my supplied resume and job description for keyword alignment, headings, experience order, and structure. Separate direct edits, missing evidence, and terms not to force into the resume. Do not treat role requirements as my existing skills or promise ATS scores or acceptance. If I request a revised resume, use render_resume to create a previewable PDF and editable Word file in my selected layout, defaulting to Minimal, and respect my photo choice. If the resume or job description is missing, ask me to provide it instead of using demonstration data.
    replay:
      steps:
        - title: Extract role keywords
          description: Identify the job title, hard requirements, tools, and recurring capabilities
        - title: Check resume alignment
          description: Compare keywords with claims that are actually supported by the resume
        - title: Check ATS structure
          description: Review headings, order, formatting, and parseability
        - title: Separate the recommendations
          description: Distinguish direct edits, missing evidence, and terms that should not be forced
        - title: Produce downloadable files
          description: Generate PDF and editable Word files in the selected layout without exaggerating experience
    result:
      template: html_preview_v1
      eyebrow: ATS review report
      title: Product manager resume ATS check
      summary: Explore a structure-review example; revised resumes can be downloaded as PDF and Word without promises about ATS acceptance.
      html_asset: resume_ats_check_demo
