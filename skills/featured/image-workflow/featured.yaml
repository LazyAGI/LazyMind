schema_version: 2
id: image-workflow
type: workflow
version: 1.0.0
status: published
default_locale: zh-CN
provider: LazyMind

workflow:
  workflow_ref: builtin:image-workflow

placement:
  home: true
  gallery: true
  order: 22

classification:
  category: 设计创意
  tags: [图片生成, 图片编辑, 动态 GIF, 表情包]

