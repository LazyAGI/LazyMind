    role: result
  generate_product:
    file: assets/generate-product.png
    role: result
  generate_cinematic:
    file: assets/generate-cinematic.png
    role: result
  generate_information:
    file: assets/generate-information.png
    role: result
  edit_preview:
    file: assets/image-edit.html
    role: result
  watch_before:
    file: assets/watch-before.png
    role: result
  watch_after:
    file: assets/watch-after.png
    role: result
  sticker_preview:
    file: assets/sticker-pack.html
    role: result
  sticker_good:
    file: assets/stickers/good.gif
    role: result
  sticker_there:
    file: assets/stickers/there.gif
    role: result
  sticker_hard_work:
    file: assets/stickers/hard-work.gif
    role: result
  sticker_thanks_boss:
    file: assets/stickers/thanks-boss.gif
    role: result
