<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data: blob:; style-src 'unsafe-inline'">
  <title>视觉创意候选方案</title>
  <style>
    :root{--primary:#006ae6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fa;color:#323c47;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{padding:18px}.image-lab-output{width:min(820px,100%);min-height:100%;margin:0 auto;padding:24px;border-radius:12px;background:radial-gradient(circle at 0 0,rgba(219,230,255,.8),transparent 34%),radial-gradient(circle at 100% 100%,rgba(255,224,230,.75),transparent 36%),#fbfcff;box-shadow:0 6px 24px rgba(37,54,78,.08)}.image-lab-header{display:flex;margin-bottom:18px;align-items:flex-start;justify-content:space-between;gap:18px}.result-kicker{margin-bottom:8px;color:var(--primary);font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase}.image-lab-header h2{margin:0;color:#283549;font-size:24px}.image-lab-header p{margin:6px 0 0;color:#8491a5;font-size:11px}.image-lab-badge{flex:0 0 auto;padding:6px 9px;color:#5f6fb2;border-radius:999px;background:#edf0ff;font-size:9px;font-weight:700}.ai-image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ai-image-item{position:relative;height:180px;overflow:hidden;border:5px solid rgba(255,255,255,.94);border-radius:12px;background:#edf1f7;box-shadow:0 10px 24px rgba(57,70,103,.1)}.ai-image-item img{display:block;width:100%;height:100%;object-fit:cover}.ai-image-label{position:absolute;right:8px;bottom:8px;padding:4px 7px;color:#39465a;border-radius:6px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);font-size:8px;font-weight:650}.source-row{margin-top:18px;padding-top:13px;border-top:1px solid #edf1f5;color:#9aa6b6;font-size:10px}@media(max-width:600px){body{padding:10px}.image-lab-output{padding:18px}.image-lab-header{flex-direction:column}.ai-image-grid{grid-template-columns:1fr}.ai-image-item{height:220px}}
  </style>
</head>
<body>
  <main class="image-lab-output">
    <header class="image-lab-header">
      <div>
        <div class="result-kicker">AI IMAGE GENERATION · 4 VARIATIONS</div>
        <h2>视觉创意候选方案</h2>
        <p>根据同一主题生成不同风格和用途的图片，可继续选择单张进行调整。</p>
      </div>
      <span class="image-lab-badge">生成完成</span>
    </header>
    <div class="ai-image-grid">
      <div class="ai-image-item"><img src="{{asset_url:generate_lifestyle}}" alt="生活方式摄影风格"><span class="ai-image-label">生活方式摄影</span></div>
      <div class="ai-image-item"><img src="{{asset_url:generate_product}}" alt="三维产品视觉风格"><span class="ai-image-label">3D 产品视觉</span></div>
      <div class="ai-image-item"><img src="{{asset_url:generate_cinematic}}" alt="电影概念视觉风格"><span class="ai-image-label">电影概念视觉</span></div>
      <div class="ai-image-item"><img src="{{asset_url:generate_information}}" alt="信息视觉风格"><span class="ai-image-label">信息视觉</span></div>
    </div>
    <div class="source-row">输出规格：横版图片 × 4 · 1536 × 1024 px · 支持继续修改构图、色彩与细节</div>
  </main>
</body>
</html>
