<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data: blob:; style-src 'unsafe-inline'">
  <title>懒懒猫动态表情包</title>
  <style>
    :root{--primary:#006ae6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fa;color:#323c47;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{padding:18px}.sticker-output{width:min(820px,100%);min-height:100%;margin:0 auto;padding:22px;border-radius:12px;background:radial-gradient(circle at 0 0,#e0fff5,transparent 35%),radial-gradient(circle at 100% 100%,#ffe4da,transparent 38%),#fffdf7;box-shadow:0 6px 24px rgba(37,54,78,.08)}.result-kicker{margin-bottom:8px;color:var(--primary);font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase}.result-title{margin:0;color:#21324a;font-size:26px;line-height:1.35;letter-spacing:-.55px}.result-deck{margin:8px 0 22px;color:#8996a8;font-size:12px;line-height:1.7}.sticker-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.sticker-item{display:grid;min-width:0;padding:8px 8px 10px;gap:8px;place-items:center;border:1px solid rgba(82,110,130,.1);border-radius:14px;background:rgba(255,255,255,.86);box-shadow:0 8px 22px rgba(73,106,127,.08)}.sticker-media{width:100%;aspect-ratio:1/1;overflow:hidden;border-radius:9px;background:#fff}.sticker-media img{display:block;width:100%;height:100%;object-fit:contain}.sticker-item strong{color:#435267;font-size:11px;line-height:1.5;text-align:center}.source-row{margin-top:18px;padding-top:13px;border-top:1px solid #edf1f5;color:#9aa6b6;font-size:10px}@media(max-width:600px){body{padding:10px}.sticker-output{padding:18px}.sticker-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="sticker-output">
    <div class="result-kicker">8 ANIMATED STICKERS</div>
    <h2 class="result-title">懒懒猫动态表情包</h2>
    <p class="result-deck">8 个日常聊天表情 · GIF 自动循环播放</p>
    <div class="sticker-grid" aria-label="懒懒猫的 8 个动态表情">
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_good}}" alt="懒懒猫动态表情：好的" width="400" height="400"></div><strong>好的</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_there}}" alt="懒懒猫动态表情：在吗" width="400" height="325"></div><strong>在吗</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_hard_work}}" alt="懒懒猫动态表情：辛苦了" width="400" height="325"></div><strong>辛苦了</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_thanks_boss}}" alt="懒懒猫动态表情：谢谢老板" width="400" height="400"></div><strong>谢谢老板</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_no_work}}" alt="懒懒猫动态表情：不想上班" width="400" height="400"></div><strong>不想上班</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_reply}}" alt="懒懒猫动态表情：催回复" width="400" height="400"></div><strong>催回复</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_good_night}}" alt="懒懒猫动态表情：晚安" width="400" height="328"></div><strong>晚安</strong></div>
      <div class="sticker-item"><div class="sticker-media"><img src="{{asset_url:sticker_eat}}" alt="懒懒猫动态表情：干饭" width="400" height="330"></div><strong>干饭</strong></div>
    </div>
    <div class="source-row">动态 GIF × 8 · 宽度 400 px · 保留原始比例与动画</div>
  </main>
</body>
</html>
