<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data: blob:; style-src 'unsafe-inline'">
  <title>智能手表表带结构替换</title>
  <style>
    :root{--primary:#006ae6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f3f6fa;color:#323c47;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}body{padding:18px}.image-lab-output{width:min(820px,100%);min-height:100%;margin:0 auto;padding:24px;border-radius:12px;background:radial-gradient(circle at 0 0,rgba(219,230,255,.8),transparent 34%),radial-gradient(circle at 100% 100%,rgba(255,224,230,.75),transparent 36%),#fbfcff;box-shadow:0 6px 24px rgba(37,54,78,.08)}.image-lab-header{display:flex;margin-bottom:18px;align-items:flex-start;justify-content:space-between;gap:18px}.result-kicker{margin-bottom:8px;color:var(--primary);font-size:10px;font-weight:750;letter-spacing:1.2px;text-transform:uppercase}.image-lab-header h2{margin:0;color:#283549;font-size:24px}.image-lab-header p{margin:6px 0 0;color:#8491a5;font-size:11px}.image-lab-badge{flex:0 0 auto;padding:6px 9px;color:#5f6fb2;border-radius:999px;background:#edf0ff;font-size:9px;font-weight:700}.image-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.image-edit-item{position:relative;min-width:0;padding:10px;border:1px solid #e3e8f0;border-radius:12px;background:rgba(255,255,255,.92)}.image-edit-item strong{display:block;margin-bottom:8px;color:#58667a;font-size:10px}.image-edit-canvas{position:relative;height:290px;overflow:hidden;border-radius:9px;background:#e9eef6}.image-edit-canvas img{display:block;width:100%;height:100%;object-fit:contain}.image-edit-note{position:absolute;right:12px;bottom:12px;padding:6px 8px;color:#fff;border-radius:7px;background:rgba(38,48,67,.8);font-size:8px;backdrop-filter:blur(6px)}.image-edit-summary{display:flex;margin-top:14px;flex-wrap:wrap;gap:7px}.image-edit-summary span{padding:5px 8px;color:#66758a;border-radius:6px;background:#edf2f8;font-size:9px}@media(max-width:600px){body{padding:10px}.image-lab-output{padding:18px}.image-lab-header{flex-direction:column}.image-edit-grid{grid-template-columns:1fr}.image-edit-canvas{height:260px}}
  </style>
</head>
<body>
  <main class="image-lab-output">
    <header class="image-lab-header">
      <div>
        <div class="result-kicker">LOCAL IMAGE EDIT · BEFORE / AFTER</div>
        <h2>智能手表表带结构替换</h2>
        <p>将硅胶表带替换为不锈钢链节表链，呈现连接件、折叠表扣与金属拉丝细节。</p>
      </div>
      <span class="image-lab-badge">实物部件替换</span>
    </header>
    <div class="image-edit-grid">
      <section class="image-edit-item">
        <strong>编辑前</strong>
        <div class="image-edit-canvas"><img src="{{asset_url:watch_before}}" alt="编辑前：配有深色硅胶表带的智能手表"><span class="image-edit-note">原图：硅胶表带</span></div>
      </section>
      <section class="image-edit-item after">
        <strong>编辑后</strong>
        <div class="image-edit-canvas"><img src="{{asset_url:watch_after}}" alt="编辑后：替换为带有金属链节、连接件和折叠表扣的不锈钢表链"><span class="image-edit-note">编辑后：不锈钢链节表链</span></div>
      </section>
    </div>
    <div class="image-edit-summary"><span>✓ 链节与连接结构</span><span>✓ 折叠表扣与拉丝细节</span><span>✓ 沿用原图主体与场景</span></div>
  </main>
</body>
</html>
