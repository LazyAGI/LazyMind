locale: en-US

classification:
  category: Content creation
  tags:
    - Web-fiction generation
    - Serialized fiction
    - Outlines and chapters

presentation:
  card:
    title: Web-fiction generator
    description: Start from one premise, plan a full story, or write a complete chapter that can grow into a serial
    output_type: document
    output_label: Novel writing workspace
    cover_asset: cover
    result_summary: Explore a real opening, full-story outline, and chapter manuscript in one consistent author workspace
  detail:
    title: Start from one premise and keep the story moving
    description: "For web-fiction and serialized-fiction creators, turn a one-line premise into a core hook, character profiles, a full-story outline, and chapter manuscripts while tracking character states and setups. Source: WorkBuddy; adapted for LazyMind."
    attachment_hint: No upload is required for the example; you may replace it with your own premise, character notes, or manuscript

tasks:
  - id: idea-development
    selector:
      title: Start from one premise
      description: Generate a working title, core appeal, first-three-chapter hooks, and a readable opening
      output_label: Story launch and opening
    launch:
      prompt_short: "Demo case: turn a product intern who can see project-failure countdowns into a serial readers can start immediately."
      prompt: |
        Develop the premise below into a binge-worthy web serial and write an opening readers can start immediately.

        Premise: Cheng Ye, a newly hired product intern, can see a red countdown above every project headed for irreversible failure. The company's AI assistant has only twenty-four hours left before launch even though every test appears normal; each wrong diagnosis makes the countdown accelerate.

        Provide a title, one-line hook, protagonist and core rules, a first-three-chapter plan, and an opening chapter of about 1,500 words. Let the payoff come from discovering information, making decisions, and accepting consequences while other characters retain believable motives. End with a compact story-state card so writing can continue in the same conversation.
    replay:
      steps:
        - title: Distill the core appeal
          description: Identify target readers, the promised payoff, and a memorable differentiator
        - title: Establish protagonist and rules
          description: Define desire, initial predicament, capability boundaries, and unavoidable cost
        - title: Design the first three chapters
          description: Link crisis, payoff, and renewed suspense into continuous reading momentum
        - title: Write a real opening
          description: Deliver a manuscript with action, change, and a forward-driving final beat
    result:
      template: html_preview_v1
      eyebrow: Web-fiction launch case
      title: The starting point for Midnight Ten Minutes
      summary: See one premise become a title, capability rules, first-three-chapter hooks, and a real opening manuscript.
      html_asset: idea_demo

  - id: outline-planning
    selector:
      title: Plan the full novel
      description: Shape the main arc, volume escalation, character growth, climax rhythm, and setup resolution
      output_label: Full serialization outline
    launch:
      prompt_short: "Demo case: plan a four-volume serialization route for the project-failure-countdown premise."
      prompt: |
        Use the premise below to plan a four-volume web serial designed for sustained serialization.

        Premise: Cheng Ye, a newly hired product intern, can see a red countdown above every project headed for irreversible failure. The company's AI assistant has only twenty-four hours left before launch even though every test appears normal; each wrong diagnosis makes the countdown accelerate.

        Lay out the main arc, protagonist growth, each volume's core conflict and ending hook, and the planting and payoff of major setups. Gradually reveal the countdown's origin, and let every victory create a new cost or a larger problem. Finish with a full-story state card that later chapters can reuse.
    replay:
      steps:
        - title: Lock the story promise
          description: Confirm the core appeal, protagonist objective, target length, and immutable rules
        - title: Build the main arc
          description: Design the opening state, midpoint change, ending choice, and character growth
        - title: Break down volume rhythm
          description: Arrange volume goals, escalating conflict, staged climaxes, rewards, and costs
        - title: Validate setup and causality
          description: Mark each setup's first appearance, progress points, and expected payoff window
    result:
      template: html_preview_v1
      eyebrow: Full-story planning case
      title: The serialization roadmap for Midnight Ten Minutes
      summary: Explore the main arc, four-volume rhythm, character growth, and setup payoff plan in the same author workspace.
      html_asset: outline_demo

  - id: chapter-writing
    selector:
      title: Write one chapter
      description: Provide characters, a setting, and a chapter objective to receive a complete, readable manuscript
      output_label: Chapter manuscript
    launch:
      prompt_short: "Demo case: write the AI-assistant launch review chapter where the countdown first appears."
      prompt: |
        Use the story setup and chapter situation below to write a complete, readable web-fiction chapter.

        Story setup: Product intern Cheng Ye can see a red countdown above projects headed for irreversible failure. The countdown never reveals the cause, and each wrong diagnosis makes the remaining time fall faster.

        Chapter situation: During an AI-assistant launch review, every test report shows a pass, but Cheng Ye sees “23:59:59” above the screen. He has no decision authority and can only investigate user feedback and anomaly records. His first fix appears successful, yet the countdown suddenly loses six hours.

        Write about 1,500 words with a clear objective, realistic resistance, one credible small win, a cost for the wrong judgment, and a natural ending hook. Do not make other characters irrational merely to elevate the protagonist. Follow the chapter with a compact state card covering character state, capability rules, and open setups.
    replay:
      steps:
        - title: Define the chapter mission
          description: Lock the viewpoint, scene goal, main obstacle, payoff, and cost
        - title: Verify writing context
          description: When prior text exists, check character states, rules, timeline, and knowledge boundaries
        - title: Write the scene chain
          description: Advance a complete chapter through action, dialogue, and causal changes
        - title: Land the ending hook
          description: Check continuity and leave a specific, natural reason to read the next chapter
    result:
      template: html_preview_v1
      eyebrow: Chapter manuscript case
      title: Chapter 001, Ten Minutes Before Collapse
      summary: Read the complete urban-fantasy opening generated in a LazyMind test and inspect its chapter mission and continuity state.
      html_asset: chapter_demo
