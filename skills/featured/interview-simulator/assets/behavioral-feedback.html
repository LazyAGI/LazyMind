<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行为面试反馈</title>
<style>*{box-sizing:border-box}html,body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#212733}body{padding:20px}.doc{max-width:920px;margin:auto;background:#fff;border-radius:10px;padding:26px 30px;box-shadow:0 14px 38px rgba(24,32,48,.09)}
h1{font-size:20px;margin:0 0 4px}.sub{color:#7a8496;font-size:13px;margin:0 0 18px}.score{display:flex;align-items:end;gap:8px;margin-bottom:18px}.score b{font-size:44px;color:#2f6fed;line-height:1}.score span{color:#8a93a3}
.row{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:12px;color:#5b6473;margin:8px 0}.track{height:7px;background:#eef1f6;border-radius:4px;overflow:hidden}.fill{height:100%;background:#2f6fed}
.star{margin:18px 0;border:1px solid #e6eaf1;border-radius:8px;overflow:hidden}.star .h{background:#f2f6ff;padding:10px 16px;font-weight:700;font-size:13px}.star .b{padding:14px 16px;font-size:13.5px;line-height:1.8}.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:6px}.ok{background:#e6f6ec;color:#12a45c}.miss{background:#fdeceb;color:#e5484d}
.gap{margin-top:16px;font-size:13px;line-height:1.8;color:#5b6473}.gap b{color:#212733}</style></head>
<body><div class="doc"><h1>STAR 回答诊断与案例库</h1><p class="sub">目标岗位：高级产品经理 · 素材：“与工程团队意见不一致”</p>
<div class="score"><b>78</b><span>/ 100 · 结构完整，结果量化好，个人决策与权衡可再具体</span></div>
<div class="row"><span>相关性</span><div class="track"><div class="fill" style="width:88%"></div></div><b>88</b></div><div class="row"><span>结构</span><div class="track"><div class="fill" style="width:80%"></div></div><b>80</b></div><div class="row"><span>证据</span><div class="track"><div class="fill" style="width:70%"></div></div><b>70</b></div><div class="row"><span>表达</span><div class="track"><div class="fill" style="width:76%"></div></div><b>76</b></div>
<div class="star"><div class="h">逐段检查</div><div class="b">
<span class="tag ok">S 情境✓</span>上线前范围分歧，背景清晰。<br>
<span class="tag ok">T 任务✓</span>作为负责人推动决策，角色明确。<br>
<span class="tag miss">A 行动△</span>“拆分一期范围”缺少你个人的具体判断与说服过程。<br>
<span class="tag ok">R 结果✓</span>按时上线、转化率 +8%，量化到位。</div></div>
<div class="gap"><b>建议追问：</b>你当时用什么数据说服工程团队？被砍掉的需求如何处理？<br><b>待补充案例库：</b>跨团队冲突、失败复盘、从 0 到 1 立项 各 1 个。</div></div></body></html>
