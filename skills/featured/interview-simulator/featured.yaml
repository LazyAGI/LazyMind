schema_version: 2
id: interview-simulator
type: chat
version: 1.0.1
status: published
default_locale: zh-CN
provider: SkillHub

skill:
  source_url: https://skillhub.cn/skills/clawhub_wscats/interview-simulator
  category: career
  required_version: 1.0.0

placement:
  home: false
  gallery: true
  order: 16

classification:
  category: 教育成长
  tags:
    - 模拟面试
    - 面试反馈
    - 求职准备
    - 回答优化

assets:
  cover:
    file: assets/cover.png
    role: cover
  pm_interview:
    file: assets/product-manager-interview.html
    role: result
  behavioral_output:
    file: assets/behavioral-feedback.html
    role: result
  resume_output:
    file: assets/resume-feedback.html
    role: result

presentation:
  card:
    title: AI 面试模拟器
    description: 为 3 年 B2B SaaS 候选人开展高级 AI 产品经理模拟面试
    output_type: report
    output_label: 面试反馈报告
    cover_asset: cover
    result_summary: 交互查看三道岗位题、四维评分、回答诊断和针对性训练计划
  detail:
    title: AI 面试模拟器
    description: 源自 SkillHub，经 LazyMind 适配。根据目标岗位、经验和面试类型开展一问一答的模拟面试，并在每题后给出评分、反馈和改进示例。
    attachment_hint: 简历、岗位描述、目标公司信息或重点练习方向

tasks:
  - id: role-interview
    selector:
      title: AI 产品经理面试
      description: 针对 B2B SaaS 背景完成三道递进式岗位题
      output_label: 岗位面试反馈
    launch:
      prompt_short: 为有 3 年 B2B SaaS 经验的候选人开始高级 AI 产品经理面试。
      prompt: 请使用 AI 面试模拟器 Skill，为一名有 3 年 B2B SaaS 产品经验、目标岗位为高级 AI 产品经理的候选人进行三题模拟面试。一次只问一题并等待回答；每题后从相关性、结构、证据和表达四个维度各按 10 分评分，指出一项最优点和两项具体改进，给出更强的回答框架，再进入下一题。题目依次覆盖 AI 场景判断、B2B 指标设计和跨团队推进，最后输出 7 天训练计划。
    replay:
      steps:
        - title: 对齐候选人画像
          description: 确认 3 年 B2B SaaS 经历和高级 AI 产品经理目标
        - title: 三题递进问答
          description: 依次考察场景判断、指标设计和跨团队推进
        - title: 四维即时评分
          description: 从相关性、结构、证据和表达给出量化反馈
        - title: 生成七天计划
          description: 汇总优势、短板、回答框架和每日训练重点
    result:
      template: html_preview_v1
      eyebrow: 岗位面试反馈
      title: 高级 AI 产品经理模拟面试
      summary: 交互查看岗位问题、四维评分、反馈与后续训练重点
      html_asset: pm_interview

  - id: behavioral-interview
    selector:
      title: 行为面试训练
      description: 以“与工程团队意见不一致”为例练习 STAR 回答
      output_label: 行为面试反馈
    launch:
      prompt_short: 示例：练习“与工程团队意见不一致”的 STAR 回答。
      prompt: 请以这段示例经历开始行为面试：“上线前我与工程团队在交付范围上有分歧，最终通过拆分一期范围按时上线，转化率提升 8%。”目标岗位是高级产品经理。逐题提问，每次回答后检查情境、任务、行动和结果是否完整，判断案例是否具体可信，并给出结构重写和追问建议，最后总结待补充案例库。
    replay:
      steps:
        - title: 盘点经历素材
          description: 确认项目、挑战、协作、冲突和失败经历
        - title: 发起行为提问
          description: 围绕能力模型逐题追问具体案例
        - title: 检查 STAR 结构
          description: 评估背景、任务、行动、结果和个人贡献
        - title: 完善案例库
          description: 输出可复用的经历主题和补充建议
    result:
      template: html_preview_v1
      eyebrow: 行为面试反馈
      title: STAR 回答诊断与案例库
      summary: 提升经历回答的结构、证据和岗位相关性
      html_asset: behavioral_output

  - id: resume-interview
    selector:
      title: 简历深挖面试
      description: 深挖“企业知识库问答”项目的职责、决策与结果
      output_label: 简历深挖反馈
    launch:
      prompt_short: 示例：深挖“企业知识库问答”项目经历。
      prompt: 请以这段示例简历项目开始深挖：“负责企业知识库问答产品，带领 4 人团队，3 个月将首答命中率从 62% 提升到 78%。”围绕职责边界、关键决策、技术或业务难点和量化结果逐层追问，一次只问一个问题；每题后指出含糊表述、证据不足或追问风险，并帮助形成更准确的回答。
    replay:
      steps:
        - title: 识别重点经历
          description: 找出与目标岗位最相关和最可能被追问的项目
        - title: 逐层深挖项目
          description: 追问职责、决策、难点、协作和结果
        - title: 检查证据一致性
          description: 识别含糊表述、逻辑跳跃和量化缺口
        - title: 整理回答要点
          description: 形成准确、具体且可验证的项目回答
    result:
      template: html_preview_v1
      eyebrow: 简历深挖反馈
      title: 项目经历问答与风险点
      summary: 梳理重点项目的回答证据、追问风险和表达改进方向
      html_asset: resume_output
