  category: 教育成长
  tags:
    - 高考
    - 志愿填报
    - 院校选择

assets:
  cover:
    file: assets/cover.png
    role: cover
  volunteer_plan_demo:
    file: assets/volunteer-plan-demo.html
    role: result
  rank_analysis_demo:
    file: assets/rank-analysis-demo.html
    role: result
  major_selection_demo:
    file: assets/major-selection-demo.html
    role: result
  admission_rules_demo:
    file: assets/admission-rules-demo.html
    role: result

presentation:
  card:
    title: 高考志愿填报顾问
    description: 从位次判断、专业比较到冲稳保排序，交互查看一套完整的志愿决策案例
    output_type: report
    output_label: 交互式志愿规划案例
    cover_asset: cover
    result_summary: 以演示数据串联位次分析、志愿梯度、专业适配和录取规则核查，结果可继续调整
  detail:
    title: 高考志愿填报顾问
    description: 根据成绩、位次、选科和个人偏好，完成院校专业筛选、冲稳保规划与录取风险分析。可直接浏览四个交互案例，了解从输入条件到志愿决策的完整过程；案例数据仅用于展示，不替代官方招生信息。
    attachment_hint: 成绩、位次、选科和院校专业意向表

tasks:
  - id: volunteer-plan
    selector:
      title: 志愿方案规划
      description: 综合位次、选科和个人偏好制定冲稳保志愿方案
      output_label: 志愿填报方案
    launch:
      prompt_short: 根据我的成绩、位次和偏好，帮我排一份冲稳保志愿方案。
      prompt: 请根据我的省份、年份、选科、分数、位次、城市和专业偏好，排出冲、稳、保志愿方案，说明每项选择的依据、风险和调整方法；关键信息不足时先询问我。
    replay:
      steps:
        - title: 核对考试信息
          description: 确认省份、年份、选科、分数和位次等基础条件
        - title: 梳理个人偏好
          description: 明确城市、院校层次、专业方向和可接受约束
        - title: 制定冲稳保梯度
          description: 结合历年录取位次形成分层候选清单
        - title: 输出志愿方案
          description: 给出志愿顺序、选择依据、风险和调整建议
    result:
      template: html_preview_v1
      eyebrow: 志愿填报案例
      title: 从位次到冲稳保志愿清单
      summary: 交互查看演示分数、志愿梯度、院校专业依据和风险检查；样例数据不代表官方录取结果。
      html_asset: volunteer_plan_demo

  - id: rank-analysis
    selector:
      title: 位次与录取概率分析
      description: 根据分数和位次判断目标院校专业的录取可能性
      output_label: 位次分析报告
    launch:
      prompt_short: 用我的高考位次分析可重点关注的院校和专业范围。
      prompt: 请根据我的省份、年份、选科、分数和位次，分析可重点关注的院校层次、专业范围以及冲稳保边界；缺少目标院校或可核验的历年数据时，先询问并说明局限。
    replay:
      steps:
        - title: 确认位次口径
          description: 核对省份、年份、选科类别及一分一段信息
        - title: 对齐历史数据
          description: 比较目标院校专业近年最低位次和波动范围
        - title: 判断录取区间
          description: 划分冲刺、稳妥和保底的参考边界
        - title: 输出分析结论
          description: 总结机会、风险和需要继续核实的数据
    result:
      template: html_preview_v1
      eyebrow: 位次分析案例
      title: 院校专业录取区间与风险判断
      summary: 交互查看位次区间、历史波动和冲稳保边界，并保留数据口径与核验提示。
      html_asset: rank_analysis_demo

  - id: major-selection
    selector:
      title: 专业选择建议
      description: 结合兴趣、学科优势和发展方向筛选专业
      output_label: 专业选择建议
    launch:
      prompt_short: 结合我的兴趣和学科优势，帮我比较适合的大学专业。
      prompt: 请根据我的兴趣、优势学科、性格、职业倾向、选科限制和城市偏好，比较适合的大学专业，说明课程、能力要求、发展路径和风险，并给出核实方法。
    replay:
      steps:
        - title: 识别个人特征
          description: 梳理兴趣、优势学科、性格和职业倾向
        - title: 检查选科限制
          description: 排除不满足选科和身体条件要求的专业
        - title: 比较专业方向
          description: 对比学习内容、培养路径、就业和深造选择
        - title: 形成推荐清单
          description: 给出推荐优先级、理由和验证方式
    result:
      template: html_preview_v1
      eyebrow: 专业选择案例
      title: 兴趣、能力与发展路径专业比较
      summary: 交互比较专业适配度、课程方向、发展路径和需要继续核实的限制条件。
      html_asset: major_selection_demo

  - id: admission-rules
    selector:
      title: 录取规则解读
      description: 解读平行志愿、投档、调剂和退档等关键规则
      output_label: 录取规则说明
    launch:
      prompt_short: 解读我所在省份的投档录取规则和填报风险。
      prompt: 请根据我所在省份和年份，解释批次、平行志愿、投档、专业调剂、退档和特殊类型招生规则；区分官方规定与一般经验，并列出需要核验的关键限制。
    replay:
      steps:
        - title: 确认省份与年份
          description: 确定适用的招生政策、批次和志愿模式
        - title: 拆解投档流程
          description: 说明排序、检索、投档和院校录取的先后关系
        - title: 分析关键风险
          description: 识别调剂、退档、专业限制和批次衔接风险
        - title: 输出规则清单
          description: 整理填报前需要确认的规则和官方核验入口
    result:
      template: html_preview_v1
      eyebrow: 录取规则案例
      title: 投档、调剂与退档风险检查
      summary: 按流程查看投档规则、关键限制和待核验清单；规则内容需以对应省份官方文件为准。
      html_asset: admission_rules_demo
