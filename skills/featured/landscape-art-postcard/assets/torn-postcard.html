<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src * data: blob:; style-src 'unsafe-inline'">
  <title>让风景跨过纸页 · 风景水墨样式预览</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f3f0e9;color:#34464a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{padding:26px 18px 30px}
    main{max-width:1040px;margin:0 auto}
    header{margin:0 0 24px}
    .kicker{margin:0 0 9px;color:#697d80;font-size:11px;line-height:1.6;letter-spacing:.12em}
    h1{margin:0;font-size:clamp(23px,4vw,32px);font-weight:500;line-height:1.4;letter-spacing:.05em}
    .intro{margin:10px 0 0;color:#6d7979;font-size:13px;line-height:1.8;max-width:760px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 22px;align-items:start}
    figure{min-width:0;margin:0;background:#fcfaf4;border:1px solid #e3e5dc;border-radius:8px;overflow:hidden}
    figure.wide{grid-column:1/-1;width:100%}
    figure.portrait{width:100%;max-width:480px;justify-self:center}
    figure.solo{grid-column:1/-1}
    .image{padding:8px;background:#fcfaf4}
    img{display:block;width:100%;height:auto}
    figcaption{padding:13px 16px 17px;border-top:1px solid #e9e8e1}
    .tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
    .tags span{padding:3px 8px;border:1px solid #d8dfd8;border-radius:99px;color:#62766f;font-size:10px;line-height:1.4}
    h2{font-size:16px;line-height:1.5;font-weight:500;margin:0 0 6px}
    .note{margin:0;color:#75817b;font-size:12px;line-height:1.8}
    footer{margin:24px 0 0;padding-top:16px;border-top:1px solid #dce1d9;color:#77817d;font-size:12px;line-height:1.9}
    footer p{margin:0 0 4px}
    @media(max-width:600px){body{padding:20px 10px 24px}.grid{grid-template-columns:minmax(0,1fr);gap:20px}figure.wide,figure.solo{grid-column:auto}.image{padding:5px}figcaption{padding:12px}.intro{font-size:12px}}
  </style>
</head>
<body>
  <main>
    <header>
      <p class="kicker">撕口明信片 · 横版示例</p>
      <h1>让风景跨过纸页</h1>
      <p class="intro">沿着水线与草木安排撕口，让同一风景的摄影与淡彩水墨自然衔接。</p>
    </header>
    <section class="grid" aria-label="可组合样式示例">
      <figure class="wide">
        <div class="image"><img src="{{asset_url:torn_postcard}}" alt="横版草甸湖泊撕口明信片：同景摄影与淡彩水墨沿不规则水线衔接，留白安排标题和小标记" decoding="async"></div>
        <figcaption>
          <div class="tags"><span>明信片</span><span>撕口</span><span>摄影＋水墨</span><span>横版 3:2</span></div>
          <h2>草甸与湖泊的交界</h2>
          <p class="note">保留同景摄影锚点，以不规则撕口过渡到水墨，配合克制的标题、短句与小标记。</p>
        </figcaption>
      </figure>
    </section>
    <footer>
      <p>点击“试一试”后只需上传一张风景照片，直接沿用案例预设，每次默认创作一张。</p>
      <p>本案例试用预设：横版 3:2、同景摄影与淡彩水墨撕口明信片。其他样张展示可自由组合的变化；你主动提出新的风格、形式或比例时再调整，无需额外填写。</p>
    </footer>
  </main>
</body>
</html>
