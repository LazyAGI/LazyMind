presentation:
  card:
    title: K12智能老师
    description: 从作业批改、错因讲解到分层练习卷，查看完整的个性化学习辅导案例
    output_type: document
    output_label: 交互式学习辅导案例
    cover_asset: cover
    result_summary: 以五年级分数学习为例，交互查看批改过程、分步讲解、分层练习和 A4 练习卷
  detail:
    title: K12智能老师
    description: 根据学生年级、学科、教材和作业内容，完成逐题批改、错因分析、分步讲解与分层练习生成。可直接浏览五年级分数学习案例，了解从错题到可打印练习卷的完整过程。
    attachment_hint: 清晰的作业或试卷图片、年级、学科和教材版本

tasks:
  - id: homework-review
    selector:
      title: 作业批改与错题辅导
      description: 逐题检查作业，定位错因，并查看讲解和巩固案例
      output_label: 交互式错题辅导案例
    launch:
      prompt_short: 批改小雨五年级下册的分数作业，检查选择、填空、解答三类题并讲清错因。
      prompt: >-
        学生称呼为小雨，五年级下册人教版数学，主题是分数加减法。请批改下面这份作业，找出错题和薄弱知识点，并生成有针对性的巩固练习。作业包含选择题、填空题、解答题各2题。题目和学生答案如下：一、选择题 1. 3/8+1/4等于多少？A.4/12 B.5/8 C.7/8 D.1/2。学生选C。2. 1−2/5等于多少？A.3/5 B.2/5 C.1/5 D.7/5。学生选A。二、填空题 3. 2/3+1/6=（ ）。学生填4/9。4. 7/8−1/4=（ ）。学生填5/8。三、解答题 5. 一本书第一天读1/4，第二天读3/10，两天一共读了这本书的几分之几？学生答4/14。6. 一块地的3/8种番茄，1/4种黄瓜，其余种青菜，青菜占这块地的几分之几？学生答3/8。
    replay:
      steps:
        - title: 识别学科与学段
          description: 根据题目和用户信息确认年级、学科、教材及题目完整性
        - title: 逐题批改作业
          description: 核对答案，记录正确题目、错题和需要补充的信息
        - title: 分析错误原因
          description: 定位知识点、思路偏差、计算或表达问题
        - title: 完成教学讲解
          description: 使用直观步骤、生活化类比和视频搜索建议讲懂错题
        - title: 生成巩固练习
          description: 围绕薄弱知识点提供分层练习、答案和易错提醒
    result:
      template: html_preview_v1
      eyebrow: 错题辅导案例
      title: 五年级分数应用题辅导报告
      summary: 查看题目识别、逐题判定、通分错因、分步讲解与巩固练习的完整交互案例。
      html_asset: homework_review_demo

  - id: graded-practice
    selector:
      title: 分层练习生成
      description: 围绕指定年级、学科和知识点生成基础到挑战练习案例
      output_label: 交互式分层练习案例
    launch:
      prompt_short: 给五年级下册人教版出一套“分数加减法先通分”的三层练习。
      prompt: >-
        请直接为一名五年级下册人教版数学学生生成一套20分钟的“分数加减法”分层练习，不要先追问教材或知识点。核心方法是先找公分母，再把分数化成同分母分数，最后加减分子并检查是否约分；重点纠正“分母不同就直接相加减”和“还剩多少没有从整体1中减去”的错误。请按基础、提高、挑战三层组织题目，覆盖计算、分数应用题、判断和解释通分理由，题意全部用完整文字写清楚，并为每题附答案、关键步骤和易错提醒。
    replay:
      steps:
        - title: 确认练习范围
          description: 明确年级、学科、教材、知识点、题量和难度
        - title: 梳理核心方法
          description: 提炼概念、解题步骤和常见错误
        - title: 设计难度梯度
          description: 按基础、提高、挑战组织不同层次题目
        - title: 生成答案解析
          description: 为每道题提供答案、关键步骤和易错提醒
    result:
      template: html_preview_v1
      eyebrow: 分层练习案例
      title: 分数加减法基础·提高·挑战练习
      summary: 围绕“先通分，再计算”展示三级题目、答案解析、易错提醒和下一轮练习入口。
      html_asset: graded_practice_demo

  - id: printable-paper
    selector:
      title: 可打印练习卷
      description: 将错题和知识点整理成适合打印的学生卷与答案解析案例
      output_label: 交互式打印练习卷案例
    launch:
      prompt_short: 根据小雨最新的三道分数错题，整理一份五年级 A4 练习卷。
      prompt: >-
        请直接为小雨生成一份五年级下册人教版数学的可打印 A4 练习卷，不要先追问。请同步使用本次最新批改中的三道错题：选择题“3/8+1/4”，学生选C，正确答案为B；填空题“2/3+1/6”，学生填4/9，正确答案为5/6；解答题“一本书第一天读1/4，第二天读3/10，两天一共读了这本书的几分之几”，学生答4/14，正确答案为11/20。围绕“异分母分数先通分”和分数应用题列式安排选择题、填空题、解答题各2题，建议用时20分钟；学生卷和答案解析分开，题目使用完整文字说明，并在解析中指出每道错题对应的通分步骤和错误原因。优先生成Word，若依赖不可用则降级为Markdown并说明。
    replay:
      steps:
        - title: 汇总学习材料
          description: 整理错题、知识点、年级学科和输出要求
        - title: 规划试卷结构
          description: 安排题型、难度、题量、答题空间和评分信息
        - title: 生成练习与答案
          description: 输出练习正文、参考答案和关键解析
        - title: 生成可打印文件
          description: 优先输出 Word，依赖不可用时自动降级为 Markdown
    result:
      template: html_preview_v1
      eyebrow: 可打印练习卷案例
      title: 分数加减法 A4 巩固练习卷
      summary: 在学生卷与答案解析之间切换，查看答题区、分值、打印版式和订正说明。
      html_asset: printable_paper_demo
