schema_version: 2
id: k12-smart-teacher
type: work
version: 1.0.4
status: published
default_locale: zh-CN
provider: SkillHub

skill:
  source_url: https://skillhub.cn/skills/user_6d79eef2/k12-smart-teacher
  category: education
  required_version: 1.0.4

placement:
  home: true
  gallery: true
  order: 10

classification:
  category: 教育成长
  tags:
    - K12教育
    - 作业批改
    - 错题分析
    - 练习生成

assets:
  cover:
    file: assets/cover.png
    role: cover

presentation:
  card:
    title: K12智能老师
    description: 批改作业、分析错因并生成分层练习，覆盖小学到高中九大学科
    output_type: document
    output_label: 学习辅导方案
    cover_asset: cover
    result_summary: 从错题讲解到巩固练习，形成可打印、可继续调整的个性化学习材料
  detail:
    title: K12智能老师
    description: 根据学生年级、学科、教材和作业内容，完成逐题批改、错因分析、可视化讲解与分层练习生成。
    attachment_hint: 清晰的作业或试卷图片、年级、学科和教材版本

tasks:
  - id: homework-review
    selector:
      title: 作业批改与错题辅导
      description: 逐题检查作业，定位错因并完成讲解和巩固建议
      output_label: 错题辅导报告
    launch:
      prompt_short: 批改我上传的作业，分析错题并给出针对性讲解和练习。
      prompt: 请根据我上传的作业或试卷完成逐题批改。先确认学生年级、学科和教材版本；对每道错题说明错误原因、正确思路和关键知识点，提供容易理解的可视化讲解，并推荐适合继续学习的视频搜索关键词。最后针对薄弱点生成少量举一反三练习和答案。图片不清晰或信息不足时，请先询问关键资料。
    replay:
      steps:
        - title: 识别学科与学段
          description: 根据题目和用户信息确认年级、学科、教材及题目完整性
        - title: 逐题批改作业
          description: 核对答案，记录正确题目、错题和需要补充的信息
        - title: 分析错误原因
          description: 定位知识点、思路偏差、计算或表达问题
        - title: 完成教学讲解
          description: 使用直观步骤、生活化类比和视频搜索建议讲懂错题
        - title: 生成巩固练习
          description: 围绕薄弱知识点提供分层练习、答案和易错提醒
    result:
      template: generic_report_v1
      eyebrow: 错题辅导报告
      title: 作业批改与个性化巩固方案
      summary: 形成包含批改结果、错因、讲解和后续练习的完整学习材料
      highlights:
        - 逐题批改与薄弱知识点清单
        - 错因分析和可视化讲解
        - 举一反三练习、答案与学习建议

  - id: graded-practice
    selector:
      title: 分层练习生成
      description: 围绕指定年级、学科和知识点生成基础到挑战练习
      output_label: 分层练习题
    launch:
      prompt_short: 根据年级、学科和知识点生成一套分层练习题。
      prompt: 请根据我提供的年级、学科、教材版本和知识点，先用简短示例讲明核心方法，再生成基础、提高、挑战三个层次的练习。题量保持适中，覆盖典型题型和常见错误，最后提供答案、解析和易错提醒；如果主题超出内置题库，请先生成通用可用版本并说明还需要哪些教材信息。
    replay:
      steps:
        - title: 确认练习范围
          description: 明确年级、学科、教材、知识点、题量和难度
        - title: 梳理核心方法
          description: 提炼概念、解题步骤和常见错误
        - title: 设计难度梯度
          description: 按基础、提高、挑战组织不同层次题目
        - title: 生成答案解析
          description: 为每道题提供答案、关键步骤和易错提醒
    result:
      template: generic_report_v1
      eyebrow: 分层练习题
      title: 基础·提高·挑战三层练习
      summary: 输出与学生阶段和薄弱点匹配的练习、答案及解析
      highlights:
        - 三层难度与典型题型覆盖
        - 标准答案和关键步骤解析
        - 易错提醒与后续复习建议

  - id: printable-paper
    selector:
      title: 可打印练习卷
      description: 将错题和知识点整理成适合打印使用的练习材料
      output_label: 打印练习卷
    launch:
      prompt_short: 把错题和薄弱知识点整理成一份可打印练习卷。
      prompt: 请根据我提供的错题、年级、学科和薄弱知识点，整理一份结构清晰、适合打印的练习卷。包含标题、学生信息栏、分层题目、答题区域、参考答案和解析。优先生成 Word 文档；如果当前环境缺少 Word 依赖，请自动降级为 Markdown，并明确告诉我如何继续使用或转换。
    replay:
      steps:
        - title: 汇总学习材料
          description: 整理错题、知识点、年级学科和输出要求
        - title: 规划试卷结构
          description: 安排题型、难度、题量、答题空间和评分信息
        - title: 生成练习与答案
          description: 输出练习正文、参考答案和关键解析
        - title: 生成可打印文件
          description: 优先输出 Word，依赖不可用时自动降级为 Markdown
    result:
      template: generic_report_v1
      eyebrow: 打印练习卷
      title: 个性化错题巩固练习卷
      summary: 生成包含练习、答题区、答案和解析的可打印学习文件
      highlights:
        - 适合打印的完整试卷结构
        - 针对薄弱知识点的分层题目
        - Word优先与Markdown降级方案
