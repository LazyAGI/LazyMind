tasks:
- id: find-opportunities
  selector:
    title: 发现采购商机
    description: 筛选相关采购项目，明确优先跟进对象与待核实条件
    output_label: 商机分析报告
  launch:
    prompt_short: 寻找长三角机器视觉采购商机
    prompt: 我是一家机器视觉设备供应商。请检索2026年8月16日至9月15日上海、江苏、浙江、安徽的机器视觉招标信息，筛选值得跟进的采购项目，核对重点项目的需求与参与条件，整理商机清单和下一步建议，并保存报告。
  replay:
    steps:
    - title: 分地区检索
      description: 按相同关键词和日期查询四地，实际取得13条公告
    - title: 去重与相关性筛选
      description: 合并转载和更正公告为10个采购项目，区分4个直接相关、3个中等相关和3个低相关项目
    - title: 核对重点项目
      description: 读取丽水职院、南京邮电大学的详情正文并取得来源地址
    - title: 制定跟进清单
      description: 整理预算、技术要求、截止时间及缺失信息，明确后续核实事项
  result:
