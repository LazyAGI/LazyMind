        relevant and 3 low-relevance projects
    - title: Review key projects
      description: Read API detail text and retrieve source URLs for Lishui Vocational
        and Technical College and Nanjing University of Posts and Telecommunications
    - title: Prioritize follow-up
      description: Summarize budgets, specifications, dates and outstanding questions
