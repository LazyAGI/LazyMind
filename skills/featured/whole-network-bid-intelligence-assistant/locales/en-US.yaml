- id: find-opportunities
  selector:
    title: Find procurement opportunities
    description: Identify relevant projects and the conditions to verify before following
      up
    output_label: Opportunity report
  launch:
    prompt_short: Find machine vision procurement opportunities in the Yangtze River
      Delta
    prompt: I supply machine vision equipment. Search machine vision tender notices
      published from August 16 to September 15, 2026 in Shanghai, Jiangsu, Zhejiang
      and Anhui. Identify relevant procurement projects, check requirements and participation
      conditions for the most promising ones, and save an opportunity list with recommended
      next steps.
