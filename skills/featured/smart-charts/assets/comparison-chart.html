<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对比分析图</title>
<style>*{box-sizing:border-box}html,body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#212733}body{padding:20px}.doc{max-width:960px;margin:auto;background:#fff;border-radius:10px;padding:24px 28px;box-shadow:0 14px 38px rgba(24,32,48,.09)}
h1{font-size:18px;margin:0 0 4px}.sub{color:#7a8496;font-size:13px;margin:0 0 16px}.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 5px 0 14px;vertical-align:middle;font-size:12px;color:#7a8496}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}th,td{text-align:right;padding:8px 10px;border-bottom:1px solid #eef1f6}th:first-child,td:first-child{text-align:left}th{color:#7a8496}.hi{color:#2f6fed;font-weight:700}</style></head>
<body><div class="doc"><h1>三地区收入与订单量对比</h1><p class="sub">华东 / 华南 / 华北 · 悬停查看数值</p>
<div class="legend"><i style="background:#2f6fed"></i>收入（万元）<i style="background:#12a45c"></i>订单量（千）</div>
<svg viewBox="0 0 900 300" width="100%" height="300" role="img"><g stroke="#eef1f6"><line x1="50" y1="50" x2="870" y2="50"/><line x1="50" y1="130" x2="870" y2="130"/><line x1="50" y1="210" x2="870" y2="210"/><line x1="50" y1="270" x2="870" y2="270"/></g>
<g><rect x="130" y="70" width="70" height="200" fill="#2f6fed"><title>华东收入 320 万元</title></rect><rect x="210" y="100" width="70" height="170" fill="#12a45c"><title>华东订单 8400</title></rect></g>
<g><rect x="400" y="95" width="70" height="175" fill="#2f6fed"><title>华南收入 280 万元</title></rect><rect x="480" y="116" width="70" height="154" fill="#12a45c"><title>华南订单 7600</title></rect></g>
<g><rect x="670" y="133" width="70" height="137" fill="#2f6fed"><title>华北收入 210 万元</title></rect><rect x="750" y="151" width="70" height="119" fill="#12a45c"><title>华北订单 5900</title></rect></g>
<g fill="#7a8496" font-size="14" text-anchor="middle"><text x="205" y="292">华东</text><text x="475" y="292">华南</text><text x="745" y="292">华北</text></g></svg>
<table><thead><tr><th>地区</th><th>收入（万元）</th><th>订单量</th><th>单均（元）</th><th>收入排名</th></tr></thead><tbody>
<tr><td class="hi">华东</td><td>320</td><td>8,400</td><td>381</td><td>1</td></tr><tr><td>华南</td><td>280</td><td>7,600</td><td>368</td><td>2</td></tr><tr><td>华北</td><td>210</td><td>5,900</td><td>356</td><td>3</td></tr></tbody></table>
<p class="sub" style="margin-top:14px">结论：华东收入领先且单均最高；三地区收入差距 110 万元，主要来自订单规模而非单价差异。</p></div></body></html>
