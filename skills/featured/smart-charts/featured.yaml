schema_version: 2
id: smart-charts
type: work
version: 6.2.1
status: published
default_locale: zh-CN
provider: WorkBuddy

skill:
  source_url: https://skillhub.cn/skills/user_5b28ea14/smart-charts
  category: data
  required_version: 6.2.1

placement:
  home: true
  gallery: true
  order: 12

classification:
  category: 信息分析
  tags:
    - 智能图表
    - 数据可视化
    - Excel 分析
    - CSV 分析

assets:
  cover:
    file: assets/cover.png
    role: cover

presentation:
  card:
    title: 智能图表
    description: 上传 CSV 或 Excel，自动生成适合数据特征的可交互图表
    output_type: dashboard
    output_label: 可视化图表
    cover_asset: cover
    result_summary: 识别字段与指标关系，生成可编辑、可下载的交互式 HTML 图表
  detail:
    title: 智能图表
    description: 源自 WorkBuddy 内置 Skill。读取 CSV、Excel 或 JSON 数据，自动推荐图表并生成可交互、可下载的 HTML 可视化。
    attachment_hint: CSV、Excel 或 JSON 数据文件

tasks:
  - id: trend-chart
    selector:
      title: 趋势图表
      description: 展示时间序列变化、增长和周期波动
      output_label: 趋势分析图
    launch:
      prompt_short: 根据我上传的数据生成一份趋势分析图表。
      prompt: 请读取我上传的表格，识别时间字段和核心指标，选择合适的折线图或组合图展示趋势、增长和异常变化，并生成可交互、可下载的 HTML 图表。若字段含义不明确，请先向我确认。
    replay:
      steps:
        - title: 读取数据结构
          description: 识别字段类型、时间范围、指标和缺失值
        - title: 选择图表方案
          description: 根据时间序列和指标关系确定图表类型与编码
        - title: 生成交互图表
          description: 构建带图例、提示和必要标注的 ECharts 页面
        - title: 核验与交付
          description: 检查数值映射、视觉可读性和下载能力
    result:
      template: generic_report_v1
      eyebrow: 趋势分析图
      title: 核心指标趋势与变化
      summary: 以交互图表呈现时间趋势、增长幅度和需要关注的异常节点
      highlights:
        - 时间序列与核心指标
        - 增长、波动和异常节点
        - 可交互与可下载 HTML

  - id: comparison-chart
    selector:
      title: 对比图表
      description: 比较多个类别、区域或产品的指标差异
      output_label: 对比分析图
    launch:
      prompt_short: 根据我上传的数据生成一份分类对比图表。
      prompt: 请读取我上传的表格，识别分类维度和数值指标，选择合适的柱状图、堆叠图或组合图进行对比，突出排名、差距和关键结论，并生成可交互、可下载的 HTML 图表。
    replay:
      steps:
        - title: 识别比较维度
          description: 确认类别、分组和需要比较的指标
        - title: 处理排序与聚合
          description: 按分析目标完成分组汇总、排序和单位统一
        - title: 生成对比图表
          description: 使用清晰的视觉编码突出差异和重点
        - title: 输出结论
          description: 总结排名、差距和业务上值得关注的发现
    result:
      template: generic_report_v1
      eyebrow: 对比分析图
      title: 分类指标对比与排名
      summary: 用交互图表呈现各分组的指标差异、排名和重点发现
      highlights:
        - 分类与指标映射
        - 排名和差距对比
        - 可交互与可下载 HTML

  - id: distribution-chart
    selector:
      title: 分布与构成
      description: 分析数据分布、占比和结构特征
      output_label: 分布分析图
    launch:
      prompt_short: 根据我上传的数据分析分布和构成。
      prompt: 请读取我上传的数据，判断适合分析的分布或构成关系，选择直方图、散点图、饼图或树图等合适形式，说明主要集中区间、占比和异常点，并生成可交互、可下载的 HTML 图表。
    replay:
      steps:
        - title: 检查数据特征
          description: 判断连续变量、分类变量及其取值分布
        - title: 选择视觉编码
          description: 根据分布或构成关系匹配合适图表
        - title: 标注关键发现
          description: 突出集中区间、主要占比和异常点
        - title: 生成交付文件
          description: 输出自包含的交互式 HTML 图表
    result:
      template: generic_report_v1
      eyebrow: 分布分析图
      title: 数据分布与结构洞察
      summary: 展示主要分布区间、类别构成和异常数据点
      highlights:
        - 分布区间与集中程度
        - 类别构成和占比
        - 异常点与进一步分析线索
