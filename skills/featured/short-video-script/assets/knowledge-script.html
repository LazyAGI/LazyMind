<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识类短视频脚本</title>
<style>:root{--ink:#172033;--muted:#667085;--accent:#5b63d3;--soft:#f0f1ff;--line:#e1e5ef}*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}.shell{max-width:1160px;margin:auto;padding:28px}.hero{padding:25px 30px;border-radius:20px;background:linear-gradient(135deg,#182238,#3f478f);color:#fff}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#dfe2ff}.visual{margin:18px 0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 12px 34px #18223818}.visual img{display:block;width:100%}.caption{padding:11px 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.card b{display:block;color:var(--accent);margin-bottom:5px}.quote{margin-top:15px;padding:16px 18px;border-radius:14px;background:var(--soft);font-weight:700}@media(max-width:720px){.shell{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head>
<body><main class="shell"><header class="hero"><h1>15 秒效率技巧 · 从混乱到清晰</h1><p>用可拍摄的三镜头演示“先归类，再排序，最后只保留下一步”</p></header>
<figure class="visual"><div style="aspect-ratio:16/9;overflow:hidden"><img src="{{asset_url:case_visual}}" alt="待办清单焦虑知识口播画面" style="display:block;width:300%;max-width:none;height:auto"></div><figcaption class="caption">成片画面参考：超长待办清单制造问题钩子，再进入整理方法与行动建议</figcaption></figure>
<section class="grid"><article class="card"><b>镜头 1 · 0–4 秒</b>桌面凌乱、窗口堆叠。口播：“事情越多，越别急着全部开始。”</article><article class="card"><b>镜头 2 · 4–11 秒</b>把任务拖入三列。口播：“先按今天、本周、等待别人归类。”</article><article class="card"><b>镜头 3 · 11–15 秒</b>镜头回到整洁桌面。口播：“每列只写一个下一步，焦虑就会变成动作。”</article></section>
<div class="quote">封面标题：任务太多时，先做这 3 列　·　字幕重点：归类 / 排序 / 下一步</div></main></body></html>
