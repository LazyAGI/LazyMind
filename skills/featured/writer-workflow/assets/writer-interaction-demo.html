const DRAFT=`# 迷雾中的低语
## 抵达与异象
雾气像一层黏稠的幕布笼罩着埃尔斯港。下了最后一班公共汽车后，林远站在空旷的公路旁，看着车尾灯消失在灰白的迷蒙中。这辆老旧的班车每周只有三班，而他要在下周一才能离开这个地方——如果那时候他还想离开的话。

他没有立刻去预订的住处，而是在镇口站了很久。雾气中，埃尔斯港的轮廓若隐若现：几座低矮的石砌建筑沿着海岸线排列，窗户里透出昏黄而微弱的灯光。空气中弥漫着海水的咸腥味，但奇怪的是，没有任何海浪拍岸的声音。这里安静得不像一个海滨小镇，甚至不像一个有人居住的地方。

踏入镇子的那一刻，林远注意到几个当地人正站在街角交谈。他们转过头看向他，目光中带着一种难以名状的情绪——不是好奇，不是警惕，而是某种更复杂的东西，仿佛在审视一个已经等待很久的人。

杂货店老板娘告诉他：“雾季提前了。你要是想画画，这倒是个好时候。”林远确实是个画家。这次来埃尔斯港，一半是寻找创作灵感，一半是想逃离让他窒息的都市生活。

海崖屋的石墙爬满暗绿色苔藓。真正吸引他注意的，是阁楼。阁楼里满是画布和画架。一本泛黄日记的扉页写着埃德加·莫里斯：它们在雾中等待，等待被看见。被看见是一种仪式。记住它们，就是喂养它们。

墙上的素描描绘着违反透视法则的建筑、由无数触手和眼睛组成的形体，以及仿佛用第四维度笔触绘制的形状。当他仔细辨认，总觉得有什么东西在画面深处注视着他。

凌晨三点，来自脚下的敲击声沉闷而有节奏。潮湿水痕沿砖缝蔓延，在灰泥表面形成一只正在睁开的眼睛。林远知道自己正在接近某种危险的边界。

## 调查与疯狂
图书馆档案室弥漫着陈年纸张的霉味。关于小镇历史的记载支离破碎。一篇八十年前大洪水的报道旁，手写批注透露：洪水并非自然灾害，而是一次“献祭”。幸存者名单里，韦恩这个姓氏重复出现超过二十次。

离开图书馆后，幻觉开始出现。街角出现本不该存在的建筑。起居室的镜子里，倒影保持着林远的站姿，却有错误的比例；当他侧身，倒影延迟半拍才跟上。

深夜，他追随敲击声推开走廊尽头从未注意过的门。楼梯尽头的砖墙随节奏移动，墙壁无声裂开，露出向下延伸的通道。两壁刻满无法辨认的符文。空气变得浓稠，手电筒光线开始弯曲，空间正以不可能的方式折叠。

## 深渊的回响
通道到了尽头，但“尽头”这个词在此刻显得如此可笑。符文微微颤动，散发暗淡磷光。然后我看见了它。

在磷光最深处，有一个形体。不是形状——形状暗示边界和轮廓，而这个东西没有边界。它既在眼前，又跨越无尽虚空。当我试图用目光丈量，意识仿佛要坠入无底深渊。

它在注视我。我的恐惧、记忆，在这种注视下毫无遮掩。它不是我之外的东西，它就在意识之中，在梦境与清醒的边界上。我的思维从来不是堡垒，它的存在本身就是为了被穿越、被占据。

我想起阁楼上画家的日记。那些关于雾中城市、海底居民的描写不是疯狂，而是一种警告。他也曾走过这条路，也许他的意识早已被吞噬，成为它永恒记忆的一部分。

而我体内也有东西在苏醒。它在等待被记住，等待被召唤。我的名字正是召唤它的咒语。我不再是“我”，只是漫长等待中的一个环节，一种记忆的载体。

意识开始模糊，像溺水，像坠入冰冷深海。最后一丝清醒中，我听见雾中有声音在呼唤，寻找下一个走进雾中的旅人。我的身体还站在入口处吗？我想知道。但我永远也不会知道了。

## 终章
雾在第三天早晨散去了一会儿。阳光短暂穿透云层，小镇钟楼敲响十二下。然后雾回来了。它更浓、更稠，带着咸涩海水气息和说不清的腐败味道。

没有人提起失踪的房客。镇公所档案里多了一张登记表，少了一个名字。阁楼上的日记仍在原处，等待下一个发现它的人。

镇外公路上，一辆锈迹斑斑的轿车缓缓驶来。年轻女人打开车窗，让雾气涌入车内。她觉得浓雾、寂静和被遗忘的历史，会是完美的故事素材。

她在镇口路标前停下车，浓雾立刻将她包裹。她不知道自己已经被看见了。

## 抵达与异象

雾气像一层黏稠的幕布笼罩着埃尔斯港。下了最后一班公共汽车后，林远站在空旷的公路旁，看着车尾灯消失在灰白的迷蒙中。这辆老旧的班车每周只有三班，而他要在下周一才能离开这个地方——如果那时候他还想离开的话。

他没有立刻去预订的住处，而是在镇口站了很久。雾气中，埃尔斯港的轮廓若隐若现：几座低矮的石砌建筑沿着海岸线排列，窗户里透出昏黄而微弱的灯光。空气中弥漫着海水的咸腥味，但奇怪的是，没有任何海浪拍岸的声音。这里安静得不像一个海滨小镇，甚至不像一个有人居住的地方。

踏入镇子的那一刻，林远注意到几个当地人正站在街角交谈。当他的脚步声响起，那些交谈戛然而止。他们转过头看向他，目光中带着一种难以名状的情绪——不是好奇，不是警惕，而是某种更复杂的东西，仿佛在审视一个已经等待很久的人。然后他们移开视线，继续低声说着什么，手指不安地绞在一起。

他试图和杂货店的老板娘搭话，想问问这个季节为什么游客这么少。女人大约五十多岁，脸上刻满风霜的痕迹。她听到这个问题时，手里的动作停顿了一瞬，然后继续整理货架，始终没有正面看他。

“雾季提前了，”她终于开口，声音沙哑，“你要是想画画，这倒是个好时候。”

“画画？”

“上一个租海崖屋的人也是画画的。”她抬起头，目光与林远相触，又迅速移开，“你也是来画画的吧？”

林远没有否认。他确实是个画家，虽然最近几个月都没有完成任何作品。这次来埃尔斯港，一半是为了寻找创作灵感，一半是想逃离让他窒息的都市生活。老板娘提到的海崖屋，正是他通过邮件预订的住所，据说曾是一位知名画家的故居。

穿过几条狭窄的巷子，林远找到了那栋房子。它比照片中看起来更加古老，石墙上爬满暗绿色的苔藓，木质窗框因潮湿而微微变形。屋内的陈设保留着几十年前的风格，家具上蒙着薄薄的灰尘，但一切都被收拾得井井有条，似乎有人定期打理。

然而真正吸引他注意的，是阁楼。

阁楼的门虚掩着。当他推开门，一股混合着霉味和某种说不清的气息扑面而来。光线从老虎窗斜射进来，照亮了满地的画布和画架。墙上挂着几十幅未完成的素描，地面上散落着速写本和炭笔。

林远蹲下身，随手翻开一本泛黄的日记。字迹潦草而急促，似乎是在极度亢奋或恐惧的状态下写下的。扉页上写着主人的名字：埃德加·莫里斯，一个他从未听说过的画家。

日记的内容断断续续，夹杂着对某种“形状”和“声音”的描述。林远无法完全理解其中的含义，但有几段文字让他感到不安：

*它们在雾中等待，等待被看见。被看见是一种仪式。记住它们，就是喂养它们。*

*那些城市不在任何地图上，它们存在于几何之外。我试图画下它们的轮廓，但每画一笔，就感觉自己的意识被拉伸、被扭曲。*

*我听到了来自地下的声音。不是敲击，而是某种节奏，像心跳，但比心跳更古老、更深邃。*

林远放下日记，目光落在墙上的素描。那些画描绘的是某种他从未见过的东西——扭曲的、不可能存在的建筑，它们违反了所有透视法则；巨大的、由无数触手和眼睛组成的形体；以及一些他根本无法描述的形状，仿佛是用第四维度的笔触绘制的。

最让他困扰的是那些城市轮廓。它们看起来既像是水下建筑，又像是某种有机体的表面。细节越丰富，整体就越令人不安。当他试图仔细辨认某个局部时，总感觉有什么东西在画面深处注视着他。

那天晚上，林远躺在陌生的床上辗转难眠。月光穿过雾气，在天花板上投下朦胧的光斑。凌晨三点左右，他听到了一个声音——来自脚下的敲击声，沉闷而有节奏，像是有什么东西在墙壁内部移动。

他起身查看，声音似乎从四面八方传来，又似乎根本不存在于任何方向。然后他注意到墙壁渗出了水痕。潮湿的痕迹沿着砖缝蔓延，在灰泥表面形成一幅诡异的图案——那是一只眼睛的形状，或者更准确地说，是一只正在睁开的眼睛。

林远盯着那只墙壁上的眼睛看了很久，直到敲击声停止，直到晨光开始穿透雾气。他试图说服自己那只是老房子潮湿造成的巧合，但脑海中不断浮现阁楼上那些素描的影子，那些扭曲的城市轮廓，那些不可名状的形体。

他知道自己不会在埃尔斯港找到想要的灵感。相反，他正在接近某种危险的边界——一个他或许不该跨越的门槛。

## 调查与疯狂

图书馆的档案室弥漫着陈年纸张的霉味。主角在落满灰尘的架子上翻找，关于小镇历史的记载支离破碎——许多页码被撕去，剩下的文字也因潮汐侵蚀而模糊难辨。

在几份残存的地方报纸中，一篇关于八十年前大洪水的报道引起注意。报道本身已残缺，但旁边的手写批注透露了真相：洪水并非自然灾害，而是一次“献祭”。幸存者名单被刻意保留下来，主角逐一审视那些名字，注意到一个令人不安的模式——韦恩、韦恩、韦恩，同样的姓氏在名单上重复出现，超过二十次。

名单上其他姓氏寥寥无几，仿佛那场洪水只为韦恩家族留下生路。

离开图书馆后，幻觉开始出现。街角出现一座本不该存在的建筑，轮廓扭曲得违反建筑法则。主角眨眼的瞬间，街景完全改变，或者完全消失。起初他以为是疲惫和失眠作祟，直到在起居室的镜子前看到倒影。

那不是镜中的自己。那个轮廓保持着主角的站姿，却有着错误的比例，像是某种拙劣的复制品。当主角侧身时，倒影延迟了半拍才跟上。更令人不安的是，倒影的头部开始缓慢地、不可名状地变形，仿佛在嘲笑他的恐惧。那一刻他才意识到，已经很久没有仔细端详自己的脸了。

那天深夜，主角在阁楼被一阵有节奏的敲击声惊醒。声音从地板下方传来——不是来自楼上，而是脚下的泥土深处，仿佛有什么东西正缓慢地向上敲打。他握紧手电筒，赤脚站在走廊冰冷的木地板上，追随那规律的敲击声。

敲击声引导他穿过走廊，推开尽头那扇从未注意过的门。门后是一段向下的楼梯，通向地下室的通道。楼梯的尽头被一堵看似普通的砖墙挡住，但主角发现墙面有一块砖的间隙与敲击声的节奏同步移动。当他用力按下时，墙壁无声地裂开，露出一条向下延伸的黑暗通道。

通道很窄，他只能侧身挤入。两侧墙壁上刻满无法辨认的符文，它们既不是任何已知的文字，也看不出任何规律，只是重复着某种令人不安的节奏。随着他越走越深，空气变得浓稠，每一次呼吸都变得艰难。手电筒的光线开始弯曲，不再沿直线照射，而是在他周围形成诡异的阴影。他感到空间本身在扭曲，墙壁与天花板的位置感逐渐消失，仿佛整个通道正在以不可能的方式折叠。

## 深渊的回响

通道到了尽头，但“尽头”这个词在此刻显得如此可笑。

空气变得稠密，几乎如同液体，而那些刻在墙壁上的符文——如果它们还能被称作符文的话——似乎在微微颤动，散发出暗淡的磷光。那光芒不是来自任何光源，而是来自某种超越视觉的本质。光线在这里弯曲，仿佛空间本身正在承受着什么巨大的压力。我能感受到周围的石壁在颤抖，但这种颤抖不是物理性的，而是某种更深层的震动，直接作用于意识本身。

然后我看见了它。

在通道的尽头，在磷光的最深处，有一个形体。不是形状——形状暗示着边界和轮廓，而这个东西没有边界，没有轮廓，或者说它的边界和轮廓超出了我能理解的维度。它就在那里，既在我眼前，又跨越无尽的虚空。我无法描述它的大小，因为当我试图用目光丈量它时，我的意识开始眩晕，仿佛要坠入某个无底的深渊。

我只能感受到它的存在。那是一种压倒性的存在，一种超越了肉体感官的认知。它是巨大的——不，“巨大”这个词太过渺小。它是无限与有限的矛盾体，是在此刻与永恒之间摇摆的扭曲。它是活的，它在注视着我，而那种注视比任何实质的形体都更加可怕。

因为我突然意识到，我的一切都被它看透了。不是身体上的，而是意识层面的。我脑海中浮现的所有画面、所有的恐惧、所有的记忆——它们在这个存在的注视下毫无遮掩。它不是我之外的东西，它就在我的意识之中，在我的记忆深处，在我的梦境与清醒的边界上。它在延伸我，在窥探我，而我无法阻止。

那种被窥探的感觉令人窒息。不是被监视的不适，而是彻底的暴露，是意识边界的消融。我曾以为我的思维是一座堡垒，是我最后的私密空间。但现在我发现，这座堡垒从来就不存在。或者说，它的存在本身就是为了被这个存在所穿越、所占据。

我想起了阁楼上那位画家的日记。那些关于雾中的城市、关于海底居民的描写，那些扭曲的画面和不可名状的素描——我一直以为那是疯狂的呓语，是某种精神疾病的症状。现在我明白了，那不是疯狂，那是一种警告，一种指引。他也曾走过这条路，也曾站在我现在站的地方。也许他逃脱了，也许他没有——也许他的意识早已被这个存在所吞噬，成为它永恒记忆的一部分。

而我体内也有东西在苏醒。不是记忆——是另一种意识，另一种存在。它在我的脑海中蠕动，像是一只潜伏在深渊中的生物，终于感知到了猎物的靠近。我想起了日记中反复出现的那句话：它在等待，等待被记住，等待被召唤。而我——不，是我的名字，那个在日记扉页上被我无意间读到又在无意间忘记的名字——我的名字正是召唤它的咒语。

我的名字被找到了，被使用了，被覆盖了。我不再是“我”，我只是这个存在漫长等待中的一个环节，一种记忆的载体，一段尚未完成的叙事。我感到自己的身份正在被改写，而我却无能为力。

然后我感到了拉扯。

不是物理性的拉扯，而是某种更深层的东西正在从我的身体中被抽离。那是意识，那是自我，那是“我”这个概念本身。它正在被拖向深渊，拖向那个跨越虚空的巨大形体，而我只能眼睁睁地看着自己消亡。

不，不完全是我。我的一部分还在——我的身体还在通道入口处，我还能感觉到冰冷的石壁在我的指尖，我还能听见远处雾中的风声。但另一部分，那个我一直以为是“我”的部分，正在脱离，正在坠入。

我试图抵抗，但我发现抵抗本身就是它的一部分。我的每一次挣扎都在喂养它，在加速我的消亡。也许这就是那位画家的命运。也许他也曾站在这里，试图抗拒，最终被吞噬。而他留下那些日记，不是为了警告后人，而是为了传递记忆，为了让自己的一部分能够延续。而我，就是他传递的最后一块碎片。

意识开始模糊了。模糊得不像是睡眠，而像是溺水，像是坠入冰冷的深海。我无法分辨上下左右，无法分辨过去与未来，只有那个形体还在我的意识深处，跨越虚空，永恒地存在着。

在最后一丝清醒中，我听见了什么。不是来自深渊，而是来自通道的入口，来自我身体所在的地方。雾中有声音在呼唤。不是画家的名字，也不是我的名字，而是某种更古老的声音，在等待，在寻找，寻找下一个会走进雾中的旅人。

我的身体还站在入口处吗？还是它已经被雾吞噬，只剩下一具空洞的皮囊？

我想知道。

但我永远也不会知道了。

## 终章

雾在第三天早晨散去了一会儿。阳光短暂地穿透云层，在碎石路面上投下苍白的光斑，像是什么遗忘已久的东西偶然浮出水面。小镇的钟楼在雾气消退的间隙里敲响了十二下，声音空洞而遥远，仿佛来自另一层现实。

然后雾回来了。

它比之前更浓，更稠，带着咸涩的海水气息和某种说不清的腐败味道。人们重新回到街上，步履匆匆，面孔模糊。他们经过那栋旧宅时，目光会不由自主地掠过那扇紧闭的门窗，然后加快脚步。没有人提起失踪的房客，就像没有人提起那些消失在前几个十年里的人一样。镇公所的档案里多了一张登记表，少了一个名字。阁楼上的日记仍在原处，素描本摊开在某幅未完成的图画前，等待着下一个发现它的人。

镇外的公路上，一辆锈迹斑斑的老式轿车正沿着蜿蜒的山道缓缓驶来。驾驶座上的年轻女人打开车窗，让雾气涌入车内。她眯起眼睛望向远处若隐若现的屋顶轮廓，嘴角浮现一丝好奇的微笑。她在找一间出租的老宅，她在信中读到过关于这地方的描述——浓雾、寂静、和一段被遗忘的历史。她觉得那会是完美的素材，适合她正在构思的那个故事。

雾气越来越浓，车灯在白色中切开一道昏黄的光路。收音机里原本清晰的电台信号开始变得模糊，取而代之的是一阵低沉的嗡鸣声，像是有什么东西在很远很远的地方回应着。她的手指在方向盘上轻轻敲动，心跳莫名加快，却说不出为什么。

她在镇口的路标前停下车。路标上爬满藤蔓，字迹几乎无法辨认。她下了车，浓雾立刻将她包裹。她抬头望向雾气深处，望向那座沉默的小镇，望向那些她还不知道名字的街道和房屋。

她不知道自己已经被看见了。

在旧宅的阁楼里，在那些摊开的素描本之间，有一张脸正在慢慢浮现。那张脸有着和她相似的轮廓，正缓缓融入纸张的纤维之中，仿佛从未存在过，却永远会在那里，等待被下一双眼睛发现。

而镇外的雾中，一个新的名字正在被低声念出。
