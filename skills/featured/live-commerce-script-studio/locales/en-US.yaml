locale: en-US
classification: {category: Content Marketing & Social Media, tags: [live commerce, host script, compliance]}
presentation:
  card: {title: "Live Commerce Script Studio", description: "Turn product-lineup facts into a ready-to-read live-show runbook and script", output_type: "document", output_label: "Live script", cover_asset: "cover", result_summary: "Three show plans with talk tracks and compliance boundaries"}
  detail: {title: "Live Commerce Script Studio", description: "Builds timed plans, seven-step product talk tracks, and compliance checks from merchant-provided facts. Paid media cards and voice samples require explicit approval.", attachment_hint: "Platform, duration, lineup, specifications, regular price, and live price"}
tasks:
  - id: blender-launch
    selector: {title: "Portable blender launch", description: "Plan a three-hour launch for a first-time host", output_label: "Runbook and talk track"}
    launch: {prompt_short: "Write a three-hour Douyin launch script for a 400ml portable blender: regular ¥129, live ¥89, USB-C, about six blends per charge; stock is unknown.", prompt: "Write a 20:00–23:00 Douyin self-hosted launch script for a first-time host selling a 400ml portable blender. It has USB-C charging for about six blends, a linked inspection report, regular price ¥129 and live price ¥89; stock is not counted. Output a timed plan, seven-step talk track, read-aloud lines, and compliance check. Do not invent stock or health claims."}
    replay: {steps: [{title: "Confirm merchant facts", description: "Use only supplied specifications, price, timing, and host information"}, {title: "Plan the session", description: "Allocate warm-up, featured product, and return segments across three hours"}, {title: "Write and screen talk", description: "Draft the seven-step talk track and remove unsupported or prohibited claims"}]}
    result: {template: "html_preview_v1", eyebrow: "Launch case", title: "Three-hour portable blender live script", summary: "Written planning and compliance review; paid media generation was not requested.", html_asset: "blender_session"}
  - id: skincare-routine
    selector: {title: "Skincare-set launch", description: "Build a two-hour video-channel show from supplied facts", output_label: "Runbook and talk track"}
    launch: {prompt_short: "Create a two-hour Video Account script for a hydrating set with cleanser, serum, cream, ¥299 regular, ¥239 live, and 80 sets in stock.", prompt: "Create a 19:00–21:00 brand-hosted Video Account launch script for a hydrating set with cleanser, serum, and cream. The merchant provides only the “hyaluronic-acid hydration” positioning, regular price ¥299, live price ¥239, and stock of 80. Output plan, seven-step talk, engagement and urgency lines, plus a compliance review; do not invent concentration, clinical data, or treatment effects."}
    replay: {steps: [{title: "Set fact boundaries", description: "Limit statements to supplied components, positioning, price, and stock"}, {title: "Arrange conversion stages", description: "Place introduction, engagement, price, and stock cues across two hours"}, {title: "Rewrite for compliance", description: "Remove treatment claims and unsupported efficacy statements"}]}
    result: {template: "html_preview_v1", eyebrow: "Brand launch case", title: "Two-hour hydrating-set session", summary: "Runbook, talk track, and compliance boundaries based on merchant facts.", html_asset: "skincare_session"}
  - id: clearance-homeware
    selector: {title: "Homeware clearance return", description: "Structure urgency and closing for verified clearance stock", output_label: "Clearance talk track"}
    launch: {prompt_short: "Write a 90-minute Kuaishou clearance script for a 500ml stainless-steel tumbler: ¥99 regular, ¥59 clearance, 36 in stock.", prompt: "Write a 90-minute Kuaishou creator-collaboration clearance return for a 500ml stainless-steel insulated tumbler. Regular price ¥99, clearance price ¥59, stock 36; no retention-time or grade is supplied. Generate a timed plan, seven-step talk, stock urgency and closing lines, and screen superlatives and unsupported functions."}
    replay: {steps: [{title: "Read clearance constraints", description: "Use only verified capacity, price, and inventory"}, {title: "Structure return pacing", description: "Allocate explanation, interaction, inventory reminders, and closing across 90 minutes"}, {title: "Screen sales language", description: "Keep real inventory cues while removing lowest-price and unsupported performance claims"}]}
    result: {template: "html_preview_v1", eyebrow: "Clearance case", title: "500ml tumbler clearance return", summary: "Verified inventory supports urgency; unspecified performance is not promised.", html_asset: "clearance_session"}
