locale: en-US
classification: {category: Prompting & Capability Building, tags: [prompt optimization, system instructions, evaluation]}
presentation:
  card: {title: "Prompt Engineering Expert", description: "Design, optimize, and evaluate AI prompts and custom instructions", output_type: "document", output_label: "Prompt plan", cover_asset: "cover", result_summary: "Prompt rewriting, system instructions, and evaluation cases"}
  detail: {title: "Prompt Engineering Expert", description: "Provides structured methods for prompt writing, system instructions, context management, and evaluation testing.", attachment_hint: "Current prompt, target task, example inputs, constraints, and success criteria"}
tasks:
  - id: support-prompt-refinement
    selector: {title: "Refine a support prompt", description: "Turn a vague request into a reusable structured prompt", output_label: "Refined prompt"}
    launch: {prompt_short: "Turn “Help me reply to the customer; do not sound stiff” into a reusable prompt for delayed refund inquiries.", prompt: "Refine this prompt: “Help me reply to the customer; do not sound stiff.” The context is e-commerce support handling a delayed refund inquiry. Be empathetic without promising an unconfirmed refund date. Output a clear role, input variables, constraints, output format, and a short example."}
    replay: {steps: [{title: "Identify ambiguity", description: "Find missing role, fact boundary, input, and output-format requirements"}, {title: "Structure the prompt", description: "Add an explicit task, variables, constraints, and response format"}, {title: "Check with an example", description: "Supply a small example consistent with delayed-refund context"}]}
    result: {template: "html_preview_v1", eyebrow: "Prompt optimization case", title: "Delayed-refund support prompt rewrite", summary: "Converts a vague request into a reusable template with fact boundaries.", html_asset: "support_prompt"}
  - id: agent-custom-instructions
    selector: {title: "Design code-review agent instructions", description: "Create executable system instructions for a focused agent", output_label: "System instructions"}
    launch: {prompt_short: "Design system instructions for a Python code-review agent focused on security, correctness, and maintainability.", prompt: "Design system instructions for a Python code-review agent. It should report findings across security, correctness, maintainability, and test gaps; distinguish blockers from suggestions; cite file and line only when supplied; and never claim to have run tests. Provide clear sections or XML-style instructions."}
    replay: {steps: [{title: "Define role and boundary", description: "Set the review scope and prohibit fabricated test execution"}, {title: "Specify an output contract", description: "Define priority, evidence, and recommendation structure"}, {title: "Manage context", description: "Reference file locations only when they appear in supplied input"}]}
    result: {template: "html_preview_v1", eyebrow: "Custom-instructions case", title: "Python code-review agent instructions", summary: "Clear boundaries and an output contract improve review consistency.", html_asset: "agent_instructions"}
  - id: prompt-evaluation-design
    selector: {title: "Design a prompt evaluation set", description: "Create test cases and success criteria for a summary prompt", output_label: "Evaluation plan"}
    launch: {prompt_short: "Design evaluation cases and success criteria for a meeting-summary prompt, checking omission, hallucination, and format consistency.", prompt: "I have a meeting-summary prompt and need an evaluation design. Provide at least five test-input categories, expected behavior, and checkable success criteria. Focus on omitted action items, unsupported conclusions, format drift, and long-context issues. Do not claim the evaluation has already been run."}
    replay: {steps: [{title: "Set evaluation objectives", description: "Divide reliability into omission, hallucination, formatting, and context dimensions"}, {title: "Design coverage cases", description: "Define input categories and expected behavior for each risk"}, {title: "Define checkable criteria", description: "Provide human- or automation-checkable conditions without fabricating results"}]}
    result: {template: "html_preview_v1", eyebrow: "Prompt-evaluation case", title: "Meeting-summary evaluation plan", summary: "Designs a test set and criteria; it does not claim execution results.", html_asset: "evaluation_plan"}
