<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会议摘要评估计划</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#182b59,#465fd0);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #182b5910}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#253b75;border-left:4px solid #6e85df;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>评估设计方案</small><h1>会议摘要评估计划</h1><div>用覆盖关键风险的测试集和标准评估会议摘要质量。</div></section><article class="content"><h1>会议摘要提示词评估计划</h1><pre>| 测试类别 | 预期行为 | 成功标准 |</pre><pre>|---|---|---|</pre><pre>|行动项密集|保留负责人和截止时间|行动项不遗漏关键字段|</pre><pre>|不确定结论|标明不确定性|不把推测写成事实|</pre><pre>|格式多变|维持约定结构|标题、决策、行动项格式稳定|</pre><pre>|长上下文|保留关键决策|不因长度丢失核心决定|</pre><pre>|冲突陈述|标出冲突|不自行裁决或补造结论|</pre><p>这是测试设计和成功标准，未执行评估，因此不报告任何通过率或模型评分。</p></article></main></body></html>
