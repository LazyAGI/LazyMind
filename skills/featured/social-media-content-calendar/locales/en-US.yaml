    prompt_short: Create a lightweight, executable week for a solo operator
    prompt: Create a seven-day content calendar for an AI-tools account targeting product managers. The solo operator has
      at most 90 minutes per day and publishes on Xiaohongshu and WeChat. Include pillars, daily topics, platform variants,
      assets, cadence, and review metrics.
  replay:
    steps:
    - title: Understand the goal
      description: Identify the audience, scenario, constraints, and expected deliverable
    - title: Structure the approach
      description: Apply the Skill framework to break down the task
    - title: Create the content
      description: Produce a result ready for the target platform or workflow
    - title: Check the delivery
      description: Verify completeness, actionability, and factual boundaries
  result:
    template: html_preview_v1
    eyebrow: Content operations calendar
    title: Seven-day content calendar
    summary: Create a lightweight, executable week for a solo operator; the page is a reproducible sample preview.
    html_asset: seven_day_calendar_demo
