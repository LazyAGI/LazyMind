<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7 天内容排期</title>
<style>:root{--ink:#15243b;--muted:#68758a;--accent:#148f8a;--soft:#eaf8f6;--line:#dde5ec}*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}.shell{max-width:1160px;margin:auto;padding:28px}.hero{padding:25px 30px;border-radius:20px;background:linear-gradient(135deg,#13334b,#137f78);color:#fff}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#d8f5f2}.visual{margin:18px 0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 12px 34px #13334b18}.visual img{display:block;width:100%}.caption{padding:11px 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff}.card b{display:block;color:var(--accent);margin-bottom:4px}.foot{margin-top:14px;padding:15px 17px;border-radius:14px;background:var(--soft)}@media(max-width:760px){.shell{padding:14px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}}</style></head>
<body><main class="shell"><header class="hero"><h1>AI 工具账号 · 7 天跨平台排期</h1><p>小红书负责发现与收藏，公众号负责解释与沉淀；每天投入不超过 90 分钟</p></header>
<figure class="visual" style="width:100%;max-width:560px;margin:18px auto"><img src="{{asset_url:seven_day_calendar_visual}}" alt="七天跨平台内容排期看板" style="display:block;width:100%;height:auto"><figcaption class="caption">完整周排期视图：日期、渠道、素材、主题和关键指标按天对齐</figcaption></figure>
<section class="grid"><article class="card"><b>周一</b>需求文档反复改｜小红书 6 页清单｜看收藏率</article><article class="card"><b>周二</b>提问前补齐 5 字段｜公众号短文｜看读完率</article><article class="card"><b>周三</b>一分钟改写需求｜小红书录屏｜看完播率</article><article class="card"><b>周四</b>AI 答非所问拆解｜公众号案例｜看停留</article><article class="card"><b>周五</b>本周工具工作流｜流程卡｜看主页访问</article><article class="card"><b>周六</b>读者问题答疑｜双平台问答｜看有效提问</article><article class="card"><b>周日</b>一周复盘投票｜数据截图｜看关注转化</article><article class="card"><b>每日预算</b>选题 15m · 制作 50m · 互动 25m</article></section>
<div class="foot">同一主题跨平台重写结构，不直接复制正文；周日按“保留 / 停止 / 实验”更新下一周期。</div></main></body></html>
