schema_version: 2
id: structured-longform-writing
type: chat
version: 1.0.0
status: published
default_locale: zh-CN

skill:
  source_url: https://github.com/xiaoyanZzz/LazyRAG/archive/c14a2be347251fe4a497d265e1863d958c5dd832.zip
  required_version: 1.0.0

placement:
  home: true
  gallery: true
  order: 11

classification:
  category: 写作创作
  tags:
    - 长文写作
    - 报告方案
    - 专业文档

assets:
  cover:
    file: assets/cover.png
    role: cover

presentation:
  card:
    title: 结构化长文写作
    description: 将零散材料与想法整理为结构清晰、证据谨慎、可直接使用的专业长文
    output_type: document
    output_label: 专业长文
    cover_asset: cover
    result_summary: 从目标、材料和受众出发，完成大纲、正文、审校与可执行结论
  detail:
    title: 结构化长文写作
    description: 面向报告、方案、PRD、技术文档和专业文章，先澄清目标与受众，再组织证据、搭建结构、逐节撰写并完成质量审校。
    attachment_hint: 参考资料、网页、会议记录、数据或现有草稿（可选）

tasks:
  - id: report-writing
    selector:
      title: 分析报告
      description: 将资料整理为有框架、有发现、有结论和建议的专业报告
      output_label: 分析报告
    launch:
      prompt_short: 根据我提供的资料，撰写一份结构严谨、结论清晰的分析报告。
      prompt: 请根据我提供的主题、资料和目标读者撰写一份专业分析报告。先识别分析问题、边界和证据缺口，再形成大纲并完成正文；请区分事实、判断和假设，给出关键发现、结论、建议以及待补充信息。若缺少会显著改变方向的关键资料，请集中询问一次。
    replay:
      steps:
        - title: 明确问题与受众
          description: 确认报告目标、读者、范围和需要支持的决策
        - title: 整理材料与证据
          description: 区分事实、判断、假设和仍需补充的信息
        - title: 设计分析结构
          description: 形成服务于核心问题的分析框架和章节大纲
        - title: 撰写并质量审校
          description: 完成正文、结论和建议，并检查逻辑、事实与可读性
    result:
      template: generic_report_v1
      eyebrow: 分析报告
      title: 结构化分析报告
      summary: 形成有问题边界、证据、关键发现、结论和行动建议的完整报告
      highlights:
        - 清晰的分析问题与边界
        - 可追溯的事实、判断和假设
        - 面向决策的结论与建议

  - id: proposal-planning
    selector:
      title: 方案与规划
      description: 将目标和约束转化为可落地的建设方案、实施计划或改进规划
      output_label: 实施方案
    launch:
      prompt_short: 围绕我的目标和约束，撰写一份可落地、可验收的实施方案。
      prompt: 请根据我提供的背景、目标、约束和现有材料撰写一份可落地的方案或规划。说明问题与目标、范围边界、核心设计、阶段路径、资源依赖、风险应对和验收标准；不要用空泛价值表述替代具体动作。若关键约束缺失，请先集中询问。
    replay:
      steps:
        - title: 定义目标与边界
          description: 明确要解决的问题、成功标准、范围和约束
        - title: 设计核心方案
          description: 给出关键模块、机制、取舍和依赖关系
        - title: 规划落地路径
          description: 拆分阶段、里程碑、责任和交付物
        - title: 补齐风险与验收
          description: 检查风险、应对措施和可验证的完成标准
    result:
      template: generic_report_v1
      eyebrow: 实施方案
      title: 可落地的建设与实施方案
      summary: 形成目标明确、边界清楚、路径可执行并可验收的完整方案
      highlights:
        - 明确的目标、范围与取舍
        - 分阶段实施路径与依赖
        - 风险应对和验收标准

  - id: product-technical-document
    selector:
      title: PRD 与技术文档
      description: 输出供产品、研发和测试协作执行的需求或技术设计文档
      output_label: 产品技术文档
    launch:
      prompt_short: 根据我的需求和约束，撰写一份完整的 PRD 或技术设计文档。
      prompt: 请根据我提供的用户问题、业务目标、需求、技术背景和约束，撰写一份可用于评审和协作执行的 PRD 或技术设计文档。请明确目标、非目标、场景、流程、功能或模块、异常边界、指标、风险和验收方式；根据任务类型选择合适结构，不要机械套用模板。
    replay:
      steps:
        - title: 澄清需求与约束
          description: 识别用户问题、业务目标、技术条件和非目标
        - title: 设计文档结构
          description: 根据 PRD 或技术设计目标组织流程、功能和模块
        - title: 补齐边界与指标
          description: 明确异常场景、性能质量要求、指标和依赖
        - title: 完成评审稿
          description: 输出可供产品、研发和测试共同评审的完整文档
    result:
      template: generic_report_v1
      eyebrow: 产品技术文档
      title: 可评审的 PRD 或技术设计文档
      summary: 将需求和约束转化为目标、流程、功能、边界和验收一致的协作文档
      highlights:
        - 目标、非目标与使用场景
        - 流程、功能或技术模块设计
        - 异常边界、指标与验收方式

  - id: professional-article
    selector:
      title: 专业文章
      description: 将观点和材料写成自然、有论证、有读者价值的博客或文章
      output_label: 专业文章
    launch:
      prompt_short: 围绕我的主题和观点，撰写一篇自然、有洞见的专业文章。
      prompt: 请根据我提供的主题、核心观点、目标读者和参考材料撰写一篇专业博客或文章。用清晰的问题意识组织开头，以材料、解释和案例支撑观点，保持自然表达并避免模板化套话；结尾应收束核心判断，并给读者留下可操作或可迁移的认识。
    replay:
      steps:
        - title: 提炼中心观点
          description: 明确文章要回答的问题、读者和核心判断
        - title: 设计论证路径
          description: 组织材料、解释、案例和章节之间的逻辑推进
        - title: 完成自然表达
          description: 逐节写作，减少套话、重复和说明书式表达
        - title: 审校并收束
          description: 检查论证、事实、节奏和结尾的读者价值
    result:
      template: generic_report_v1
      eyebrow: 专业文章
      title: 有观点、有论证的专业文章
      summary: 形成中心观点清晰、论证完整、表达自然并面向目标读者的文章
      highlights:
        - 清晰的问题意识与中心观点
        - 材料、解释和案例构成的论证
        - 自然表达与有价值的结尾
