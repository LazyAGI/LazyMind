        .style-features { color: #666; font-size: 15px; line-height: 1.8; margin-bottom: 16px; }

        .cover-grid a { width: 180px; height: 77px; border-radius: 6px; overflow: hidden; display: block; }
        .cover-grid img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .divider { border: none; border-top: 2px dashed #e8e8e8; margin: 40px 0; }
        .plan-card { background: #fafafa; border-radius: 12px; padding: 24px; margin: 25px 0; border: 2px solid #1890ff; }
        .plan-card h2 { font-size: 20px; font-weight: 600; color: #1890ff; margin-bottom: 12px; }
        .plan-core { color: #52c41a; font-weight: 500; margin: 10px 0; font-size: 16px; }
        .plan-card h3 { color: #333; margin: 20px 0 15px; font-size: 18px; }
        .case-ref { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 20px; margin: 15px 0; display: flex; gap: 20px; align-items: flex-start; }
        .case-ref .cover-wrap { width: 300px; height: 128px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: block; flex-shrink: 0; }
        .case-ref .cover-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
        .case-ref .info { flex: 1; }
        .case-ref .info .title a { color: #1890ff; text-decoration: none; font-weight: 500; font-size: 18px; }
        .case-ref .info .author { color: #666; font-size: 14px; margin: 8px 0; }
        .case-ref .info .reads { display: inline-block; background: #fff7e6; color: #fa8c16; padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; }
        .prompt-box { background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px; padding: 16px; margin: 20px 0; }
        .prompt-box .label { color: #52c41a; font-weight: 600; margin-bottom: 8px; }
        .prompt-box .content { color: #333; font-size: 14px; line-height: 1.8; background: #fff; padding: 12px; border-radius: 4px; word-break: break-all; }
        .select-area { background: #fafafa; border-radius: 12px; padding: 24px; margin: 20px 0; border: 1px solid #e8e8e8; }
        .select-area h2 { margin: 0 0 16px; font-size: 20px; color: #1890ff; }
        .select-area .options { font-size: 15px; line-height: 2; color: #333; }
        .select-area .options .option { margin-bottom: 8px; }
