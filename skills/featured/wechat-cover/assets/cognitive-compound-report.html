<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>爆款封面分析报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1.report-title { color: #1a1a1a; margin-bottom: 30px; font-size: 28px; border-bottom: 3px solid #1890ff; padding-bottom: 15px; }
        .info-bar { background: #e6f7ff; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .info-bar strong { color: #1a1a1a; }
        .style-card { background: #fafafa; border-radius: 12px; padding: 24px; margin: 20px 0; border: 1px solid #e8e8e8; }
        .style-name { font-size: 20px; font-weight: 600; color: #1890ff; margin-bottom: 8px; }
        .style-freq { display: inline-block; background: #e6f7ff; padding: 4px 12px; border-radius: 4px; font-size: 14px; color: #1890ff; margin-bottom: 12px; }
        .style-core { color: #52c41a; font-weight: 500; margin: 12px 0; }
        .style-features { color: #666; font-size: 15px; line-height: 1.8; margin-bottom: 16px; }
        .cover-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
        .cover-grid a { width: 180px; height: 77px; border-radius: 6px; overflow: hidden; display: block; }
        .cover-grid img { width: 100%; height: 100%; object-fit: cover; object-position: center; }
        .divider { border: none; border-top: 2px dashed #e8e8e8; margin: 40px 0; }
        .plan-card { background: #fafafa; border-radius: 12px; padding: 24px; margin: 25px 0; border: 2px solid #1890ff; }
        .plan-card h2 { font-size: 20px; font-weight: 600; color: #1890ff; margin-bottom: 12px; }
        .plan-core { color: #52c41a; font-weight: 500; margin: 10px 0; font-size: 16px; }
        .plan-card h3 { color: #333; margin: 20px 0 15px; font-size: 18px; }
        .case-ref { background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; padding: 20px; margin: 15px 0; display: flex; gap: 20px; align-items: flex-start; }
        .case-ref .cover-wrap { width: 300px; height: 128px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: block; flex-shrink: 0; }
        .case-ref .cover-wrap img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
        .case-ref .info { flex: 1; }
        .case-ref .info .title a { color: #1890ff; text-decoration: none; font-weight: 500; font-size: 18px; }
        .case-ref .info .author { color: #666; font-size: 14px; margin: 8px 0; }
        .case-ref .info .reads { display: inline-block; background: #fff7e6; color: #fa8c16; padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; }
        .prompt-box { background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px; padding: 16px; margin: 20px 0; }
        .prompt-box .label { color: #52c41a; font-weight: 600; margin-bottom: 8px; }
        .prompt-box .content { color: #333; font-size: 14px; line-height: 1.8; background: #fff; padding: 12px; border-radius: 4px; word-break: break-all; }
        .select-area { background: #fafafa; border-radius: 12px; padding: 24px; margin: 20px 0; border: 1px solid #e8e8e8; }
        .select-area h2 { margin: 0 0 16px; font-size: 20px; color: #1890ff; }
        .select-area .options { font-size: 15px; line-height: 2; color: #333; }
        .select-area .options .option { margin-bottom: 8px; }
        .select-area .options .hint { color: #666; margin-top: 8px; }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<script>
// ====== 数据注入区域（Agent 只需替换此处的 JSON） ======
var __REPORT_DATA__ = {"keyword": "认知成长·职场进阶·长期主义", "analysisCount": 20, "styles": [{"name": "信息图表·认知模型", "count": 3, "coreVisual": "以结构化图表、层级模型、大字标题为主体，信息密度高，用视觉化方式呈现认知/成长/职场方法论", "features": "米色/深蓝/白底为主，黑字或对比色强调关键词；金字塔、阶梯、能力模型等符号常见；适合干货、方法论、认知提升类内容，传递专业可信感", "covers": ["http://mmbiz.qpic.cn/sz_mmbiz_jpg/PfS0Q6Tdp1J8Nia39BUElmKBLK9ZuY3LUMApQmpY3kXhEMplyJFHnlmg6wRyqficibnofTuQviady5peiblRU2WIA7lUrL96yaAjbs3gIibdkypTo/0?wx_fmt=jpeg", "http://mmbiz.qpic.cn/sz_mmbiz_jpg/g91ChVqZ6LjaCiavF3ffHk8licmXFc5ZYUAiakB72IuiaMh1oer65kagGfft3icsgJolEolicbsEzWL8l6cdianJNGeoz5s8SyeouZdX3An8uQHKP4/0?wx_fmt=jpeg", "http://mmbiz.qpic.cn/mmbiz_jpg/Jib25DkMjb2oJKhqbqia6MX1ovdH8ZOicnCNF8qvxxyNdsRibSAJ875BoaS8lHnbzzfLM2k4lPyn5fw9dU2zHzdPFg/0?wx_fmt=jpeg"]}, {"name": "电影意境·情绪共鸣", "count": 5, "coreVisual": "以自然风景、城市夜景、人物剪影/侧影为主体，通过光影、留白、远景营造思考、沉淀、长期主义的氛围", "features": "低饱和度色调（青绿、深蓝、暖橙、 sepia）；大量留白和虚化背景；人物多为背影/侧脸，增强代入感；适合深度观点、情绪共鸣、长期主义主题", "covers": ["https://mmbiz.qpic.cn/sz_mmbiz_jpg/fdOFSP6xPwfBib45ckENlZQicbicjsxyv67JFQfw3tnzMNDfkZ2LlwbJLiavWfKRpbW7Nmb1Pbx2Xy5aRryCz0v6Fw/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/SL01kv8vjY3terCyqLgSz9a3ZWhibCIBZYJbNuMMfxfliaKQbsbC41MYOz8YpzAnMBFPBq0ADN1jzklgSUL17ibBA/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/sz_mmbiz_jpg/Xx6cVPQr5iceFgw86E0q0WiahcFKGmolVZXUmYXaFkMmZvGlicHJhA3wFf6m3qHx1ZzokiacticIkqfuic67rSKudPyA/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/sz_mmbiz_jpg/Xx6cVPQr5iceia5sR2rYicUVUGicC7RnxRXA3IDVzLItY0LxyYec2WvIDz9wwopSaY2ZkvVu2Jb1jWTBJq4xnthNicQ/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/4xQpcc9PVXgMLcf8r8BFGSwBKdbwDQkn3I1a0dOfvKng2XU4PLgtXQMIqlr7RsL71SBXaFbPW1M1DdLOqaN52g/0?wx_fmt=jpeg"]}, {"name": "卡通插画·年轻化解压", "count": 4, "coreVisual": "以卡通角色、萌宠、简笔插画为主体，配合轻松幽默或温暖治愈的视觉语言，降低认知压力", "features": "色彩明快或柔和，线条简洁；常以动物、Q版人物为符号；适合年轻化表达、情绪治愈、职场吐槽类内容", "covers": ["https://mmbiz.qpic.cn/mmbiz_jpg/FLpE2yWtC5ebPAxkmz59z7EdibsiaRniatgmvUgWLmJ0hAl4b3k7jp6mvz29Jald7YYGeugJWOia7cnecibnnljpQUA/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/HvjIqmAEpJYVlibaA8IviadQawI0vZe2ErJPEQ9HfvSVViaLR3OLvFBaABiaU2xicc1rEnMUF1a3VEhaNvz9YIMBXQw/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/FLpE2yWtC5dZoxzEU6zN9f2RewtCGOWWOy1iaQn9Ce5GByibibnDlHhfmMMibx39btj31v4eJaO8SWx5dZxeEE7X9g/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/t9xYLoJNTT5ShwZqvdgzC53kFu4p31UzjkqNbrzmdIg37jGN485gqr94ibD9ukwGicgTcNia0t8auNOhJKrl04gDg/0?wx_fmt=jpeg"]}, {"name": "商务质感·品牌IP", "count": 5, "coreVisual": "以商务人像、建筑景观、产品/品牌视觉为主体，强调专业感、成功感或机构背书", "features": "色调稳重（黑白、深蓝、自然绿）；构图端正或有品牌标识；适合管理者视角、企业品牌、个人IP类内容", "covers": ["https://mmbiz.qpic.cn/mmbiz_jpg/75aM8OyvVZWxTovebnAkkZrVibpNk5eicJb80Jibhden2ic1SUTvM5UibuWBoXTUPGyqMQwRepTroehRYKlV5cXAFqQ/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/sz_mmbiz_jpg/ZpPXv3XATmypwicRWxMkuMc2kCZ1nuzStmib0e5cmSsVPnoRgAnAne7KcggLbQJHHms2dhvuYfFDDV7oEZSZZKMA/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/sz_mmbiz_jpg/QB019KgPSP1I0SC49MkmZibUv09hx20CbWAUJOt9JSDkb9NgNGRHCt8TgrFJqvYzJoAxEUibL8QT6rrgKt76fhwQ/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/xALqE5MicEv6ovEtwIOqJdTakGFQdVNzq4aYqzZZ4Uic8B2yzM0fC00IH78xs9S0t7xpCpH4QcicP8czty7Y7vnUQ/0?wx_fmt=jpeg", "https://mmbiz.qpic.cn/mmbiz_jpg/iaicR2ypE1icArVOvpjMD5PXyzGWQPIbAjia6ibzL5qH8VhGFGu21OzhPt2nEOOgF10ib2xn0zKnUOvkUHTNdgCQoDFQ/0?wx_fmt=jpeg"]}], "plans": [{"name": "认知复利·知识视觉化", "coreVisual": "浅米色背景上，一条优雅的向上复利曲线从左下延伸至右上，曲线旁点缀简约认知节点图标（打开的书本、灯泡、齿轮、时钟、阶梯），底部标注'努力'，顶部标注'认知复利'。整体像一张高级信息图，克制、专业、不浮夸", "case": {"imageUrl": "http://mmbiz.qpic.cn/sz_mmbiz_jpg/g91ChVqZ6LjaCiavF3ffHk8licmXFc5ZYUAiakB72IuiaMh1oer65kagGfft3icsgJolEolicbsEzWL8l6cdianJNGeoz5s8SyeouZdX3An8uQHKP4/0?wx_fmt=jpeg", "url": "https://mp.weixin.qq.com/s?__biz=MzYzMjI3MTIxMg==&mid=2247485257&idx=1&sn=d9a9183ad91fbdd1714763d6b19073bb#rd", "title": "个人成长阶段", "author": "过眼yunyan", "reads": "10.0w"}, "prompt": "2.35:1 horizontal ratio WeChat cover image, 900x383 pixels. Off-white / light beige background. An elegant compound growth curve rises from bottom-left to top-right, with minimalist cognitive milestone icons along the path: open book, light bulb, gear, clock, staircase. Small label '努力' near the bottom, larger label '认知复利' near the top. Premium infographic style, restrained color palette, clean typography, professional and sophisticated, no human figures."}, {"name": "沉稳意境·长期主义", "coreVisual": "清晨薄雾中的山水湖面，一叶扁舟或蜿蜒小路通向远方晨光，画面右侧1/3留白。低饱和度青绿色调，意境悠远，象征30岁后的沉淀、长期主义与认知复利", "case": {"imageUrl": "https://mmbiz.qpic.cn/sz_mmbiz_jpg/fdOFSP6xPwfBib45ckENlZQicbicjsxyv67JFQfw3tnzMNDfkZ2LlwbJLiavWfKRpbW7Nmb1Pbx2Xy5aRryCz0v6Fw/0?wx_fmt=jpeg", "url": "http://mp.weixin.qq.com/s?__biz=MzAwMDM4Mjg2Nw==&mid=2650766534&idx=1&sn=4566dde7edb0bed3e16615033e5a0bc6&chksm=835fd42d6bbc6d225083b1c17da24ff11b066617669cce6846d7d7f836769dfad1eeb69718ff#rd", "title": "一个人成长最快的方式：深度工作", "author": "帆书樊登讲书", "reads": "10.0w"}, "prompt": "2.35:1 horizontal ratio WeChat cover image, 900x383 pixels. Serene landscape at dawn: misty lake or mountains, a small boat or winding path leading toward soft morning light. Desaturated teal-green color palette. Right one-third left as clean negative space. Cinematic photography style, poetic and restrained, symbolizing long-term thinking and compounding wisdom. No text overlay."}, {"name": "克制大字·观点直给", "coreVisual": "深灰蓝色纯色背景，中央大号白色无衬线标题文字'真正拉开差距的是认知复利'，字体简洁有设计感，底部小字'30岁以后'。大面积留白，克制高级的大字报风格，不浮夸", "case": {"imageUrl": "http://mmbiz.qpic.cn/mmbiz_jpg/Jib25DkMjb2oJKhqbqia6MX1ovdH8ZOicnCNF8qvxxyNdsRibSAJ875BoaS8lHnbzzfLM2k4lPyn5fw9dU2zHzdPFg/0?wx_fmt=jpeg", "url": "https://mp.weixin.qq.com/s?__biz=MzYzNjYzNjc0MA==&mid=2247483802&idx=1&sn=5983e6a6e61b2cb2db5adefd4202d89c#rd", "title": "混到管理岗才知道领导不在意你做了多少事", "author": "斌哥的管理指南", "reads": "10.0w"}, "prompt": "2.35:1 horizontal ratio WeChat cover image, 900x383 pixels. Deep blue-gray solid background. Large clean white sans-serif Chinese headline in the center: '真正拉开差距的是认知复利'. Small subtitle below: '30岁以后'. Minimalist bold-poster style, generous negative space, sophisticated typography, no decorative elements, professional and restrained."}]};
// ====== 数据注入区域结束 ======

(function() {
    var d = __REPORT_DATA__;
    if (!d.keyword) { document.getElementById('app').innerHTML = '<p style="text-align:center;padding:60px;color:#999">等待数据注入...</p>'; return; }

    var html = '';

    // 标题
    html += '<h1 class="report-title">📊 爆款封面分析报告</h1>';

    // 信息栏
    html += '<div class="info-bar"><strong>关键词：</strong>' + esc(d.keyword) + ' | <strong>数据来源：</strong>公众号爆款雷达接口 | <strong>分析数量：</strong>' + d.analysisCount + '张封面</div>';

    // 风格类型
    for (var i = 0; i < d.styles.length; i++) {
        var s = d.styles[i];
        html += '<div class="style-card">';
        html += '<div class="style-name">' + esc(s.name) + '</div>';
        html += '<span class="style-freq">出现频次：' + s.count + '/' + d.analysisCount + '</span>';
        html += '<div class="style-core">核心视觉：' + esc(s.coreVisual) + '</div>';
        html += '<div class="style-features">关键特征：' + esc(s.features) + '</div>';
        if (s.covers && s.covers.length > 0) {
            html += '<div class="cover-grid">';
            var maxCovers = Math.min(s.covers.length, 5);
            for (var j = 0; j < maxCovers; j++) {
                var url = esc(s.covers[j]);
                html += '<a href="' + url + '" target="_blank"><img src="' + url + '" alt="封面示例"></a>';
            }
            html += '</div>';
        }
        html += '</div>';
    }

    // 分隔线
    html += '<hr class="divider">';
    html += '<h1 class="report-title">🎯 爆款封面设计方案</h1>';

    // 设计方案
    for (var i = 0; i < d.plans.length; i++) {
        var p = d.plans[i];
        var n = i + 1;
        html += '<div class="plan-card">';
        html += '<h2>方案' + n + '：' + esc(p.name) + '</h2>';
        html += '<div class="plan-core">核心视觉：' + esc(p.coreVisual) + '</div>';

        // 案例参考
        html += '<h3>案例参考</h3>';
        html += '<div class="case-ref">';
        html += '<a href="' + esc(p.case.imageUrl) + '" target="_blank" class="cover-wrap"><img src="' + esc(p.case.imageUrl) + '" alt="封面图"></a>';
        html += '<div class="info">';
        html += '<div class="title"><a href="' + esc(p.case.url) + '" target="_blank">' + esc(p.case.title) + '</a></div>';
        html += '<div class="author">作者：' + esc(p.case.author) + '</div>';
        html += '<span class="reads">阅读：' + esc(p.case.reads) + '</span>';
        html += '</div></div>';

        // 生图提示词
        html += '<h3>生图提示词</h3>';
        html += '<div class="prompt-box">';
        html += '<div class="label">公众号封面图</div>';
        html += '<div class="content">' + esc(p.prompt) + '</div>';
        html += '</div>';

        html += '</div>';
    }

    // 方案选择区域
    html += '<hr class="divider">';
    html += '<div class="select-area">';
    html += '<h2>🎯 请选择您想要的封面设计方案</h2>';
    html += '<div class="options">';
    var labels = ['一', '二', '三'];
    for (var i = 0; i < d.plans.length; i++) {
        html += '<div class="option"><strong>方案' + labels[i] + '：</strong>' + esc(d.plans[i].name) + ' - ' + esc(d.plans[i].coreVisual) + '</div>';
    }
    html += '<div class="hint">';
    html += '<strong>💡 请选择：</strong><br>';
    html += 'A. 回复"方案1"、"方案2"或"方案3"直接选择方案<br>';
    html += 'B. 如果您有产品图、人物图或场景图想作为参考，可以和方案编号一起发送<br>';
    html += '<span style="margin-left:24px">例如：直接发送图片 + "方案1"</span>';
    html += '</div></div></div>';

    // 实际生成封面结果
    html += '<hr class="divider">';
    html += '<div class="style-card">';
    html += '<div class="style-name">实际封面效果</div>';
    html += '<p class="summary">基于「认知复利、30岁以后、长期成长」赛道的爆款规律，按方案顺序输出了三张适合公众号横版封面的视觉成品。</p>';
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:24px;">';
    html += '<figure style="margin:0;background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.08);"><img src="{{asset_url:cognitive_cover_1}}" alt="认知复利方案一封面" style="display:block;width:100%;height:auto;"><figcaption style="padding:12px 14px;font-size:14px;color:#555;">方案一：认知复利·知识视觉化</figcaption></figure>';
    html += '<figure style="margin:0;background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.08);"><img src="{{asset_url:cognitive_cover_2}}" alt="认知复利方案二封面" style="display:block;width:100%;height:auto;"><figcaption style="padding:12px 14px;font-size:14px;color:#555;">方案二：沉稳意境·长期主义</figcaption></figure>';
    html += '<figure style="margin:0;background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,0.08);"><img src="{{asset_url:cognitive_cover_3}}" alt="认知复利方案三封面" style="display:block;width:100%;height:auto;"><figcaption style="padding:12px 14px;font-size:14px;color:#555;">方案三：克制大字·观点直给</figcaption></figure>';
    html += '</div></div>';

    document.title = '爆款封面分析报告 - ' + d.keyword + '主题';
    document.getElementById('app').innerHTML = html;

    function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
})();
</script>
</body>
</html>
