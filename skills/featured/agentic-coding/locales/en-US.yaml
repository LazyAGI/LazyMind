- id: fix-and-handoff
  selector:
    title: Fix a defect
    description: Deliver a focused fix, verification plan and compatibility notes
    output_label: Repair and handoff packet
  launch:
    prompt_short: Deliver a focused fix, verification plan and compatibility notes
    prompt: 'Fix this Python function: def final_price(price, discount): return round(price * (1 - discount),
      2). The rule is to round the original price to cents using ROUND_HALF_UP, apply the discount, then round
      again. final_price(10.005, 0.1) should be 9.01, not 9.00. Deliver code, boundary tests and handoff notes
      in this conversation workspace. Explain type changes and distinguish executed tests from pending checks.'
