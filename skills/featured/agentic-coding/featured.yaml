    prompt_short: 从缺陷复现到最小修复，交付代码、验证方案和风险说明
    prompt: |-
      请修复下面的 Python 金额计算函数，并给出修改、验证方法和交接说明。
      业务规则：原价先按四舍五入保留两位小数，再乘以 (1-discount)，结果再次四舍五入保留两位小数。例如 final_price(10.005, 0.1) 应为 9.01，目前得到 9.00。这里 discount=0.1 表示优惠 10%。

      def final_price(price, discount):
          return round(price * (1 - discount), 2)

      在会话工作区交付修复文件和边界测试；说明返回类型及兼容性变化，并区分实际执行的测试与待执行检查。
