schema_version: 2
id: chat-eq-reply
type: chat
version: 1.0.0
status: published
default_locale: zh-CN
provider: SkillHub

skill:
  source_url: https://skillhub.cn/skills/chat-eq-reply
  category: communication
  required_version: 3.5.0

placement:
  home: true
  gallery: true
  order: 22

classification:
  category: 内容创作
  tags:
    - 高情商回复
    - 聊天
    - 关系沟通
    - 话术

assets:
  cover:
    file: assets/cover.png
    role: cover

presentation:
  card:
    title: 高情商聊天回复助手
    description: 根据对话语境生成自然、体面、有分寸的多风格回复
    output_type: document
    output_label: 回复建议
    cover_asset: cover
    result_summary: 输出多种语气版本，帮助你在不同关系和场景下妥帖表达
  detail:
    title: 高情商聊天回复助手
    description: 识别对方真实语气、关系距离和场景目标，生成温柔、幽默、直接或高情商等不同风格的聊天回复。来源：https://skillhub.cn/skills/chat-eq-reply，经 LazyMind 适配。
    attachment_hint: 对方原话、聊天背景、你希望达到的目的和关系类型

tasks:
  - id: eq-reply
    selector:
      title: 高情商回复
      description: 为恋爱、职场、朋友和家人沟通生成合适回复
      output_label: 聊天回复建议
    launch:
      prompt_short: 帮我根据这段聊天生成高情商回复。
      prompt: 请根据我提供的对方原话、聊天背景、关系类型和我希望达成的目的，生成多种高情商聊天回复。请先判断对方情绪和潜台词，再给出温柔体贴、幽默风趣、直接有效等不同风格版本，并说明每种回复适合的场景；如果信息不足，请先问我关键背景。
    replay:
      steps:
        - title: 理解语境
          description: 分析对方话语、情绪、关系距离和沟通目标
        - title: 选择风格
          description: 匹配温柔、幽默、直接或安抚等回复策略
        - title: 生成回复
          description: 输出多版自然、不尴尬、可直接发送的表达
        - title: 提醒风险
          description: 标注不适合发送的说法和进一步沟通建议
    result:
      template: generic_report_v1
      eyebrow: 聊天回复建议
      title: 多风格高情商回复
      summary: 生成贴合关系、情绪和目标的聊天回复版本
      highlights:
        - 对方情绪和潜台词判断
        - 多种语气回复可选
        - 发送建议和沟通风险提醒
