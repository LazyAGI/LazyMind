locale: en-US

classification:
  category: Content creation
  tags:
    - Book distillation
    - Methodology
    - Skill creation
    - Knowledge distillation

presentation:
  card:
    title: Cangjie book-to-skill distiller
    description: Turn Pyramid Principle notes into conclusion-first, MECE, and evidence Skills
    output_type: document
    output_label: Skill design
    cover_asset: cover
    result_summary: Show how four reading notes become atomic Skills with clear boundaries and composition order
  detail:
    title: Cangjie book-to-skill distiller
    description: Sourced from SkillHub and adapted for LazyMind. Analyze a complete book or selected chapters, extract transferable methods and execution steps, and produce a structured reusable Skill.
    attachment_hint: A book PDF, chapter text, reading notes, or a target-method brief

tasks:
  - id: distill-book
    selector:
      title: Distill Pyramid Principle notes
      description: Turn four core notes into composable communication and review capabilities
      output_label: Skill set
    launch:
      prompt_short: Distill these Pyramid Principle notes into four executable Skills.
      prompt: >-
        Use the Cangjie distillation Skill to convert these Pyramid Principle reading notes into four clearly bounded executable Skills: 1) lead with the conclusion before reasons; 2) items at one level must be mutually exclusive and collectively exhaustive; 3) vertical structure should form questions and answers; 4) every claim needs verifiable evidence. For each Skill, provide triggers, inputs, steps, checks, failure modes, and outputs, then explain their composition order. Do not reproduce or expand the book; design only from these notes.
    replay:
      steps:
        - title: Calibrate note boundaries
          description: Use only the four supplied principles without expanding the book
        - title: Extract atomic methods
          description: Separate conclusion-first, MECE, evidence, and logic review
        - title: Design execution boundaries
          description: Define each capability's triggers, steps, checks, and failures
        - title: Map composition order
          description: Explain dependencies and the recommended invocation sequence
    result:
      template: html_preview_v1
      eyebrow: Skill set
      title: Four atomic Skills for pyramid communication
      summary: Convert four reading notes into independently triggered methods that compose in sequence
      html_asset: pyramid_map

  - id: distill-chapter
    selector:
      title: Extract a chapter method
      description: Turn a "writing meeting minutes" chapter into one playbook
      output_label: Method playbook
    launch:
      prompt_short: 'Example: extract one playbook from a "writing meeting minutes" chapter.'
      prompt: >-
        Extract the method from this sample chapter summary: "Write meeting minutes with the conclusion first, then group items as decisions, action items, and risks; every action item must have an owner and a due date." Separate principle from procedure and organize it into a playbook with scenarios, prerequisites, step-by-step actions, checks, and common failure modes.
    replay:
      steps:
        - title: Identify the chapter goal
          description: Confirm the actual problem the chapter tries to solve
        - title: Separate principle and action
          description: Extract core principles, decision criteria, and procedures
        - title: Complete execution conditions
          description: Define inputs, constraints, checks, and failure modes
        - title: Deliver the playbook
          description: Produce a structured method that can be reused directly
    result:
      template: html_preview_v1
      eyebrow: Method playbook
      title: Core chapter method and execution steps
      summary: Extract a bounded, immediately applicable method from the chapter
      html_asset: chapter_method

  - id: skill-draft
    selector:
      title: Generate a Skill draft
      description: Turn the conclusion-first minutes method into a SKILL.md
      output_label: SKILL.md draft
    launch:
      prompt_short: 'Example: turn the "conclusion-first minutes" method into a standard SKILL.md.'
      prompt: >-
        Convert this sample method into a standard SKILL.md draft: "Write meeting minutes with the conclusion first, then group decisions, action items, and risks; every action item must have an owner and a due date." Include an accurate name, trigger description, supported and unsupported scopes, input requirements, execution flow, quality checks, and required references. Preserve the method's boundaries and do not add unsupported capabilities.
    replay:
      steps:
        - title: Confirm method boundaries
          description: Define what the capability solves and what it excludes
        - title: Design the trigger description
          description: Describe situations the model can recognize reliably
        - title: Structure the workflow
          description: Convert the method into steps and quality checks
        - title: Deliver the Skill draft
          description: Produce a complete SKILL.md ready for review
    result:
      template: html_preview_v1
      eyebrow: SKILL.md draft
      title: Reusable methodology Skill design
      summary: Convert the method into a Skill with clear triggers, steps, and quality standards
      html_asset: skill_draft
