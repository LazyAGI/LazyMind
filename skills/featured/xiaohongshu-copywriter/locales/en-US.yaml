locale: en-US

classification:
  category: Content creation
  tags:
    - Xiaohongshu
    - Product recommendations
    - High-performing titles
    - Social media

presentation:
  card:
    title: Xiaohongshu copywriter
    description: Create a credible, publish-ready commute post for a portable blender
    output_type: document
    output_label: Xiaohongshu post
    cover_asset: cover
    result_summary: Animate the path from a scenario hook and truthful details to tags and publishing time
  detail:
    title: Xiaohongshu copywriter
    description: "Create a natural, credible Xiaohongshu post around product benefits and a target audience, including titles, body structure, emojis, tags, and publishing advice. Source: the former 'Xiaohongshu Copywriter Plus' listing on SkillHub (the original link is no longer available), adapted for LazyMind."
    attachment_hint: Product details, selling points, audience notes, or reference images

tasks:
  - id: product-note
    selector:
      title: Portable blender commute post
      description: Create credible copy for an office-breakfast scenario without overclaiming
      output_label: Recommendation post
    launch:
      prompt_short: Write a commute-focused Xiaohongshu post for a portable blender.
      prompt: >-
        Use the Xiaohongshu Copywriter Skill for a portable blender with these facts: 380 ml, 520 g, 40-second blending, USB-C charging, and a detachable cup for cleaning. The audience is commuters and the scenario is office breakfast. Provide five titles, a six-part body, restrained emojis, eight topic tags, a first-comment draft, and posting-time advice. A first-person scenario is allowed only when clearly labelled as sample copy. State the noise and need to cut large ice into smaller pieces, and do not invent weight-loss or skincare claims.
    replay:
      steps:
        - title: Lock the commute scenario
          description: Align office breakfast, product specifications, and factual boundaries
        - title: Design title hooks
          description: Use time savings, portability, and concrete situations
        - title: Add truthful details
          description: Present benefits alongside noise and ice-size limitations
        - title: Complete publishing strategy
          description: Add emojis, tags, a first comment, and timing advice
    result:
      template: html_preview_v1
      eyebrow: Xiaohongshu recommendation post
      title: Five-minute office breakfast post
      summary: Balance concrete specifications, honest limitations, and platform-native publishing details
      html_asset: blender_output

  - id: rewrite-note
    selector:
      title: Rewrite and optimize a post
      description: Turn a vague "the blender is great" draft into a credible post
      output_label: Optimized post
    launch:
      prompt_short: 'Example: turn "the blender cup is great, breakfast is easier" into a credible Xiaohongshu post.'
      prompt: >-
        Optimize this sample draft: "The blender cup works great, breakfast check-ins are more convenient, and everyone says it is worth buying." Known product facts: 380 ml, 520 g, 40-second blending, USB-C charging, and a detachable cup for cleaning; the audience is commuting office workers. Preserve the facts and personal voice while improving the title hook, opening, pacing, information density, emojis, and topic tags. Point out vague or exaggerated claims and deliver a complete rewrite.
    replay:
      steps:
        - title: Diagnose the draft
          description: Review its title, structure, voice, benefits, and credibility
        - title: Restructure pacing
          description: Improve the opening hook, paragraph order, and information density
        - title: Adapt platform expression
          description: Refine emojis, conversational tone, tags, and engagement prompts
        - title: Deliver the rewrite
          description: Produce a complete version ready for further editing
    result:
      template: html_preview_v1
      eyebrow: Optimized post
      title: More natural and engaging Xiaohongshu copy
      summary: Improve the title, pacing, and engagement while preserving facts and personal voice
      html_asset: rewrite_output
