schema_version: 2
id: academic_research_pipeline
type: workflow
version: 1.1.0
status: published
default_locale: zh-CN
provider: LazyMind

workflow:
  workflow_ref: builtin:academic_research_pipeline

placement:
  home: true
  hot: true
  gallery: true
  order: 20

classification:
  category: 信息分析
  tags:
    - 学术研究
    - 文献检索
    - 同行评审
    - 论文写作

assets:
  cover:
    file: assets/cover.png
    role: cover
  paper_demo:
    file: assets/academic-paper-demo.html
    role: result

presentation:
  card:
    title: 学术研究与论文写作
    description: 以个人知识积累与人工智能为例，展示研究设计、证据综合、论文写作、评审修订与 Word 交付
    output_type: document
    output_label: 交互式论文案例
    cover_asset: cover
    result_summary: 查看真实工作流生成的论文、13 个执行节点与版本化 AI 润色交互
  detail:
    title: 从研究主题到可复审论文
    description: 以“个人知识积累如何与人工智能结合”为真实案例，串联轻量检索、六条证据综合、全文写作、五视角评审、两轮修订和 DOCX 交付；默认打开第 12 步论文交付，并支持模拟 AI 润色与 V1/V2 对比。
    attachment_hint: 研究主题、目标篇幅、论文类型和引用格式（可选）

tasks:
  - id: full-paper
    selector:
      title: 个人知识积累与人工智能
      description: 用轻量模式完成约千字论文的检索、写作、评审、修订与交付
      output_label: 交互式论文
    launch:
      prompt_short: "使用工作流：学术研究与论文写作，主题：个人知识积累如何与人工智能结合。大概1000字"
      prompt: "使用工作流：学术研究与论文写作，主题：个人知识积累如何与人工智能结合。大概1000字"
    replay:
      steps:
        - title: 设计研究问题
          description: 确认概念性研究边界、约千字目标和 GB/T 7714 引用格式
        - title: 轻量检索与证据综合
          description: 登记六条文献证据，提炼共识、风险、边界条件与研究空白
        - title: 生成大纲与论文初稿
          description: 围绕获取、整理、内化、应用四个环节组织全文
        - title: 五视角同行评审
          description: 汇总方法、领域、跨学科与魔鬼代言人意见，形成 28 项修订路线
        - title: 两轮修订与完整性检查
          description: 逐项落实意见，复核引用、结构、研究局限和完整性声明
        - title: 交付论文与过程记录
          description: 输出最终 Markdown、42.2 KB DOCX 和 13 步执行记录
    result:
      template: html_preview_v1
      eyebrow: 学术论文案例
      title: 个人知识积累与人工智能的结合
      summary: 默认进入第 12 步论文交付，查看真实论文、过程产物，并体验 AI 润色生成 V2 与版本 Diff。
      html_asset: paper_demo
