locale: en-US

classification:
  category: Information analysis
  tags:
    - Academic research
    - Literature search
    - Peer review
    - Paper writing

presentation:
  card:
    title: Academic research and paper writing
    description: Follow a real personal knowledge and AI case through research design, evidence synthesis, writing, review, revision, and Word delivery
    output_type: document
    output_label: Interactive paper case
    cover_asset: cover
    result_summary: Explore the generated paper, thirteen workflow stages, and a versioned AI-polish interaction
  detail:
    title: From research topic to reviewable paper
    description: Follow a real “personal knowledge accumulation and AI” case through lightweight retrieval, six registered sources, full drafting, five-perspective review, two revision rounds, and DOCX delivery. The demo opens on stage 12 and includes mock AI polishing with a V1/V2 diff.
    attachment_hint: Research topic, target length, paper type, and citation style (optional)

tasks:
  - id: full-paper
    selector:
      title: Personal knowledge and AI
      description: Complete lightweight retrieval, writing, review, revision, and delivery for a short paper
      output_label: Interactive paper
    launch:
      prompt_short: Use the academic research and paper-writing workflow to write about how personal knowledge accumulation can combine with AI, in roughly 1,000 Chinese characters.
      prompt: Use the academic research and paper-writing workflow to write about how personal knowledge accumulation can combine with AI, in roughly 1,000 Chinese characters.
    replay:
      steps:
        - title: Design the research question
          description: Confirm a conceptual-research scope, short target length, and GB/T 7714 citation style
        - title: Retrieve and synthesize evidence
          description: Register six sources and summarize consensus, risks, boundary conditions, and gaps
        - title: Generate the outline and first draft
          description: Organize the paper around acquisition, organization, internalization, and application
        - title: Run five-perspective peer review
          description: Combine methodological, domain, interdisciplinary, and devil's-advocate feedback into 28 revision items
        - title: Revise twice and validate integrity
          description: Resolve feedback and recheck citations, structure, limitations, and integrity declarations
        - title: Deliver the paper and process record
          description: Produce final Markdown, a 42.2 KB DOCX, and the thirteen-stage execution record
    result:
      template: html_preview_v1
      eyebrow: Academic paper case
      title: Combining personal knowledge accumulation with AI
      summary: Open directly on stage twelve to inspect the real paper and process artifacts, then mock an AI polish and compare V1 with V2.
      html_asset: paper_demo
