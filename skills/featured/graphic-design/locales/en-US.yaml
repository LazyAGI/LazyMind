locale: en-US
classification: {category: Multimedia Design & Creative, tags: [design critique, typography, accessibility]}
presentation:
  card: {title: "Graphic Design", description: "Design principles, critique, and production guidance tailored to audience and medium", output_type: "document", output_label: "Design guidance", cover_asset: "cover", result_summary: "Social design, print production, and student-portfolio workflows"}
  detail: {title: "Graphic Design", description: "Selects accessible guidance, professional production requirements, or design theory based on the user's role and output context; readability and accessibility remain non-negotiable.", attachment_hint: "Audience, medium, dimensions, brand guidelines, and existing design details"}
tasks:
  - id: social-post-review
    selector: {title: "Review a social recruitment post", description: "Check hierarchy and readability for a non-designer", output_label: "Revision checklist"}
    launch: {prompt_short: "Review a 1080×1080 recruitment post titled “Weekend Volunteer Recruitment” with six body lines, four fonts, and five colors.", prompt: "I am a non-designer preparing a 1080×1080 Instagram recruitment post. Its title is “Weekend Volunteer Recruitment,” it has six lines of explanatory copy, four fonts, five colors, and text over a photo. Give a Canva-ready checklist for readability, alignment, typography, color, and whitespace. Keep to the supplied information and do not assume brand assets."}
    replay: {steps: [{title: "Identify user and medium", description: "Choose actionable guidance for a non-designer working on a square social post"}, {title: "Check hierarchy and readability", description: "Identify excess fonts and colors and the risk of low-contrast text over imagery"}, {title: "Propose simplification", description: "Organize changes around limited typography, palette, alignment, and space"}]}
    result: {template: "html_preview_v1", eyebrow: "Non-designer social case", title: "Recruitment-post readability checklist", summary: "Applies the source Skill's limits, alignment, and contrast principles.", html_asset: "social_post"}
  - id: print-preflight
    selector: {title: "Preflight an exhibition leaflet", description: "Create a technical checklist for professional print delivery", output_label: "Print checklist"}
    launch: {prompt_short: "Create a print-preflight checklist for an A4 double-sided exhibition leaflet; paper and color profile are not confirmed.", prompt: "I will send an A4 double-sided exhibition leaflet to a printer. Paper, color profile, bleed, and PDF standard have not been confirmed. List the items to confirm with the printer and the export checks for CMYK, 3–5mm bleed, 300dpi, fonts, transparency, and PDF/X-4. Do not assume unconfirmed production parameters."}
    replay: {steps: [{title: "Confirm production context", description: "Recognize the output as a print deliverable requiring exact specifications"}, {title: "Identify open parameters", description: "State that paper, color profile, and printer requirements remain unknown"}, {title: "Provide preflight checks", description: "Cover bleed, resolution, fonts, transparency, and delivery format"}]}
    result: {template: "html_preview_v1", eyebrow: "Print-production case", title: "A4 leaflet preflight checklist", summary: "Separates printer confirmations from immediately actionable file checks.", html_asset: "print_preflight"}
  - id: student-portfolio-critique
    selector: {title: "Critique a student portfolio", description: "Evaluate case-study structure and typographic rigor", output_label: "Critique guidance"}
    launch: {prompt_short: "Critique a six-page campus sustainable-market visual-system portfolio and give concrete restructuring and typography fixes.", prompt: "I am a visual-communication student presenting a six-page campus sustainable-market visual system: cover, research, sketches, key visual, extensions, and summary. The title uses three typefaces, body copy uses two; research is too dense, sketches lack selection rationale, the final poster appears before process, extension mockups vary in size, margins lack a shared grid, and type scale and leading are inconsistent. Provide a concrete diagnosis, problem–reason–action recommendations, revised page order, and typography/grid changes; state what I still need to supply."}
    replay: {steps: [{title: "Identify educational goals", description: "Use a student's theory and portfolio-structure needs as the review basis"}, {title: "Apply formal principles", description: "Organize critique through hierarchy, Gestalt, and typographic rigor"}, {title: "Recommend case structure", description: "Use the supplied project facts to recommend concrete restructuring and layout actions"}]}
    result: {template: "html_preview_v1", eyebrow: "Design-education case", title: "Portfolio structure and typography critique framework", summary: "Concrete structure diagnosis and reordering for the campus-market project.", html_asset: "portfolio_critique"}
