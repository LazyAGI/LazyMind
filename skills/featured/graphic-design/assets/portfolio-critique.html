<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品集结构与排版评图框架</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#182b59,#465fd0);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #182b5910}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#253b75;border-left:4px solid #6e85df;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>作品集评图框架</small><h1>作品集结构与排版评图框架</h1><div>提供理论化的评图框架，不捏造项目内容。</div></section><article class="content"><h1>作品集评图框架</h1><h2>每案结构</h2><p>用“问题 → 过程 → 解决方案”说明：先写要解决的传播问题，再展示研究、草图和迭代，最后说明视觉决策如何回应问题。</p><h2>形式检查</h2><div class="item">层级：标题、正文和辅助信息的阅读顺序是否明确。</div><div class="item">图底：内容与背景是否有足够区分。</div><div class="item">邻近与重复：相关信息是否成组，组件是否一致。</div><div class="item">对齐与对比：网格、边缘和重点是否有意图。</div><div class="item">字体：限制在 2–3 种；正文行距保持 120–145%。</div><p>未提供具体项目，因此不评价或编造任何作品内容。</p></article></main></body></html>
