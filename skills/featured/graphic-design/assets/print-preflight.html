<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4 折页印前检查</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#0b6b66,#159a8c);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0b6b6610}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#0b6b66;border-left:4px solid #159a8c;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>印前检查清单</small><h1>A4 折页印前检查</h1><div>区分待向印厂确认的参数与可立即执行的文件检查。</div></section><article class="content"><h1>A4 双面折页印前清单</h1><h2>先向印厂确认</h2><p>纸张、涂布情况、ICC 色彩配置与 PDF 标准尚未提供，必须先确认。</p><h2>文件预检</h2><div class="item">CMYK：印刷文件使用正确色彩模式并嵌入确认的配置。</div><div class="item">出血：至少 3mm；大型或印厂另有要求时按其要求。</div><div class="item">分辨率：最终尺寸 300dpi。</div><div class="item">字体：转曲或嵌入，检查特殊字符。</div><div class="item">透明度：检查复杂效果、叠印与镂空。</div><div class="item">交付：按确认的 PDF/X-4 标准输出。</div><h2>不作假定</h2><p>未确认纸张和色彩配置前，不指定纸张重量、Pantone 或具体 ICC 名称。</p></article></main></body></html>
