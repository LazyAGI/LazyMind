<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>招募帖可读性修改清单</title><style>body{margin:0;background:#f5f7fb;color:#152033;font:15px/1.7 Inter,system-ui,"PingFang SC",sans-serif}.page{max-width:900px;margin:32px auto;padding:0 20px 48px}.hero{background:linear-gradient(135deg,#0b6b66,#159a8c);color:white;padding:28px;border-radius:20px;margin-bottom:18px}.hero small{opacity:.8}.content{background:#fff;border:1px solid #e5e9f2;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0b6b6610}h1{font-size:27px;line-height:1.25;margin:0 0 22px}h2{font-size:18px;margin:26px 0 10px;color:#0b6b66;border-left:4px solid #159a8c;padding-left:10px}p{margin:8px 0}.item{background:#f4f6fc;border-radius:10px;padding:9px 12px;margin:7px 0}pre{white-space:pre-wrap;overflow:auto;background:#f7f8fb;padding:10px;border-radius:8px;font:13px/1.55 ui-monospace,monospace}</style><body><main class="page"><section class="hero"><small>设计修改建议</small><h1>招募帖可读性修改清单</h1><div>依据 Skill 的三项上限、对齐和对比原则。</div></section><article class="content"><h1>设计诊断</h1><p>对象：1080×1080 招募帖，标题“周末志愿者招募”，六行说明文字；当前使用 4 种字体、5 种颜色，文字覆盖照片。</p><h2>优先级</h2><p>1. 先解决照片上的文字对比：为文字设置高对比纯色承载区，确保可读。</p><p>2. 将字体收敛为 2–3 种，标题与正文建立稳定层级。</p><p>3. 将颜色收敛为不超过 3–4 种，避免无关颜色竞争。</p><p>4. 左对齐文字块，为标题、正文和边缘留出呼吸空间。</p><h2>Canva 执行清单</h2><p>使用现成方形模板；保留一个标题样式和一个正文样式；检查手机缩略图下标题和关键信息仍能读到。</p></article></main></body></html>
