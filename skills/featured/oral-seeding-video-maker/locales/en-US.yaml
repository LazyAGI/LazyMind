    title: Talking-head seeding video maker
    description: Turn product benefits and audience insights into a talking-head script, storyboard, and generation-ready
      plan
    output_type: report
    output_label: Talking-head video plan
    cover_asset: cover
    result_summary: Explore three complete Talking-head seeding video maker examples
  detail:
    title: Talking-head seeding video maker
    description: 'Create a talking-head product-seeding video plan, confirm the script and storyboard first, then optionally
      continue to image, voice, music, and video generation. Media generation requires Beatra authorization and available
      credits; preset demos stop before paid calls. Source: https://skillhub.cn/skills/beatra-ai/oral-seeding-video-maker,
      adapted for LazyMind.'
    attachment_hint: Product benefits, audience, style references, duration, or existing media
