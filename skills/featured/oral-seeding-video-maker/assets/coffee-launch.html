<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>咖啡新品口播分镜</title>
<style>:root{--ink:#182033;--muted:#657087;--accent:#d0643b;--soft:#fff3ed;--line:#eadfd9}*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}.shell{max-width:1160px;margin:auto;padding:28px}.hero{padding:25px 30px;border-radius:20px;background:linear-gradient(135deg,#301d1a,#7a3324);color:#fff}.hero h1{margin:0 0 5px;font-size:30px}.hero p{margin:0;color:#ffe3d5}.visual{margin:18px 0;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 12px 34px #301d1a18}.visual img{display:block;width:100%;height:auto}.caption{padding:11px 16px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px;border:1px solid var(--line);border-radius:15px;background:#fff}.card b{display:block;color:var(--accent);margin-bottom:5px}.line{margin-top:15px;padding:16px 18px;border-radius:14px;background:var(--soft)}@media(max-width:720px){.shell{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head>
<body><main class="shell"><header class="hero"><h1>低糖冷萃 · 20 秒口播分镜</h1><p>通勤疲惫 → 产品特写 → 清爽抵达，三镜头形成完整情绪转折</p></header>
<figure class="visual"><div style="aspect-ratio:16/9;overflow:hidden"><img src="{{asset_url:case_visual}}" alt="低糖冷萃咖啡通勤口播画面" style="display:block;width:300%;max-width:none;height:auto"></div><figcaption class="caption">成片画面参考：通勤上班族在地铁站手持低糖冷萃，主体与产品清晰入镜</figcaption></figure>
<section class="grid"><article class="card"><b>0–6 秒 · 钩子</b>“早八赶时间，也别让甜腻拖住状态。” 镜头从站台中景推到手持冷萃。</article><article class="card"><b>6–14 秒 · 卖点</b>“低糖、即开即饮，冷萃的清爽刚刚好。” 使用瓶身冷凝与桌面特写。</article><article class="card"><b>14–20 秒 · 收束</b>“到公司前，先把自己切到清醒模式。” 只陈述可核实产品信息。</article></section>
<div class="line"><strong>拍摄清单：</strong>冷萃实物、通勤站台、办公桌与大厅；字幕只保留“低糖 / 即开即饮 / 清爽口感”，不添加未经验证的提神或健康承诺。</div></main></body></html>
