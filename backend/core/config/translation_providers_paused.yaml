# Paused translators: restore suppliers into model_catalog.yaml to re-enable.
# This file is intentionally not loaded at startup; implementations are retained.
translation_providers:
  capabilities: [api_key_required]
  suppliers:
    - name: Volcengine Translation
      description:
        zh-CN: |
          火山引擎机器翻译 API。可申请按月更新的免费额度，需开通服务并填写 AccessKey ID 与 Secret Access Key；额度和资格以火山引擎控制台为准。

          接入文档：https://www.volcengine.com/docs/4640/65067
        en-US: |
          Volcengine Machine Translation API. A recurring free allowance may be available after activation. Enter your AccessKey ID and Secret Access Key; check the console for current eligibility and quota.

          API guide: https://www.volcengine.com/docs/4640/65067
      base_url: "https://translate.volcengineapi.com/"
    - name: Microsoft Translator
      description:
        zh-CN: |
          微软 Azure Translator 官方 API。可申请长期 F0 免费层；需填写订阅 Key。区域性资源还需填写 Region，实际额度和开通条件以 Azure 为准。

          接入文档：https://learn.microsoft.com/azure/ai-services/translator/text-translation/quickstart/rest-api
        en-US: |
          Official Azure Translator API. The ongoing F0 tier may be available. Enter your subscription key and, for regional resources, the region; check Azure for current eligibility and limits.

          API guide: https://learn.microsoft.com/azure/ai-services/translator/text-translation/quickstart/rest-api
      base_url: "https://api.cognitive.microsofttranslator.com/"
    - name: Google Cloud Translation
      description:
        zh-CN: |
          Google Cloud Translation Basic 官方 API，与免密钥 Google Translate Web 分开。可使用每月免费额度，但需要 Google Cloud 项目、启用 API 和计费设置；请输入 API Key。

          接入文档：https://docs.cloud.google.com/translate/docs/basic/translating-text
        en-US: |
          Official Google Cloud Translation Basic API, separate from Google Translate Web. A monthly free allowance is available, but a Cloud project, API activation, and billing setup are required. Enter an API key.

          API guide: https://docs.cloud.google.com/translate/docs/basic/translating-text
      base_url: "https://translation.googleapis.com/"
    - name: Youdao Translation
      description:
        zh-CN: |
          有道智云文本翻译 API。新账号可能获赠一次性体验金，耗尽后按服务规则计费；需填写应用 ID 与应用密钥。

          接入文档：https://ai.youdao.com/DOCSIRMA/html/trans/api/wbfy/index.html
        en-US: |
          Youdao AI Cloud Text Translation API. New accounts may receive one-time trial credit; usage after that follows the provider's billing rules. Enter the application ID and secret.

          API guide: https://ai.youdao.com/DOCSIRMA/html/trans/api/wbfy/index.html
      base_url: "https://openapi.youdao.com/"
    - name: DeepL
      description:
        zh-CN: |
          DeepL 官方翻译 API。新用户可申请一次性 Developer 试用额度；旧版 API Free 已停售。填写 DeepL API Key。

          开发者文档：https://developers.deepl.com/docs/getting-started/auth
        en-US: |
          Official DeepL translation API. New users can apply for a one-time Developer trial; the former API Free plan is no longer sold. Enter a DeepL API key.

          Developer guide: https://developers.deepl.com/docs/getting-started/auth
      base_url: "https://api.deepl.com/"
    - name: Caiyun Translation
      description:
        zh-CN: |
          彩云小译开放 API。新账号可能提供一次性试用额度，后续按服务规则计费；填写 API Token。

          开放平台：https://platform.caiyunapp.com/
        en-US: |
          Caiyun Translation API. A one-time trial allowance may be available for new accounts; later usage follows the provider's billing rules. Enter an API token.

          Platform: https://platform.caiyunapp.com/
      base_url: "https://api.interpreter.caiyunai.com/"
    - name: Tencent TokenHub Translation
      description:
        zh-CN: |
          腾讯云 TokenHub 的 hy-mt2 翻译模型，是旧版腾讯云机器翻译文本接口的迁移方向。需填写 TokenHub API Key 并开通模型；试用与付费额度以 TokenHub 控制台为准。

          接入文档：https://cloud.tencent.com/document/product/1823/130079
        en-US: |
          Tencent TokenHub hy-mt2 translation models are the migration path from the legacy Tencent Cloud text translation API. Enter a TokenHub API key and activate the model; check the console for current trial and paid quota.

          API guide: https://cloud.tencent.com/document/product/1823/130079
      base_url: "https://tokenhub.tencentmaas.com/v1/"
    - name: Tencent Translation
      description:
        zh-CN: |
          腾讯云旧版机器翻译文本接口，已停止接纳新用户，并计划下线；现有账号仍可用 SecretId 和 SecretKey 接入。新用户建议使用 Tencent TokenHub Translation。

          官方调整说明：https://cloud.tencent.com/document/product/551/104415

          现有账号密钥：https://console.cloud.tencent.com/cam/capi
        en-US: |
          Legacy Tencent Cloud Machine Translation text API. It no longer accepts new users and is scheduled for retirement. Existing accounts can continue with a SecretId and SecretKey; new users should choose Tencent TokenHub Translation.

          Official service update: https://cloud.tencent.com/document/product/551/104415

          Existing-account credentials: https://console.cloud.tencent.com/cam/capi
      base_url: "https://tmt.tencentcloudapi.com/"
