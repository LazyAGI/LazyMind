# Knowledge market catalog — source of truth for knowledge_market_items.
# Loaded at startup by knowledge_market.SeedCatalog(); mirrors datasource_catalog.yaml.
#
# M2 测试用例（真实可下载的 ModelScope 公开数据集）：
#   - weather-qa  : 普通 git 仓库（无 LFS），clone 即真实内容，全部文件约 180KB，解析快
#   - ccvg-law    : LFS 仓库，clone 得到指针，安装时自动走 host 表 resolve 兜底
#   - nlpcc2018   : 普通 git 仓库，单 CSV 小文件，最轻量
# 用法：给任意条目填 package_url + package_revision 后重启 core，调用
#   POST /api/core/knowledge-market/items/{id}:install 即可测试后台安装链路。
# 字段说明：package_url 为唯一下载入口（.git 结尾 → git 仓库；否则直链 + zip 解压）；
# package_revision 可选，固定 git 分支/tag；文件清单与 sha256 安装时实时生成，不在目录维护。
# 注意：catalog 不再维护 version / version_date / version_note。前端不展示版本号，
# "更新时间"以用户实际安装/更新成功时间（knowledge_market_installs.installed_at）为准；
# 是否真正有更新由安装快照（git commit / 文件 sha256）与远端内容比对决定。
# online_access_url 为「在线查询」使用的公开网页地址（产品维护）：必须可被模型直接抓取
# 正文（url_fetch），不能是 git 仓库/zip 直链/需登录页面；为空时前端不展示「在线查询」。

knowledge_market_items:
  - id: weather-qa
    category: industry       # industry | evaluation
    name: 中文天气预报生成知识集（Weather）
    description: DAMO_NLP 天气信息生成测试集，覆盖晴雨、气温、空气质量、预警等级等结构化天气属性与对应天气播报文本，可用于对话知识库与问答检索测试。
    icon: 🌤️
    domain: 生活服务
    tags: [天气, 中文, 测试]
    package_url: https://www.modelscope.cn/datasets/DAMO_NLP/weather_infomation_generation.git
    package_revision: master
    online_access_url: https://www.modelscope.cn/datasets/DAMO_NLP/weather_infomation_generation/summary
    data_source: ModelScope 公开数据集 DAMO_NLP/weather_infomation_generation
    sample_questions:
      - 今日天气类型为晴、最低气温26℃、最高气温31℃时，天气播报应如何组织？
      - 空气质量为严重污染时，天气预报一般会给出什么建议？
      - 出现道路结冰黄色预警时，天气播报应如何提醒出行？

  - id: ccvg-law
    category: industry       # industry | evaluation
    name: 刑事裁判文书知识集（CCVG）
    description: 中文刑事案件裁判文书语料，包含事实描述与法院观点，可用于法律人工智能与法院观点生成研究。
    icon: ⚖
    domain: 法律
    tags: [法律, 裁判文书, LFS]
    package_url: https://www.modelscope.cn/datasets/ZhitianHou/CCVG.git
    package_revision: master
    online_access_url: https://www.modelscope.cn/datasets/ZhitianHou/CCVG/summary
    data_source: ModelScope 公开数据集 ZhitianHou/CCVG
    sample_questions:
      - 根据裁判文书事实部分生成法院推理部分。
      - 该案被告人涉嫌什么罪名？

  - id: nlpcc2018
    category: industry       # industry | evaluation
    name: 中文语法纠错知识集（NLPCC2018）
    description: NLPCC 2018 中文语法纠错测试集，2,000 条带编辑标注的句子对，适用于语言校验与文本纠错知识库测试。
    icon: ✏️
    domain: 语言
    tags: [语法纠错, 中文, 测试]
    package_url: https://www.modelscope.cn/datasets/DAMO_NLP/NLPCC2018-test.git
    package_revision: master
    online_access_url: https://www.modelscope.cn/datasets/DAMO_NLP/NLPCC2018-test/summary
    data_source: ModelScope 公开数据集 DAMO_NLP/NLPCC2018-test
    sample_questions:
      - 展示一条中文语法纠错样例。
      - 语法纠错数据的字段含义是什么？
