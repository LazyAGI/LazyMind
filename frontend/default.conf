upstream kong_backend {
    zone kong_backend 64k;
    server kong:8000 resolve;
    resolver 127.0.0.11 valid=10s ipv6=off;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 1024m;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 60s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /showcase-assets/ {
        alias /skills/.runtime/featured-skills/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/browser/v1/connect {
        proxy_pass http://kong:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Use /api/ (trailing slash) so /api-docs/* is not matched and goes to api-docs proxies
    location /api/ {
        proxy_pass http://kong_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        add_header X-Accel-Buffering no always;
    }

    # Proxy only openapi.json for API docs (avoids bypassing Kong auth for other endpoints)
    location = /api-docs/core/openapi.json {
        proxy_pass http://core:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api-docs/auth-service/openapi.json {
        proxy_pass http://auth-service:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api-docs/processor-server/openapi.json {
        proxy_pass http://processor-server:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api-docs/processor-worker/openapi.json {
        proxy_pass http://processor-worker:8001/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api-docs/parsing/openapi.json {
        proxy_pass http://parsing:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api-docs/chat/openapi.json {
        proxy_pass http://chat:8046/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
