openapi: 3.0.3
info:
  title: LazyMind Channel Gateway
  description: APIs for connecting and managing external chat channel accounts.
  version: 0.1.0
tags:
  - name: ChannelAccounts
    description: Connected external chat channel accounts.
  - name: ConnectionSessions
    description: QR-code connection session lifecycle.
paths:
  /api/channel-gateway/v1/channel-accounts/{account_id}/notification-references:
    get:
      summary: Notification References
      operationId: listNotificationReferences
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1f]+$
            title: Account Id
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
            default: ''
            title: Cursor
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
      tags:
        - ChannelAccounts
  /api/channel-gateway/v1/channel-accounts/{account_id}/notification-targets:
    get:
      summary: Notification Targets
      operationId: listNotificationTargets
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1f]+$
            title: Account Id
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
            default: ''
            title: Cursor
        - name: recipient_id
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
            default: ''
            title: Recipient Id
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
      tags:
        - ChannelAccounts
  /api/channel-gateway/v1/task-notifications/{notification_id}:retry:
    post:
      summary: Retry Notification
      operationId: retryTaskNotification
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1f]+$
            title: Notification Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRetry'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
      tags:
        - TaskNotifications
  /api/channel-gateway/v1/task-notifications:
    get:
      summary: Notification History
      operationId: listTaskNotifications
      parameters:
        - name: task_id
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1f]+$
            title: Task Id
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]+$
            description: Opaque decimal int64 cursor; keep as a string to avoid JavaScript precision loss.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
      tags:
        - TaskNotifications
  /api/channel-gateway/v1/channel-accounts:
    get:
      tags:
        - ChannelAccounts
      summary: List channel accounts
      operationId: listChannelAccounts
      parameters:
        - name: provider
          in: query
          required: true
          description: External chat channel provider identifier.
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        "200":
          description: Connected accounts for the requested provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/channel-accounts/{account_id}:
    get:
      summary: Channel Account Detail
      operationId: getChannelAccount
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: ^[^\x00-\x1f]+$
            title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayErrorResponse'
      tags:
        - ChannelAccounts
    patch:
      tags: [ChannelAccounts]
      summary: Change the remark of an existing Feishu account
      operationId: renameChannelAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "200":
          description: Updated safe account view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidRequest"
    delete:
      tags:
        - ChannelAccounts
      summary: Unbind a channel account and erase its stored credentials
      operationId: disconnectChannelAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Account disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/channel-gateway/v1/channel-accounts/{account_id}/notification-groups:
    get:
      tags: [ChannelAccounts]
      summary: List groups joined by the connected Feishu bot
      operationId: listNotificationGroups
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048, default: ''}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
      responses:
        "200":
          description: Readable group names and opaque pagination cursor.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  next_cursor: {type: string}
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationTarget"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account changed or needs reauthorization.
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          description: Feishu group permissions or service unavailable.
  /api/channel-gateway/v1/channel-accounts/{account_id}/default-recipient:
    put:
      tags: [ChannelAccounts]
      summary: Set or clear an explicit connection default without changing saved task rules
      operationId: setDefaultRecipient
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipient_id]
              properties:
                recipient_id:
                  type: string
                  maxLength: 256
                  pattern: '^[^\x00-\x1f]*$'
                  description: Known recipient of this account; empty clears the default.
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Account changed; refresh before retrying.
        "422":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          description: Group membership verification unavailable.
  /api/channel-gateway/v1/channel-accounts/{account_id}:archive:
    post:
      tags: [ChannelAccounts]
      summary: Remove an unbound Feishu account from active lists and retain history
      operationId: archiveChannelAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Record removed; repeated requests by the owner also succeed.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ACCOUNT_UNBIND_REQUIRED; connected and paused accounts cannot be removed.
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/channel-accounts/{account_id}:pause:
    post:
      tags:
        - ChannelAccounts
      summary: Pause an existing Feishu connection
      operationId: pauseChannelAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Feishu connection paused; original identity retained.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ACCOUNT_STATE_CHANGED or FEISHU_REAUTHORIZATION_REQUIRED.
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/channel-accounts/{account_id}:resume:
    post:
      tags:
        - ChannelAccounts
      summary: Resume an existing Feishu connection
      operationId: resumeChannelAccount
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Feishu connection resumed; original identity retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ACCOUNT_STATE_CHANGED or FEISHU_REAUTHORIZATION_REQUIRED.
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/connection-sessions:
    post:
      tags:
        - ConnectionSessions
      summary: Create a connection session
      operationId: createConnectionSession
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key used to make session creation idempotent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionSessionCreate"
      responses:
        "201":
          description: Connection session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSessionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/connection-sessions/{session_id}:
    get:
      tags:
        - ConnectionSessions
      summary: Get a connection session
      operationId: getConnectionSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current connection session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSessionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - ConnectionSessions
      summary: Cancel a connection session
      operationId: cancelConnectionSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Connection session canceled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/channel-gateway/v1/connection-sessions/{session_id}:submit-challenge:
    post:
      tags:
        - ConnectionSessions
      summary: Submit a connection challenge
      operationId: submitConnectionChallenge
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionChallengeSubmit"
      responses:
        "200":
          description: Updated connection session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSessionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/channel-gateway/v1/connection-sessions/{session_id}:refresh:
    post:
      tags:
        - ConnectionSessions
      summary: Refresh a connection session
      operationId: refreshConnectionSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Refreshed connection session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSessionView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      description: Channel account identifier.
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      description: Connection session identifier.
      schema:
        type: string
  responses:
    BadRequest:
      description: The request cannot be completed in the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorResponse"
    Unauthorized:
      description: The user is not authenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorResponse"
    NotFound:
      description: The requested account or session does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorResponse"
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorResponse"
    InvalidRequest:
      description: The request parameters or body are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayErrorResponse"
  schemas:
    NotificationRetry:
      properties:
        idempotency_key:
          type: string
          maxLength: 128
          minLength: 1
          title: Idempotency Key
        confirm_duplicate_risk:
          type: boolean
          title: Confirm Duplicate Risk
          default: false
      additionalProperties: false
      type: object
      required:
        - idempotency_key
      title: NotificationRetry
    ConnectionSessionCreate:
      type: object
      additionalProperties: false
      required:
        - provider
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 32
          description: External chat channel provider identifier.
        create_new:
          type: boolean
          default: false
          description: Feishu only. Explicitly create another robot; incompatible with account_id and reauthorize.
        reauthorize:
          type: boolean
          default: false
          description: Feishu only. Request authorization for the required original account_id, without creating a robot.
        account_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Existing account owned by the current user.
        credentials:
          type: object
          additionalProperties: false
          required: [bot_id, secret]
          properties:
            bot_id:
              type: string
              minLength: 1
              maxLength: 256
            secret:
              type: string
              format: password
              minLength: 1
              maxLength: 4096
          description: Required for WeCom; prohibited for other providers.
    ConnectionChallengeSubmit:
      type: object
      required:
        - value
      properties:
        type:
          type: string
          default: numeric_code
          maxLength: 32
          description: Challenge type expected by the provider.
        value:
          type: string
          minLength: 1
          maxLength: 12
          description: Challenge response entered by the user.
    QRCodeView:
      type: object
      required:
        - payload
        - version
        - expires_at
      properties:
        payload:
          type: string
        version:
          type: integer
        expires_at:
          type: string
    ChallengeView:
      type: object
      required:
        - type
        - prompt
        - input_mode
      properties:
        type:
          type: string
        prompt:
          type: string
        input_mode:
          type: string
    NotificationTarget:
      type: object
      required: [recipient_id, label, available]
      properties:
        recipient_id: {type: string}
        label: {type: string}
        available: {type: boolean}
        kind: {type: string}
    AccountView:
      type: object
      required:
        - id
        - provider
        - label
        - status
        - runtime_status
        - connected_at
        - last_poll_at
        - last_message_at
        - last_error
        - updated_at
      properties:
        default_recipient_id:
          type: string
          default: ''
          description: Explicit default; existing task recipients remain unchanged.
        binding_status:
          type: string
          enum: [connected, paused, unbound]
        identity:
          type: object
          properties:
            app_id:
              type: string
            authorized_name:
              type: string
            authorized_id:
              type: string
          description: Non-secret Feishu application and authorizing user identifiers; unavailable legacy data is empty.

        id:
          type: string
        provider:
          type: string
        label:
          type: string
        status:
          type: string
          enum:
            - provisioning
            - connected
            - disconnected
        runtime_status:
          type: string
          enum:
            - stopped
            - starting
            - running
            - degraded
            - failed
        connected_at:
          type: string
          nullable: true
        last_poll_at:
          type: string
          nullable: true
        last_message_at:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        updated_at:
          type: string
    SessionErrorView:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ConnectionSessionView:
      type: object
      required:
        - id
        - provider
        - mode
        - status
        - revision
        - message
        - qr
        - challenge
        - poll_after_ms
        - allowed_actions
        - account
        - error
      properties:
        id:
          type: string
        provider:
          type: string
        mode:
          type: string
          enum:
            - qr_code
        status:
          type: string
          enum:
            - preparing
            - waiting_scan
            - scanned
            - verification_required
            - confirming
            - connected
            - expired
            - canceled
            - failed
        revision:
          type: integer
        message:
          type: string
        qr:
          allOf:
            - $ref: "#/components/schemas/QRCodeView"
          nullable: true
        challenge:
          allOf:
            - $ref: "#/components/schemas/ChallengeView"
          nullable: true
        poll_after_ms:
          type: integer
        allowed_actions:
          type: array
          items:
            type: string
            enum:
              - cancel
              - submit_challenge
              - refresh
        account:
          allOf:
            - $ref: "#/components/schemas/AccountView"
          nullable: true
        error:
          allOf:
            - $ref: "#/components/schemas/SessionErrorView"
          nullable: true
    AccountListView:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountView"
    GatewayErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/GatewayErrorView"
    GatewayErrorView:
      type: object
      required:
        - code
        - message
        - retryable
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
