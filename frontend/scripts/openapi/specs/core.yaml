                - description: Filter by exact algorithm id.
                  in: query
                  name: algorithm_id
                  required: false
                  schema:
                    type: string
                - description: Filter by live Router status; defaults to all.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - all
                        - starting
                        - active
                        - disabled
                        - missing
                    type: string
                - description: Optional Router admin origin override.
                  in: query
                  name: router_admin_url
                  required: false
                  schema:
                    type: string
                - description: Optional Router chat stream URL override.
                  in: query
