        get:
            description: Returns the full catalog entry including its latest version, download package URL/revision and sample questions. 404 when the item does not exist or is not published.
            parameters:
                - in: path
                  name: market_item_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledgeMarketDetailOpenAPIResponse'
                    description: Knowledge market item
            summary: Get knowledge market item details
            tags:
                - knowledge-market
    /api/core/knowledge-market/items/{market_item_id}:install:
        post:
            description: Enqueues a background install job that downloads the package, creates a personal dataset and submits every file to the parsing/vectorizing pipeline. Returns the job id; progress is polled via GET /knowledge-market/tasks/{job_id}. Conflicts with an in-flight install/update of the same item return 409.
            parameters:
                - in: path
                  name: market_item_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledgeMarketInstallOpenAPIResponse'
                    description: Install job enqueued
            summary: Install an official knowledge base
            tags:
                - knowledge-market
    /api/core/knowledge-market/items/{market_item_id}:update:
        post:
            description: 'Enqueues a background update job (strategy A: clear old documents then import the new package). No-change updates finish with updated=false and write nothing. Conflicts with an in-flight install/update of the same item return 409; not-installed items return 404.'
            parameters:
                - in: path
                  name: market_item_id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledgeMarketInstallOpenAPIResponse'
                    description: Update job enqueued
            summary: Update one installed official knowledge base
            tags:
                - knowledge-market
    /api/core/knowledge-market/tasks:
        get:
            description: Returns the current user's knowledge market tasks (default job type knowledge_market_install; pass job_type for update/update-all) with market item info and install-state enrichment.
            parameters:
                - in: query
                  name: page
                  required: false
                  schema:
                    type: integer
                - in: query
                  name: page_size
                  required: false
                  schema:
                    type: integer
                - description: Filter background tasks by async job status.
                  in: query
                  name: status
                  required: false
                  schema:
                    enum:
                        - pending
                        - running
                        - succeeded
                        - failed
                        - canceled
                    type: string
                - description: Async job type; defaults to knowledge_market_install.
                  in: query
                  name: job_type
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/knowledgeMarketTaskListOpenAPIResponse'
                    description: Background install task list
            summary: List background knowledge market tasks
            tags:
                - knowledge-market
    /api/core/knowledge-market/tasks/{job_id}:
        get:
            description: Returns one knowledge market task (install/update/update-all) with payload, result and the derived stage/overall progress. 404 when the job does not exist or belongs to another user.
            parameters:
                - in: path
                  name: job_id
