                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/agentRouterDeleteResponse'
                    description: Deleted Evo router algorithm
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/agentRouterErrorResponse'
                    description: Router management error
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/agentRouterErrorResponse'
