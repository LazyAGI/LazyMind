id: bid_tech_proposal_writer
name: 投标技术方案编写
description: >
  面向中文招标文件技术部分的内置九步工作流。按原始 bid-tech-proposal
  模式完成文件解析、技术要求与废标项提取、可追溯大纲、逐章正文、
  指定知识库资料检索、代码渲染架构图和 5–10 张差异化效果图、Markdown/Word
  导出及最终校验。大纲与正文复用 LazyMind Writer，并设人工审批点，支持卡片内
  编辑、版本修订和选区改写。

when_to_use: >
  当用户提供中文招标文件（优先支持 DOCX、PDF，也支持 TXT、Markdown、HTML、RTF），
  希望生成完整投标技术方案、技术标正文或可下载 Markdown/Word 技术方案时使用。
  启动前必须确认并绑定：招标文件、导出格式（md 或 docx）、目标总字数，以及是否
  使用内置 DOCX 默认投标样式。用户已明确的参数直接使用；缺少任意参数时一次性
  询问，例如“导出 Markdown 还是 Word？目标 5000/10000/20000/30000 字或其他字数？
  Word 是否使用默认投标样式（否则采用基础样式）？”，不要先启动再猜默认值。
  不用于仅编写商务报价、资质证明或制作 PPT 的请求。

tool_scripts:
  - path: scripts/pipeline_tools.py
    functions:
      - normalize_bid_parameters
      - parse_bid_document
      - extract_technical_requirements
      - extract_disqualification_items
      - validate_and_allocate_outline
      - validate_proposal_from_inputs
  - path: scripts/visual_renderer.py
    functions:
      - render_proposal_image
  - path: scripts/document_builder.py
    functions:
      - compose_proposal_from_inputs
  - path: scripts/writer_bridge.py
    functions:
      - bid_writer_prepare_context
      - bid_writer_generate_outline
      - bid_writer_save_validated_outline
      - bid_writer_save_effective_outline
      - bid_writer_read_markdown
      - bid_writer_update_context
      - bid_writer_plan_sections
      - bid_writer_write_sections
      - bid_writer_assemble_draft
      - bid_writer_revise_markdown
      - bid_writer_preview_selection_rewrite

artifact_actions:
  rewrite_selection:
    slots: [outline_document, draft_document]
    preview_tool: bid_writer_preview_selection_rewrite

steps:
  - id: parse_bid_document
    label: 招标文件解析
  - id: extract_tech_requirements
    label: 技术要求提取
  - id: extract_disqualification_items
    label: 废标项聚焦
  - id: search_reference_materials
    label: 知识库资料检索
  - id: build_chapter_outline
    label: 章节大纲撰写与审批
  - id: write_chapter_contents
    label: 完整正文撰写与审批
  - id: generate_proposal_images
    label: 架构图与效果图
  - id: compose_proposal_docx
    label: 技术方案导出
  - id: validate_proposal
    label: 文档结果校验

