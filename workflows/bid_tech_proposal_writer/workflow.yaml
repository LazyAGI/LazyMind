id: bid_tech_proposal_writer
name: 投标技术方案编写
description: >
  面向中文招标文件技术部分的内置九步工作流。按原始 bid-tech-proposal
  模式完成文件解析、技术要求与废标项提取、可追溯大纲、逐章正文、
  指定知识库资料检索、代码渲染架构图和 5–10 张差异化效果图、Markdown/Word
  导出及最终校验。大纲与正文复用 LazyMind Writer，并设人工审批点，支持卡片内
  编辑、版本修订和选区改写。

when_to_use: >
  当用户提供中文招标文件（优先支持 DOCX、PDF，也支持 TXT、Markdown、HTML、RTF），
  希望生成完整投标技术方案、技术标正文或可下载 Markdown/Word 技术方案时使用。
  启动前必须解析招标文件和目标总字数；缺少才提问。导出格式未指定时采用 DOCX，
  DOCX 未指定样式时采用默认投标样式，Markdown 不询问 DOCX 样式。
  效果图未指定数量时保留按正文自动规划，明确指定时遵守 1–10 张范围。
  用户已明确的参数直接使用，不重复提问；每次最多三个问题，不猜测必需参数。
  不用于仅编写商务报价、资质证明或制作 PPT 的请求。

runtime:
  execution:
    version: '1'
    skills:
    - scenario/execution.md
    constraints:
    - Follow the shared state.yml step specification, declared output schemas and acceptance criteria; preserve the
      user request and bound input revisions.
    - Validate actual artifacts before completion, honor questions and review pauses, and report missing capabilities
      without fabricating output.
    steps:
      parse_bid_document:
        tools: []
      extract_tech_requirements:
        tools: []
      extract_disqualification_items:
        tools: []
      search_reference_materials:
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
      build_chapter_outline:
        tools: []
      write_chapter_contents:
        tools: []
      generate_proposal_images:
        tools:
        - name: image_generator
          source: global
      compose_proposal_docx:
        tools: []
      validate_proposal:
        tools: []
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  clarification_fields:
    - id: bid_doc
      label: 招标文件
      question: 请上传本次需要依据的招标文件。
      reason: 需要依据招标原文提取技术要求，不能编造或猜测条款。
      type: single
      choice_policy: fixed
      allow_other: false
      choices: [上传招标文件]
      attachment:
        when_choice: 上传招标文件
        material_id: bid_doc
        accept: [.pdf, .docx, .doc, .txt, .md, .html, .rtf]
        max_files: 1
        required: true
    - id: output_format
      label: 导出格式
      default: docx
      choice_policy: fixed
      allow_other: false
      value_aliases: {Word: docx, DOCX: docx, Markdown: md}
      question: 请选择最终导出格式。
      type: single
      choices: [docx, md]
    - id: word_target
      label: 目标总字数
      required: true
      resolution: explicit
      reason: 目标字数决定技术方案的展开深度和章节预算。
      patterns: ['(?:摘要|abstract)[^0-9零一二三四五六七八九十百千万两，。；;\n]*[0-9.,，零一二三四五六七八九十百千万两]+\s*(?:字|词|words)|([0-9.,，零一二三四五六七八九十百千万两]+)\s*字']
      validation: {format: positive_integer, min: 1000, max: 500000, example: '例如：20000'}
      question: 请确认投标技术方案的目标总字数。
      type: single
      choices: ['5000', '10000', '20000', '30000']
    - id: use_default_docx_template
      label: DOCX 样式
      default: 'true'
      applies_when: {field: output_format, equals: docx}
      boolean_labels: {'yes': 使用默认投标样式, 'no': 使用基础样式}
      value_aliases: {'__ask_user_yes__': 'true', '__ask_user_no__': 'false', 使用默认投标样式: 'true', 使用基础样式: 'false'}
      question: 是否使用默认投标 DOCX 样式模板？
      type: boolean
      choices: [是, 否]
    - id: effect_image_count
      label: 效果图数量
      question: 希望生成多少张功能效果图？
      reason: 未指定时根据正文长度和实际功能自动规划，不额外询问。
      type: text
      patterns: ['([0-9]+)\s*张(?:功能)?效果图']
      validation: {format: positive_integer, min: 1, max: 10, example: '例如：5'}

tool_scripts:
  - path: scripts/pipeline_tools.py
    functions:
      - normalize_bid_parameters
      - parse_bid_document
      - extract_technical_requirements
      - extract_disqualification_items
      - normalize_bid_outline_from_inputs
      - validate_proposal_from_inputs
  - path: scripts/visual_renderer.py
    functions:
      - render_proposal_image
  - path: scripts/document_builder.py
    functions:
      - compose_proposal_from_inputs
  - path: scripts/writer_bridge.py
    functions:
      - bid_writer_prepare_context
      - bid_writer_generate_outline
      - bid_writer_save_validated_outline
      - bid_writer_save_effective_outline
      - bid_writer_read_markdown
      - bid_writer_update_context
      - bid_writer_plan_sections
      - bid_writer_write_sections
      - bid_writer_assemble_draft
      - bid_writer_revise_markdown

artifact_actions:
  rewrite_selection:
    slots: [outline_document, draft_document]
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1

steps:
  - id: parse_bid_document
    label: 招标文件解析
  - id: extract_tech_requirements
    label: 技术要求提取
  - id: extract_disqualification_items
    label: 废标项聚焦
  - id: search_reference_materials
    label: 知识库资料检索
  - id: build_chapter_outline
    label: 章节大纲撰写与审批
  - id: write_chapter_contents
    label: 完整正文撰写与审批
  - id: generate_proposal_images
    label: 架构图与效果图
  - id: compose_proposal_docx
    label: 技术方案导出
  - id: validate_proposal
    label: 文档结果校验

