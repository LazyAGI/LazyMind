id: bid_tech_proposal_writer
name: 投标技术方案编写
description: >
  面向中文招标文件技术部分的内置九步工作流。按原始 bid-tech-proposal
  模式完成文件解析、技术要求与废标项提取、可追溯大纲、逐章正文、
  指定知识库资料检索、代码渲染架构图和 5–10 张差异化效果图、Markdown/Word
  导出及最终校验。大纲与正文复用 LazyMind Writer，并设人工审批点，支持卡片内
  编辑、版本修订和选区改写。

when_to_use: >
  当用户提供中文招标文件（优先支持 DOCX、PDF，也支持 TXT、Markdown、HTML、RTF），
  希望生成完整投标技术方案、技术标正文或可下载 Markdown/Word 技术方案时使用。
  启动前必须解析招标文件和目标总字数；缺少才提问。导出格式未指定时采用 DOCX，
  DOCX 未指定样式时采用默认投标样式，Markdown 不询问 DOCX 样式。
  效果图未指定数量时保留按正文自动规划，明确指定时遵守 1–10 张范围。
  用户已明确的参数直接使用，不重复提问；每次最多三个问题，不猜测必需参数。
  不用于仅编写商务报价、资质证明或制作 PPT 的请求。

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      parse_bid_document:
        prompt: Read scenario/external.md and its parse_bid_document step contract from this pinned package. Complete 招标文件解析
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - generation_parameters
        - raw_bid_text
        - raw_bid_meta
        acceptance_criteria:
        - 'generation_parameters contains canonical md/docx output format, a valid integer word

          target and an explicit DOCX style mode. raw_bid_text contains substantive source text,

          and raw_bid_meta identifies the source filename, detected format, parser, section count

          and any honest warnings.'
      extract_tech_requirements:
        prompt: Read scenario/external.md and its extract_tech_requirements step contract from this pinned package. Complete
          技术要求提取 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - technical_requirements
        acceptance_criteria:
        - 'Every actionable requirement has one stable ID, evidence location, original

          excerpt and response suggestion. Every number and standard is source-grounded.'
      extract_disqualification_items:
        prompt: Read scenario/external.md and its extract_disqualification_items step contract from this pinned package.
          Complete 废标项聚焦 using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - disqualification_items
        acceptance_criteria:
        - 'Explicit rejection clauses and inferred risks are separated. Every D-NNN item has

          a source reference, response strategy and risk rating without invented conditions.'
      search_reference_materials:
        prompt: Read scenario/external.md and its search_reference_materials step contract from this pinned package. Complete
          知识库资料检索 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - knowledge_evidence
        - writing_task
        - resource_profiles
        - writing_context
        acceptance_criteria:
        - 'knowledge_evidence truthfully states the selected-KB evidence with available source

          labels/evidence identifiers, that no KB was selected, or the outcome of every attempted

          query when retrieval failed.

          writing_task, resource_profiles, and writing_context are real files authored by the external subagent and the
          Writer resources include the knowledge evidence.'
      build_chapter_outline:
        prompt: Read scenario/external.md and its build_chapter_outline step contract from this pinned package. Complete
          章节大纲与字数 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - outline_document
        - outline
        - outline_check_report
        - writing_context_after_outline
        acceptance_criteria:
        - 'outline_document is a real editable `.md` file authored and checked by the external subagent. outline_check_report
          begins with PASS; the normalized

          outline satisfies level, numbering, title, target allocation and complete ID coverage.

          writing_context_after_outline exists and preserves the selected knowledge-base

          evidence as fact `bid-selected-knowledge-evidence`. Revision internals are required

          only for an AI modification run; direct frontend edits remain human revisions of

          outline_document. After saving the editable outline, stop at the human approval

          checkpoint; do not start body drafting until the user saves any edits and clicks Continue.'
      write_chapter_contents:
        prompt: Read scenario/external.md and its write_chapter_contents step contract from this pinned package. Complete
          逐章正文编写 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - effective_outline
        - effective_outline_check_report
        - draft_document
        - writing_context_after_draft
        acceptance_criteria:
        - 'effective_outline_check_report begins with PASS. draft_document is one real editable

          Markdown file and writing_context_after_draft exists. Generation mode requires

          section_instructions and one ordered chapter_contents file per planned section;

          targeted revision mode requires all document_* revision internals. The final draft

          explicitly covers mapped IDs and follows the validated latest human/AI outline. After

          saving draft_document, stop at the human approval checkpoint; do not generate images

          or delivery files until the user saves any edits and clicks Continue.'
      generate_proposal_images:
        prompt: Read scenario/external.md and its generate_proposal_images step contract from this pinned package. Complete
          架构图与效果图 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - architecture_image
        - effect_images
        - image_manifest
        acceptance_criteria:
        - 'One real 1920x1080 architecture PNG exists. The effect PNG count matches the

          explicit effect_image_count, or the automatic 5–10 range when unspecified.

          Use distinct effect layout types, all images share one palette and the

          manifest order matches the effect_images order.'
      compose_proposal_docx:
        prompt: Read scenario/external.md and its compose_proposal_docx step contract from this pinned package. Complete
          技术方案导出 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - final_proposal_markdown
        - final_proposal
        acceptance_criteria:
        - 'final_proposal_markdown is complete and non-duplicated. final_proposal is one real,

          non-empty file matching generation_parameters.output_format. A DOCX export contains

          the complete body, updateable TOC and every selected architecture/effect image, and

          its style mode matches use_default_docx_template.'
      validate_proposal:
        prompt: Read scenario/external.md and its validate_proposal step contract from this pinned package. Complete 文档结果校验
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - validation_report
        - validation_summary
        acceptance_criteria:
        - 'validation_report and validation_summary are internally consistent, verify the actual

          selected Markdown or DOCX delivery file, and provide evidence for word count, chapters,

          ID coverage, disqualification responses and image count.'
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  clarification_fields:
    - id: bid_doc
      label: 招标文件
      question: 请上传本次需要依据的招标文件。
      reason: 需要依据招标原文提取技术要求，不能编造或猜测条款。
      type: single
      choice_policy: fixed
      allow_other: false
      choices: [上传招标文件]
      attachment:
        when_choice: 上传招标文件
        material_id: bid_doc
        accept: [.pdf, .docx, .doc, .txt, .md, .html, .rtf]
        max_files: 1
        required: true
    - id: output_format
      label: 导出格式
      default: docx
      choice_policy: fixed
      allow_other: false
      value_aliases: {Word: docx, DOCX: docx, Markdown: md}
      question: 请选择最终导出格式。
      type: single
      choices: [docx, md]
    - id: word_target
      label: 目标总字数
      required: true
      resolution: explicit
      reason: 目标字数决定技术方案的展开深度和章节预算。
      patterns: ['(?:摘要|abstract)[^0-9零一二三四五六七八九十百千万两，。；;\n]*[0-9.,，零一二三四五六七八九十百千万两]+\s*(?:字|词|words)|([0-9.,，零一二三四五六七八九十百千万两]+)\s*字']
      validation: {format: positive_integer, min: 1000, max: 500000, example: '例如：20000'}
      question: 请确认投标技术方案的目标总字数。
      type: single
      choices: ['5000', '10000', '20000', '30000']
    - id: use_default_docx_template
      label: DOCX 样式
      default: 'true'
      applies_when: {field: output_format, equals: docx}
      boolean_labels: {'yes': 使用默认投标样式, 'no': 使用基础样式}
      value_aliases: {'__ask_user_yes__': 'true', '__ask_user_no__': 'false', 使用默认投标样式: 'true', 使用基础样式: 'false'}
      question: 是否使用默认投标 DOCX 样式模板？
      type: boolean
      choices: [是, 否]
    - id: effect_image_count
      label: 效果图数量
      question: 希望生成多少张功能效果图？
      reason: 未指定时根据正文长度和实际功能自动规划，不额外询问。
      type: text
      patterns: ['([0-9]+)\s*张(?:功能)?效果图']
      validation: {format: positive_integer, min: 1, max: 10, example: '例如：5'}

tool_scripts:
  - path: scripts/pipeline_tools.py
    functions:
      - normalize_bid_parameters
      - parse_bid_document
      - extract_technical_requirements
      - extract_disqualification_items
      - normalize_bid_outline_from_inputs
      - validate_proposal_from_inputs
  - path: scripts/visual_renderer.py
    functions:
      - render_proposal_image
  - path: scripts/document_builder.py
    functions:
      - compose_proposal_from_inputs
  - path: scripts/writer_bridge.py
    functions:
      - bid_writer_prepare_context
      - bid_writer_generate_outline
      - bid_writer_save_validated_outline
      - bid_writer_save_effective_outline
      - bid_writer_read_markdown
      - bid_writer_update_context
      - bid_writer_plan_sections
      - bid_writer_write_sections
      - bid_writer_assemble_draft
      - bid_writer_revise_markdown

artifact_actions:
  rewrite_selection:
    slots: [outline_document, draft_document]
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1

