    cardinality: single
    external: true
    exposed: false
  - id: use_default_docx_template
    label: 使用默认 DOCX 样式
    type: text
    cardinality: single
    external: true
    exposed: false

  - id: generation_parameters
    label: 已确认生成参数
    type: json
    cardinality: single
    exposed: false

