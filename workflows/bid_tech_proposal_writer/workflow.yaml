ui:
  slots:
    raw_bid_text: {widgetType: text-markdown, readOnly: true, maxHeight: 560}
    raw_bid_meta: {widgetType: json-block, readOnly: true, collapsed: false}
    technical_requirements: {widgetType: text-markdown, readOnly: true}
    disqualification_items: {widgetType: text-markdown, readOnly: true}
    knowledge_evidence: {widgetType: text-markdown, readOnly: true}
    outline_document: {widgetType: file-card, readOnly: false}
    outline_check_report: {widgetType: text-markdown, readOnly: true}
    effective_outline_check_report: {widgetType: text-markdown, readOnly: true}
    chapter_contents: {widgetType: file-card, readOnly: true}
    draft_document: {widgetType: file-card, readOnly: false}
    architecture_image: {widgetType: image-gallery, readOnly: true, itemWidth: 720, itemHeight: 405}
    effect_images: {widgetType: image-gallery, readOnly: true, itemLayout: grid, gridMaxCols: 2, itemWidth: 520, itemHeight: 292}
    image_manifest: {widgetType: json-block, readOnly: true, collapsed: true}
    final_proposal_markdown: {widgetType: file-card, readOnly: true}
    final_proposal: {widgetType: file-card, readOnly: true}
    validation_report: {widgetType: text-markdown, readOnly: true}
    validation_summary: {widgetType: json-block, readOnly: true, collapsed: false}
  tabs:
    - id: parse
      step_id: parse_bid_document
      label: 文件解析
      layout: composite
      slots: [{id: raw_bid_text}, {id: raw_bid_meta}]
      composite_layout:
        direction: row
        children:
          - {slot: raw_bid_text, weight: 2}
          - {slot: raw_bid_meta, weight: 1}
    - id: requirements
      step_id: extract_tech_requirements
      label: 技术要求
      layout: list
      slots: [{id: technical_requirements}]
    - id: disqualification
      step_id: extract_disqualification_items
      label: 废标项
      layout: list
      slots: [{id: disqualification_items}]
    - id: knowledge
      step_id: search_reference_materials
      label: 资料检索
      layout: list
      slots: [{id: knowledge_evidence}]
    - id: outline
      step_id: build_chapter_outline
      label: 大纲撰写与审批
      layout: composite
      slots: [{id: outline_document}, {id: outline_check_report}]
      composite_layout:
        direction: row
        children:
          - {slot: outline_document, weight: 2}
          - {slot: outline_check_report, weight: 1}
    - id: chapters
      step_id: write_chapter_contents
      label: 正文撰写与审批
      layout: list
      slots: [{id: draft_document}, {id: chapter_contents}, {id: effective_outline_check_report}]
    - id: images
      step_id: generate_proposal_images
      label: 方案配图
      layout: grid
      grid_cols: 2
      slots: [{id: architecture_image}, {id: effect_images}, {id: image_manifest}]
    - id: delivery
      step_id: compose_proposal_docx
      label: 方案交付
      layout: list
      slots: [{id: final_proposal_markdown}]
    - id: validation
      step_id: validate_proposal
      label: 结果校验
      layout: composite
      slots: [{id: final_proposal}, {id: validation_report}, {id: validation_summary}]
      composite_layout:
        direction: row
        children:
          - {slot: final_proposal, weight: 1}
          - direction: column
            weight: 2
            children:
              - {slot: validation_report, weight: 2}
              - {slot: validation_summary, weight: 1}

i18n:
  zh-CN:
    name: 投标技术方案编写
