    type: file
    cardinality: single
    exposed: false
  - id: outline_modify_plan
    label: 大纲修改计划
    type: file
    cardinality: single
    exposed: false
  - id: outline_revision_set
    label: 大纲修改集
    type: file
    cardinality: single
    exposed: false
  - id: outline_revision_result
