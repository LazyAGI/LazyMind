initial: __start__
start_route: all

transitions:
  __start__: [{to: parse_bid_document}]
  parse_bid_document:
    - {to: extract_tech_requirements}
    - {to: extract_disqualification_items}
  extract_tech_requirements: [{to: search_reference_materials}]
  extract_disqualification_items: [{to: search_reference_materials}]
  search_reference_materials: [{to: build_chapter_outline}]
  build_chapter_outline: [{to: write_chapter_contents}]
  write_chapter_contents: [{to: generate_proposal_images}]
  generate_proposal_images: [{to: compose_proposal_docx}]
  compose_proposal_docx: [{to: validate_proposal}]
  validate_proposal: [{to: __end__}]

steps:
  parse_bid_document:
    label: 招标文件解析
    prompt: |
      {{runtime_instruction}}

      Execute step 1 of the bid-tech-proposal pipeline. All required external inputs were
      collected by Workflow preflight before this Session was created. First call
      normalize_bid_parameters(output_format=<output_format>, word_target=<word_target>,
      use_default_docx_template=<use_default_docx_template>). Do not infer or silently
      default a value. Save the returned canonical object as generation_parameters with
      content_type="json" together with this step's parsing artifacts.

      The Runtime Parameters section
      contains remote_inputs, a mapping from material id to the actual local input path.
      Take remote_inputs.bid_doc exactly as supplied; never guess, rewrite, or reuse a
      path from the source skill.

      Call parse_bid_document(input_path=<remote_inputs.bid_doc>). The tool performs the
      format-specific deterministic parsing. Save the returned raw_text as raw_bid_text
      with content_type="text" and returned metadata as raw_bid_meta with
      content_type="json" in one save_artifacts call together with generation_parameters.
      Preserve full source clauses,
      headings, numbered paragraphs, table rows and page markers. Do not replace the
      parsed text with a summary and do not claim an unavailable parser was used.
    tools: [normalize_bid_parameters, parse_bid_document]
    inputs:
      - material: bid_doc
        required: true
      - material: output_format
        required: true
      - material: word_target
        required: true
      - material: use_default_docx_template
        required: true
    outputs:
      - material: generation_parameters
      - material: raw_bid_text
      - material: raw_bid_meta
    acceptance_criteria: |
      generation_parameters contains canonical md/docx output format, a valid integer word
      target and an explicit DOCX style mode. raw_bid_text contains substantive source text,
      and raw_bid_meta identifies the source filename, detected format, parser, section count
      and any honest warnings.

  extract_tech_requirements:
    label: 技术要求提取
    prompt: |
      {{runtime_instruction}}

      Execute step 2. Read raw_bid_text, then call
      extract_technical_requirements(raw_text=<complete parsed text>). Treat the script
      result as a deterministic candidate set and review it as a solution expert:

      - retain stable IDs in the BG/FUNC/PERF/SEC/SVC/IMPL-NNN namespaces;
      - retain source line/page/section, trigger words, exact numbers, cited standards,
        policy references, minimum original excerpt and suggested response chapter;
      - add an actually missed actionable requirement only when it is present verbatim
        in raw_bid_text; never invent a metric, standard or product capability;
      - assign one primary category to each source paragraph and remove duplicates.

      Save one complete Markdown artifact as technical_requirements with
      content_type="text". This ID pool is authoritative for the outline and body.
    tools: [extract_technical_requirements]
    inputs:
      - material: raw_bid_text
        required: true
      - material: raw_bid_meta
        required: true
    outputs:
      - material: technical_requirements
    acceptance_criteria: |
      Every actionable requirement has one stable ID, evidence location, original
      excerpt and response suggestion. Every number and standard is source-grounded.

  extract_disqualification_items:
    label: 废标项聚焦
    prompt: |
      {{runtime_instruction}}

      Execute step 3. Read raw_bid_text and call
      extract_disqualification_items(raw_text=<complete parsed text>). Review the
      deterministic scan using the original skill's rules: explicit "废标/否决/否则视为
      不响应/不接受偏离/★" clauses belong in the explicit section; ordinary mandatory,
      qualification, schedule, service and security wording belongs in high-risk
      reminders unless the source states a rejection consequence.

      Preserve D-NNN IDs, original clause number/page, a minimal exact excerpt, critical
      numbers, category, 1–5 star risk, required response and proposed outline location.
      Merge duplicates without losing the strongest evidence. Save one Markdown artifact
      as disqualification_items with content_type="text".

    tools: [extract_disqualification_items]
    inputs:
      - material: raw_bid_text
        required: true
    outputs:
      - material: disqualification_items
    acceptance_criteria: |
      Explicit rejection clauses and inferred risks are separated. Every D-NNN item has
      a source reference, response strategy and risk rating without invented conditions.

  search_reference_materials:
    label: 知识库资料检索
    prompt: |
      {{runtime_instruction}}

      Execute step 4 as the proposal evidence-enrichment stage. The kb framework receives
      the knowledge bases selected in the parent chat through its runtime filters. Never
      call list_knowledge_bases, never choose or enumerate a knowledge base yourself, never
      pass guessed kb_ids, and never use web search. Search only the implicit selected scope.

      Read raw_bid_text, technical_requirements, and disqualification_items. If one or more
      knowledge bases were selected for this conversation, perform multiple complementary
      kb_search calls as needed, normally 2–4, to cover distinct evidence needs derived from
      the tender requirements. Each query must express one natural-language intent, such as
      relevant reference solutions, matching product capabilities, implementation practices,
      or service and security evidence. Base every query on the project name, construction
      objective, and requirement IDs rather than a comma-separated keyword/topic list. Keep
      each query under 120 Chinese characters, avoid duplicate queries, and use the tool's
      default retrieval and reranking sizes; do not pass kb_ids, filters, retriever_topk,
      rerank_topk, k_max, or image_topk. Consolidate only retrieved evidence that can improve
      the proposal, retaining document/source labels and evidence identifiers exposed by every
      useful tool result. The runtime collects clickable sources separately for the Task card,
      so do not invent inline citation markers that the tool did not return. Clearly separate
      retrieved facts from solution recommendations and do not turn unsupported knowledge
      into a mandatory tender requirement.

      If kb_search is unavailable or reports that no knowledge base is selected, do not
      discover a replacement knowledge base. Save exactly one short Markdown artifact
      explaining that no knowledge base was specified and that this run will use the tender
      document only. If an individual search fails, record that failure, continue with other
      distinct evidence queries, and retry the same query at most once only when the error is
      transient. In every branch save the combined successful evidence and any failure notes
      as knowledge_evidence with content_type="text"; this output must always exist so the
      pipeline remains deterministic.

      Then call bid_writer_prepare_context(user_request="{{user_input}}",
      requirements_markdown=<technical_requirements artifact path>,
      disqualification_markdown=<disqualification_items artifact path>,
      word_target=<generation_parameters artifact path>,
      knowledge_text=<knowledge_evidence artifact path>). Pass the bound paths directly;
      do not copy large artifact bodies or manually parse generation_parameters in the Agent.
      The business bridge accepts both paths and inline values for backward compatibility. This is the only
      preparation path for later outline and drafting: it delegates task construction,
      resource profiling, and writing context to LazyMind's shared Writer capability.
      Save the three returned paths as writing_task, resource_profiles, and writing_context
      with content_type="file". Never recreate Writer schemas in the model or save a
      returned path as text.
    tools: [kb, bid_writer_prepare_context]
    inputs:
      - material: raw_bid_text
        required: true
      - material: technical_requirements
        required: true
      - material: disqualification_items
        required: true
      - material: generation_parameters
        required: true
    outputs:
      - material: knowledge_evidence
      - material: writing_task
      - material: resource_profiles
      - material: writing_context
    acceptance_criteria: |
      knowledge_evidence truthfully states the selected-KB evidence with available source
      labels/evidence identifiers, that no KB was selected, or the outcome of every attempted
      query when retrieval failed.
      writing_task, resource_profiles, and writing_context are real files returned by the
      shared Writer capability and the Writer resources include the knowledge evidence.

  build_chapter_outline:
    label: 章节大纲与字数
    mode: human
    rerun_when: >
      用户要求重新生成、调整或局部修改当前章节大纲。人工在卡片中保存的
      outline_document 修订也是后续步骤唯一应读取的最新大纲。
    prompt: |
      {{runtime_instruction}}

      Execute step 5 with LazyMind's shared Writer outline capability while preserving the
      bid-specific validation contract. Every Writer tool returns a real local path; save
      it with content_type="file" and never save the path string as text.

      Retrieve writing_task, writing_context, and the latest selected outline_document when
      it exists. Large requirement and parameter bodies are already bound to this Attempt;
      never read, copy, reconstruct, or pass their JSON/text through the model.
      Select exactly one mode:

      A. First generation or complete regeneration: call bid_writer_generate_outline with
         writing_task and writing_context. Its returned Markdown is a Writer-generated seed.
      B. Targeted AI modification: call bid_writer_revise_markdown with the latest selected
         outline_document, writing_context, the current instruction, and
         document_slot="outline_document". Save returned revision internals under the
         outline_* optional slots, and use its returned outline_document as the seed.

      Do not execute both modes in one run. Call normalize_bid_outline_from_inputs exactly
      once with outline_document_path=<the selected seed path>. This business adapter reads
      the bound source paths directly, treats current Markdown headings as authoritative,
      normalizes relative heading levels/numbering, allocates the confirmed target, removes
      unknown IDs, and deterministically fills missing requirement/disqualification mappings.
      Do not manually parse headings or retry validation in the Agent.

      Call bid_writer_save_validated_outline with the returned normalized_outline. This
      creates the canonical editable outline_document.md as clean user-facing Markdown;
      keep trace and word-allocation metadata in the structured outline artifact rather
      than HTML comments. Then call bid_writer_update_context using this canonical outline
      and writing_context.

      Save the canonical path as outline_document with content_type="file", the normalized
      object as outline with content_type="json", the report as outline_check_report with
      content_type="text", and the updated context path as
      writing_context_after_outline with content_type="file". Every successful rerun writes
      a new revision of the same outline_document slot; never create another visible outline.
    tools:
      - bid_writer_generate_outline
      - bid_writer_revise_markdown
      - normalize_bid_outline_from_inputs
      - bid_writer_save_validated_outline
      - bid_writer_update_context
    inputs:
      - material: writing_task
        required: true
      - material: writing_context
        required: true
      - material: knowledge_evidence
        required: true
      - material: technical_requirements
        required: true
      - material: disqualification_items
        required: true
      - material: generation_parameters
        required: true
    outputs:
      - material: outline_document
      - material: outline
      - material: outline_check_report
      - material: writing_context_after_outline
      - material: outline_revision_task
        required: false
      - material: outline_locate_result
        required: false
      - material: outline_modify_plan
        required: false
      - material: outline_revision_set
        required: false
      - material: outline_revision_result
        required: false
    acceptance_criteria: |
      outline_document is a real editable `.md` file produced through the shared Writer
      planner or revision path. outline_check_report begins with PASS; the normalized
      outline satisfies level, numbering, title, target allocation and complete ID coverage.
      writing_context_after_outline exists and preserves the selected knowledge-base
      evidence as fact `bid-selected-knowledge-evidence`. Revision internals are required
      only for an AI modification run; direct frontend edits remain human revisions of
      outline_document. After saving the editable outline, stop at the human approval
      checkpoint; do not start body drafting until the user saves any edits and clicks Continue.

  write_chapter_contents:
    label: 逐章正文编写
    mode: human
    rerun_when: >
      用户要求修改、扩写、缩写或重写当前 draft_document，包括对文字、章节、
      表格、图片说明或插入位置的修改。
    prompt: |
      {{runtime_instruction}}

      Execute step 6 through LazyMind's shared Writer planning, streaming drafting, and
      revision capabilities. The latest selected outline_document is authoritative,
      including any human revision saved in the frontend. Retrieve it together with
      writing_task, writing_context_after_outline, knowledge_evidence, technical_requirements,
      disqualification_items, generation_parameters, and the latest selected draft_document
      when one exists. Use generation_parameters.word_target for allocation and validation.
      First call normalize_bid_outline_from_inputs exactly once with the latest selected
      outline_document path. The adapter reads bound requirements, disqualification items,
      and generation parameters directly and deterministically rebuilds the private contract;
      do not read or reconstruct those JSON bodies in the Agent and do not retry validation.
      Call bid_writer_save_effective_outline with the returned normalized_outline, then save its
      returned JSON file path as effective_outline with content_type="file" and save the
      report as effective_outline_check_report. Never save effective_outline as inline JSON,
      and never reuse the old structure when a human has changed the Markdown outline.

      Select exactly one writing mode:

      A. Generate or fully rewrite from the selected outline:
         1. Call bid_writer_update_context with the latest outline_document and the baseline
            writing_context_after_outline.
         2. Call bid_writer_plan_sections with writing_task_path=writing_task,
            outline_document_path=outline_document,
            writing_context_path=<the path returned by step 1>, and
            effective_outline_path=effective_outline. The bridge injects the exact ordered
            leaf headings and target_words into the shared Writer plan. Save
            section_instructions as a file.
         3. Call bid_writer_write_sections with writing_task_path=writing_task,
            section_instructions_path=section_instructions,
            writing_context_path=<the path returned by step 1>, and
            effective_outline_path=effective_outline. It delegates drafting and live preview
            to LazyMind Writer, then deterministically canonicalizes compatible heading
            variants, preserves completed prose, and inserts visible placeholders for a
            missing leaf instead of throwing away the draft. A short draft remains available
            for approval and is reported by final validation; text above target is allowed. Save every
            returned path as a separate, ordered chapter_contents file artifact; never
            stringify the path list.
         4. Call bid_writer_assemble_draft with
            draft_sections_anchor_path=<one returned section path>,
            writing_context_path=<the path returned by step 1>,
            outline_document_path=outline_document, and
            document_title="" so the shared Writer derives the exact H1 title from
            outline_document instead of risking a project-name mismatch.
            Save its path as draft_document with content_type="file".

      B. Targeted AI revision of an existing draft_document:
         Call bid_writer_revise_markdown with the latest selected draft_document, the latest
         writing context, the current instruction, and document_slot="draft_document".
         Save its document_* internals and returned draft_document path. Do not regenerate
         section instructions or chapter files in this mode.

      Do not run generation and targeted revision in one execution. A direct frontend edit
      creates a human revision of the same draft_document slot and requires no hidden copy.

      Writer generation must still obey the bid contract carried in writing_task/context:
      each leaf explicitly covers its mapped IDs, retains a compact “追溯：ID...” line,
      treats target_words as a minimum rather than a maximum, and uses solution-expert
      language with no invented number, first person, requirement-echo opening, vague
      promise, or defensive wording.
      The section plan and draft must use relevant concrete facts from
      `bid-selected-knowledge-evidence` in the architecture, platform, data-governance,
      security, and operations sections. Do not merely mention that knowledge was retrieved,
      and do not force irrelevant evidence into a section.

      The effective outline is authoritative for structure. Every leaf must appear in the
      same order as one independent exact Markdown heading at its mapped H3/H4/H5 level;
      never add title suffixes, merge leaves, or replace a leaf heading with bold text.
      Call the expensive section planner and drafting tool at most once in this Attempt.
      Do not regenerate because of heading variation, missing leaf separation, or word-count
      shortfall; deterministic adapters preserve the result and final validation reports
      remaining quality gaps. If a real Writer/provider error occurs, keep checkpoint inputs
      unchanged so a later retry can resume completed sections.

      Finally call bid_writer_update_context with the final draft_document and the refreshed
      outline context. Save its path as writing_context_after_draft. Every returned Writer
      path must be saved with content_type="file".
    tools:
      - normalize_bid_outline_from_inputs
      - bid_writer_save_effective_outline
      - bid_writer_update_context
      - bid_writer_plan_sections
      - bid_writer_write_sections
      - bid_writer_assemble_draft
      - bid_writer_revise_markdown
    inputs:
      - material: outline_document
        required: true
      - material: writing_task
        required: true
      - material: writing_context_after_outline
        required: true
      - material: knowledge_evidence
        required: true
      - material: technical_requirements
        required: true
      - material: disqualification_items
        required: true
      - material: generation_parameters
        required: true
    outputs:
      - material: effective_outline
      - material: effective_outline_check_report
      - material: section_instructions
        required: false
      - material: chapter_contents
        required: false
      - material: draft_document
      - material: writing_context_after_draft
      - material: document_revision_task
        required: false
      - material: document_locate_result
        required: false
      - material: document_modify_plan
        required: false
      - material: document_revision_set
        required: false
      - material: document_revision_result
        required: false
    acceptance_criteria: |
      effective_outline_check_report begins with PASS. draft_document is one real editable
      Markdown file and writing_context_after_draft exists. Generation mode requires
      section_instructions and one ordered chapter_contents file per planned section;
      targeted revision mode requires all document_* revision internals. The final draft
      explicitly covers mapped IDs and follows the validated latest human/AI outline. After
      saving draft_document, stop at the human approval checkpoint; do not generate images
      or delivery files until the user saves any edits and clicks Continue.

  generate_proposal_images:
    label: 架构图与效果图
    prompt: |
      {{runtime_instruction}}

      Execute step 7 using local code only. Never call a text-to-image or image-generation
      model. Retrieve the latest selected draft_document, resolve its local path, and read
      it with bid_writer_read_markdown. Derive truthful JSON specs from effective_outline,
      requirements, and that latest editable body.

      First call render_proposal_image once with image_type="architecture" for a
      4–6-layer system architecture and save its real PNG path as architecture_image.
      Then select 5–10 effect types that match actual project functions from dashboard,
      workbench, list, form, approval, analytics, mobile, admin, login and flow. Use at
      least five distinct types; every image's main block, information density and visual
      focus must differ from the others. Call render_proposal_image once per effect.

      All specs use color_scheme="blue", 1920x1080, concise Chinese labels and only
      source-grounded metrics. Save every returned effect PNG as one ordered effect_images
      item with a distinct caption. Save image_manifest as JSON containing architecture
      metadata and the ordered effect entries (type, title, source_chapter, filename).
      PNG paths must be saved with content_type="image" and source_tool="render_proposal_image";
      never save spec JSON, HTML, SVG or placeholder text in an image slot.
    tools: [bid_writer_read_markdown, render_proposal_image]
    inputs:
      - material: effective_outline
        required: true
      - material: technical_requirements
        required: true
      - material: draft_document
        required: true
    outputs:
      - material: architecture_image
      - material: effect_images
      - material: image_manifest
    acceptance_criteria: |
      One real 1920x1080 architecture PNG and 5–10 real 1920x1080 effect PNGs exist.
      At least five effect layout types are used, all images share one palette and the
      manifest order matches the effect_images order.

  compose_proposal_docx:
    label: 技术方案导出
    prompt: |
      {{runtime_instruction}}

      Execute step 8 deterministically. Call compose_proposal_from_inputs exactly once with
      no document content arguments. The Workflow-local tool reads the immutable paths bound
      to this Attempt, preserves the latest user-approved draft, consumes every ordered
      effect_images list item, inserts the image section when needed, and applies
      generation_parameters.output_format and use_default_docx_template.

      Save result.final_markdown as final_proposal_markdown with content_type="file" and
      result.final_proposal as final_proposal with content_type="file" in one save_artifacts
      call. Never read or copy the full draft, requirement lists, outline, image manifest or
      binary data through the model. Never store a path string as text or a base64 placeholder.
    tools: [compose_proposal_from_inputs]
    inputs:
      - material: effective_outline
        required: true
      - material: draft_document
        required: true
      - material: architecture_image
        required: true
      - material: effect_images
        required: true
      - material: image_manifest
        required: true
      - material: technical_requirements
        required: true
      - material: disqualification_items
        required: true
      - material: generation_parameters
        required: true
    outputs:
      - material: final_proposal_markdown
      - material: final_proposal
    acceptance_criteria: |
      final_proposal_markdown is complete and non-duplicated. final_proposal is one real,
      non-empty file matching generation_parameters.output_format. A DOCX export contains
      the complete body, updateable TOC and every selected architecture/effect image, and
      its style mode matches use_default_docx_template.

  validate_proposal:
    label: 文档结果校验
    prompt: |
      {{runtime_instruction}}

      Execute step 9 deterministically. Call validate_proposal_from_inputs exactly once with
      no arguments. The Workflow-local tool reads the immutable files bound to this Attempt;
      never read, echo, reconstruct or pass full document content or binary data through the
      model. Save returned report as validation_report with
      content_type="text" and returned summary as validation_summary with
      content_type="json" in one call.

      Report overall and per-leaf Chinese-character attainment, missing headings,
      uncovered requirement IDs, uncovered D-NNN items, selected delivery-file validity and
      actionable remediation. For DOCX also validate the Office package and embedded-image
      count; for Markdown validate that the file matches the final Markdown exactly. A total
      word count below the user's minimum target, any missing leaf, any uncovered
      explicit rejection item, fewer than six generated images, or an invalid selected
      delivery file must not be PASS. Text above the minimum target is valid and must not
      lower the status by itself.
    tools: [validate_proposal_from_inputs]
    inputs:
      - material: final_proposal_markdown
        required: true
      - material: final_proposal
        required: true
      - material: effective_outline
        required: true
      - material: technical_requirements
        required: true
      - material: disqualification_items
        required: true
      - material: generation_parameters
        required: true
      - material: image_manifest
        required: true
    outputs:
      - material: validation_report
      - material: validation_summary
    acceptance_criteria: |
      validation_report and validation_summary are internally consistent, verify the actual
      selected Markdown or DOCX delivery file, and provide evidence for word count, chapters,
      ID coverage, disqualification responses and image count.
