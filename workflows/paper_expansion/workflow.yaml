id: paper_expansion
name: 论文自动拓展
description: 承接记录中已确认的研究范围，四步自动检索、筛选、分层阅读和证据核验。临时阅读不自动入库。
when_to_use: 仅在拓展记录已经确定方向后执行（单一方向自动确定，多方向由用户确认）；继续同一范围或调整结果表达沿用原记录。
runtime:
  transactional_outputs: true
  publisher_owned_slots:
  - expansion_plan
  - candidate_set
  - relation_analysis
  - expansion_result
  - expansion_report
  host_extensions:
  - academic-paper-chat-v1
  trigger_inputs:
  - expansion_id
  completed_edit_step: compose_result
  completed_continue_steps:
  - expand_and_screen
  completed_edit_routing: 同一范围继续查找回到 expand_and_screen；仅调整表达回到 compose_result；实质改变主题或方向时返回拓展记录准备并确认，不在正式
    Workflow 内决策方向。
  execution_limits:
    prepare_plan:
      rounds: 12
      tool_calls:
        academic_search_papers: 6
    expand_and_screen:
      rounds: 32
      tool_calls:
        academic_search_papers: 24
    analyze_relations:
      rounds: 32
      tool_calls:
        academic_read_paper: 48
        academic_submit_relations: 2
    compose_result:
      rounds: 8
  post_step_checks:
  - step_id: prepare_plan
    tool: academic_validate_stage
    arguments:
      result: expansion_plan
  - step_id: expand_and_screen
    tool: academic_validate_stage
    arguments:
      result: candidate_set
  - step_id: compose_result
    tool: academic_validate_result
    arguments:
      result: expansion_result
tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_expansion_context
  - academic_search_papers
  - academic_read_paper
  - academic_publish_stage
  - academic_submit_relations
  - academic_publish_expansion_result
  - academic_validate_stage
  - academic_validate_result
steps:
- id: prepare_plan
  label: 准备参考论文与检索计划
- id: expand_and_screen
  label: 拓展与筛选
- id: analyze_relations
  label: 分析论文关系
- id: compose_result
  label: 研究报告与阅读导图
slots:
- id: expansion_id
  label: 任务定位
  type: text
  cardinality: single
  external: true
  exposed: false
- id: expansion_plan
  label: 准备参考论文与检索计划
  type: json
  cardinality: single
  exposed: true
- id: candidate_set
  label: 拓展与筛选
  type: json
  cardinality: single
  exposed: true
- id: relation_analysis
  label: 分析论文关系
  type: json
  cardinality: single
  exposed: true
- id: expansion_result
  label: 论文清单
  type: json
  cardinality: single
  exposed: true
- id: expansion_report
  label: 研究报告与阅读导图
  type: json
  cardinality: single
  exposed: true
ui:
  slots:
    expansion_plan:
      widgetType: json-block
      readOnly: true
    candidate_set:
      widgetType: json-block
      readOnly: true
    relation_analysis:
      widgetType: json-block
      readOnly: true
    expansion_result:
      widgetType: json-block
      readOnly: true
    expansion_report:
      widgetType: json-block
      readOnly: true
  tabs:
  - id: prepare_plan
    step_id: prepare_plan
    label: 准备参考论文与检索计划
    layout: list
    slots:
    - id: expansion_plan
  - id: expand_and_screen
    step_id: expand_and_screen
    label: 拓展与筛选
    layout: list
    slots:
    - id: candidate_set
  - id: analyze_relations
    step_id: analyze_relations
    label: 分析论文关系
    layout: list
    slots:
    - id: relation_analysis
  - id: compose_result
    step_id: compose_result
    label: 研究报告与阅读导图
    layout: list
    slots:
    - id: expansion_report
    - id: expansion_result
