id: paper_expansion
name: 论文自动拓展
description: 承接已确认的研究范围，检索并交付论文清单，深入研究进一步生成研究报告与论文关系。
when_to_use: 仅在拓展记录已经确定方向后执行（按启动时所选策略全选方向或等待人工确认）；继续同一范围或调整结果表达沿用原记录。
runtime:
  transactional_outputs: true
  publisher_owned_slots:
  - candidate_set
  - screened_candidates
  - screened_list_ready
  - expansion_list_ready
  - relation_analysis
  - expansion_result
  - expansion_report
  host_extensions:
  - academic-paper-chat-v2
  trigger_inputs:
  - expansion_id
  completed_continue_steps:
  - expand_and_screen
  completed_edit_routing: 同一范围继续查找回到 expand_and_screen；报告根据有依据的研究发现撰写，不支持独立改写保存的报告。正式执行后实质改变主题或方向时新建调研任务；仅初步调研阶段支持在原记录调整范围。
  execution_limits:
    expand_and_screen:
      rounds: 32
      tool_calls:
        academic_search_papers: 24
    screen_and_supplement:
      rounds: 12
      tool_calls:
        academic_search_papers: 8
        academic_read_paper: 5
    analyze_relations:
      rounds: 32
      tool_calls:
        academic_read_paper: 48
        academic_search_papers: 8
  post_step_checks:
  - step_id: expand_and_screen
    tool: academic_validate_stage
    arguments:
      result: candidate_set
  - step_id: screen_and_supplement
    tool: academic_validate_stage
    arguments:
      result: screened_candidates
  - step_id: analyze_relations
    tool: academic_validate_relations
    arguments:
      result: relation_analysis
  - step_id: analyze_relations
    tool: academic_validate_result
    arguments:
      result: expansion_result
tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_expansion_context
  - academic_search_papers
  - academic_read_paper
  - academic_publish_stage
  - academic_submit_relations
  - academic_validate_stage
  - academic_validate_result
  - academic_validate_relations
steps:
- id: expand_and_screen
  label: 检索与拓展
- id: screen_and_supplement
  label: 筛选与补充
- id: analyze_relations
  label: 研究分析与报告
slots:
- id: expansion_id
  label: 任务定位
  type: text
  cardinality: single
  external: true
  exposed: false
- id: candidate_set
  label: 检索与拓展
  type: json
  cardinality: single
  exposed: true
- id: screening_not_required
  label: 跳过独立筛选
  type: json
  cardinality: single
  external: true
  required: false
  exposed: false
- id: analysis_not_required
  label: 跳过研究分析与报告
  type: json
  cardinality: single
  external: true
  required: false
  exposed: false
- id: screened_candidates
  label: 筛选与补充
  type: json
  cardinality: single
  exposed: true
- id: screened_list_ready
  label: 筛选清单完成
  type: json
  cardinality: single
  exposed: false
- id: relation_analysis
  label: 研究分析与报告
  type: json
  cardinality: single
  exposed: true
- id: expansion_list_ready
  label: 论文清单完成
  type: json
  cardinality: single
  exposed: false
- id: expansion_result
  label: 论文清单
  type: json
  cardinality: single
  exposed: true
- id: expansion_report
  label: 研究报告
  type: json
  cardinality: single
  exposed: true
ui:
  slots:
    candidate_set:
      widgetType: json-block
      readOnly: true
    screened_candidates:
      widgetType: json-block
      readOnly: true
    relation_analysis:
      widgetType: json-block
      readOnly: true
    expansion_result:
      widgetType: json-block
      readOnly: true
    expansion_report:
      widgetType: json-block
      readOnly: true
  tabs:
  - id: expand_and_screen
    step_id: expand_and_screen
    label: 检索与拓展
    layout: list
    slots:
    - id: candidate_set
  - id: screen_and_supplement
    step_id: screen_and_supplement
    hide_when_material: screening_not_required
    label: 筛选与补充
    layout: list
    slots:
    - id: screened_candidates
  - id: analyze_relations
    step_id: analyze_relations
    hide_when_material: analysis_not_required
    label: 研究分析与报告
    layout: list
    generation_process: {result_slot: expansion_report, slots: [relation_analysis]}
    slots:
    - id: relation_analysis
    - id: expansion_report
    - id: expansion_result
