id: paper_expansion
name: 论文自动拓展
description: 承接已确认的研究范围，检索并交付论文清单，深入研究进一步生成研究报告与论文关系。
when_to_use: 仅在拓展记录已经确定方向后执行（按启动时所选策略全选方向或等待人工确认）；继续同一范围或调整结果表达沿用原记录。
runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      expand_and_screen:
        prompt: Read scenario/external.md and its expand_and_screen step contract from this pinned package. Retrieve real
          candidates for every confirmed direction; preserve all seed papers. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_expansion
          source: package
        - name: academic_search_papers
          source: package
        - name: academic_read_paper
          source: package
        - name: academic_resolve_papers
          source: package
        required_outputs:
        - candidate_set
        acceptance_criteria:
        - 保留确认范围、全部种子和真实登记的候选；快速档交付带理由的有序清单，标准和深入交接待筛选候选。 The external agent authors and validates report prose; no native
          publication wrapper or hidden LLM call is used.
      screen_and_supplement:
        prompt: Read scenario/external.md and its screen_and_supplement step contract from this pinned package. Screen
          the frozen candidates and make only targeted evidence-backed additions. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_expansion
          source: package
        - name: academic_search_papers
          source: package
        - name: academic_read_paper
          source: package
        - name: academic_resolve_papers
          source: package
        required_outputs:
        - screened_candidates
        acceptance_criteria:
        - 保留全部种子与确认方向；筛选及定点补查后按方向交付真实论文及推荐理由。 The external agent authors and validates report prose; no native publication
          wrapper or hidden LLM call is used.
      analyze_relations:
        prompt: Read scenario/external.md and its analyze_relations step contract from this pinned package. Analyze supported
          relationships and write the actual cited research report from the same findings. Generate and validate with your
          own host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_expansion
          source: package
        - name: academic_search_papers
          source: package
        - name: academic_read_paper
          source: package
        - name: academic_resolve_papers
          source: package
        required_outputs:
        - relation_analysis
        - expansion_result
        - expansion_report
        acceptance_criteria:
        - 沿用确认范围和完整清单，仅为关键结论定点补读；引用真实版本与已读位置，事实与推断明确区分；无证据不画关系边，正常局限和未覆盖范围如实写入报告；不要求穷尽调查或耗尽预算后才交付；不得自动入库。 The external
          agent authors and validates report prose; no native publication wrapper or hidden LLM call is used.
  transactional_outputs: true
  publisher_owned_slots:
  - candidate_set
  - screened_candidates
  - screened_list_ready
  - expansion_list_ready
  - relation_analysis
  - expansion_result
  - expansion_report
  host_extensions:
  - academic-paper-chat-v2
  trigger_inputs:
  - expansion_id
  completed_continue_steps:
  - expand_and_screen
  completed_edit_routing: 同一范围继续查找回到 expand_and_screen；报告根据有依据的研究发现撰写，不支持独立改写保存的报告。正式执行后实质改变主题或方向时新建调研任务；仅初步调研阶段支持在原记录调整范围。
  execution_limits:
    expand_and_screen:
      rounds: 32
      tool_calls:
        academic_search_papers: 24
    screen_and_supplement:
      rounds: 12
      tool_calls:
        academic_search_papers: 8
        academic_read_paper: 5
    analyze_relations:
      rounds: 32
      tool_calls:
        academic_read_paper: 48
        academic_search_papers: 8
  post_step_checks:
  - step_id: expand_and_screen
    tool: academic_validate_stage
    arguments:
      result: candidate_set
  - step_id: screen_and_supplement
    tool: academic_validate_stage
    arguments:
      result: screened_candidates
  - step_id: analyze_relations
    tool: academic_validate_relations
    arguments:
      result: relation_analysis
  - step_id: analyze_relations
    tool: academic_validate_result
    arguments:
      result: expansion_result
tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_expansion_context
  - academic_search_papers
  - academic_read_paper
  - academic_publish_stage
  - academic_submit_relations
  - academic_validate_stage
  - academic_validate_result
  - academic_validate_relations
steps:
- id: expand_and_screen
  label: 检索与拓展
- id: screen_and_supplement
  label: 筛选与补充
- id: analyze_relations
  label: 研究分析与报告
slots:
- id: expansion_id
  label: 任务定位
  type: text
  cardinality: single
  external: true
  exposed: false
- id: candidate_set
  label: 检索与拓展
  type: json
  cardinality: single
  exposed: true
- id: screening_not_required
  label: 跳过独立筛选
  type: json
  cardinality: single
  external: true
  required: false
  exposed: false
- id: analysis_not_required
  label: 跳过研究分析与报告
  type: json
  cardinality: single
  external: true
  required: false
  exposed: false
- id: screened_candidates
  label: 筛选与补充
  type: json
  cardinality: single
  exposed: true
- id: screened_list_ready
  label: 筛选清单完成
  type: json
  cardinality: single
  exposed: false
- id: relation_analysis
  label: 研究分析与报告
  type: json
  cardinality: single
  exposed: true
- id: expansion_list_ready
  label: 论文清单完成
  type: json
  cardinality: single
  exposed: false
- id: expansion_result
  label: 论文清单
  type: json
  cardinality: single
  exposed: true
- id: expansion_report
  label: 研究报告
  type: json
  cardinality: single
  exposed: true
ui:
  slots:
    candidate_set:
      widgetType: json-block
      readOnly: true
    screened_candidates:
      widgetType: json-block
      readOnly: true
    relation_analysis:
      widgetType: json-block
      readOnly: true
    expansion_result:
      widgetType: json-block
      readOnly: true
    expansion_report:
      widgetType: json-block
      readOnly: true
  tabs:
  - id: expand_and_screen
    step_id: expand_and_screen
    label: 检索与拓展
    layout: list
    slots:
    - id: candidate_set
  - id: screen_and_supplement
    step_id: screen_and_supplement
    hide_when_material: screening_not_required
    label: 筛选与补充
    layout: list
    slots:
    - id: screened_candidates
  - id: analyze_relations
    step_id: analyze_relations
    hide_when_material: analysis_not_required
    label: 研究分析与报告
    layout: list
    generation_process: {result_slot: expansion_report, slots: [relation_analysis]}
    slots:
    - id: relation_analysis
    - id: expansion_report
    - id: expansion_result
