initial: __start__
start_route: all
transitions:
  __start__:
  - to: prepare_plan
  prepare_plan:
  - to: expand_and_screen
  expand_and_screen:
  - to: analyze_relations
  analyze_relations:
  - to: compose_result
  compose_result:
  - to: __end__
steps:
  prepare_plan:
    label: 准备参考论文与检索计划
    prompt: '{{runtime_instruction}}

      先用 academic_expansion_context 读取绑定任务；使用服务端确定的方向、用户要求、种子和已有调研，按 record.budget_mode 与 research_guidance 执行本任务固定调研深度。不得改变主要方向或 ask_user。模型只提交论文
      ID 和分析，题录和标记由发布工具填充。只使用实际登记材料；区分全文可用与已经阅读。按研究目标和证据充分程度收尾；达到轮次或工具调用上限时，保存有效成果和缺口，不按耗时承诺完成。

      复用 preparation 的调研、摘要、代表论文及先前成果，不机械重查。多方向分别安排主题、前后向引用与方法检索，写明检索和阅读范围及停止条件。调用 academic_publish_stage(paper_ids,plan,decisions,gaps)
      保存 expansion_plan，保留全部用户种子。'
    tools:
    - academic_expansion_context
    - academic_search_papers
    - academic_read_paper
    - academic_publish_stage
    terminal_tools:
    - academic_publish_stage
    inputs:
    - material: expansion_id
      required: true
    outputs:
    - material: expansion_plan
      required: true
    acceptance_criteria: 保持已确认范围、全部用户种子和实际来源；证据对应真实内容版本及读取范围；异常保留，局部成果可用；不得自动入库。
  expand_and_screen:
    label: 拓展与筛选
    prompt: '{{runtime_instruction}}

      先用 academic_expansion_context 读取绑定任务；使用服务端确定的方向、用户要求、种子和已有调研，按 record.budget_mode 与 research_guidance 执行本任务固定调研深度。不得改变主要方向或 ask_user。模型只提交论文
      ID 和分析，题录和标记由发布工具填充。只使用实际登记材料；区分全文可用与已经阅读。按研究目标和证据充分程度收尾；达到轮次或工具调用上限时，保存有效成果和缺口，不按耗时承诺完成。

      按各已选方向分别检索，再跨方向去重。academic_search_papers 的 sources 可选 openalex/arxiv/sciverse/web，mode
      可选 keyword/references/citations（引用查询用 openalex 和 paper_id）。Sciverse 有配置时正常参与适合的查询；通用搜索补查遗漏和公开副本，网页线索不能冒充论文。正常零结果、缺
      Key、鉴权/额度失败分别处理，不重复无效调用。按相关性筛选，可移除非种子；用户要求不新增时只保留种子。用 academic_publish_stage
      保存完整 candidate_set 和筛选理由、覆盖缺口。'
    tools:
    - academic_expansion_context
    - academic_search_papers
    - academic_read_paper
    - academic_publish_stage
    terminal_tools:
    - academic_publish_stage
    inputs:
    - material: expansion_id
      required: true
    - material: expansion_plan
      required: true
    outputs:
    - material: candidate_set
      required: true
    acceptance_criteria: 保持已确认范围、全部用户种子和实际来源；证据对应真实内容版本及读取范围；异常保留，局部成果可用；不得自动入库。
  analyze_relations:
    label: 分析论文关系
    prompt: '{{runtime_instruction}}

      先用 academic_expansion_context 读取绑定任务；使用服务端确定的方向、用户要求、种子和已有调研，按 record.budget_mode 与 research_guidance 执行本任务固定调研深度。不得改变主要方向或 ask_user。模型只提交论文
      ID 和分析，题录和标记由发布工具填充。只使用实际登记材料；区分全文可用与已经阅读。按研究目标和证据充分程度收尾；达到轮次或工具调用上限时，保存有效成果和缺口，不按耗时承诺完成。

      先按原始摘要初筛，对关键论文按问题调用 academic_read_paper(keywords=[...]) 或指定 page_start/page_end。检查完整命中页、相邻页、表格标题、实验条件及运行前提；必要时扩大或完整阅读，不要求所有论文把
      cursor 读到底。内容 processing/failed/needs_review 时保留论文并限制分析。调用 academic_submit_relations(analyses,claims)：analyses
      精确覆盖 candidate_set 全部 ID，只提交 paper_id 及纯文本 seed_relation、direction_relation、key_contribution。claims
      是需要独立核验的方法继承、效果改善、关键数字、适用条件。每项仅包含 paper_id、field、positions；field 必须是 seed_relation、direction_relation、key_contribution 之一，和 analyses 的字段名完全一致，不能填 method、result、condition。每个论文的每个分析字段合并为一条核验，程序直接取该字段完整文本，不要重复抄写分析。positions 合并支持该字段的真实读取返回的0起始块位置（1..5个）。每字段2~4句，保持简洁，先补齐上下文，再统一提交一次核验；无法取正文时不作具体强结论。复核不支持或未提交证据的项由程序降为不确定，不反复重提。'
    tools:
    - academic_expansion_context
    - academic_read_paper
    - academic_submit_relations
    terminal_tools:
    - academic_submit_relations
    inputs:
    - material: expansion_id
      required: true
    - material: candidate_set
      required: true
    outputs:
    - material: relation_analysis
      required: true
    acceptance_criteria: 保持已确认范围、全部用户种子和实际来源；证据对应真实内容版本及读取范围；异常保留，局部成果可用；不得自动入库。
  compose_result:
    label: 研究脉络与阅读建议
    prompt: '{{runtime_instruction}}

      先用 academic_expansion_context 读取绑定任务；使用服务端确定的方向、用户要求、种子和已有调研，按 record.budget_mode 与 research_guidance 执行本任务固定调研深度。不得改变主要方向或 ask_user。模型只提交论文
      ID 和分析，题录和标记由发布工具填充。只使用实际登记材料；区分全文可用与已经阅读。按研究目标和证据充分程度收尾；达到轮次或工具调用上限时，保存有效成果和缺口，不按耗时承诺完成。

      读取 relation_analysis 的 input、claims、reading，按方向整理研究问题、前序基础、相关路线、后续变化及阅读建议。具体主张必须遵循复核结论；不把引用当继承，不把方法改变当效果改善。调用
      academic_publish_expansion_result(narrative,reading_order,limitations)，narrative
      为可读 Markdown，reading_order 为选中论文 ID 顺序，limitations 包含实际覆盖及材料限制。程序同时发布四字段 expansion_result
      和独立 expansion_report，不重新抄写题录或摘要。'
    tools:
    - academic_expansion_context
    - academic_publish_expansion_result
    terminal_tools:
    - academic_publish_expansion_result
    inputs:
    - material: expansion_id
      required: true
    - material: relation_analysis
      required: true
    outputs:
    - material: expansion_result
      required: true
    - material: expansion_report
      required: true
    acceptance_criteria: 保持已确认范围、全部用户种子和实际来源；证据对应真实内容版本及读取范围；异常保留，局部成果可用；不得自动入库。
