initial: __start__
transitions:
  __start__: [{to: generate}]
  generate: [{to: update}]
  update: [{to: verify}]
  verify: [{to: __end__}]
steps:
  generate:
    label: Generate
    mode: auto
    prompt: |
      Summarize {{user_input}} in one short sentence (use "hello" if no test text
      was supplied). Call smoke_generate(summary=<that exact sentence>).
      Save the sentence as prompt_result (text), the returned metadata as
      metadata_json (json), and the returned source.txt as source_attachment
      (file). Wait for all saves to be acknowledged.
    tools: [smoke_generate]
    outputs:
      - {material: prompt_result, required: true}
      - {material: metadata_json, required: true}
      - {material: source_attachment, required: true}
    acceptance_criteria:
      - The tool was called and all three outputs were saved.
      - metadata_json has smoke_test=true, schema=test.v2, and summary equal to prompt_result.
      - source_attachment is a readable file containing the exact summary and revision-1.
  update:
    label: Update and Review
    mode: human
    prompt: |
      Read the saved prompt_result and the COMPLETE source_attachment file,
      preserving newlines. Call smoke_update(summary=<prompt_result>,
      source_text=<actual file text>).
      Save returned revision-1.txt to rewritten_attachment (file), wait for its
      acknowledgement, then save revision-2.txt to that SAME slot and wait again.
      Publish returned item-1.txt and item-2.txt to list_attachments (file) in
      that order, with captions item-1 and item-2. Complete this step after all
      saves succeed. The user reviews this step before verification continues.
    tools: [smoke_update]
    inputs:
      - {material: prompt_result, required: true}
      - {material: source_attachment, required: true}
    outputs:
      - {material: rewritten_attachment, required: true}
      - {material: list_attachments, required: true}
    acceptance_criteria:
      - Two acknowledged saves created distinct revisions of rewritten_attachment; the latest contains revision-2.
      - list_attachments has exactly two distinct items in order item-1 then item-2.
  verify:
    label: Verify
    mode: auto
    prompt: |
      Read the saved prompt_result, metadata_json, source_attachment,
      rewritten_attachment and both list_attachments in their stored order.
      Read complete file texts, preserving newlines. Obtain the updated file's
      actual revision number from its pinned source_revision or artifact record.
      Call smoke_verify with these exact saved values: summary, metadata,
      source_text, rewritten_text, rewritten_revision and ordered list_texts.
      Save the returned object as verification_report (json) and its status as
      test_status (text). Report success only after the tool and all saves succeed.
    tools: [smoke_verify]
    inputs:
      - {material: prompt_result, required: true}
      - {material: metadata_json, required: true}
      - {material: source_attachment, required: true}
      - {material: rewritten_attachment, required: true}
      - {material: list_attachments, required: true}
    outputs:
      - {material: verification_report, required: true}
      - {material: test_status, required: true}
    acceptance_criteria:
      - smoke_verify checked actual saved values and every reported check is true.
      - test_status equals Workflow smoke test passed.
