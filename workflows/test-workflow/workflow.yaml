id: test-workflow
name: Workflow Runtime End-to-End Self-Test
description: >
  A fast multi-stage workflow that exercises prompts, local script tools,
  typed artifacts, single-slot revisions, list artifacts, and final validation.

when_to_use: >
  Use only when the user explicitly asks to test, smoke-test, or verify the
  Workflow runtime, for example "运行测试工作流" or "smoke test workflow".
  Do not select this workflow for normal writing, image, or research requests.

tool_scripts:
  - path: scripts/tools.py
    functions:
      - build_test_metadata
      - create_typed_fixtures
      - create_rewrite_fixture
      - rewrite_fixture
      - create_list_fixtures
      - verify_fixtures

steps:
  - id: prompt
    label: Prompt
  - id: script
    label: Script Tool
  - id: typed_artifacts
    label: Typed Artifacts
  - id: rewrite
    label: Rewrite Artifact
  - id: list_artifacts
    label: List Artifacts
  - id: verify
    label: Verify

slots:
  - id: prompt_result
    user_visible: true
    label: Prompt Result
    type: text
    cardinality: single
  - id: metadata_json
    user_visible: true
    label: JSON Metadata
    type: json
    cardinality: single
  - id: text_attachment
    user_visible: true
    label: Text Attachment
    type: file
    cardinality: single
  - id: image_attachment
    user_visible: true
    label: Image Attachment
    type: image
    cardinality: single
  - id: rewritten_attachment
    user_visible: true
    label: Rewritten Attachment
    type: file
    cardinality: single
  - id: list_attachments
    user_visible: true
    label: List Attachments
    type: file
    cardinality: list
    ordered: true
  - id: verification_report
    user_visible: true
    label: Verification Report
    type: file
    cardinality: single
  - id: test_status
    user_visible: true
    label: Test Status
    type: text
    cardinality: single

ui:
  tabs:
    - id: prompt
      step_id: prompt
      label: Prompt
      layout: list
      slots: [{id: prompt_result}]
    - id: script
      step_id: script
      label: Script
      layout: list
      slots: [{id: metadata_json}]
    - id: attachments
      label: Attachments
      layout: grid
      slots:
        - id: text_attachment
        - id: image_attachment
        - id: rewritten_attachment
        - id: list_attachments
    - id: result
      step_id: verify
      label: Result
      layout: list
      slots:
        - id: test_status
        - id: verification_report

i18n:
  zh-CN:
    name: Workflow 运行时端到端自检
    steps:
      prompt: {label: 提示词}
      script: {label: 脚本工具}
      typed_artifacts: {label: 多类型附件}
      rewrite: {label: 附件重写}
      list_artifacts: {label: 列表附件}
      verify: {label: 验证结果}
    tabs:
      prompt: {label: 提示词}
      script: {label: 脚本}
      attachments: {label: 附件}
      result: {label: 结果}
    slots:
      prompt_result: {label: 提示词结果}
      metadata_json: {label: JSON 元数据}
      text_attachment: {label: 文本附件}
      image_attachment: {label: 图片附件}
      rewritten_attachment: {label: 重写附件}
      list_attachments: {label: 列表附件}
      verification_report: {label: 验证报告}
      test_status: {label: 测试状态}

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall
      back to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      prompt:
        prompt: Read scenario/external.md and its prompt step contract from this pinned package. Complete Prompt using
          the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - prompt_result
        acceptance_criteria:
        - prompt_result is present and non-empty.
      script:
        prompt: Read scenario/external.md and its script step contract from this pinned package. Complete Script Tool
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - metadata_json
        acceptance_criteria:
        - metadata_json is valid JSON with smoke_test=true.
      typed_artifacts:
        prompt: Read scenario/external.md and its typed_artifacts step contract from this pinned package. Complete
          Typed Artifacts using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - text_attachment
        - image_attachment
        acceptance_criteria:
        - The text file is readable and the PNG decodes from real transferred bytes.
      rewrite:
        prompt: Read scenario/external.md and its rewrite step contract from this pinned package. Complete Rewrite
          Artifact using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - rewritten_attachment
        acceptance_criteria:
        - rewritten_attachment is selected at revision 2 and contains revision-2.
      list_artifacts:
        prompt: Read scenario/external.md and its list_artifacts step contract from this pinned package. Complete
          List Artifacts using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - list_attachments
        acceptance_criteria:
        - list_attachments contains exactly two ordered files.
      verify:
        prompt: Read scenario/external.md and its verify step contract from this pinned package. Complete Verify using
          the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - verification_report
        - test_status
        acceptance_criteria:
        - test_status equals Workflow smoke test passed.
