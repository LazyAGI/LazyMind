id: test-workflow
name: Workflow Basic Self-Test
description: A three-step test of shared tools, typed artifacts, revisions, ordered lists and one human review.
when_to_use: >
  Use when the user explicitly asks to test the Workflow runtime, for example
  "运行测试工作流，内容是 hello". A short text request is sufficient.
tool_scripts:
  - path: scripts/tools.py
    functions: [smoke_generate, smoke_update, smoke_verify]
steps:
  - {id: generate, label: Generate}
  - {id: update, label: Update and Review}
  - {id: verify, label: Verify}
slots:
  - {id: prompt_result, label: Summary, type: text, cardinality: single, user_visible: true}
  - {id: metadata_json, label: Metadata, type: json, cardinality: single, user_visible: true}
  - {id: source_attachment, label: Source File, type: file, cardinality: single, user_visible: true}
  - {id: rewritten_attachment, label: Updated File, type: file, cardinality: single, user_visible: true}
  - {id: list_attachments, label: Ordered Files, type: file, cardinality: list, ordered: true, user_visible: true}
  - {id: verification_report, label: Verification Report, type: json, cardinality: single, user_visible: true}
  - {id: test_status, label: Test Status, type: text, cardinality: single, user_visible: true}
ui:
  tabs:
    - id: generate
      step_id: generate
      label: Generate
      layout: list
      slots: [{id: prompt_result}, {id: metadata_json}, {id: source_attachment}]
    - id: update
      step_id: update
      label: Update and Review
      layout: list
      slots: [{id: rewritten_attachment}, {id: list_attachments}]
    - id: verify
      step_id: verify
      label: Verify
      layout: list
      slots: [{id: test_status}, {id: verification_report}]
i18n:
  zh-CN:
    name: Workflow 基础自检
    steps:
      generate: {label: 生成}
      update: {label: 更新与确认}
      verify: {label: 校验}
    tabs:
      generate: {label: 生成}
      update: {label: 更新与确认}
      verify: {label: 校验}
    slots:
      prompt_result: {label: 摘要}
      metadata_json: {label: 元数据}
      source_attachment: {label: 源文件}
      rewritten_attachment: {label: 更新后的文件}
      list_attachments: {label: 有序文件列表}
      verification_report: {label: 校验报告}
      test_status: {label: 测试状态}
runtime:
  execution:
    version: '1'
    skills: [scenario/execution.md]
    steps:
      generate:
        tools: [{name: smoke_generate, source: package}]
      update:
        tools: [{name: smoke_update, source: package}]
      verify:
        tools: [{name: smoke_verify, source: package}]
