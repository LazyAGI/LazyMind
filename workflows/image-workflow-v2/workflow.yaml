id: image-workflow-v2
name: AI Image Production V2
description: >
  Locally customized image production workflow with three final-deliverable
  routes: ordinary image generation, authoritative-source local editing, and
  static or dynamic meme-pack production. Ordinary generation and local editing
  use LazyMind's built-in Baoyu adapter pinned to Seedream 5.0; meme production
  keeps the existing native LazyMind media toolchain and establishes an
  approved canonical character and extracts one grounded visual identity lock
  before state planning. The same lock is reused unchanged for every dynamic key
  image, and each state uses exactly one key image as the locked visual
  reference for video generation with a motion-only prompt. Dynamic packs include concise theme-appropriate
  captions by default: the workflow proposes one caption per state for approval
  before production. Media is generated without overlay captions; approved exact
  captions are rendered locally after inspecting the actual whitespace.

when_to_use: >
  Prefer the original image-workflow for general image generation and editing
  with configured model roles. Choose V2 explicitly for Seedream 5.0 or reviewed
  multi-state meme production. Use for static memes, animated
  GIF stickers, reaction images, or multi-state meme packs that benefit from
  explicit planning and review. Final meme delivery overrides whether a source
  image is uploaded, searched, or generated. For memes, choose exactly one
  delivery mode: static or dynamic.

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      classify_request:
        prompt: Read scenario/external.md and its classify_request step contract from this pinned package. Complete Classify
          Final Deliverable using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - route_plan
        acceptance_criteria:
        - route_plan contains exactly one supported route, a rationale, and delivery_mode=static|dynamic|unspecified for
          meme or not_applicable otherwise; after it is saved, the workflow engine selects the sole matching transition.
      ordinary_prepare:
        prompt: Read scenario/external.md and its ordinary_prepare step contract from this pinned package. Complete Prepare
          Ordinary Image using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - material_summary
        - ordinary_prompt
        acceptance_criteria:
        - The prompt is usable and all saved web images came verbatim from validated selected results.
      ordinary_generate:
        prompt: Read scenario/external.md and its ordinary_generate step contract from this pinned package. Complete Generate
          Ordinary Image using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - ordinary_output
        acceptance_criteria:
        - At least one generated image is saved and no hidden retry occurred.
      edit_prepare:
        prompt: Read scenario/external.md and its edit_prepare step contract from this pinned package. Complete Prepare
          Local Edit using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - authoritative_image
        - edit_contract
        acceptance_criteria:
        - One valid authoritative image and a complete four-part edit contract exist.
      edit_candidate:
        prompt: Read scenario/external.md and its edit_candidate step contract from this pinned package. Complete Generate
          and Review Edit using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_editor
          source: global
        required_outputs:
        - edit_candidate
        acceptance_criteria:
        - A new candidate exists and the user explicitly accepts it before completion.
      meme_brief:
        prompt: Read scenario/external.md and its meme_brief step contract from this pinned package. Complete Confirm Meme
          Brief using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - meme_brief_data
        acceptance_criteria:
        - One delivery mode and a complete ordered state list exist; every state has one non-duplicative caption, communication
          purpose, and action design; dynamic delivery defaults to one proposed caption per state unless no_text was explicit;
          every caption is approved or no_text is explicit; brief_status is approved only after both caption approval and
          count compliance; save_validated_meme_brief confirms requested_count and state count match the immutable launch
          request and preserves supplied captions verbatim; the user explicitly approves the complete scheme before generation
          can continue.
      meme_preflight:
        prompt: Read scenario/external.md and its meme_preflight step contract from this pinned package. Complete Preflight
          Media Runtime using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - preflight_report
        acceptance_criteria:
        - preflight_report.ready is true; otherwise the workflow fails closed before paid calls.
      canonical_character:
        prompt: Read scenario/external.md and its canonical_character step contract from this pinned package. Complete
          Confirm Canonical Character using the bound evidence and the domain rules above. Generate and validate with your
          own host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - canonical_character_image
        acceptance_criteria:
        - With an upload, the exact unchanged source is the sole canonical character; without an upload, one neutral generated
          candidate exists.
      build_identity_anchors:
        prompt: Read scenario/external.md and its build_identity_anchors step contract from this pinned package. Complete
          Build Eye and Mouth Anchors using the bound evidence and the domain rules above. Generate and validate with your
          own host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - character_identity_prompt
        - face_anchor_images
        - face_anchor_grid
        acceptance_criteria:
        - One grounded identity lock, exactly four distinct ordered eye/mouth anchor images, and one 2x2 review grid exist;
          no editor call was retried; the user explicitly approves the anchor result before static image generation can
          continue.
      understand_states:
        prompt: Read scenario/external.md and its understand_states step contract from this pinned package. Complete Understand
          Communication States using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - state_specs
        acceptance_criteria:
        - Every requested state has exactly one distinct, broadly reusable proposition, and every item preserves the exact
          state and caption from meme_brief_data.states in the same order.
      design_best_performances:
        prompt: Read scenario/external.md and its design_best_performances step contract from this pinned package. Complete
          Design Best Performances using the bound evidence and the domain rules above. Generate and validate with your
          own host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - best_performances
        acceptance_criteria:
        - Every state has one complete, distinct, identity-safe BestPerformance with the exact approved state and caption
          and a non-empty facial performance; no signed URL, local path, or model-rendered text instruction is embedded;
          select_meme_delivery_route returns the sole control.next_step matching the approved delivery mode after best_performances
          is saved.
      plan_static:
        prompt: Read scenario/external.md and its plan_static step contract from this pinned package. Complete Plan Static
          Hero Frames using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - static_plan
        acceptance_criteria:
        - There is exactly one text-free hero-frame plan per state and no caption box is preselected.
      render_static:
        prompt: Read scenario/external.md and its render_static step contract from this pinned package. Complete Render
          Text-Free Hero Frames using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - hero_no_text
        acceptance_criteria:
        - One and only one text-free hero result exists per successful state-generation call.
      caption_static:
        prompt: Read scenario/external.md and its caption_static step contract from this pinned package. Complete Caption
          Static Results using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - static_final
        acceptance_criteria:
        - Final images preserve order and captions, when enabled, use post-render whitespace analysis.
      plan_dynamic:
        prompt: Read scenario/external.md and its plan_dynamic step contract from this pinned package. Complete Plan Key
          Images and Motion using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - dynamic_plan
        acceptance_criteria:
        - Each state has the exact same grounded identity_lock, exactly one key-image prompt, and one motion-only prompt
          that starts from that image without redefining appearance.
      render_keyframes:
        prompt: Read scenario/external.md and its render_keyframes step contract from this pinned package. Complete Render
          Key Images using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - master_keyframes
        acceptance_criteria:
        - The list contains exactly one ordered key image per state, every call uses the same canonical source and shared
          identity lock, and every caption identifies its state; the user explicitly approves all static key images before
          video generation can continue.
      video_canary:
        prompt: Read scenario/external.md and its video_canary step contract from this pinned package. Complete Generate
          and Review Video Canary using the bound evidence and the domain rules above. Generate and validate with your
          own host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: video_generator
          source: global
        required_outputs:
        - canary_video
        - canary_state_id
        acceptance_criteria:
        - Exactly one first-state canary exists before the remaining videos are generated.
      render_dynamic:
        prompt: Read scenario/external.md and its render_dynamic step contract from this pinned package. Complete Render
          Remaining Videos using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: video_generator
          source: global
        required_outputs:
        - remaining_videos
        acceptance_criteria:
        - The canary and every remaining state have exactly one ordered video matching dynamic_plan, and the user explicitly
          approves the complete video set before GIF conversion can continue.
      caption_dynamic:
        prompt: Read scenario/external.md and its caption_dynamic step contract from this pinned package. Complete Caption
          and Convert GIFs using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - gif_output
        acceptance_criteria:
        - One ordered final GIF exists per successful video; every output is provenance-checked as the atomic converter-captioner
          result and contains its exact approved caption.
      review_pack:
        prompt: Read scenario/external.md and its review_pack step contract from this pinned package. Complete Review Final
          Pack using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - pack_review
        acceptance_criteria:
        - One final review covers every delivered item; approval is allowed only when all requested states pass in order
          and failed_units is empty, while any rework is scoped to the smallest failed unit.
  clarification_fields:
    - id: image_goal
      label: 图片主体或修改要求
      question: 想生成什么图片，或对原图做什么修改？
      reason: 需要明确主体或修改要求，才能继续当前图片任务。
      required: true
      type: text
      validation: {min_length: 1, max_length: 4000, example: '例如：根据上传角色制作一套动态表情包'}
    - id: image_count
      label: 数量
      question: 希望生成多少张？
      type: text
      reason: 普通生成当前支持单张；表情包数量由方案校验和审阅确认。
      patterns: ['([0-9]+)\s*(?:张|个)(?:图片|图|表情包|动图)']
      validation: {format: positive_integer, min: 1, example: '例如：3'}
    - id: caption
      label: 文案
      question: 图片上需要显示什么文字？
      type: text
      reason: 普通图片未要求时不添加文字，动态表情包沿用已有文案审阅。
  publisher_owned_slots: [route_plan, material_summary, ordinary_prompt, ordinary_output, authoritative_image, edit_contract, edit_candidate]

tool_scripts:
  - path: scripts/baoyu.py
    functions:
      - baoyu_image_generator
      - baoyu_image_editor
      - generate_ordinary_image
      - generate_edit_candidate
  - path: scripts/tools.py
    functions:
      - classify_image_request
      - prepare_ordinary_request
      - publish_edit_contract
      - image_search_and_validate
      - validate_image_ref
      - image_media_preflight
      - compose_character_anchor_sheet
      - save_validated_meme_brief
      - select_meme_delivery_route
      - meme_add_caption
      - meme_video_to_captioned_gif

steps:
  - {id: classify_request, label: Classify Final Deliverable}
  - {id: ordinary_prepare, label: Prepare Ordinary Image}
  - {id: ordinary_generate, label: Generate Ordinary Image}
  - {id: edit_prepare, label: Prepare Local Edit}
  - {id: edit_candidate, label: Generate and Review Edit}
  - {id: meme_brief, label: Confirm Meme Brief}
  - {id: meme_preflight, label: Preflight Media Runtime}
  - {id: canonical_character, label: Confirm Canonical Character}
  - {id: build_identity_anchors, label: Build Eye and Mouth Anchors}
  - {id: understand_states, label: Understand Communication States}
  - {id: design_best_performances, label: Design Best Performances}
  - {id: plan_static, label: Plan Static Hero Frames}
  - {id: render_static, label: Render Text-Free Hero Frames}
  - {id: caption_static, label: Caption Static Results}
  - {id: plan_dynamic, label: Plan Key Images and Motion}
  - {id: render_keyframes, label: Render Key Images}
  - {id: video_canary, label: Generate and Review Video Canary}
  - {id: render_dynamic, label: Render Remaining Videos}
  - {id: caption_dynamic, label: Caption and Convert GIFs}
  - {id: review_pack, label: Review Final Pack}

slots:
  - {id: source_image, user_visible: false, label: Uploaded Source Image, type: image, cardinality: single, external: true, required: false}
  - {id: route_plan, user_visible: true, label: Route Plan, type: json, cardinality: single}
  - {id: material_images, user_visible: false, label: Reference Materials, type: image, cardinality: list, ordered: true}
  - {id: material_summary, user_visible: true, label: Material Summary, type: text, cardinality: single}
  - {id: ordinary_prompt, user_visible: false, label: Ordinary Image Prompt, type: text, cardinality: single}
  - {id: ordinary_output, user_visible: true, label: Ordinary Image Output, type: image, cardinality: list, ordered: true}
  - {id: authoritative_image, user_visible: false, label: Authoritative Source Image, type: image, cardinality: single}
  - {id: edit_contract, user_visible: true, label: Local Edit Contract, type: json, cardinality: single}
  - {id: edit_candidate, user_visible: true, label: Local Edit Candidate, type: image, cardinality: single}
  - {id: meme_brief_data, user_visible: true, label: Meme Brief, type: json, cardinality: single}
  - {id: preflight_report, user_visible: true, label: Preflight Report, type: json, cardinality: single}
  - {id: canonical_character_image, user_visible: true, label: Canonical Character, type: image, cardinality: single}
  - {id: character_identity_prompt, user_visible: false, label: Character Identity Prompt, type: text, cardinality: single}
  - {id: face_anchor_images, user_visible: false, label: Eye and Mouth Anchor Images, type: image, cardinality: list, ordered: true}
  - {id: face_anchor_grid, user_visible: true, label: 2x2 Eye and Mouth Anchor Grid, type: image, cardinality: single}
  - {id: state_specs, user_visible: true, label: State Performance Propositions, type: json, cardinality: single}
  - {id: best_performances, user_visible: true, label: Best Performances, type: json, cardinality: single}
  - {id: static_plan, user_visible: true, label: Static Hero-Frame Plan, type: json, cardinality: single}
  - {id: hero_no_text, user_visible: true, label: Text-Free Hero Frames, type: image, cardinality: list, ordered: true}
  - {id: static_final, user_visible: true, label: Final Static Memes, type: image, cardinality: list, ordered: true}
  - {id: dynamic_plan, user_visible: true, label: Key-Image Dynamic Plan, type: json, cardinality: single}
  - {id: master_keyframes, user_visible: true, label: Key Images, type: image, cardinality: list, ordered: true}
  - {id: canary_video, user_visible: true, label: Video Canary, type: file, cardinality: single}
  - {id: canary_state_id, user_visible: false, label: Canary State, type: text, cardinality: single}
  - {id: skip_remaining_dynamic, user_visible: false, label: Skip Remaining Videos, type: json, cardinality: single}
  - {id: remaining_videos, user_visible: true, label: Remaining Videos, type: file, cardinality: list, ordered: true}
  - {id: gif_output, user_visible: true, label: Final Animated GIFs, type: image, cardinality: list, ordered: true}
  - {id: pack_review, user_visible: true, label: Final Pack Review, type: json, cardinality: single}

ui:
  follow_mode:
    default: following
  tabs:
    - id: plan
      status_step_ids: [classify_request, ordinary_prepare, edit_prepare, meme_brief, meme_preflight, understand_states, design_best_performances, plan_static, plan_dynamic]
      label: Plan
      layout: list
      slots:
        - {id: route_plan}
        - {id: material_summary}
        - {id: ordinary_prompt}
        - {id: edit_contract}
        - {id: meme_brief_data}
        - {id: preflight_report}
        - {id: state_specs}
        - {id: best_performances}
        - {id: static_plan}
        - {id: dynamic_plan}
    - id: character
      status_step_ids: [canonical_character, build_identity_anchors]
      label: Character
      layout: grid
      slots:
        - {id: source_image}
        - {id: material_images}
        - {id: authoritative_image}
        - {id: canonical_character_image}
        - {id: character_identity_prompt}
        - {id: face_anchor_images}
        - {id: face_anchor_grid}
      composite_behavior: {hide_empty_columns: true, empty_column_scope: selected}
    - id: production
      status_step_ids: [render_static, render_keyframes, video_canary, render_dynamic]
      label: Production
      layout: grid
      slots:
        - {id: hero_no_text}
        - {id: master_keyframes}
        - {id: canary_video}
        - {id: remaining_videos}
      composite_behavior: {hide_empty_columns: true, empty_column_scope: selected}
    - id: result
      status_step_ids: [ordinary_generate, edit_candidate, caption_static, caption_dynamic, review_pack]
      label: Result
      layout: composite
      slots:
        - {id: ordinary_output}
        - {id: edit_candidate}
        - {id: static_final}
        - {id: gif_output}
        - {id: pack_review}
      composite_layout: [ordinary_output, edit_candidate, static_final, gif_output, pack_review]
      composite_behavior: {hide_empty_columns: true, empty_column_scope: selected}

