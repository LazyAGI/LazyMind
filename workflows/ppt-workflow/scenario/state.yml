initial: __start__

transitions:
  __start__:
    - to: analyze_requirements

  analyze_requirements:
    - to: collect_materials
      when: >
        template_mode is upload, or skip_material_collection was not saved because uploaded sources,
        knowledge-base/web research, citations, current facts, real photos,
        product evidence, cases, data, or reference images are still needed.
    - to: plan_background_prompts
      when: >
        template_mode is none and skip_material_collection was saved, and
        ppt_capability_requirements is exactly AI_BACKGROUND_IMAGES: enabled.
    - to: build_outline
      when: >
        template_mode is none and skip_material_collection was saved, and
        ppt_capability_requirements is exactly AI_BACKGROUND_IMAGES: disabled.

  collect_materials:
    - to: plan_background_prompts
      when: >
        ppt_capability_requirements is exactly AI_BACKGROUND_IMAGES: enabled.
    - to: build_outline
      when: >
        ppt_capability_requirements is exactly AI_BACKGROUND_IMAGES: disabled.

  plan_background_prompts:
    - to: generate_backgrounds

  generate_backgrounds:
    - to: build_outline

  build_outline:
    - to: plan_page_prompts

  plan_page_prompts:
    - to: generate_ppt

  generate_ppt:
    - to: __end__

steps:
  analyze_requirements:
    label: Analyze Requirements
    mode: auto
    route: choice
    prompt: |
      Analyze the presentation request and publish a concise requirement brief in
      the user's language. This step determines scope; source research belongs to
      collect_materials and page authoring belongs to later steps.

      User request: {{user_input}}
      {{runtime_instruction}}

      Reuse launch_user_input, bound inputs and confirmed answers when the latest
      message is only continue/继续. Record topic, goal, audience, speaker role,
      exact slide count, communication tone, visual direction, content priorities,
      constraints and assumptions. One slide is valid. Do not impose a larger
      minimum or ask again for information already supplied. Unknown/omit answers
      are final decisions, not permission to repeat the question.

      Sources and route:
      - Uploads are optional. A self-contained text request can skip collection;
      requests requiring uploaded sources, KB research, citations, current facts,
      real photos, product evidence, cases or data must collect those sources.
      - Classify presentation_scenario as general, research_report, paper_review,
      thesis_defense or reading_notes. Preserve all selected papers and explicit
      requests for reading reflections. Unless the user specified a count, budget
      three content pages per paper plus explicitly requested opening/closing
      pages. Explain an inferred count; a confirmed count takes precedence.
      - Without an uploaded template, set template_mode=none and author HTML.
      Preserve an explicit request for a downloadable/editable PPTX in the brief;
      this requires export after HTML authoring. Do not ask an output-format or
      template-upload question merely because those features exist.
      - With a supplied template, set template_mode=upload and preserve the
      confirmed HTML or native_pptx choice. Inspect the original PPTX directly,
      across every page, including canvas, editable slots, layouts, typography,
      charts, images and sample content. Do not convert it to PDF just to read it.
      HTML recreates the inspected style; native_pptx reuses actual template
      layouts and editable objects. Keep the original page count only when the
      user requested it; otherwise layouts may be repeated or omitted.
      - Publish template_content_brief with the source hash, page-by-page content
      roles/layouts, reusable elements, required evidence, missing inputs and a
      collection_plan. Distinguish template-only, evidence-only and dual-role
      sources. Sample claims are not facts; a user-designated prior work deck can
      also supply historical evidence with its date and attribution preserved.

      Visual decisions:
      - Preserve explicit user direction. Academic/scientific presentations default
      to white (#FFFFFF), dark text (#111111), restrained chart accents and
      readable evidence-led typography; AI backgrounds default to disabled.
      - An uploaded template determines style and disables AI backgrounds. Do not
      ask again for palette, typography, decorative images or background choices.
      Evidence figures, screenshots and editable charts remain allowed.
      - Otherwise preserve the confirmed AI-background choice. Do not infer consent
      from a request for a polished presentation. Missing optional image services
      do not invalidate unrelated text/source work.

      Publish requirement_analysis and presentation_scenario, plus routing values:
      template_mode=none|upload; presentation_output_format=html|native_pptx;
      style_flow=auto; generation_mode=full; generate_background_images=enabled|disabled.
      Set ppt_capability_requirements to exactly AI_BACKGROUND_IMAGES: enabled or
      AI_BACKGROUND_IMAGES: disabled. Publish skip_background_images=skip exactly
      when disabled; publish skip_material_collection=skip only for a self-contained
      request with no unresolved source needs. Do not generate slides in this step.
    tools:
      - pptx_analyzer
    inputs:
      - material: template_pptx
        required: false
    outputs:
      - material: template_content_brief
        required: false
      - material: presentation_scenario
      - material: requirement_analysis
      - material: ppt_capability_requirements
      - material: style_flow
      - material: generation_mode
      - material: presentation_output_format
      - material: template_mode
      - material: generate_background_images
      - material: skip_background_images
        required: false
      - material: skip_material_collection
        required: false
    acceptance_criteria: |
      requirement_analysis must be saved and must cover goal, presentation
      topic, exact slide count, target customer/audience, communication tone,
      explicit visual constraints, structure, constraints, and assumptions.
      ppt_capability_requirements must be exactly AI_BACKGROUND_IMAGES: enabled
      or AI_BACKGROUND_IMAGES: disabled, matching the enabled or disabled value
      in generate_background_images. Use the confirmed startup choice unless a
      template is uploaded, which forces disabled. Save skip_background_images
      with value skip exactly when backgrounds are disabled.
      style_flow must always be auto.
      generation_mode must be full, and template_mode must be
      exactly none or upload. presentation_output_format must be html or native_pptx;
      without a template use html, with a template preserve the confirmed choice.
      When a template is uploaded, template_content_brief must cover every original
      page, source hash, required evidence and missing inputs before this step passes.

  collect_materials:
    label: Collect Materials
    mode: auto
    route: choice
    prompt: |
      Collect and analyze the evidence needed by the requirement brief. Produce one
      material_summary and a material_clarification record. Reading, source analysis
      and image selection are phases of this same step.

      Requirements: {{requirement_analysis}}
      Scenario: {{presentation_scenario}}
      Template mode: {{template_mode}}
      Template collection plan: {{template_content_brief}}
      Uploaded materials: {{uploaded_materials}}
      User request: {{user_input}}
      {{runtime_instruction}}

      Source selection and completeness:
      - Reuse the conversation and relevant uploads first. For a selected KB or an
      internal topic, retrieve authorized KB evidence before optional web research.
      In the native runtime, if the knowledge base is not already bound, use
      knowledge.list(keyword='', page={'page_size': 20}) to discover readable bases.
      Select the matching IDs from result.items and pass them as a JSON list in
      kb_ids when calling KBToolkit_kb_search. For the external runtime, use the
      selected knowledge documents and the read tools declared for this step.
      Search the web only for a concrete remaining gap. A selected collection step
      may finish without web calls when the existing evidence is sufficient.
      - Read actual document bodies, preserving source identity, page/chunk locations
      and citations. Use authorized attachment/document tools; do not invent local
      paths or bypass source permissions. A chunk number is not a PDF page number.
      - Read every selected paper to the end, using cached chunks without rereading
      the entire source. Preserve distinct attachments and repeated filenames from
      different turns. Metadata/abstracts do not substitute for selected full texts.
      Report any failed source and remaining coverage; do not publish a completed
      summary while required papers or other explicitly required sources are unread.
      - Optional additional web/image research has a six-call budget. Required source
      pagination, full-text reads and PR-description reads are exempt. Stop optional
      research when the gap is filled. Never claim exhaustive coverage after truncation.
      - Templates are visual references unless the user also designated their content
      as evidence. Follow the template's page-specific collection plan. Do not use
      sample charts, sample metrics or placeholder achievements as source facts.

      Academic scenarios (research_report, paper_review, thesis_defense, reading_notes):
      - Analyze each selected source in this step: research question, prior problem,
      core contribution, mechanism, inputs/outputs, assumptions, variables, formulas,
      experiment setup, dataset/sample scope, baselines, quantitative results,
      limitations and useful figure/table references. Distinguish author claims
      from your interpretation and from the user's own reading reflections.
      - Retain mechanisms and conditions needed for a technical presentation, not
      only slogans or a summary of the abstract. Preserve units, citations and
      uncertainty; do not invent missing measurements or recreate unreadable data.
      - For multiple papers, identify evidence-backed prerequisite relationships,
      establish a readable order and retain every selected source. Similar dates
      or keywords alone do not establish a dependency.
      - If reading reflections were requested, publish the actual reflection prose
      as reflection_markdown after reading all selected sources, before finishing
      material_summary. Keep it alongside the original evidence for later planning.

      Personal contribution / internship / probation defense:
      - Use the supplied repository, author identity, reporting period and optional
      branch. A connected account, repository owner or branch name does not prove
      the user's identity. Ask only for missing identity/scope, not API/filter URLs.
      - Read authorized work records and PR descriptions. Preserve supplied filters;
      dates mean inclusive PR creation dates in UTC, not merge or commit dates.
      Read all requested pages and full descriptions, including past empty pages
      when a continuation cursor exists. Keep repository/PR identity and source URL.
      - Public repositories can use anonymous access. Private repositories and cloud
      documents require an authorized existing connection. Never ask for tokens in
      chat, broaden filters on errors, or create/update/delete source documents.
      - Analyze code/diffs only when requested and authorized. Filenames alone do not
      establish behavior. Empty descriptions are evidence gaps. Permission errors,
      rate limits or failed required reads must be reported precisely; do not replace
      missing work records with unrelated web results or invented contributions.
      - Distinguish described work from measured results, merged from open/closed PRs,
      personal from team contributions and source snapshot dates from the current
      period. Deduplicate records and reconcile conflicts. A count of PRs does not
      establish impact. Preserve metric names, units, baseline values, conditions,
      sample scope and absolute versus relative improvements. Do not infer end-to-end
      speedups from a single stage or current completion from historical 'ongoing'.

      Image phases: obtain candidates → inspect actual pixels → select → publish.
      - Use real source figures/screenshots when relevant; optional stock/decorative
      images are not required. Reuse supplied assets before searching. Generate a
      material image only on explicit request and identify it as generated.
      - Extract relevant PDF figures with full axes/legends and source page/caption.
      Region crops may be needed for vector figures or scans. A page preview is not
      an isolated figure. Do not describe a raster figure as an editable chart.
      - Existing authorized KB chunks can supply images without image-vector search
      or a new OCR run. Follow all continuation cursors, including empty pages;
      retain document/chunk provenance and report absent or missing files honestly.
      - Inspect the candidate's actual pixels using the executing model or an available
      image-understanding tool. Record what is visible, relevance, legibility and
      limitations. A filename, URL, resolution or generated caption alone is not
      visual inspection. Select only images supported by successful observations.
      - In an external execution, download direct image search results using
      host tools or workflow.tool.call with tool_name=ppt_download_material_image,
      arguments.urls and a Connector-local result_directory.
      If a source is expired, returns 403/404 or serves an HTML page, try another
      candidate or refresh the search. Inspect the actual file. Publish it with
      workflow.artifact.publish using output.slot=material_images,
      output.content_type=image, output.local_path and a stable positive seq.
      The local file must be readable by the Connector.
      - Publish only selected images intended for the deck. Record their source
      URL/document and intended page use in material_summary.
      For external execution, list acknowledged artifacts with
      workflow.artifact.list (metadata_only=true) and record the material_images
      artifact IDs. For LazyMind execution, use ppt_register_material_images.
      - If a user-required photo is unavailable after trying alternative sources,
      report the missing photo and the actual download or capability error. Keep
      acknowledged assets for recovery. Fail the step or ask for a replacement
      source or permission to omit it through material_clarification.
      - With an uploaded template, retain its artwork and avoid unrelated decorative
      searches. Evidence diagrams/product screenshots are still valid when useful.
      - If inspection is unavailable, skip uninspected optional candidates and disclose
      any missing requested images. Zero material_images is valid when no image
      is required. Do not fabricate a passed image check.
      - Use named icons only as small labels or decoration. Reserve main visuals
      for registered materials, diagrams or data charts.

      Publish material_summary with source coverage, findings, useful citations and
      visuals, assumptions, conflicts, missing measurements and remaining gaps.
      Always publish material_clarification as JSON: {"questions": [{"id": "field_id",
      "text": "Missing fact and the section that needs it", "type": "text"}],
      "checked_fields": ["field_id", ...]}. Use questions=[] when nothing is missing.
      Audit required names, roles, dates, reporting periods and results against all
      template pages and prior answers. Group related questions; never invent
      identities or measurements. Unknown/omit answers are settled. Do not include
      answer_text or checkpoint_token: the host owns answers and continuation.
      Host approval mode determines whether nonempty questions pause execution;
      otherwise record unavailable facts or omit optional fields without inventing.
      Do not create the outline or generate slide HTML here.
    tools:
      - ppt_publish_paper_reflection
      - ppt_source_connections
      - ppt_collect_github_prs
      - ppt_read_pr_description
      - cloud_files
      - ppt_cache_academic_sources
      - ppt_read_academic_source
      - ppt_plan_paper_order
      - kb
      - knowledge_management
      - web_search
      - wikipedia
      - ppt_search_web_images
      - ppt_search_assets
      - ppt_get_asset
      - ppt_inspect_material_images
      - ppt_register_material_images
      - ppt_collect_kb_images
      - ppt_extract_pdf_images
      - ppt_generate_material_images
    inputs:
      - material: presentation_scenario
        required: true
      - material: requirement_analysis
        required: true
      - material: uploaded_materials
        required: false
      - material: presentation_output_format
        required: true
      - material: template_mode
        required: false
      - material: template_content_brief
        required: false
    outputs:
      - material: reflection_markdown
        required: false
      - material: material_summary
        required: true
      - material: material_clarification
        required: true
      - material: material_images
        required: false
    acceptance_criteria: |
      Save one material_summary. For academic scenarios it must include per-source findings,
      experimental conditions, data, limitations and available formula/figure references.
      All selected paper-library full texts must have been successfully read;
      metadata/abstract-only summaries do not satisfy collection. A tool failure
      must be reported as incomplete, without publishing a completed summary.
      material_summary must be saved and must identify uploaded-file findings
      when files are present, references, useful evidence, gaps, and assumptions.
      material_images is optional. Its absence must never fail or retry this
      step; a text-only material_summary is sufficient. Publish selected images
      that were inspected and found relevant as individual image-list artifacts.
      Record their sources and intended uses and disclose any missing requested
      images in material_summary.

  build_outline:
    label: Build Outline
    mode: auto
    rerun_when: >
      用户要求在未启用 AI 底图的现有 PPT 中插入整页；或 AI 底图插页流程
      已经先插入底图提示词和底图，需要发布对应的新大纲。
    prompt: |
      Write the presentation's content outline from the approved requirements and
      evidence. Publish deck_outline as one Markdown document, with exactly one
      second-level heading and a useful content plan for each requested page.

      Requirements: {{requirement_analysis}}
      Materials: {{material_summary}}
      Clarifications: {{material_clarification}}
      Reading reflections: {{reflection_markdown}}
      Template requirements: {{template_content_brief}}
      User request: {{user_input}}
      {{runtime_instruction}}

      Plan a coherent narrative with page-specific claims, supporting facts, mechanisms,
      comparisons and transitions. Respect the confirmed scope/count, including one page.
      Preserve every selected paper, requested reflection and source attribution. Use
      the source prerequisite order for academic decks. Missing optional materials do
      not block a self-contained request; missing facts remain explicit gaps.

      For technical/research work, explain how the method works: inputs/outputs,
      variables, conditions, tradeoffs and quantitative comparisons. Keep the detail
      needed by the audience. Do not replace requested mechanisms with slogans or
      metric cards merely to make the layout sparse. Do not invent chart values.
      Template samples are not evidence. Map each retained claim to its source and
      later visible page content; record scope-based exclusions in validation evidence.

      Preserve the requested speaking budget and distinguish talk time from Q&A.
      When a duration is needed but the user delegated that choice, use 15 minutes
      unless the scope justifies another explicit assumption. Assign page weights by
      content density, reserving less for opening/closing pages. Publish
      presentation_timing with exact seconds and contiguous cumulative ranges whose
      total matches the speaking budget. Later scripts reuse these allocations.

      This step authors content only; do not generate HTML, background images or a
      second model-written outline. Shared visual design and complete page prompts
      are planned next. For a requested insertion, add only the new section at its
      intended position, preserving other page plans and approved background bindings.
      If the tool rejects the Markdown page count, correct the headings and retry
      once with the same content. Use ### for subsections.
    tools:
      - ppt_plan_timing
      - ppt_find_deck
      - ppt_read_page_outline
      - ppt_insert_outline_page
      - ppt_publish_deck_outline
      - ppt_build_outline
    inputs:
      - material: presentation_output_format
        required: true
      - material: reflection_markdown
        required: false
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_clarification
        required: false
      - material: template_content_brief
        required: false
      - material: material_images
        required: false
      - material: ppt_capability_requirements
        required: true
      - material: style_flow
        required: true
    outputs:
      - material: deck_outline
      - material: presentation_timing
        required: false
    acceptance_criteria: |
      deck_outline must be one non-empty Markdown document with one concise page
      description for every requested page. For technical/research requests, each page
      must preserve its evidence-backed mechanism, variables, conditions and tradeoffs.
      Review source coverage before accepting: do not classify a requested core method
      as optional solely to obtain a sparse layout. Record deliberate exclusions and
      their source/scope reasons in validation evidence, never as visible slide copy.

  plan_page_prompts:
    label: Plan Page Prompts
    mode: auto
    prompt: |
      Turn the approved deck outline into complete, editable per-page generation
      prompts and separately authored speaker scripts. Freeze one shared visual
      specification, then apply it consistently to every page.

      Requirements: {{requirement_analysis}}
      Outline: {{deck_outline}}
      Materials: {{material_summary}}
      Clarifications: {{material_clarification}}
      Reflections: {{reflection_markdown}}
      Timing: {{presentation_timing}}
      Output format: {{presentation_output_format}}
      Template mode: {{template_mode}}
      Template requirements: {{template_content_brief}}
      {{runtime_instruction}}

      For each slide_outline item, write one Markdown document containing:
      1. Shared style: canvas, palette, typography, spacing, graphic language and
      output constraints. Retain user-approved style and template geometry.
      2. Layout: meaningful hierarchy, positions, chart/diagram structure and content
      areas. HTML uses 1600×900; native PPTX uses the inspected template's dimensions.
      3. Exact visible copy: title, explanations, formulas, labels and source-backed
      data. Use readable Markdown, not internal JSON or duplicate object lists.
      4. Assets: approved evidence images, background binding and intended use. Reuse
      real asset references; explicitly state when no external image is needed.

      Each prompt must be self-contained for page generation, beyond simply copying
      its outline. Preserve all approved technical claims, mechanisms and conditions
      as visible content or labelled figures. Notes cannot replace the explanation
      the slide itself must show. Do not add unsupported metrics or remove detail
      merely to fit a generic sparse layout. Keep source references in notes rather
      than visible citation footers unless the user requested visible references.

      Template rules apply to both representations: preserve its visual hierarchy,
      typography and brand elements; remove unapproved sample claims. For native PPTX,
      plan editable text/charts/tables and actual source-page mappings. For HTML,
      recreate the inspected design without pretending the HTML is a native file.
      AI backgrounds, when enabled, align one-to-one with pages and are already
      approved; do not regenerate or change them during prompt planning.

      Publish one slide_outline per page in approved visual order. Put style, layout,
      copy and assets together in that editable card. Do not create separate
      presentation_style, page_layout or page_assets artifacts, or embed a positional
      '第N页' header that would require rewriting unchanged cards after insertion.
      In external HTML execution, include exactly one comment on its own line
      in each slide_outline, for example <!-- ppt-material-images: ["id"] -->.
      List the exact source_revision_id of every approved foreground image for
      the page from bound material_images. Use [] for a page without approved
      foreground materials. A full plan with selected foreground materials
      must assign them to their intended pages. Describe placement and purpose
      under Assets. AI backgrounds bind by sort_order independently. Preserve the comment
      when editing a card and update it when replacing foreground materials.
      Report a required missing image and recover collection before generating.
      For a new deck or unfinished planning in LazyMind, call ppt_plan_page_prompts
      with the saved output_format and the shared global_style. It checkpoints each prompt
      and speaker note and resumes from the first missing page after a failure.

      Author each spoken script once, separately from slide copy and generation
      prompts. Use the allocated duration and cumulative range; explain the page's
      purpose, key points, intuition, evidence and transition in natural language.
      Multiple useful sentences (often 120+ Chinese characters) are preferable to
      one-line notes, but do not pad or recite long formula source. Publish
      speaker_notes_source as a UTF-8 JSON file with schema_version=1 and ordered
      pages=[{page: 1, text: '...'}, ...]. Generation attaches these scripts verbatim.
      For insert/delete/reorder, remap the saved scripts to the final page order,
      preserve unedited script bodies and keep the total speaking budget.
      For edits in LazyMind, use ppt_publish_outline with the saved output_format,
      global_style, page_components and separate speaker_notes for changed pages.

      Before completion, compare every page prompt with deck_outline and sources.
      Keep the claim-to-visible-content coverage map in validation evidence, outside
      the editable card. A correct count or valid Markdown alone does not prove fidelity.
    tools:
      - ppt_plan_page_prompts
      - ppt_publish_outline
      - ppt_update_speaker_notes
    terminal_tools:
      - ppt_plan_page_prompts
      - ppt_publish_outline
    inputs:
      - material: presentation_output_format
        required: true
      - material: template_mode
        required: true
      - material: template_content_brief
        required: false
      - material: presentation_timing
        required: false
      - material: material_clarification
        required: false
      - material: reflection_markdown
        required: false
      - material: deck_outline
        required: true
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_images
        required: false
      - material: background_images
        required: false
    outputs:
      - material: slide_outline
      - material: speaker_notes_source
    acceptance_criteria: |
      slide_outline must contain exactly one non-empty, editable generation
      prompt per requested page with aligned sort_order. Each slide_outline is one
      Markdown document: style first, then layout, copy and assets. Do not publish
      internal JSON/schema dumps or duplicate the copy as a second object list in
      this user-editable prompt. Express exact copy, formulas and chart data as
      readable Markdown; keep machine-oriented coverage evidence separate.
      Compare each page with deck_outline and material_summary before acceptance.
      Every retained core claim must map to actual visible copy, a labelled diagram,
      formula or chart specification, with conditions and distinctions preserved.
      Speaker notes cannot be the sole location of the mechanism. Record this
      page-by-page coverage map in validation evidence. File count, Skill hashes and
      valid Markdown alone do not prove content fidelity.

  plan_background_prompts:
    label: Plan Background Prompts
    mode: auto
    skip_if: {material: skip_background_images}
    rerun_when: >
      用户要求修改、替换或重新生成全部/指定页的底图提示词；或者在已启用
      AI 底图的现有 PPT 中插入整页（插页必须从此步骤开始）。
    prompt: |
      Write one short English image prompt for each requested slide when AI
      backgrounds are enabled. Use the approved requirement brief, available materials
      and visual direction; do not generate images in this phase.

      Requirements: {{requirement_analysis}}
      Materials: {{material_summary}}
      {{runtime_instruction}}

      Repeat a shared visual-series anchor (palette, rendering style, lighting,
      texture and atmosphere), varying the scene by page topic. Require a text-free,
      logo-free 16:9 composition, with calm content-safe areas and enough contrast for
      later editable slide text. The background must not contain slide copy, diagrams
      with invented data, illegible fake labels or embedded speaker notes.

      Preserve an explicit user prompt/style rather than paraphrasing it into a new
      design. Publish background_prompts in approved page order, one editable English
      paragraph per page. A targeted rerun replaces only requested positions. A page
      insertion adds one prompt at the requested position and preserves all previous
      stable item identities/revisions. This entire branch is skipped for uploaded
      templates and whenever AI backgrounds are disabled.
    tools:
      - ppt_init_deck
      - ppt_find_deck
      - ppt_read_page_outline
      - ppt_publish_background_prompts
    inputs:
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: style_flow
        required: true
    outputs:
      - material: background_prompts
        required: true
    acceptance_criteria: |
      On a full run, background_prompts contains one short, non-empty English
      paragraph per requested slide, with aligned sort_order. Prompts follow
      the existing style, leave space for slide text, and request no text in
      the background. On a targeted rerun, only requested positions are replaced.

  generate_backgrounds:
    label: Generate Backgrounds
    mode: auto
    skip_if: {material: skip_background_images}
    rerun_when: >
      用户要求重新生成全部底图、重新生成/替换第 1、2 等指定位置的底图，
      或者底图提示词步骤刚为现有 PPT 插入了一页新的底图提示词。
    prompt: |
      Generate, normalize and publish the approved background images.

      Approved prompts: {{background_prompts}}
      {{runtime_instruction}}

      Generate from the exact approved prompts; do not rewrite them. Reuse completed
      files/checkpoints after an interrupted attempt instead of generating them again.
      Normalize the final file to exactly 1280×720 (16:9), preserving composition.
      When image understanding is available, inspect actual pixels for scene relevance,
      series style and readable content areas. Visual review is advisory: record
      findings or unavailable checks without withholding usable images, failing the
      step or automatically regenerating them. This includes provider-added generation
      labels or watermarks. Never claim an unperformed visual check passed.
      The tool publishes each ready page. If it reports a provider failure, surface
      the exact error and reuse completed backgrounds on retry.

      Publish the final images in approved page order with matching prompt identities.
      In external execution, download the provider's image using its signed URL
      if remote, normalize it locally, and publish each file with
      output.slot=background_images, output.content_type=image and output.local_path.
      Report exact provider/model/file errors.

      Full runs produce one image per prompt. Targeted regeneration replaces only the
      requested positions; never append, reorder or regenerate untouched pages. A page
      insertion adds exactly the matching new image. User review pauses are controlled
      by the host's approval mode, not an extra requirement introduced by this step.
    tools:
      - ppt_generate_background_images
    terminal_tools:
      - ppt_generate_background_images
    inputs:
      - material: background_prompts
        required: true
    outputs:
      - material: background_images
        required: true
    acceptance_criteria: |
      background_images aligns one-to-one with background_prompts by sort_order.
      Each published image is a usable file at exactly 1280x720. Visual findings,
      including generation labels/watermarks, and unavailable visual checks are
      advisory and do not block publication or step completion.
      Full runs have N images. Targeted reruns replace only requested positions,
      preserve all others, and expose exact provider failures instead of empty
      success.

  generate_ppt:
    label: Generate PPT
    mode: auto
    tools_only: true
    terminal_tools:
      - ppt_fill_template
      - ppt_generate_native_pptx
    prompt: |
      Produce the requested presentation from the approved page prompts, assets and
      saved speaker scripts. Work in phases: resolve approved inputs → author the
      selected representation → verify content/structure → review visual quality →
      publish. Preserve the user's requested scope during retries and edits.

      Requirements: {{requirement_analysis}}
      Output format: {{presentation_output_format}}
      Template mode: {{template_mode}}
      Template source: {{template_pptx}}
      Template requirements: {{template_content_brief}}
      Materials: {{material_summary}}
      {{runtime_instruction}}

      Resolve the bound slide_outline, background_images, material_images and
      speaker_notes_source revisions. Use each complete page prompt directly; do not
      regenerate the outline/style or rewrite the saved scripts. Preserve requested
      content, approved order, exact page count and all source-backed values. Technical
      mechanisms must remain visible as explanations, formulas, labelled diagrams or
      charts, not only in hidden notes. Compare actual visible output to its approved
      prompt before accepting it.

      HTML route (presentation_output_format=html):
      - Generate one complete 1600×900 HTML document per page using the supplied
      page-authoring prompt and HTML constraints. Use stable unique data-el IDs,
      a background layer and an editable content layer. Render text as real text.
      - In external execution, call ppt_prepare_page with the one-based page_no
        (the approved sort_order) for the pinned brief
        and pass its model response with the same page_no and a new command_id. Put each approved
        foreground image in an <img data-ppt-image="ARTIFACT_ID"> in the intended
        layout with meaningful alt text. Core fills src from the saved bytes.
        Include a #bg layer for the bound AI background. Use the returned HTML
        for rendering, export and publication. Keep the markers and embedded
        assets intact. Publish using output.value_file (content_type=text) or
        an inline text value. For targeted regeneration use the partial selector
        or the existing preview list_index in the inline text object. Fix
        rejected pages and retry with the same seq before completing.
      - Use real inline SVG/evidence diagrams and source-backed charts. Preserve
      requested editable chart semantics; rasterizing a chart does not make it
      editable. Choose distinct, legible scientific chart colors and labels.
      - Attach saved scripts as the matching preview_notes and hidden speaker notes
      without asking a model to write them again. Publish each page/notes pair in
      approved order once checked. Buffer out-of-order worker results until earlier
      pages are acknowledged. A partial delivery is not a completed full run.
      - Deliver the actual PPTX as native_pptx when the user explicitly requested a
      downloadable/editable file, using the completed pages and scripts. HTML
      previews or an export button do not satisfy that explicit request. Otherwise
      the HTML pages and notes are the deliverable; no automatic export is needed.

      Native route (presentation_output_format=native_pptx):
      - Inspect/reuse the uploaded template's actual source pages, editable slots,
      geometry and effective fonts. Select, repeat or omit source layouts to meet
      the requested count. Do not assume the template length is the target count.
      - Preserve unspecified artwork, layout and text styling; remove unapproved
      sample claims. Keep native text, tables, charts and notes editable, with
      truthful data and correct fonts. Use the same approved page copy as HTML
      would use, not an independently shortened deck.
      - Publish a real non-empty PPTX after validating page count, content and notes.
      Optional HTML previews are not required and cannot replace the file. Do not
      launch HTML generation after a successful native delivery.

      Visual review:
      - Render the delivered representation when available; inspect actual pixels
      with the executing model or a declared image-understanding tool. A file's
      existence, dimensions, extracted text or a tool success flag is not a passed
      visual review. Ensure needed language fonts are installed before attributing
      missing glyphs to the slide design.
      - Check overflow, clipping, text/graphic collisions, font readability, image
      presence, aspect ratios and chart labels. Preserve natural glyph widths;
      never stretch text/images with unequal scale to fill a box.
      - Use the supplied review/repair prompts only for this phase. Apply at most
      two bounded repairs to defective pages, preserving content and the last usable
      version. Record findings and any unavailable checks without claiming approval.
      - For native PPTX, visual findings or unavailable rendering/vision are advisory:
      keep a structurally valid, usable delivered file and disclose limitations.
      Do not turn optional visual repair into failure or a parent-chat follow-up task.

      Edits and recovery:
      - Read the current selected artifacts, not the original template or stale disk
      snapshots. Pure text/font/color/layout changes preserve unspecified objects,
      data and pages. Use inspected anchors and current revision/hash checks.
      - Explicit redraws replace only requested pages. Update their approved content
      plan before rendering a requested content change. A material/background
      replacement updates its binding and only the affected page.
      - Insert/delete/reorder operations keep every nonempty prompt/background/HTML/
      notes list in the same visual order, with stable identities and unchanged
      revisions for unaffected items. Update an existing downloadable PPTX as well.
      - Reuse acknowledged outputs and generated files after interruption. Surface
      exact failures and missing capabilities, retaining useful progress; never
      restart the entire deck to repair one page.
      - Use named icons as small labels or decorations, up to 96 CSS pixels or
      0.8 inches per side. Reserve main visuals for factual diagrams, screenshots
      or charts.
    tools:
      - ppt_search_assets
      - ppt_get_asset
      - ppt_analyze_template
      - ppt_generate_native_pptx
      - ppt_restyle_pages
      - ppt_recolor_pages
      - pptx_analyzer
      - ppt_fill_template
      - ppt_generate_pages
      - ppt_export_deck
      - ppt_find_deck
      - ppt_run_stage
      - ppt_list_pages
      - ppt_publish_outline
      - ppt_replace_deck_fonts
      - ppt_read_page_html
      - ppt_read_page_outline
      - ppt_patch_page_outline
      - ppt_edit_page_html
      - ppt_edit_pages_html
      - ppt_delete_page
      - ppt_register_material_images
      - ppt_collect_kb_images
      - ppt_extract_pdf_images
      - ppt_replace_page_material_image
      - ppt_replace_page_background
    inputs:
      - material: speaker_notes_source
        required: true
      - material: presentation_timing
        required: false
      - material: material_clarification
        required: false
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_images
        required: false
      - material: background_images
        required: false
      - material: background_prompts
        required: false
      - material: generate_background_images
        required: false
      - material: slide_outline
        required: true
      - material: deck_outline
        required: false
      - material: generation_mode
        required: true
      - material: presentation_output_format
        required: true
      - material: template_mode
        required: true
      - material: template_pptx
        required: false
      - material: template_content_brief
        required: false
    outputs:
      - material: preview_html
        required: false
      - material: preview_notes
        required: false
      - material: native_pptx
        required: false
      - material: template_profile
        required: false
    acceptance_criteria: |
      Before publication, compare the actual visible page text, formulas, diagram
      labels and chart data with the bound slide_outline. Preserve all specified
      technical claims and their conditions; do not replace explained mechanisms
      with headings, slogans or metric cards. Validate content fidelity separately
      from screenshot/layout quality, and record omissions explicitly. A copied
      Skill hash, valid file or notes-only match is not a passed fidelity check.
      For the native branch: native_pptx must be a published non-empty PPTX file
      with the exact requested number of slides. Repeat or omit source layouts
      when needed; preserve the original count only if requested. HTML pages and notes slots are
      not required for this branch. A successful native publication completes
      the step; do not invoke HTML generation afterward.
      Visual findings, missing screenshot/vision support, and unsuccessful
      optional layout repairs are advisory. They must never fail a step that
      already delivered a usable native_pptx; keep the last published version.
      For HTML authoring with an explicitly requested PPTX download, native_pptx
      must also contain the actual exported file with matching count, copy and notes.
      For a full HTML run: the exact requested number of preview_html HTML pages must
      be saved (DOCTYPE/html documents), with matching preview_notes sort_order.
      After page-level checks, publish each page and its matching notes in approved
      page order. Buffer any page that finishes early until all earlier pages and
      notes have been acknowledged. Preserve the approved page identities.
      Keep saved HTML pages and notes if an optional PPTX export fails.
      preview_notes must be aligned with preview_html; the auto-generated draft
      must be a natural spoken explanation, not copied formula source. For
      academic pages explain intuition, key quantities, measured comparisons and
      caveats in human language; keep long equations on the slide only. The HTML
      publication tool inserts the saved notes into hidden data-el="speaker-notes"
      after rendering; the generator must not author them again.
      For a single-page edit: only the requested sort_order rows need updating.
      For a foreground image or AI-background replacement, the corresponding
      page prompt/binding and preview_html must update at the same sort_order;
      the tool result must report updated_pages=[N], and untouched pages must
      keep their existing revisions.
