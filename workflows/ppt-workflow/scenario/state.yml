initial: __start__

transitions:
  __start__:
    - to: analyze_requirements

  analyze_requirements:
    - to: collect_materials

  collect_materials:
    - to: build_outline

  build_outline:
    - to: generate_ppt

  generate_ppt:
    - to: __end__

steps:
  analyze_requirements:
    label: Analyze Requirements
    mode: auto
    prompt: |
      You are a senior presentation strategist.

      User request:
      {{user_input}}

      {{runtime_instruction}}

      Analyze the presentation requirements. Produce a concise but useful
      requirement brief in the user's language. The next step is always
      collect_materials; do not try to skip directly to build_outline.

      Step boundary (mandatory):
      - This step only analyzes requirements.
      - Do NOT search or call a knowledge base in this step. When the user asks
        to use a knowledge base, record that requirement clearly;
        collect_materials is the next step and is the only step that performs
        KB retrieval.

      Input availability rule:
      - A user upload is NOT required. For a text-only request, immediately
        analyze {{user_input}} and continue the workflow.
      - Only read uploaded material when an attachment actually exists and the
        user asks to use it. Never ask the user to upload a file merely because
        this workflow supports optional uploaded materials.

      Startup clarification contract:
      - The Chat host collects presentation topic, exact slide count, target
        customer/audience, and visual style before creating this workflow
        session. Extract all four faithfully from {{user_input}}; clarification
        answers may have been merged into the original request.
      - Do not replace an explicitly supplied value with a generic default.
      - Do not interpret the phrase "make a PPT" itself as a presentation topic,
        and do not confuse the number of source files with the requested slide
        count.

      Uploaded source reading:
      - You CAN read user-uploaded PPT/PPTX files with the attachment reader.
        When the request asks you to base the new deck on an uploaded PPT/PPTX,
        call read_user_attachment(filename=<uploaded filename>) before writing
        the requirement brief, then use the extracted slide text as source material.
      - Use the same reader for uploaded PDF/DOC/DOCX source documents.
      - Do not use read_file, Python, shell commands, URL fetching, or workspace
        file tools to open conversation uploads. Do not claim that PPTX is
        unreadable before trying read_user_attachment.
      - If the reader returns a parsing error, record the filename and exact
        error under missing information / assumptions; do not invent the deck's
        contents.

      Include:
      - presentation goal
      - presentation topic
      - target customer / audience
      - exact expected slide count (any positive integer)
      - communication tone
      - visual style constraints supplied by the user (for example a named
        style, color, brand guide, or reference image). Do not invent colors,
        palettes, theme names, or cultural / holiday color stereotypes here;
        the deck-wide style stage applies the requested direction consistently.
      - required sections / narrative arc
      - available source material and missing information
      - practical assumptions
      - whether real photos/diagrams from KB or web should be collected for
        embedding in slide HTML (default: yes when the topic is product /
        industry / case-study visual; otherwise CSS/SVG/ECharts only)
      - whether the user explicitly asked for AI-generated material images
        (default: no — do not invent this need)

      If the user already attached a PDF/PPTX/report or pasted key facts, fold the
      usable numbers and claims into the brief. collect_materials will reuse
      these facts and may complete without any network search.

      Save the result:
        save_artifact(key='requirement_analysis', content_type='text', value=<analysis>)

      Stop after saving. Do not call advance tools yourself.
    outputs:
      - material: requirement_analysis
    acceptance_criteria: |
      requirement_analysis must be saved and must cover goal, presentation
      topic, exact slide count, target customer/audience, communication tone,
      explicit visual constraints, structure, constraints, and assumptions.

  collect_materials:
    label: Collect Materials
    mode: auto
    prompt: |
      You are a presentation research and material collection assistant.

      This step always follows analyze_requirements. Entering this step does not
      mean web research is required: first reuse the user request and uploads,
      then search a supplied/selected knowledge base when present, and call web
      tools only when a concrete unresolved need remains.

      Requirement analysis:
      {{requirement_analysis}}

      Uploaded material files, if the user added any through the workflow panel:
      {{uploaded_materials}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      Collect facts AND visual assets that should guide the presentation.
      Use the conversation, uploaded files, requirement analysis, and KB/web
      retrieval subject to the KB-first gate below.

      Uploaded file parsing:
      - You CAN read PPT/PPTX with the attachment reader. If the user uploaded a
        PDF/DOC/DOCX/PPT/PPTX or refers to an uploaded source file, call
        read_user_attachment(filename=<uploaded filename>) to extract text.
      - If multiple files are available, read the ones that are relevant.
      - Do not use read_file, Python, shell commands, URL fetching, or workspace
        file tools to open conversation uploads.
      - If a file cannot be parsed, mention the filename and the parsing error
        in gaps/assumptions.

      Retrieval policy (do this before writing the summary):
      1. KB-first gate (mandatory): if the user supplied, selected, or mentioned
         a knowledge base / selected documents, or the topic looks internal,
         call kb semantic search BEFORE calling any web tool. Do not call
         web_search, wikipedia, or ppt_search_web_images first. Prefer KB hits
         with numbers, definitions, and product facts. When kb returns image
         hits, keep their local_path or image_url + a short caption.
         Use this exact discovery-and-search sequence; do not omit kb_ids:
         a) First call:
            KBToolkit_list_knowledge_bases(keyword='', page_size=20)
         b) Read result.datasets and copy the exact dataset_id values (for
            example ds_abc123). The name field may be prefixed with `datasets/`;
            pass dataset_id, not the prefixed name. Select the KB whose
            display_name matches the user's request; if exactly one readable KB
            exists, use that one.
         c) Then call semantic search with kb_ids as a JSON LIST, never a string:
            KBToolkit_kb_search(
              query='one focused retrieval intent',
              kb_ids=['ds_abc123'],
              retriever_topk=10,
              k_max=15,
              image_topk=3
            )
            For multiple selected KBs use kb_ids=['ds_abc123', 'ds_def456'].
            Each call must contain exactly one search intent; make separate
            calls for unrelated topics.
         d) If search returns `kb_ids is required`, do not repeat the same
            invalid call. Run list_knowledge_bases, extract dataset_id, and retry
            once with the explicit list. If no readable/matching KB exists,
            record that as a gap and do not claim KB retrieval succeeded.
         e) Treat retrieval as successful only when the tool returns evidence;
            base claims on that evidence and retain its document/citation markers.
         f) If KB evidence and KB images are sufficient for the requested deck,
            STOP retrieval and do not call any web tool.
      2. Web fallback gate: call web_search only when at least one of these is true:
         - the user explicitly requested web research or latest/current facts;
         - KB search completed but left a specific factual gap required by the deck;
         - no applicable/readable KB exists and external facts are genuinely required.
         Before each web call, identify the exact unresolved gap and use one focused
         intent per query. Do not call web_search merely because it is available,
         because the topic is public, or to duplicate facts already found in KB.
         Use wikipedia only as a thin fallback under the same gate.
      3. Images for slides (required when visuals would help, or the user /
         analysis asks for photos/diagrams/产品图):
         a) Register KB image hits first via ppt_register_material_images with
            [{"local_path":..., "caption":..., "source":"kb"}, ...]
            (image_url also works if local_path is absent).
         b) Call ppt_search_web_images only when required slide visuals are still
            missing after KB image retrieval, or when no applicable KB is available.
            Then register only the necessary results with
            [{"url":..., "caption":..., "source":"web"}, ...] for 2–6 chosen URLs.
         c) AI-generated material images — ONLY when the user explicitly asks
            to generate/create material images for the deck (e.g. "生成素材图",
            "用 AI 画几张参考图", "AI generate reference images"). Then call:
            ppt_generate_material_images(prompts_json=[
              {"prompt":"<detailed image-generation prompt>",
               "caption":"<short caption>"}, ...
            ])
            Cap at ~4 generated images. Do NOT call this for decorative polish,
            generic "make it prettier", or when KB/web photos already suffice.
            Do NOT invent an AI-gen need that the user never stated.
         d) Cap at ~6 useful images total across kb/web/ai-gen. Prefer real
            photos/diagrams over decorative stock. Do not fabricate URLs.
      4. Do not fabricate citations.

      These registered images are auto-attached at ppt_init_deck and embedded
      into the final slide HTML as foreground <img> (via outline use_image).
      ppt_register_material_images / ppt_generate_material_images also publish
      one content_type=image artifact per registered visual, so material_images
      is a previewable ordered image list in the Materials tab. Never save a
      path inventory or Markdown list into material_images; put textual source
      notes in material_summary instead. Preserve each supplied caption as the
      displayed material name; source belongs in metadata/summary and must not
      be prepended to the caption.

      Produce a material summary with:
      - uploaded file summaries, if any
      - key facts or claims to support
      - useful source material or references
      - registered visual assets (caption + source=kb|web|ai-gen) that will appear in HTML
      - open gaps and assumptions

      Save the result:
        save_artifact(key='material_summary', content_type='text', value=<summary>)

      Stop after saving.
    tools:
      - kb
      - web_search
      - wikipedia
      - ppt_search_web_images
      - ppt_register_material_images
      - ppt_generate_material_images
    inputs:
      - material: requirement_analysis
        required: true
      - material: uploaded_materials
        required: false
    outputs:
      - material: material_summary
      - material: material_images
    acceptance_criteria: |
      material_summary must be saved and must identify uploaded-file findings
      when files are present, references, useful evidence, gaps, and assumptions.
      When KB/web/AI material images were needed, material_images should be
      registered via ppt_register_material_images / ppt_generate_material_images
      as individual image-list artifacts so the Materials tab can preview them
      and later steps can embed them in HTML.

  build_outline:
    label: Build Outline
    mode: auto
    prompt: |
      You are a PPT outline planner. Build the deck structure and publish one
      editable outline brief per page for the UI. Do NOT generate slide HTML yet.

      Requirement analysis:
      {{requirement_analysis}}

      Material summary (may be empty if collect_materials was skipped):
      {{material_summary}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      Call ONE tool only:

      ppt_build_outline — pass only these (omit unused optionals; never pass null):
           user_query=<merged request>,
           page_count=<positive integer>,
           topic=<short topic>,
           role / audience / scene=<from analysis>,
           style_hint=<ONLY visual constraints explicitly stated by the user>,
           key_points_json='["point1","point2"]'  (JSON string, or omit)
         Defaults: ppt_mode=fast.
         Slide photos come from registered material_images (KB/web, or
         ppt_generate_material_images when the user explicitly asked).

      Omit style_hint when the user did not explicitly request a style, color,
      brand guide, or visual reference. Do not copy model-inferred visual ideas
      from requirement_analysis into style_hint. The PPT runtime selects one
      deck-wide style and applies that same contract to every page.

      This single call runs init → preflight → style → outline → publish_outline
      and writes slide_outline list items (sort_order=page) for the Outline tab.

      This is an atomic step. If ppt_build_outline fails, report that exact tool
      error and stop so the Workflow step fails and can be retried. Do NOT recover
      by calling save_artifacts, and never write a multi-page JSON array into one
      slide_outline item.
      Do NOT call batch-page-html or export here — HTML is generate_ppt.
      After success, stop.
    tools:
      - ppt_build_outline
    inputs:
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_images
        required: false
    outputs:
      - material: slide_outline
    acceptance_criteria: |
      slide_outline must be saved as a list with at least 2 pages (sort_order
      aligned), each containing that page's title / bullets / layout brief.

  generate_ppt:
    label: Generate PPT
    mode: auto
    prompt: |
      You are a PPT HTML generator. You do NOT rewrite the outline. You MUST
      drive generation through ppt_* tools and publish preview_html.
      LLM stages reuse the same chat model as this SubAgent (AutoModel llm).

      Requirement analysis:
      {{requirement_analysis}}

      Material summary (optional):
      {{material_summary}}

      Per-page outline briefs already published (and possibly edited by the user):
      {{slide_outline}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      ## Mode selection

      ### A) Delete an entire page
      If the user asks to remove a whole slide (e.g. "删掉第3页", "去掉封面",
      "delete page 2") — not a bullet inside a page:
        ppt_find_deck() → ppt_delete_page(deck_dir, page=N)
      Stop after delete. Do NOT re-run outline/style/batch-page-html.

      ### B) Single-page content edit
      If user_input / runtime_instruction asks to modify specific pages
      (e.g. "改第3页", "page 2", "这一页", "删掉最后一个要点", or a focused sort_order):

      1. Resolve target 1-based page numbers.
      2. Resolve deck_dir via ppt_find_deck() (or earlier tool results).
         Only if no deck exists: say so and stop — do not silently rebuild.
      3. Text-only edits inside existing elements MUST use stable element ids;
         examples: add detail to the middle description, expand/reword a card,
         change a label/title/number, or remove one existing item. Use:
           ppt_read_page_html(deck_dir, page=N)
           ppt_edit_page_html(deck_dir, page=N, ops_json=[
             {"op":"replace_text","el":"<data-el id>","value":"<new text>"}
           ])
         Put all element edits for that page in one ops_json call. This preserves
         the original layout byte-for-byte and auto-publishes a new revision at
         the SAME page/list_index. Never redraw for a text-only request.
      4. Also keep the page brief consistent when its content changed:
           ppt_read_page_outline(deck_dir, page=N)
           ppt_patch_page_outline(deck_dir, page=N, ops_json=[...])
         Do not run page-html after this when step 3 already updated the HTML.
      5. Use ppt_run_stage(deck_dir, stage='page-html', page=N) ONLY when the user
         explicitly requests a structural/layout redesign, a new visual block, or
         the existing HTML has no addressable element for the requested content.
      6. ppt_edit_page_html and page-html auto-publish. Stop immediately afterward:
         do NOT call ppt_publish_pages and do NOT call save_artifacts.

      ### C) Full deck HTML generation (default)
      Outline already exists from build_outline. Do NOT call ppt_init_deck,
      stage=style, or stage=outline again.

      Call ONE tool:
        ppt_generate_pages()
          — omit deck_dir to auto-find; or pass deck_dir from earlier results.
          — concurrency=4 by default.
          — Internally: asset-plan → batch-page-html
            (uses each slide_outline brief, including Outline-tab edits;
             auto-publishes preview_html + notes).

      Do NOT call ppt_run_stage(asset-plan|batch-page-html) separately unless
      ppt_generate_pages failed and you are recovering.
      Stop after success. Do NOT export PPTX from tools.

      ## Hard rules
      - Never call save_artifacts in generate_ppt; PPT tools publish the declared
        artifacts themselves. Never invent slide JSON or hand-write full HTML.
      - Never ppt_read_page_html + save_artifacts for full HTML bodies.
      - Full outline run → ppt_build_outline. Full HTML run → ppt_generate_pages.
      - Whole-page delete → ppt_delete_page. Bullet/element delete →
        ppt_patch_page_outline / ppt_edit_page_html (not ppt_delete_page).
      - Never stage=outline / style / ppt_init_deck on a full generate after
        build_outline already ran (unless ppt_find_deck finds nothing).
      - Never export PPTX from tools — UI Export only.
      - All visible slide text must match the user's language.
      - After tools finish, stop.

      Stop after preview_html pages are published.
    tools:
      - ppt_generate_pages
      - ppt_find_deck
      - ppt_run_stage
      - ppt_list_pages
      - ppt_publish_outline
      - ppt_read_page_html
      - ppt_read_page_outline
      - ppt_patch_page_outline
      - ppt_edit_page_html
      - ppt_delete_page
    inputs:
      - material: requirement_analysis
        required: true
      - material: material_summary
        required: false
      - material: material_images
        required: false
      - material: slide_outline
        required: true
    outputs:
      - material: preview_html
      - material: preview_notes
    acceptance_criteria: |
      For a full run: at least 2 aligned preview_html HTML pages must be saved
      (DOCTYPE/html documents), with matching preview_notes sort_order.
      preview_notes must be aligned with preview_html; the auto-generated draft is
      sufficient unless the user explicitly requests a richer speaker script.
      For a single-page edit: only the requested sort_order rows need updating.
