    acceptance_criteria: |
      For the native branch: native_pptx must be a published non-empty PPTX file
      with the exact requested number of slides. Repeat or omit source layouts
      when needed; preserve the original count only if requested. HTML pages and notes slots are
      not required for this branch. A successful native publication completes
      the step; do not invoke HTML generation afterward.
      Visual findings, missing screenshot/vision support, and unsuccessful
      optional layout repairs are advisory. They must never fail a step that
      already delivered a usable native_pptx; keep the last published version.
      For a full HTML run: the exact requested number of preview_html HTML pages must
      be saved (DOCTYPE/html documents), with matching preview_notes sort_order.
      Generate pages sequentially; a two-page request still requires both pages.
      preview_notes must be aligned with preview_html; the auto-generated draft
      must be a natural spoken explanation, not copied formula source. For
      academic pages explain intuition, key quantities, measured comparisons and
      caveats in human language; keep long equations on the slide only. The HTML
      publication tool inserts the saved notes into hidden data-el="speaker-notes"
      after rendering; the generator must not author them again.
      For a single-page edit: only the requested sort_order rows need updating.
      For a foreground image or AI-background replacement, the corresponding
      page prompt/binding and preview_html must update at the same sort_order;
      the tool result must report updated_pages=[N], and untouched pages must
      keep their existing revisions.
