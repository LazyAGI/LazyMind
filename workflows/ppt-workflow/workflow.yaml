id: ppt-workflow
name: AI PPT Planner
preflight_disabled: true
description: >
  Plan a presentation from a user request, collect useful source material,
  then generate HTML slides by default, or compose uploaded templates into a new
  native PPTX. Native files are downloaded for viewing in PowerPoint or WPS.

when_to_use: >
  Trigger this workflow when the user explicitly asks to use the PPT workflow, or
  when the user wants to create, plan, draft, or revise a multi-slide
  presentation/deck/PPT. Use it for requests such as "make a PPT", "generate a
  presentation", "帮我做一个路演 PPT", or "做一份汇报幻灯片".
  Treat every supplied source as an ordinary conversation attachment. Use the
  user's instructions to distinguish research reports, paper reviews and reading
  notes. Preserve all selected papers; never ask for internal paper IDs.
  Academic/scientific presentations, including paper group meetings, default to
  科研风格（白底黑字：#FFFFFF background, #111111 text, restrained chart accents,
  readable evidence-led typography and diagrams）and
  generate_background_images=disabled. Do not ask visual_style or AI-background
  questions for these defaults. Preserve an explicit user visual direction or
  explicit request to enable AI backgrounds; an uploaded template takes precedence.
  Uploaded source materials are optional: text-only requests must start from
  the user's prompt. Never ask whether to use/upload a template. Bind a template
  only when the user actually supplies one. Without a template, default to HTML
  and do not ask an output-format question. With an uploaded template, ask once
  for HTML or PPTX unless already specified. HTML reads and recreates its style;
  PPTX reuses template layouts and can add, remove or repeat pages.
  Never ask for a source document merely because uploads are supported.
  Before starting, collect only missing declared fields: presentation topic,
  slide count, target customer/audience, visual style, AI-generated per-slide
  backgrounds. Never ask quick/full generation mode, with or without a template.
  When a supplied PPTX is identified as the template, it already determines
  visual style: never ask about style, palette, typography, decorative images
  or AI backgrounds, even via a custom question. Reuse supplied facts and ask
  only missing content/scope fields. Ask page count when unknown unless the
  user explicitly asks to fill all existing pages or preserve template length.
  Main Chat only analyzes the user's requirements and launches this Workflow.
  Bind supplied template/source references without opening document bodies,
  listing knowledge-base documents, searching local directories or ranking contributions.
  Pass requests such as "choose my four largest contributions from WorkLog"
  intact to the Workflow; choosing those records belongs to collect_materials.
  analyze_requirements owns template inspection; collect_materials owns source
  retrieval, doc read, factual analysis and evidence selection; later steps own generation.
  For an uploaded PPTX template, preserve the original file and let the Workflow
  inspect it through the native template tools. Never invoke Office-to-PDF, HTML conversion
  or an OCR conversion tool merely to read or fill the template.
  After successful native PPTX publication, generation is complete. Do not
  launch additional parent-chat inspection, academic analysis or rendering.
  A reported visual-validation limitation is a disclosure, not a new task.
  Do not trigger for simple one-off explanations, ordinary image generation,
  edits to dates/text or adding speaker notes on an already generated native PPTX
  (use edit_presentation inspect_content/edit_content on native_pptx directly),
  ordinary long-form writing, or requests that only ask to preview an uploaded
  PowerPoint file.

runtime:
  trigger_inputs: [template_pptx, uploaded_materials]
  publisher_owned_slots:
    - reflection_markdown
    - deck_outline
    - slide_outline
    - background_prompts
    - background_images
    - preview_html
    - preview_notes
    - native_pptx
  collects_knowledge: true
  completed_actions:
  - name: edit_current_pptx
    requires_slot: native_pptx
    description: |-
      Delegate current native PPTX edits to a dedicated SubAgent.

      Pass the user's complete edit instruction, including preservation constraints.
      The SubAgent inspects current content, writes text/notes and publishes a new
      artifact revision. Do not write speeches or edit files in main Chat, and do
      not rewind any Workflow step. Report the task result and stop.
    agent_type: pptx_edit
    title: PPTX 内容、布局、表格与讲稿编辑
    session_params:
    - _pptx_edit_session_id
    - session_id
    params:
      tools_only: true
      terminal_tools:
      - publish_pptx_edit
      output_slot_types:
        pptx_edit_receipt: json
      instruction: >-
        Edit the selected native PPTX only. Inspect it first. Reuse saved material_summary and requirement_analysis
        when needed; never search or regenerate. Preserve all unspecified slide content and formatting.
        For font requests pass target_font to publish_pptx_edit: omit pages for the entire deck, pages=[1]
        for the first slide, exact inspected slot_ids for a specific part or custom title. Never rewrite
        text to change fonts. For size, bold, italic, underline or text color use style_edits on publish_pptx_edit:
        each object has pages/slot_ids/text_scope and font_size_pt/bold/italic/underline/text_color. Omitted
        fields stay unchanged, false cancels that style. Use multiple entries for different ranges, publish
        once. Sizes are pt. Report overflow errors instead of silently shrinking fonts or resizing boxes.
        Missing allowlisted open fonts download by default; disable only if the user disallows downloads.
        Accept a user-uploaded TTF/OTF through font_filename. Report font_notice and
        any unmodified_complex_text_parts from the result; never claim chart/SmartArt text was changed when
        it was not. Write requested detailed page-specific speeches in speaker notes, not visible slide
        text; do not invent facts. For every-page notes set require_all_notes=true.
        For a request such as 修改第5页, inspect_current_pptx(page=5) and edit the CURRENT generated
        artifact, not the uploaded template. Preserve every unspecified page, chart value and note.
        For chart colors use chart_edits=[{page:5,chart_index:1,palette:'teal'}] on publish_pptx_edit;
        inspect chart_index first. Available palettes: blue, teal, orange, purple, or distinct RGB colors.
        For move/resize/alignment/layer changes, adding/removing objects, lists, tables or row/column edits,
        inspect layout (shape_id, box, table.rows, paragraphs), then pass structure_edits to publish_pptx_edit.
        Each op has page and shape_id/shape_ids; add_text/add_list/add_table use box in inches.
        resize(dw,dh), move(dx,dy), align(edge), distribute(axis), duplicate_shape(box), delete_shape,
        bring_to_front/send_to_back, set_list(values,ordered), list_insert_item/list_set_item(index,text),
        list_delete_item(index), table_set_cell(row,column,text), table_insert_row/table_insert_column(index,values),
        table_delete_row/table_delete_column(index) are local edits. Indices are 1-based in the edited state;
        delete multiple indices descending. All pages/objects belong in one batch; never restart generation.
        For timing edits include per-page suggested duration and cumulative range in speaker_notes;
        reuse presentation_timing where available and keep the total within the user's budget.
        Publish exactly once then stop. If the requested edit is unsupported or overflows, report the limitation.
    output_slots:
    - pptx_edit_receipt
    tools:
    - inspect_current_pptx
    - read_pptx_edit_material
    - publish_pptx_edit
    routing: >-
      For date, title, slide text, typography (font/size/bold/italic/underline/text color on whole deck/page/selected
      text), chart palette/color changes, move/resize/alignment/layer changes, adding/deleting objects,
      list/table edits including row/column insertion/deletion, or speaker-note/timing changes on the selected native_pptx,
      including 修改第几页 and every-page detailed speeches,
      MUST delegate to edit_current_pptx with the complete user instruction. Its dedicated SubAgent performs
      inspection, writing and publication; main Chat must not write speeches or edit the file itself. Do
      NOT call advance_step, rewind, generate_ppt or another Workflow for these edits. Publish once and
      stop; the Session remains completed. If unsupported or overflowing, report the limitation. Only an
      explicit user request to regenerate/restructure the deck uses the ordinary completed-edit step routing.
  completed_edit_step: generate_ppt
  completed_edit_routing: |
    For "only edit section N of the outline", read the selected deck_outline
    and use patch_artifact_text with a unique exact section excerpt. For a
    composite prompt, use its exact selected list handle. Stop after the patch;
    do not rewind or advance downstream steps unless regeneration was requested.
    Pure page moves/exchanges use reorder_artifact_pages directly without
    advance_step/rewind. Include slide_outline, background_prompts,
    background_images, preview_html and preview_notes; empty slots are skipped.
    Deleting existing whole slides routes to generate_ppt, where linked page
    materials must be changed together without a full rebuild.
    An explicit page regeneration routes to generate_ppt with the requested
    pages only. These scoped rules take precedence over deck-wide routing below.

    For an explicit request to revise a completed deck, infer the earliest
    affected Workflow stage from the user's requested change; do not ask the
    user to choose an internal step. When several rules match, choose the
    earliest stage in Workflow order so Runtime reruns that stage and every
    later applicable stage. Select only an exact rewindable step returned by
    Runtime. If the inferred target is absent because that conditional stage
    was skipped on the first run, rewind to analyze_requirements, which owns
    the applicability markers, so it can make the stage applicable from the
    new explicit request.

    Route changes to presentation goal, audience, tone, slide count, global
    constraints affecting content, or whether AI backgrounds are
    enabled to analyze_requirements.
    Route requests to add, replace, refresh, research, or cite source material
    to collect_materials. Route requests to revise academic interpretation or
    cross-paper comparison to collect_materials as well.
    Route requests to rewrite the deck-wide or selected
    AI-background prompt plan to plan_background_prompts. Route requests to
    regenerate existing AI background images without changing their approved
    prompts to generate_backgrounds. Route changes to deck structure, section
    order, page sequence, or the deck outline to build_outline. Route requests
    to rewrite one or more editable per-page generation briefs to
    plan_page_prompts. Route slide rendering, page content, layout, element,
    foreground image, ordinary background, and page-scoped visual changes to
    generate_ppt.
    Pure palette/color, typography, spacing, whitespace and visual restyling
    requests on an existing deck go directly to generate_ppt, even deck-wide.
    Font-only requests MUST use ppt_replace_deck_fonts on the existing HTML deck:
    omit pages for the entire deck, pages=[1] for page one, text_scope=titles
    for all titles. For exact custom text use ppt_read_page_html and
    ppt_edit_page_html with set_style. These are deterministic sparse patches.
    For local HTML list/table/object additions, deletions, row/column edits or width/height changes,
    inspect each page with ppt_read_page_html then use ppt_edit_pages_html for the complete batch.
    Pass source hashes and exact element IDs. Use set_style for explicit dimensions and adjust_style
    for relative inline dimensions. Never generate pages for a supported local edit.
    NEVER call ppt_generate_pages, page-html, batch-page-html, style generation,
    outline generation or regenerate any page for font replacement, even when
    the user requests fonts across the whole deck. A font failure must be
    reported; regeneration is not a recovery mechanism. Preserve text, images,
    geometry, notes and every unselected element/page. Stop after publication.
    For a missing font, automatically download allowlisted open fonts unless disabled, or import
    the user's TTF/OTF with ppt_import_font(filename=...).
    Only report portable delivery after fonts have been embedded and verified.
    For an existing HTML deck, a simple white-background/black-text or dark-background/
    light-text request must use ppt_recolor_pages (theme=light/dark). This edits and
    republishes HTML with a deterministic script and zero page-generation model calls.
    Do not call ppt_generate_pages or page-html for a palette-only request.
    Preserve approved content and page count; do not restart requirement analysis
    or material collection for these visual-only changes.

    For a request to insert or add a whole slide into an already generated deck,
    first call read_artifact(artifact_ref='ppt_capability_requirements') to inspect
    the saved capability marker. When its content is exactly
    AI_BACKGROUND_IMAGES: enabled, rewind to plan_background_prompts so the new
    background prompt is inserted first. When it is exactly
    AI_BACKGROUND_IMAGES: disabled, rewind to build_outline. These insertion
    routes take precedence over completed_edit_step; all other completed-deck
    edits use the generate_ppt fallback.
  post_step_checks:
    - step_id: analyze_requirements
      tool: check_ppt_workflow_capabilities
      arguments:
        capability_requirements: ppt_capability_requirements
        style_flow: style_flow
        generate_background_images: generate_background_images
        template_mode: template_mode
  input_checkpoint:
    after_step: collect_materials
    slot: material_clarification
    before_steps: [plan_background_prompts, generate_backgrounds, build_outline, plan_page_prompts, generate_ppt]
    title: 素材搜集完成 · 补充缺失信息
  attachment_clarification:
    filename_suffixes: [.pptx]
    question_id_prefix: template_detail_
    inspection_tools:
      - pptx_analyzer
      - read_user_attachment
      - find_user_attachment
      - KBToolkit
      - KBToolkit_kb_search
      - KBToolkit_kb_keyword_search
      - KBToolkit_kb_get_parent_node
      - KBToolkit_kb_get_window_nodes
      - KBToolkit_read_document
      - KBToolkit_list_knowledge_bases
      - KBToolkit_list_knowledge_base_documents
      - KBToolkit_aggregate_knowledge_base_documents
    # Retained for interpreting answers in older conversation histories.
    # New tasks inspect attachments only inside the Workflow.
    instructions: >
      Main Chat analyzes the request, binds the exact supplied template filename
      and source references, and starts the Workflow without reading their contents.
      analyze_requirements owns whole-template inspection and template_content_brief.
      collect_materials owns document body reads, knowledge-base retrieval, evidence
      comparison and contribution selection. Do not move these operations before
      the trigger. Ask unresolved material facts at the post-collection input_checkpoint;
      preserve all facts and prior answers already supplied by the user.
  clarification_fields:
    - id: contribution_scope
      label: 个人贡献范围
      ask_when: >
        Only when the user requests personal work/contribution analysis from
        GitHub, Git or PR descriptions and author identity or repository is missing,
        or a requested bounded internship/reporting period has no dates.
        Extract author/repository/state from a supplied GitHub /pulls?q= URL;
        these count as supplied. A filter URL without dates means all matching
        dates unless the user additionally requests a specific reporting period.
        Public repositories do not require a connection or token.
        Reuse explicit information already supplied. Do not infer that a connected
        account is the contribution author. Branch is optional, not a substitute
        for author identity. Ask only for missing fields in one question.
      question: 请补充尚未提供的 GitHub 用户名、仓库及实习起止日期（按 PR 创建日期筛选）；如需限定分支，请注明来源分支或目标分支。
      type: text
    - id: academic_materials
      label: 科研材料
      ask_when: >
        Only for research reports, paper reviews, thesis defenses or reading-note
        presentations when no relevant source attachments, substantive research
        text or reading notes have already been supplied in this conversation.
        Reuse existing materials without asking again. A PPTX visual template
        is not a research source. Do not ask this question for general PPT tasks.
      question: 请提供科研材料，可上传单篇或多篇论文，也可以直接输入研究内容或阅读心得。
      type: single
      choice_policy: seed
      allow_other: true
      choices:
        - 上传论文或研究材料
      attachment:
        when_choice: 上传论文或研究材料
        material_id: uploaded_materials
        accept: [.pdf, .doc, .docx, .txt, .md]
        max_files: -1
        required: true
    - id: topic
      label: 主题
      required: true
      reason: 主题决定内容范围，未明确主题时无法组织幻灯片。
      patterns: ['(?:主题|题目)[是为：:\s]+([^\n，。；]+)', '(?:关于|围绕)([^\n，。；]+?)(?:的?PPT|的?演示|的?汇报)']
      ask_when: Only when the presentation purpose/topic is not already clear from the request. A probation defense is a supplied topic.
      question: 这份 PPT 的主题是什么？
      type: text
    - id: slide_count
      label: 页数
      required: true
      resolution: explicit
      reason: 页数会影响内容颗粒度和生成时间。
      patterns: ['([0-9一二三四五六七八九十百两]+)\s*页']
      value_aliases: {沿用模板全部页面: preserve_all, 填满模板全部页面: preserve_all, 保留模板页数: preserve_all}
      ask_when: >
        For paper presentations with N known papers and no requested count, default
        to 3*N content pages plus explicitly requested shared pages; do not ask this
        field. Otherwise only when the desired page count is unknown, the user has not delegated
        page count to the model, AND the user has not explicitly
        requested filling all existing template pages, filling the template completely
        (填满/补全模板全部页面), or preserving its original page count.
        Uploading a template alone does not settle page count: it may contain only
        opening/closing pages. Reuse an explicit count; never ask it again.
      question: 希望最终多少页？可以填写页数，或选择沿用模板全部页面；模板只有收尾页时，也请说明期望的总页数。
      type: single
      choice_policy: seed
      choices:
        - 3 页
        - 5 页
        - 8 页
        - 10 页
        - 沿用模板全部页面（已上传模板时）
    - id: presentation_duration
      label: 演讲时长
      ask_when: >
        Only when the user has not supplied a talk duration or delegated timing.
        Reuse explicit minutes and any Q&A allowance; combine with the existing
        first Ask, never create a separate round just for duration.
      question: 预计讲多长时间？如包含问答，请说明问答预留几分钟。
      type: single
      choice_policy: seed
      choices: [5 分钟, 10 分钟, 15 分钟, 20 分钟, 按内容建议时长]
    - id: academic_page_budget
      label: 论文展示页数确认
      ask_when: >
        Only for paper presentations/reviews when N distinct selected or uploaded
        papers are known and the user's requested total is below 3*N content pages
        plus any explicitly requested cover, agenda, comparison and closing pages.
        This is a tradeoff confirmation, not a missing slide_count question.
        Ask once even when slide_count is explicit; include it in the same startup
        Ask card as other missing fields. State N, the requested total and the
        concrete recommended total (3*N plus explicitly requested shared pages).
        Offer that exact recommended total and keeping the user's exact total.
        If the user already chose to keep/compress to their count, do not ask again:
        compress all selected papers into that count without dropping papers.
        Never infer N from arbitrary PDFs, templates or reading notes.
      question: 每篇论文建议用三页分别介绍问题、方法和实验结论。是否采用建议总页数，还是保留你的页数并压缩内容？
      type: single
      choice_policy: seed
      choices:
        - 采用建议页数
        - 保留我的页数，压缩内容
    - id: target_customer
      label: 对应客户
      reason: 受众会影响内容表达，已有使用场景时由场景确定。
      ask_when: Only when the audience is unknown and cannot be inferred from the stated purpose. A company probation defense already implies its reviewers/managers; do not ask for a customer.
      question: 这份 PPT 面向哪位客户或哪类受众？
      type: text
    - id: template_mode
      label: Template binding
      default: none
      ask_when: Never ask this field. Derive upload only from an actually bound template_pptx; otherwise none; do not ask for another upload.
      question: Template binding (internal default; never display this question).
      type: single
      choices: [none, upload]
      attachment:
        when_choice: upload
        material_id: template_pptx
        accept: [.pptx]
        max_files: 1
        required: true
    - id: presentation_output_format
      label: 输出格式
      required: true
      reason: HTML 会重建模板样式，PPTX 会保留并复用原生模板版式。
      # Accept grounded extraction from requests such as "生成12 页pptx";
      # this is an output parameter, not an opt-in requiring a card answer.
      applies_when: {field: template_mode, equals: upload}
      value_aliases: {HTML｜参考模板样式生成: html, PPTX｜复用模板并按需增删页面: native_pptx, 输出HTML: html, 输出 HTML: html, 生成HTML: html, 生成 HTML: html, 输出PPTX: native_pptx, 输出 PPTX: native_pptx, 生成PPTX: native_pptx, 生成 PPTX: native_pptx, 用HTML: html, 用 HTML: html, 要HTML: html, 要 HTML: html, HTML输出: html, HTML 输出: html, HTML格式: html, HTML 格式: html, 选择HTML: html, 选择 HTML: html, output HTML: html, generate HTML: html, 用PPTX: native_pptx, 用 PPTX: native_pptx, 要PPTX: native_pptx, 要 PPTX: native_pptx, PPTX输出: native_pptx, PPTX 输出: native_pptx, PPTX格式: native_pptx, PPTX 格式: native_pptx, 选择PPTX: native_pptx, 选择 PPTX: native_pptx, output PPTX: native_pptx, generate PPTX: native_pptx}
      ask_when: >
        Only after a PPTX template is actually uploaded, and the user has not chosen
        HTML or PPTX output. Bind native_pptx for an explicit request such as
        "生成12 页pptx" or "制作可编辑的 PowerPoint 文件", and html for explicitly
        requested web/HTML slides. Extract the user's requested delivery format;
        do not choose one on their behalf. A template filename or mention of
        PPT/PPTX alone is not an output choice. Leave this field unbound when
        the output choice is missing so the Host asks the required question.
      question: 已收到模板，希望输出哪种格式？HTML 会读取并仿照模板样式生成；PPTX 会复用模板版式，可按目标页数增加、删除和修改页面。
      type: single
      choice_policy: fixed
      allow_other: false
      choices: [HTML｜参考模板样式生成, PPTX｜复用模板并按需增删页面]
    - id: visual_style
      label: 风格
      reason: 未指定风格时按主题自动设计，明确要求优先保留。
      applies_when: {field: template_mode, equals: none}
      ask_when: >
        Never for academic/scientific decks or paper group meetings: default to
        科研风格（白底黑字，少量图表强调色）unless the user already supplied a different direction; do not ask.
        Otherwise only when no PPTX template is uploaded, selected or identified in the
        request AND the user has supplied no
        visual direction. Any explicit colors, typography, layout/density,
        references, prohibitions or qualified style description satisfies this
        field, even if it is not a catalog style. Preserve all qualifiers verbatim.
      question: >
        希望采用什么视觉风格？仅在尚未提供视觉要求时询问；根据主题提供
        2-4 个相关建议，也支持自定义描述。已提供的配色、布局和禁用元素不会被建议覆盖。
      type: single
      choice_policy: seed
      choices:
        - 赛博朋克｜霓虹暗底、电影式非对称大图、HUD 信息轨道
        - 科技感｜深色数据界面、蓝青信号线、专业克制
        - 未来主义｜银白蓝紫、流线造型、产品发布感留白
        - 科幻/HUD｜全息视窗、遥测标签、精密信息框架
        - 商务经典｜深蓝灰、稳重结构、可信数据表达
        - 轻商务/现代商务｜年轻简洁、互联网感、清晰模块
        - 杂志感｜大图裁切、栏目排版、编辑设计层次
        - 极简主义｜大留白、少色块、强字体层级
        - 简约大气｜大标题、宽间距、克制但有冲击力
        - 渐变流体｜大面积单层渐变、流动曲线、现代视觉
        - 国潮｜现代色块、云纹窗格、印章式文化元素
        - 胶片/摄影｜主视觉大图、编辑裁切、克制文字
        - 节日/庆典｜动势构图、醒目标题、边缘庆典装饰
        - 自然生态｜有机曲线、大地色、舒展图文关系
        - 医疗/健康｜浅蓝绿、可信留白、专业信息层级
        - 卡通可爱｜圆润造型、活泼色彩、友好叙事
    - id: generate_background_images
      label: AI 底图
      required: true
      resolution: explicit
      reason: AI 底图会影响视觉效果、生成时间和图片资源使用。
      applies_when: {field: template_mode, equals: none}
      value_aliases: {启用｜为每页生成独立 AI 底图: enabled, 不启用｜使用纯色、渐变和矢量装饰: disabled, 不生成AI底图: disabled, 不生成 AI 底图: disabled, 不要生成AI底图: disabled, 不要生成 AI 底图: disabled, 不启用AI底图: disabled, 生成AI底图: enabled, 生成 AI 底图: enabled, 不需要底图: disabled, 启用AI底图: enabled, 关闭AI底图: disabled, '__ask_user_yes__': enabled, '__ask_user_no__': disabled}
      ask_when: >
        Never for academic/scientific decks or paper group meetings: default to
        disabled, unless the user explicitly requested enabling AI backgrounds.
        Otherwise only when no PPTX template has been uploaded or selected AND
        the user has not already specified whether backgrounds should be generated.
        Uploaded templates always disable AI backgrounds.
      question: 是否为每一页启用 AI 生成底图？启用后会根据需求和素材先生成一组相互关联、可编辑的底图提示词，再生成 16:9 无文字背景并应用到幻灯片背景层。
      type: single
      choice_policy: fixed
      allow_other: false
      choices:
        - 启用｜为每页生成独立 AI 底图
        - 不启用｜使用纯色、渐变和矢量装饰

