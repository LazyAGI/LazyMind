ui:
  follow_mode:
    default: following
  tab_visibility_ready_material: ppt_capability_requirements
  slots:
    requirement_analysis:
      widgetType: text-markdown
    material_summary:
      widgetType: text-markdown
    background_prompts:
      widgetType: text-markdown
      maxHeight: 420
    background_images:
      widgetType: image-gallery
    slide_outline:
      widgetType: text-markdown
      maxHeight: 420
    deck_outline:
      widgetType: text-markdown
      maxHeight: 420
    preview_html:
      widgetType: html-slide
      maxHeight: 520
    preview_notes:
      widgetType: text-markdown
      maxHeight: 200

  tabs:
    - id: analysis
      presentation_hide_when_material: compact_presentation
      step_id: analyze_requirements
      label: Analysis
      layout: list
      slots:
        - id: requirement_analysis
        - id: template_content_brief

    - id: materials
      presentation_hide_when_material: compact_presentation
      step_id: collect_materials
      status_step_ids: [collect_materials, analyze_academic_sources, prepare_paper_reflection]
      label: Materials
      hide_when_material: skip_material_collection
      layout: list
      slots:
        - id: material_summary
        - id: reflection_markdown

    - id: background_prompts
      presentation_hide_when_material: compact_presentation
      step_id: plan_background_prompts
      label: Background Prompts
      hide_when_material: skip_background_images
      layout: composite
      page_group: presentation
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: background_prompts
      composite_layout:
        direction: row
        children:
          - slot: background_prompts
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: background_images
      presentation_hide_when_material: compact_presentation
      step_id: generate_backgrounds
      label: Background Images
      hide_when_material: skip_background_images
      layout: composite
      page_group: presentation
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: background_images
      composite_layout:
        direction: row
        children:
          - slot: background_images
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: outline
      presentation_hide_when_material: compact_presentation
      step_id: build_outline
      label: Outline
      layout: list
      slots:
        - id: deck_outline

    - id: page_prompts
      presentation_hide_when_material: compact_presentation
      step_id: plan_page_prompts
      label: Page Prompts
      layout: composite
      page_group: presentation
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: slide_outline
      composite_layout:
        direction: row
        children:
          - slot: slide_outline
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: composite_preview
      step_id: generate_ppt
      label: Slides
      layout: composite
      page_group: presentation
      composite_tab_position: left
      actions:
        - id: export_presentation
          type: export
          provider: html-presentation
          inputs:
            pages: preview_html
            notes: preview_notes
          formats:
            - raster-pptx
            - pdf
            - editable-pptx
          alignment: sort_order
      slots:
        - id: native_pptx
        - id: preview_html
        - id: preview_notes
      composite_layout:
        direction: column
        children:
          - slot: native_pptx
            weight: 1
          - slot: preview_html
            weight: 3
          - slot: preview_notes
            weight: 1
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

