id: ppt-workflow
name: AI PPT Planner
preflight_disabled: true
description: >
  Plan a presentation from a user request, collect useful source material,
  then generate free-form HTML slides via the workflow runtime (SenseNova-derived
  subset under runtime/). Preview shows HTML pages in a flippable composite
  workspace with speaker notes below. PPTX export is UI-only (Export button).

when_to_use: >
  Trigger this workflow when the user explicitly asks to use the PPT workflow, or
  when the user wants to create, plan, draft, or revise a multi-slide
  presentation/deck/PPT. Use it for requests such as "make a PPT", "generate a
  presentation", "帮我做一个路演 PPT", or "做一份汇报幻灯片".
  Uploaded materials are optional: text-only requests must start immediately
  from the user's prompt and must never ask for an upload unless the user
  explicitly asks to base the deck on a source file that is not available.
  Before starting, collect only any missing presentation topic, slide count,
  target customer/audience, visual style, and whether AI-generated per-slide
  background images should be enabled, as declared by runtime policy.
  Do not trigger for simple one-off explanations, ordinary image generation,
  ordinary long-form writing, or requests that only ask to preview an uploaded
  PowerPoint file.

runtime:
  publisher_owned_slots:
    - deck_outline
    - slide_outline
    - background_prompts
    - background_images
    - preview_html
    - preview_notes
  collects_knowledge: true
  completed_edit_step: generate_ppt
  completed_edit_routing: |
    For a request to insert or add a whole slide into an already generated deck,
    first call read_artifact(artifact_ref='ppt_capability_requirements') to inspect
    the saved capability marker. When its content is exactly
    AI_BACKGROUND_IMAGES: enabled, rewind to plan_background_prompts so the new
    background prompt is inserted first. When it is exactly
    AI_BACKGROUND_IMAGES: disabled, rewind to build_outline. These insertion
    routes take precedence over completed_edit_step; all other completed-deck
    edits use the generate_ppt fallback.
  post_step_checks:
    - step_id: analyze_requirements
      tool: check_ppt_workflow_capabilities
      arguments:
        capability_requirements: ppt_capability_requirements
  clarification_fields:
    - id: topic
      label: 主题
      question: 这份 PPT 的主题是什么？
      type: text
    - id: slide_count
      label: 页数
      question: 希望生成多少页？请输入任意正整数；下列常用页数仅供快速选择。
      type: single
      choice_policy: seed
      choices:
        - 3 页
        - 5 页
        - 8 页
        - 10 页
    - id: target_customer
      label: 对应客户
      question: 这份 PPT 面向哪位客户或哪类受众？
      type: text
    - id: visual_style
      label: 风格
      question: >
        希望采用什么视觉风格？请基于当前主题，从下面的可导出风格配方中
        推荐并展示最匹配的 2-4 项；不要改写“｜”前的标准风格名。
      type: single
      choice_policy: subset
      choices:
        - 赛博朋克｜霓虹暗底、电影式非对称大图、HUD 信息轨道
        - 科技感｜深色数据界面、蓝青信号线、专业克制
        - 未来主义｜银白蓝紫、流线造型、产品发布感留白
        - 科幻/HUD｜全息视窗、遥测标签、精密信息框架
        - 商务经典｜深蓝灰、稳重结构、可信数据表达
        - 轻商务/现代商务｜年轻简洁、互联网感、清晰模块
        - 杂志感｜大图裁切、栏目排版、编辑设计层次
        - 极简主义｜大留白、少色块、强字体层级
        - 简约大气｜大标题、宽间距、克制但有冲击力
        - 渐变流体｜大面积单层渐变、流动曲线、现代视觉
        - 国潮｜现代色块、云纹窗格、印章式文化元素
        - 胶片/摄影｜主视觉大图、编辑裁切、克制文字
        - 节日/庆典｜动势构图、醒目标题、边缘庆典装饰
        - 自然生态｜有机曲线、大地色、舒展图文关系
        - 医疗/健康｜浅蓝绿、可信留白、专业信息层级
        - 卡通可爱｜圆润造型、活泼色彩、友好叙事
    - id: generate_background_images
      label: AI 底图
      question: 是否为每一页启用 AI 生成底图？启用后会根据需求和素材先生成一组相互关联、可编辑的底图提示词，再生成 16:9 无文字背景并应用到幻灯片背景层。
      type: single
      choice_policy: fixed
      allow_other: false
      choices:
        - 启用｜为每页生成独立 AI 底图
        - 不启用｜使用纯色、渐变和矢量装饰

tool_scripts:
  - path: scripts/tools.py
    functions:
      - ppt_search_web_images
      - ppt_register_material_images
      - ppt_generate_material_images
      - ppt_publish_background_prompts
      - ppt_generate_background_images
      - check_ppt_workflow_capabilities
      - ppt_attach_material_images
      - ppt_replace_page_material_image
      - ppt_replace_page_background
      - ppt_build_outline
      - ppt_insert_outline_page
      - ppt_publish_deck_outline
      - ppt_generate_pages
      - ppt_init_deck
      - ppt_find_deck
      - ppt_run_stage
      - ppt_list_pages
      - ppt_publish_outline
      - ppt_publish_pages
      - ppt_read_page_html
      - ppt_read_page_outline
      - ppt_patch_page_outline
      - ppt_edit_page_html
      - ppt_delete_page
      - ppt_preview_selection_edit
      - ppt_apply_selection_edit

artifact_actions:
  rewrite_selection:
    revision_policy: head
    slots:
      - preview_html
    preview_tool: ppt_preview_selection_edit
    execute_tool: ppt_apply_selection_edit

steps:
  - id: analyze_requirements
    label: Analyze Requirements
  - id: collect_materials
    label: Collect Materials
  - id: plan_background_prompts
    label: Plan Background Prompts
  - id: generate_backgrounds
    label: Generate Backgrounds
  - id: build_outline
    label: Build Outline
  - id: plan_page_prompts
    label: Plan Page Prompts
  - id: generate_ppt
    label: Generate PPT

slots:
  - id: requirement_analysis
    label: Requirement Analysis
    type: text
    cardinality: single
    summary_max_chars: 600

  - id: ppt_capability_requirements
    label: PPT Capability Requirements
    type: text
    cardinality: single
    exposed: false
    summary_max_chars: 80

  - id: skip_background_images
    label: Skip AI Backgrounds
    type: text
    cardinality: single
    exposed: false
    summary_max_chars: 40

  - id: skip_material_collection
    label: Skip Material Collection
    type: text
    cardinality: single
    exposed: false
    summary_max_chars: 40

  - id: uploaded_materials
    label: Uploaded Materials
    type: file
    cardinality: list
    ordered: true
    external: true
    required: false
    allow_manual_add: true

  - id: material_summary
    label: Material Summary
    type: text
    cardinality: single
    summary_max_chars: 700

  - id: material_images
    label: Material Images
    type: image
    cardinality: list
    ordered: true

  - id: background_images
    label: AI Background Images
    type: image
    cardinality: list
    ordered: true

  - id: background_prompts
    label: AI Background Prompts
    type: text
    cardinality: list
    ordered: true
    summary_max_chars: 1200

  - id: slide_outline
    label: Page Prompt
    type: text
    cardinality: list
    ordered: true
    summary_max_chars: 900

  - id: deck_outline
    label: Deck Outline
    type: text
    cardinality: single
    summary_max_chars: 1600

  - id: preview_html
    label: Slide
    type: text
    cardinality: list
    ordered: true
    summary_max_chars: 500

  - id: preview_notes
    label: Speaker Notes
    type: text
    cardinality: list
    ordered: true
    summary_max_chars: 1200

ui:
  slots:
    requirement_analysis:
      widgetType: text-markdown
    material_summary:
      widgetType: text-markdown
    background_prompts:
      widgetType: text-markdown
      maxHeight: 420
    background_images:
      widgetType: image-gallery
    slide_outline:
      widgetType: text-markdown
      maxHeight: 420
    deck_outline:
      widgetType: text-markdown
      maxHeight: 420
    preview_html:
      widgetType: html-slide
      maxHeight: 520
    preview_notes:
      widgetType: text-markdown
      maxHeight: 200

  tabs:
    - id: analysis
      step_id: analyze_requirements
      label: Analysis
      layout: list
      slots:
        - id: requirement_analysis

    - id: materials
      step_id: collect_materials
      label: Materials
      layout: list
      slots:
        - id: uploaded_materials
        - id: material_summary
        - id: material_images

    - id: background_prompts
      step_id: plan_background_prompts
      label: Background Prompts
      layout: composite
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: background_prompts
      composite_layout:
        direction: row
        children:
          - slot: background_prompts
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: background_images
      step_id: generate_backgrounds
      label: Background Images
      layout: composite
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: background_images
      composite_layout:
        direction: row
        children:
          - slot: background_images
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: outline
      step_id: build_outline
      label: Outline
      layout: list
      slots:
        - id: deck_outline

    - id: page_prompts
      step_id: plan_page_prompts
      label: Page Prompts
      layout: composite
      slot_scope: step
      composite_tab_position: left
      slots:
        - id: slide_outline
      composite_layout:
        direction: row
        children:
          - slot: slide_outline
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: composite_preview
      step_id: generate_ppt
      label: Slides
      layout: composite
      composite_tab_position: left
      actions:
        - id: export_presentation
          type: export
          provider: html-presentation
          inputs:
            pages: preview_html
            notes: preview_notes
          formats:
            - raster-pptx
            - pdf
            - editable-pptx
          alignment: sort_order
      slots:
        - id: preview_html
        - id: preview_notes
      composite_layout:
        direction: column
        children:
          - slot: preview_html
            weight: 3
          - slot: preview_notes
            weight: 1

