ui:
  slots:
    generation_parameters: {widgetType: json-block, readOnly: true, collapsed: false}
    research_question_brief: {widgetType: text-markdown, readOnly: true}
    methodology_blueprint: {widgetType: text-markdown, readOnly: true}
    literature_evidence: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    search_log: {widgetType: text-markdown, readOnly: true}
    annotated_bibliography: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    research_synthesis: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
    outline_document: {widgetType: file-card, readOnly: false}
    outline_check_report: {widgetType: text-markdown, readOnly: true}
    effective_outline_check_report: {widgetType: text-markdown, readOnly: true}
    chapter_drafts: {widgetType: file-card, readOnly: true}
    draft_document: {widgetType: file-card, readOnly: false}
    pre_integrity_report: {widgetType: text-markdown, readOnly: true}
    pre_integrity_summary: {widgetType: json-block, readOnly: true, collapsed: false}
    reviewer_configuration: {widgetType: text-markdown, readOnly: true}
    review_reports: {widgetType: text-markdown, readOnly: true}
    editorial_decision: {widgetType: text-markdown, readOnly: true}
    revision_roadmap: {widgetType: text-markdown, readOnly: true}
    revised_document: {widgetType: file-card, readOnly: false}
    revision_response: {widgetType: text-markdown, readOnly: true}
    re_review_report: {widgetType: text-markdown, readOnly: true}
    re_review_decision: {widgetType: text-markdown, readOnly: true}
    second_revised_document: {widgetType: file-card, readOnly: false}
    second_revision_response: {widgetType: text-markdown, readOnly: true}
    final_integrity_report: {widgetType: text-markdown, readOnly: true}
    final_integrity_summary: {widgetType: json-block, readOnly: true, collapsed: false}
    final_paper_markdown: {widgetType: file-card, readOnly: true}
    final_paper: {widgetType: file-card, readOnly: true}
    delivery_metadata: {widgetType: json-block, readOnly: true, collapsed: false}
    process_record: {widgetType: text-markdown, readOnly: true, maxHeight: 680}
  tabs:
    - id: research
      step_id: formulate_research
      label: 研究设计
      layout: composite
      slots: [{id: generation_parameters}, {id: research_question_brief}, {id: methodology_blueprint}]
      composite_layout:
        direction: row
        children:
          - {slot: research_question_brief, weight: 2}
          - direction: column
            weight: 1
            children: [{slot: generation_parameters}, {slot: methodology_blueprint}]
    - id: retrieval
      step_id: retrieve_literature
      label: 资料检索
      layout: composite
      slots: [{id: literature_evidence}, {id: search_log}]
      composite_layout:
        direction: row
        children: [{slot: literature_evidence, weight: 2}, {slot: search_log, weight: 1}]
    - id: synthesis
      step_id: synthesize_evidence
      label: 证据综合
      layout: composite
      slots: [{id: annotated_bibliography}, {id: research_synthesis}]
      composite_layout:
        direction: row
        children: [{slot: annotated_bibliography, weight: 1}, {slot: research_synthesis, weight: 2}]
    - id: outline
      step_id: build_paper_outline
      label: 大纲生成
      layout: composite
      slots: [{id: outline_document}, {id: outline_check_report}]
      composite_layout:
        direction: row
        children: [{slot: outline_document, weight: 2}, {slot: outline_check_report, weight: 1}]
    - id: draft
      step_id: write_paper_draft
      label: 全文生成
      layout: list
      generation_process: {result_slot: draft_document, slots: [chapter_drafts, effective_outline_check_report]}
      composite_behavior: {hide_empty_columns: true, empty_column_scope: tab}
      slots: [{id: draft_document}, {id: chapter_drafts}, {id: effective_outline_check_report}]
    - id: pre_integrity
      step_id: pre_review_integrity
      label: 审稿前完整性
      layout: composite
      slots: [{id: pre_integrity_report}, {id: pre_integrity_summary}]
      composite_layout:
        direction: row
        children: [{slot: pre_integrity_report, weight: 2}, {slot: pre_integrity_summary, weight: 1}]
    - id: review
      step_id: peer_review
      label: 同行评审
      layout: list
      slots: [{id: reviewer_configuration}, {id: review_reports}, {id: editorial_decision}, {id: revision_roadmap}]
    - id: revision
      step_id: revise_paper
      label: 一轮修订
      layout: composite
      slots: [{id: revised_document}, {id: revision_response}]
      composite_layout:
        direction: row
        children: [{slot: revised_document, weight: 2}, {slot: revision_response, weight: 1}]
    - id: rereview
      step_id: re_review
      label: 修订复审
      layout: composite
      slots: [{id: re_review_report}, {id: re_review_decision}]
      composite_layout:
        direction: row
        children: [{slot: re_review_report, weight: 2}, {slot: re_review_decision, weight: 1}]
    - id: second_revision
      step_id: second_revision
      label: 二轮修订
      layout: composite
      slots: [{id: second_revised_document}, {id: second_revision_response}]
      composite_layout:
        direction: row
        children: [{slot: second_revised_document, weight: 2}, {slot: second_revision_response, weight: 1}]
    - id: final_integrity
      step_id: final_integrity
      label: 最终完整性
      layout: composite
      slots: [{id: final_integrity_report}, {id: final_integrity_summary}]
      composite_layout:
        direction: row
        children: [{slot: final_integrity_report, weight: 2}, {slot: final_integrity_summary, weight: 1}]
    - id: delivery
      step_id: finalize_paper
      label: 论文交付
      layout: list
      slots: [{id: final_paper}, {id: final_paper_markdown}, {id: delivery_metadata}]
    - id: process
      step_id: process_summary
      label: 过程记录
      layout: list
      slots: [{id: process_record}]

i18n:
  zh-CN:
    name: 学术研究与论文写作
