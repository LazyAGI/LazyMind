id: academic_research_pipeline
name: 学术研究与论文写作
description: >
  基于 academic-research-skills 的 academic-pipeline v3.21.0 适配为 LazyMind
  内置工作流。从研究问题与方法设计开始，经过学术/知识库检索、证据综合、可编辑大纲、
  可编辑全文、完整性检查、五视角同行评审、修订与复审、最终校验和 Markdown/Word 交付。
  大纲、正文和修订复用 LazyMind Writer；检索优先使用 LazyMind academic_search
  （Sciverse/可用学术源）及当前会话已选知识库，均不可用时允许以明确的无检索边界继续。

when_to_use: >
  当用户希望从研究主题出发完成“研究到论文”的全流程，或明确要求学术研究、文献检索、
  论文大纲、完整论文、同行评审和修订交付组成的一体化流程时使用。启动前必须确认并绑定：
  研究主题、论文类型（研究型/实证/文献综述/理论/案例/会议论文）、目标篇幅、正文语言（中文/英文）、
  引用格式（APA 7/Chicago/MLA 9/IEEE/Vancouver/GB/T 7714）和导出格式（md/docx）。用户已经明确的值
  直接使用；导出格式未指定时采用 DOCX。其他必需参数缺少时每次最多询问三个，
  已回答的字段不再重复询问，不能先启动后猜必需参数。仅需单次检索、单独润色、
  单独审稿或格式转换时不应触发完整流程。

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      formulate_research:
        prompt: Read scenario/external.md and its formulate_research step contract from this pinned package. Complete 研究问题与方法设计
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - generation_parameters
        - research_question_brief
        - methodology_blueprint
        acceptance_criteria:
        - 'Parameters are canonical and contain no inferred defaults. The primary question is

          answerable and bounded; methodology is compatible with the question and labels every

          unavailable empirical input or institutional determination as planned/unknown.'
      retrieve_literature:
        prompt: Read scenario/external.md and its retrieve_literature step contract from this pinned package. Complete
          学术与知识库检索 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - literature_evidence
        - search_log
        acceptance_criteria:
        - 'Every registered evidence ID maps to a real returned record with preserved provenance.

          Failed/unavailable channels and coverage limits are explicit. No citation, DOI, author,

          title, venue, date or URL is invented.'
      synthesize_evidence:
        prompt: Read scenario/external.md and its synthesize_evidence step contract from this pinned package. Complete
          文献核验与证据综合 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - annotated_bibliography
        - research_synthesis
        - writing_task
        - resource_profiles
        - writing_context
        acceptance_criteria:
        - 'The bibliography accounts for every retained evidence ID without invented metadata.

          Synthesis exposes supporting and contradictory evidence plus gaps. Writer files are real

          files and context preserves the complete registered corpus as a locked fact.'
      build_paper_outline:
        prompt: Read scenario/external.md and its build_paper_outline step contract from this pinned package. Complete
          论文大纲生成 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - outline_document
        - outline_check_report
        - writing_context_after_outline
        acceptance_criteria:
        - 'The editable outline is a real Markdown file. Structural report says PASS, leaf targets

          sum to the confirmed target, source refs are registered, and the standard academic

          sections/declarations are present or explicitly flagged before user approval.'
      write_paper_draft:
        prompt: Read scenario/external.md and its write_paper_draft step contract from this pinned package. Complete 论文全文生成
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - effective_outline_check_report
        - draft_document
        - writing_context_after_draft
        acceptance_criteria:
        - 'The latest editable draft is a real Markdown file and follows the approved heading order.

          Target-length and evidence-ID deviations remain visible in the following external-agent audit

          without making completed prose disappear. Per-section source_refs are

          planning guidance rather than a hard authorization boundary. Conventional sections omitted by

          the user-approved outline are visible warnings rather than silently restored chapters or

          deterministic failures. First generation has ordered section files; targeted revision does

          not fabricate replacement evidence.'
      pre_review_integrity:
        prompt: Read scenario/external.md and its pre_review_integrity step contract from this pinned package. Complete
          审稿前完整性检查 using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - pre_integrity_report
        - pre_integrity_summary
        acceptance_criteria:
        - 'Report and summary expose deterministic failures, sampling denominators, UNKNOWN and

          NOT_CHECKED states, seven failure modes and every blocking concern. No unsupported

          claim of complete plagiarism, statistical or source-content verification is made.'
      peer_review:
        prompt: Read scenario/external.md and its peer_review step contract from this pinned package. Complete 五视角同行评审
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - reviewer_configuration
        - review_reports
        - editorial_decision
        - revision_roadmap
        acceptance_criteria:
        - 'Five ordered, perspective-specific reports exist; every criticism is anchored and

          actionable. Decision is one closed value, synthesizes rather than fabricates findings,

          and roadmap accounts for all Critical/Major/Minor items.'
      revise_paper:
        prompt: Read scenario/external.md and its revise_paper step contract from this pinned package. Complete 论文一轮修订
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - revised_document
        - revision_response
        - writing_context_after_revision
        acceptance_criteria:
        - 'revised_document is editable and every roadmap item has an explicit disposition.

          Untouched scope is preserved, disagreements are evidence-based, and no new unregistered

          source or fabricated result appears.'
      re_review:
        prompt: Read scenario/external.md and its re_review step contract from this pinned package. Complete 修订验证复审 using
          the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - re_review_report
        - re_review_decision
        acceptance_criteria:
        - 'Every first-round item is verified against manuscript evidence. Decision is one closed

          value; no Reject is emitted, and MAJOR is used only for material unresolved issues.'
      second_revision:
        prompt: Read scenario/external.md and its second_revision step contract from this pinned package. Complete 论文二轮修订
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - second_revised_document
        - second_revision_response
        acceptance_criteria:
        - 'Second revision is a real editable Markdown file, stays within residual issue scope and

          records every addressed or acknowledged item. No third revision loop is possible.'
      final_integrity:
        prompt: Read scenario/external.md and its final_integrity step contract from this pinned package. Complete 最终完整性检查
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - final_integrity_report
        - final_integrity_summary
        acceptance_criteria:
        - 'Final report is a fresh check of the latest bytes, exposes every unresolved state and

          never inherits a previous PASS without re-evaluation.'
      finalize_paper:
        prompt: Read scenario/external.md and its finalize_paper step contract from this pinned package. Complete 论文格式化与交付
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - final_paper_markdown
        - final_paper
        - delivery_metadata
        acceptance_criteria:
        - 'Markdown snapshot is complete. final_paper is a non-empty `.md` or valid `.docx`

          matching the confirmed output format, and metadata names the actual renderer and source

          Skill adaptation.'
      process_summary:
        prompt: Read scenario/external.md and its process_summary step contract from this pinned package. Complete 研究与写作过程记录
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - process_record
        acceptance_criteria:
        - 'Process record is auditable, distinguishes deterministic/generative/human actions,

          preserves failures and limitations, and names the exact source Skill adaptation.'
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  clarification_fields:
    - id: research_topic
      label: 研究主题
      question: 论文的研究主题或核心问题是什么？
      reason: 研究主题决定检索范围和论证方向。
      required: true
      type: text
      validation: {min_length: 1, max_length: 1000, example: '例如：大语言模型在医学问答中的可靠性'}
    - id: paper_type
      label: 论文类型
      required: true
      resolution: explicit
      reason: 不同论文类型需要不同的研究方法与正文结构。
      choice_policy: fixed
      allow_other: false
      value_aliases: {research: research, empirical: empirical, literature_review: literature_review, theoretical: theoretical, case_study: case_study, conference: conference, 研究型论文: research, 实证研究: empirical, 文献综述: literature_review, 理论研究: theoretical, 案例研究: case_study, 会议论文: conference}
      question: 请选择论文类型。
      type: single
      choices: [研究型论文, 实证研究, 文献综述, 理论研究, 案例研究, 会议论文]
    - id: word_target
      label: 目标篇幅
      question: 论文正文的目标篇幅是多少？
      reason: 篇幅决定章节预算和写作工作量；中文按字数，英文按单词数。
      required: true
      type: text
      resolution: explicit
      patterns: ['(?:摘要|abstract)[^0-9零一二三四五六七八九十百千万两，。；;\n]*[0-9.,，零一二三四五六七八九十百千万两]+\s*(?:字|词|words)|([0-9.,，零一二三四五六七八九十百千万两]+)\s*(?:字|词|words)']
      validation: {format: positive_integer, min: 1, max_length: 12, example: '例如：8000'}
    - id: paper_language
      label: 正文语言
      required: true
      resolution: explicit
      reason: 正文语言影响检索侧重、写作和篇幅计数单位。
      choice_policy: fixed
      allow_other: false
      value_aliases: {中文: zh-CN, 英文: en, zh-CN: zh-CN, en: en, Chinese: zh-CN, English: en}
      question: 请选择论文正文语言。
      type: single
      choices: [中文, 英文]
    - id: citation_style
      label: 引用格式
      required: true
      resolution: explicit
      reason: 引用格式需要符合学校或期刊要求，不能替你猜定规范。
      choice_policy: fixed
      allow_other: false
      question: 请选择引用格式。
      type: single
      choices: [APA 7, Chicago, MLA 9, IEEE, Vancouver, GB/T 7714]
    - id: output_format
      label: 导出格式
      default: docx
      choice_policy: fixed
      allow_other: false
      value_aliases: {Word: docx, DOCX: docx, Markdown: md}
      question: 请选择最终导出格式。
      type: single
      choices: [docx, md]

tool_scripts:
  - path: scripts/pipeline_tools.py
    functions:
      - normalize_academic_parameters
      - validate_and_allocate_academic_outline
      - validate_and_allocate_academic_outline_from_inputs
      - normalize_academic_review_decision
      - audit_academic_manuscript
      - audit_academic_manuscript_from_inputs
  - path: scripts/writer_bridge.py
    functions:
      - academic_writer_prepare_context
      - academic_writer_generate_outline
      - academic_writer_save_validated_outline
      - academic_writer_save_effective_outline
      - academic_writer_normalize_outline
      - academic_writer_update_context
      - academic_writer_plan_sections
      - academic_writer_write_sections
      - academic_writer_assemble_draft
      - academic_writer_revise_markdown
      - academic_writer_revise_from_feedback
  - path: scripts/document_builder.py
    functions:
      - compose_academic_paper_from_inputs

artifact_actions:
  rewrite_selection:
    slots: [outline_document, draft_document, revised_document, second_revised_document]
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1

