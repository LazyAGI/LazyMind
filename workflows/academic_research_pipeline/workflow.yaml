  - {id: literature_evidence, user_visible: true, label: 已注册检索证据, type: text, cardinality: single, exposed: true}
  - {id: search_log, user_visible: false, label: 检索策略与执行记录, type: text, cardinality: single, exposed: true}
  - {id: annotated_bibliography, user_visible: true, label: 注释书目与来源核验, type: text, cardinality: single, exposed: true}
  - {id: research_synthesis, user_visible: true, label: 主题综合、矛盾与研究空白, type: text, cardinality: single, exposed: true}

