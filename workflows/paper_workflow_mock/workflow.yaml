id: paper_workflow_mock
name: 论文下游接口联调（Mock）
description: 综述、独立阅读心得、科研 PPT 的接口联调，不生成正式成果。
when_to_use: 仅用于从论文业务发起的 Mock 交接。
steps:
- id: acknowledge
  label: 核对交接并反馈
slots:
- id: task_context
  label: 任务上下文
  type: text
  cardinality: single
  external: true
  exposed: false
- id: mock_feedback
  label: 模拟反馈
  type: text
  cardinality: single
runtime:
  publisher_owned_slots: [mock_feedback]
  trigger_inputs:
  - task_context

tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_mock_submit
  - academic_mock_context
