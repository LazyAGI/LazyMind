    label: Document Cloud Sync Result
    type: file
    cardinality: single
ui:
  follow_mode:
    default: following
  slots:
    outline_document:
      widgetType: writer-document
    draft_document:
      widgetType: writer-document
    flat_draft_document:
      widgetType: writer-document
  tabs:
    - id: prepare
      step_id: prepare
      label: Preparation
      layout: list
      slots:
        - id: writing_task
        - id: source_document

    - id: outline
      step_id: outline
      label: Outline
      layout: list
      slots:
        - id: outline_document
      completed_continue_step: write_document

    - id: result
      status_step_ids:
        - write_document
        - write_flat_document
      label: Final Document
      layout: list
      slots:
        - id: draft_document
        - id: flat_draft_document
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected
        mutually_exclusive:
          - slots:
              - draft_document
              - flat_draft_document
            prefer:
              - draft_document
              - flat_draft_document

