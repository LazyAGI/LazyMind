id: writer-workflow
name: AI Writer
description: >
  Read source documents and knowledge, create a flat article or reuse an
  outline for a structured document, revise either the outline or full text, and produce
  Markdown or WriterDocument IR according to the selected writing path. Exporting
  an IR draft as Markdown is a separate user-initiated download flow.

when_to_use: >
  Always use this workflow when the user's primary request is to create a complete
  article, report, or other long-form document, including writing from supplied
  materials or knowledge-base evidence. Such a direct writing request matches
  this workflow even when the user does not know or name AI Writer; do not
  generate the requested full document directly in chat. Also use it for
  continuing from a supplied outline, revising an existing Feishu or Notion document,
  locating a WeChat draft article by its complete title, or
  delivering a generated document. When a writer session already owns the current
  draft, requests to insert, replace, move, or delete an image are document revisions:
  rerun write_document and keep image acquisition inside that step. Never route such
  a request to a standalone image task or generic subagent. Do not require the
  user to choose between creation and revision workflows; select the applicable
  reachable step from the user's request and the available artifacts. When the
  current turn supplies a Markdown, plain-text, or LMD file to write, continue,
  or revise, trigger this workflow before reading or editing that file with generic
  attachment tools. Preserve its exact basename in request_context and let the
  prepare step load it; do not substitute the file contents for its identity.
  When triggering after clarification or a cloud-file read, request_context must
  likewise preserve every user-supplied source and destination URL verbatim,
  including URLs supplied through ask_user; a content summary never replaces
  its locator.

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      prepare:
        prompt: Read scenario/external.md and its prepare step contract from this pinned package. Read sources and prepare
          the immutable writing command and evidence context without drafting. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - writer_command
        - writing_task
        - media_assets
        - writing_context
        acceptance_criteria:
        - 'writer_command, writing_task, media_assets, and writing_context are present.

          media_assets is valid even when its assets mapping is empty.

          When a URL source was required, source_document and target_document are also present.'
      outline:
        prompt: Read scenario/external.md and its outline step contract from this pinned package. Create or revise the
          editable outline according to the bound command. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - outline_document
        acceptance_criteria:
        - 'outline_document is present. Markdown outlines

          are `.md`; IR outlines have stage="outline" and ui_editable=true. Revision internals are required only when

          this execution handled an AI revision. For a cloud-bound revision,

          outline_write_result must report success.'
      write_flat_document:
        prompt: Read scenario/external.md and its write_flat_document step contract from this pinned package. Write the
          requested complete flat document without an outline stage. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - flat_draft_document
        acceptance_criteria:
        - 'flat_draft_document is present and is Markdown or a non-outline WriterDocument IR

          with ui_editable=true. Required media is saved before the body.

          No outline_document, section_instructions, or draft_blocks are produced.

          short_writing_plan and flat_visual_plan are auxiliary publications: a save failure

          leaves a pending checkpoint entry and does not invalidate delivery or rerun generation.'
      write_document:
        prompt: Read scenario/external.md and its write_document step contract from this pinned package. Draft or revise
          the complete document within the bound operation and approved scope. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - draft_document
        acceptance_criteria:
        - 'draft_document is present. Markdown output is a

          `.md` file or an IR document with ui_editable=true. Required media is saved before the body. A targeted revision
          requires a successful

          document_revision_result. A targeted image-adding revision also requires resolved_media_assets.

          section_instructions, draft_blocks, visual_plan, document_revision_task,

          document_locate_result, document_modify_plan, and document_revision_set are auxiliary

          publications. Their save failures leave pending checkpoint entries without invalidating

          delivery; recovery retries saving without rerunning generation or provider writes.

          When generation started without draft_document and used a cloud-bound `.lmd` source,

          document_write_result must report success and draft_document must be the

          provider-confirmed document. Every cloud-bound IR full-document rewrite also requires

          one successful document_write_result and a provider-confirmed draft_document,

          regardless of whether a previous draft existed. Markdown rewrite remains local and

          does not require document_write_result. Later targeted revisions must not mutate the

          cloud document automatically.'
  clarification_fields:
    - id: writing_goal
      label: 写作目标
      question: 想写什么内容，或修改哪份文档？
      reason: 需要明确写作目标或修改对象才能开始。
      ask_when: >
        The writing topic or target document cannot be determined from the current
        request, attachments, or prior conversation. Missing length, structure,
        illustration preferences, or output format alone do not require a question.
      type: text
      validation: {min_length: 1, max_length: 4000, example: '例如：为新员工写一份企业知识库使用指南'}
    - id: writing_action
      label: 写作动作
      question: 希望对文档做什么处理？
      type: text
      reason: 根据明确指令和已有文档自动识别创建、续写或修改。
    - id: document_structure
      label: 文档结构
      question: 希望采用什么文档结构？
      type: text
      reason: 未指定时复用现有结构分类和大纲规划。
    - id: word_target
      label: 目标篇幅
      question: 希望正文达到多少字？
      type: text
      reason: 未指定时自动规划篇幅，不添加固定字数限制。
      patterns: ['(?:摘要|abstract)[^0-9，。；;\n]*[0-9]+\s*(?:字|词|words)|([0-9]+)\s*字']
      validation: {format: positive_integer, min: 1, example: '例如：3000'}
    - id: visual_policy
      label: 配图策略
      question: 希望如何配图？
      type: text
      reason: 按明确要求和内容价值规划，优先复用已有素材。
    - id: output_format
      label: 产物格式
      question: 希望使用什么产物格式？
      type: text
      reason: 新建使用现有 Markdown 表示，修改时继承源文档表示。
  exclusive_tool_capabilities:
    - writer.create
    - writer.revise
  completed_continue_steps:
    - write_flat_document
    - write_document

tool_scripts:
  - path: scripts/tools.py
    functions:
      - writer_classify_structure
      - writer_build_writing_task
      - writer_load_local_document
      - writer_collect_available_media
      - writer_load_document
      - writer_profile_resources
      - writer_create_writing_context
      - writer_prepare_workspace
      - writer_prepare_outline
      - writer_generate_outline
      - writer_outline_workspace
      - writer_generate_rewrite_outline
      - writer_generate_rewrite_section_instructions
      - writer_generate_section_instructions
      - writer_execute_writing_subtasks
      - writer_generate_short_writing_plan
      - writer_generate_short_document
      - writer_resolve_visual_media
      - writer_resolve_revision_media
      - writer_generate_draft_document
      - writer_flat_draft_workspace
      - writer_draft_workspace
      - writer_update_writing_context
      - writer_export_markdown
      - writer_convert_markdown_to_ir
      - writer_create_document
      - writer_publish_revision
      - writer_convert_document
      - writer_write_document
      - writer_build_revision_task
      - writer_locate_revision_target
      - writer_generate_modify_plan
      - writer_generate_revision_set
      - writer_apply_revision

artifact_actions:
  rewrite_selection:
    slots: [outline_document, flat_draft_document, draft_document]
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1
  sync_document:
    slots: [draft_document]
    execute_tool: builtin:document.sync_document.v1
  convert_document:
    slots: [source_document, outline_document, flat_draft_document, draft_document]
    preview_tool: builtin:document.convert_document.v1
    execute_tool: builtin:document.convert_document.v1
  write_document:
    slots: [flat_draft_document, draft_document]
    execute_tool: builtin:document.write_document.v1
  render_document:
    slots: [source_document, outline_document, flat_draft_document, draft_document]
    preview_tool: builtin:document.render_document.v1
    execute_tool: builtin:document.render_document.v1
  save_document:
    slots: [outline_document, flat_draft_document, draft_document]
    execute_tool: builtin:document.save_document.v1

steps:
