id: writer-workflow
name: AI Writer
description: >
  Read source documents and knowledge, create or reuse an outline, draft a
  structured document, revise either the outline or full text, and produce
  Markdown or WriterDocument IR according to the selected writing path. Exporting
  an IR draft as Markdown is a separate user-initiated download flow.

when_to_use: >
  Always use this workflow when the user's primary request is to create a complete
  article, report, or other long-form document, including writing from supplied
  materials or knowledge-base evidence. Such a direct writing request matches
  this workflow even when the user does not know or name AI Writer; do not
  generate the requested full document directly in chat. Also use it for
  continuing from a supplied outline, revising an existing Feishu document, or
  delivering a generated document. When a writer session already owns the current
  draft, requests to insert, replace, move, or delete an image are document revisions:
  rerun write_document and keep image acquisition inside that step. Never route such
  a request to a standalone image task or generic subagent. Do not require the
  user to choose between creation and revision workflows; select the applicable
  reachable step from the user's request and the available artifacts. When the
  current turn supplies a Markdown, plain-text, or LMD file to write, continue,
  or revise, trigger this workflow before reading or editing that file with generic
  attachment tools. Preserve its exact basename in request_context and let the
  prepare step load it; do not substitute the file contents for its identity.
  When triggering after clarification or a cloud-file read, request_context must
  likewise preserve every user-supplied source and destination URL verbatim,
  including URLs supplied through ask_user; a content summary never replaces
  its locator.

tool_scripts:
  - path: scripts/tools.py
    functions:
      - writer_build_writing_task
      - writer_load_local_document
      - writer_collect_available_media
      - writer_load_document
      - writer_profile_resources
      - writer_create_writing_context
      - writer_prepare_outline
      - writer_generate_outline
      - writer_generate_rewrite_outline
      - writer_generate_rewrite_section_instructions
      - writer_generate_section_instructions
      - writer_resolve_visual_media
      - writer_resolve_revision_media
      - writer_generate_draft_blocks
      - writer_generate_draft_blocks_markdown
      - writer_generate_draft_document
      - writer_generate_draft_document_markdown
      - writer_update_writing_context
      - writer_export_markdown
      - writer_convert_markdown_to_ir
      - writer_create_document
      - writer_publish_revision
      - writer_replace_document
      - writer_preview_selection_rewrite
      - writer_sync_document
      - writer_append_document
      - writer_build_revision_task
      - writer_locate_revision_target
      - writer_generate_modify_plan
      - writer_generate_revision_set
      - writer_apply_revision
      - writer_publish_revision
      - writer_replace_document

artifact_actions:
  rewrite_selection:
    slots: [draft_document]
    preview_tool: writer_preview_selection_rewrite
  sync_document:
    slots: [draft_document]
    execute_tool: writer_sync_document

