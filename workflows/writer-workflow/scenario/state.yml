initial: __start__
start_route: choice

transitions:
  __start__:
    - to: prepare

  prepare:
    - to: outline
      when: >
        Generate, reuse, display, or revise an outline. This route is mandatory
        for a targeted revision when the prepared source_document is an outline.
    - to: write_document
      when: >
        Revise an existing full document directly. Use this route for a targeted
        revision only when the prepared source_document is a complete document.
    - to: __end__
      when: The requested read-only preparation is complete.

  outline:
    - to: write_document
      when: Draft the full document from the latest outline revision.
    - to: __end__
      when: The requested outline work is complete.

  write_document:
    - to: __end__

steps:
  prepare:
    label: 写作准备
    mode: auto
    route: choice
    prompt: |
      {{runtime_instruction}}

      Artifact persistence rule: writer tools return absolute local file paths.
      Save every declared output in this step with content_type="file" and the exact
      returned path as value. Never save a path with content_type="json" or "text";
      doing so stores the path string instead of the file.

      Prepare the user's complete writing workspace without generating an outline or
      document body.

      Before creating any artifact, verify resource identity. If the request refers to
      "this", "my", "the supplied", or "the original" Feishu/Lark outline or document,
      but {{user_input}} contains no exact Feishu/Lark URL, stop this step and report
      that the source locator was lost or missing. Do not continue as a from-scratch
      request and do not reconstruct the document from a summary.

      1. Resolve the working document and representation before building the task:
         - A Feishu/Lark source or supplied `.lmd` file uses `ir`.
         - A supplied Markdown/plain-text source and a from-scratch request use
           `markdown`, even when the final request explicitly asks for Feishu delivery.
         - If the user is modifying or continuing one supplied `.md`, `.markdown`,
           `.txt`, or `.lmd` file, call writer_load_local_document and save its path as
           source_document. Do not treat ordinary reference attachments as the working
           document.
      2. If the request contains a Feishu/Lark document that must be read, call
         writer_load_document(user_input="{{user_input}}", stage=<draft for a direct
         in-place revision of an existing document; outline only when the user explicitly
         wants to create, use, or revise the document as an authoring outline>). Merely
         mentioning an outline title, outline section, or text located before/after an
         outline does not make the whole document an outline. Save source_document and
         target_document. Do not call writer_load_document for unrelated ordinary URLs.
      3. Call writer_build_writing_task(query="{{user_input}}",
         representation=<resolved `ir` or `markdown`>) and save its path as writing_task.
      4. Call writer_collect_available_media with writing_task_path. It returns
         media_assets and profile_input_resources file paths. Save media_assets and
         retain profile_input_resources for step 6. This call is required even when
         the user uploaded no images.
      5. If the request selects or references a knowledge base, use the kb framework
         tools to retrieve the relevant evidence first. Preserve the returned evidence
         text for the next call.
      6. Call writer_profile_resources with writing_task_path, the complete original
         user_input, source_document_path when present, and knowledge_text when KB evidence was
         retrieved. Also pass the profile_input_resources path returned by step 4. Save
         resource_profiles.
      7. Call writer_create_writing_context with writing_task_path,
         resource_profiles_path, and source_document_path when present. Save its returned path
         as writing_context.

      source_document and target_document are optional because a from-scratch request has no
      cloud source. Do not invent either artifact. If a required tool fails, stop without
      synthesizing a fallback artifact.

      In the final summary, when source_document exists, explicitly report its representation
      and, for IR, its stage and the
      required next step. Use "next step: outline revision" for stage="outline", and
      "next step: full-document revision" for stage="draft" or stage="final". This
      routing information must be stated even when the user did not ask to see it.
      When source_document does not exist, explicitly state: "No source file was provided.
      Continue directly to outline without requesting confirmation." Do not emit this
      instruction when source_document exists.
    tools:
      - kb
      - cloud_files
      - writer_build_writing_task
      - writer_load_local_document
      - writer_collect_available_media
      - writer_load_document
      - writer_profile_resources
      - writer_create_writing_context
    outputs:
      - material: writing_task
      - material: media_assets
      - material: resource_profiles
      - material: writing_context
      - material: source_document
        required: false
      - material: target_document
        required: false
    acceptance_criteria: |
      writing_task, media_assets, resource_profiles, and writing_context are present.
      media_assets is valid even when its assets mapping is empty.
      When a Feishu/Lark source was required, source_document and target_document are also present.

  outline:
    label: 大纲
    route: choice
    prompt: |
      {{runtime_instruction}}

      Artifact persistence rule: writer tools return absolute local file paths.
      Save every declared output in this step with content_type="file" and the exact
      returned path as value. Never save a path with content_type="json" or "text".

      Maintain one user-visible outline artifact: outline_document. Preserve the
      representation selected in writing_task: Markdown produces `.md`; IR produces
      `.lmd` with stage="outline" and ui_editable=true. Every successful execution saves
      the result under the same slot as a new revision rather than a second card.

      Retrieve writing_task, writing_context, resource_profiles, and source_document when it
      exists. Also retrieve the latest selected outline_document and
      writing_context_after_outline when previous revisions exist.

      Dynamically select exactly one mode:

      A. Prepare supplied outline:
         When no outline_document exists and the user supplied source_document as the outline to use,
         call writer_prepare_outline(source_document_path=<source_document path>).

      B. Generate or regenerate outline:
         When no outline_document exists without a supplied outline, or the user explicitly
         requests complete regeneration, call writer_generate_outline using writing_task
         and the current writing_context.

      C. Revise current outline:
         When outline_document exists and the user requests a targeted change, use the latest
         selected outline_document as base_document. Call writer_build_revision_task with the current
         user instruction, then call writer_locate_revision_target,
         writer_generate_modify_plan, writer_generate_revision_set, and
         writer_apply_revision in that order.
         Pass base_document_path consistently. writer_generate_revision_set selects an
         IR PatchSet for `.lmd` and a StringReplaceSet for Markdown. Persist the returned
         task, locate result, modify plan, revision set, and revision result under the
         outline_* internal keys. If write_result is non-empty, persist
         it as outline_write_result. Save the returned revised_document path as outline_document,
         not under a new key.

      Do not call generation and revision tools in the same execution. After the selected
      mode produces the new outline_document, call writer_update_writing_context using that
      outline and the latest available context. Save the result as
      writing_context_after_outline.

      A cloud-bound outline revision is synchronized by writer_apply_revision and the
      returned outline_document is the provider-confirmed document. Human frontend edits also
      remain revisions of this same outline_document slot.
    tools:
      - writer_prepare_outline
      - writer_generate_outline
      - writer_build_revision_task
      - writer_locate_revision_target
      - writer_generate_modify_plan
      - writer_generate_revision_set
      - writer_apply_revision
      - writer_update_writing_context
    inputs:
      - material: writing_task
        required: true
      - material: writing_context
        required: true
      - material: source_document
        required: false
      - material: resource_profiles
        required: false
    outputs:
      - material: outline_document
      - material: writing_context_after_outline
      - material: outline_revision_task
        required: false
      - material: outline_locate_result
        required: false
      - material: outline_modify_plan
        required: false
      - material: outline_revision_set
        required: false
      - material: outline_revision_result
        required: false
      - material: outline_write_result
        required: false
    acceptance_criteria: |
      outline_document and writing_context_after_outline are present. Markdown outlines
      are `.md`; IR outlines have stage="outline" and ui_editable=true. Revision internals are required only when
      this execution handled an AI revision. For a cloud-bound revision,
      outline_write_result must report success.

  write_document:
    label: 成稿
    prompt: |
      {{runtime_instruction}}

      Artifact persistence rule: writer tools returning file paths must be saved with
      content_type="file" and the exact returned path as value. Feishu provider results
      are internal to this step; save the provider read-back document as a new
      draft_document revision instead of creating delivery or publish artifacts.

      Maintain one user-visible full-document artifact: draft_document. Local generation
      preserves the selected representation: Markdown stays `.md`; IR stays `.lmd` and
      ui_editable=true. After a Feishu write, the provider read-back is saved as the next
      draft_document revision rather than a second card.

      Retrieve the latest selected draft_document when it exists, plus source_document,
      target_document, outline_document, writing_task, writing_context,
      writing_context_after_outline, and writing_context_after_draft when available. Also
      retrieve media_assets for generation mode and resolved_media_assets when resuming an
      earlier generation.

      Dynamically select exactly one mode:

      A. Generate or rewrite from outline:
         Use this mode when draft_document does not exist and an outline is available, or
         when the user explicitly asks to rewrite from the latest outline.
         This rule is mandatory when outline_document is the current outline: requests such as
         "expand the outline into a full article" or "write it back after drafting" are
         generation requests, not targeted revisions. The requested later destination
         does not change the mode selected in this step.

         1. Call writer_generate_section_instructions using writing_task, the latest
            outline_document, and writing_context_after_outline. Save section_instructions
            and visual_plan.
         2. Route from the outline file format without changing representation:
            - Markdown outline: call writer_generate_draft_blocks_markdown, then
              writer_generate_draft_document_markdown.
            - IR outline: call writer_resolve_visual_media using visual_plan and
              media_assets, save resolved_media_assets, then call
              writer_generate_draft_blocks with visual_plan and resolved_media_assets,
              followed by writer_generate_draft_document.
            Save every returned section path as a separate ordered draft_blocks entry.
            Never stringify the path list or save it as one file entry. Save the assembled
            result as draft_document; save draft_document_md when returned.
         3. Call writer_update_writing_context using draft_document and save
            writing_context_after_draft.

         Chapter planning therefore always runs after the latest outline revision and
         immediately before drafting.

      B. Revise current full document:
         Use this mode when the user asks for a targeted modification. Prefer the latest
         selected draft_document as base_document; for a direct revision workflow, use
         source_document. An IR base must have stage="draft" or stage="final"; Markdown
         has no stage field.

         1. Call writer_build_revision_task with the current user instruction and
            base_document_path.
         2. Call writer_locate_revision_target, writer_generate_modify_plan,
            writer_generate_revision_set, then writer_apply_revision using the same base
            document and latest context. The revision-set tool automatically creates an
            IR PatchSet for `.lmd` or a StringReplaceSet for Markdown.
         3. Persist the task, locate result, modify plan, revision set, and revision result
            under the document_* internal keys.
         4. Save the returned revised_document path as draft_document, not under a new key.
         5. Call writer_update_writing_context using the revised draft_document and save
            writing_context_after_draft.

         Do not rerun chapter planning for a targeted body revision. Keep the revised
         document local unless the user explicitly requests a Feishu write in this step.
         Human frontend edits remain revisions of this same slot.

      After the selected generation or revision mode succeeds, keep the result in
      draft_document. If the user requested Feishu delivery or a Feishu target is bound,
      perform the provider write in this same step and replace draft_document with the
      provider read-back as its next revision:

      1. For a local result without a Feishu target, keep draft_document as-is.

      2. When a Markdown file is explicitly requested, call writer_export_markdown and
         save the returned .md path as the next draft_document revision.

      3. For Feishu delivery, if the selected content is Markdown, call
         writer_convert_markdown_to_ir once and keep the returned path transiently.
         Otherwise use draft_document directly.
      4. If document_revision_set exists for a targeted IR revision, call
         writer_publish_revision with source_document and document_revision_set.
      5. For a generated or rewritten document bound to an existing source, call
         writer_replace_document with the selected content and source_document. Pass
         target_document_path when target_document exists.
      6. For an unbound document, append to target_document when it exists. Otherwise
         call writer_create_document once, save its target under target_document, then
         call writer_append_document with the selected content and target path. Reuse
         target_document on retry; never create a second target for the same attempt.
      7. When resolved_media_assets exists, pass its path as media_assets_path to
         writer_replace_document or writer_append_document. This is required for Image
         WriterBlocks and keeps local media outside the Writer IR.
      8. After provider write and read-back succeed, save the returned provider document
         path as the next draft_document revision. A failed image upload must be reported
         as a partial delivery result and must not be claimed as successful.

      Before passing an existing artifact to a writer tool, call get_artifact, extract
      the absolute path string from value.path, and pass that string to the tool. When a
      writer tool returns a file descriptor with filename, path, and size, pass only its
      path string to save_artifacts, never the whole descriptor object.

      Complete exactly one mode in each run. Generation mode is complete when its draft
      lineage produces draft_document. Revision mode is complete when its revision task,
      locate result, modify plan, revision set, and successful revision result produce
      draft_document. A tool failure leaves the selected mode incomplete and should be
      retried within that same mode.
    tools:
      - writer_generate_section_instructions
      - writer_resolve_visual_media
      - writer_generate_draft_blocks
      - writer_generate_draft_blocks_markdown
      - writer_generate_draft_document
      - writer_generate_draft_document_markdown
      - writer_update_writing_context
      - writer_export_markdown
      - writer_convert_markdown_to_ir
      - writer_create_document
      - writer_publish_revision
      - writer_replace_document
      - writer_append_document
      - writer_build_revision_task
      - writer_locate_revision_target
      - writer_generate_modify_plan
      - writer_generate_revision_set
      - writer_apply_revision
    inputs:
      - material: outline_document
        required: true
        alternatives:
          - material: source_document
      - material: writing_task
        required: true
      - material: media_assets
        required: true
      - material: writing_context_after_outline
        required: true
        alternatives:
          - material: writing_context
      - material: source_document
        required: false
      - material: target_document
        required: false
    outputs:
      - material: draft_document
      - material: writing_context_after_draft
      - material: target_document
        required: false
      - material: section_instructions
        required: false
      - material: visual_plan
        required: false
      - material: resolved_media_assets
        required: false
      - material: draft_blocks
        required: false
      - material: draft_document_md
        required: false
      - material: document_revision_task
        required: false
      - material: document_locate_result
        required: false
      - material: document_modify_plan
        required: false
      - material: document_revision_set
        required: false
      - material: document_revision_result
        required: false
    acceptance_criteria: |
      draft_document and writing_context_after_draft are present. Markdown output is a
      `.md` file or an IR document with ui_editable=true. Drafting artifacts are required
      for generation/rewrite mode; IR generation also requires visual_plan and
      resolved_media_assets. A targeted revision requires document_revision_task,
      document_locate_result, document_modify_plan, document_revision_set, and a successful
      document_revision_result. When Feishu delivery is requested, the latest
      draft_document must be the provider-confirmed read-back document.
