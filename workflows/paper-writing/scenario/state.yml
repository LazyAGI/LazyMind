      source IDs and actual bibliographic facts. Background does not count as literature. Output evidence and
      selected papers; preserve source facts exactly, adding only reading judgments and citation formatting.  Read
      the complete pinned scenario/execution.md and this step method before acting. Call paper_prepare_inputs to
