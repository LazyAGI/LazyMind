      executing Agent: perform the reasoning, generation, checking and finite repair yourself. Do not call
      run_paper_step or ask LazyMind for model responses. Keep source and computation receipts. Native execution
      finishes through paper_submit_candidate; external execution uses paper_prepare_candidate and returns its
      exact artifact bundle to the controller for publication and completion. Never substitute a source filename
