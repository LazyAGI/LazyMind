initial: __start__
start_route: choice
transitions:
  __start__:
    - {to: research_topic, when: "The user requests topic development, without earlier unfinished literature retrieval"}
    - {to: literature_review, when: "Literature retrieval or review is the earliest unfinished requested work, including a new paper requiring literature search and analysis of supplied results"}
    - {to: experiment, when: "Data preparation, experimental research or analysis is the earliest unfinished requested work; requested literature retrieval is already complete or out of scope"}
    - {to: write_outline, when: "The user requests only an outline, or earlier requested literature retrieval and data analysis are complete or explicitly out of scope"}
    - {to: write_document, when: "The user continues drafting from the confirmed outline"}
    - {to: revise_document, when: "The user requests direct edits to an existing manuscript without peer review"}
    - {to: peer_review, when: "The user explicitly selects peer review"}
    - {to: reading_reflection, when: "The user explicitly selects reading reflection"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  research_topic:
    - {to: literature_review, when: "The user explicitly selects literature review"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  literature_review:
    - {to: refine_topic, when: "The user explicitly selects topic refinement"}
    - {to: experiment, when: "The user explicitly selects experimental research"}
    - {to: write_outline, when: "The user requests a new manuscript or an outline before drafting"}
    - {to: write_document, when: "The user continues drafting from the confirmed outline"}
    - {to: revise_document, when: "The user requests direct edits to an existing manuscript without peer review"}
    - {to: reading_reflection, when: "The user explicitly selects reading reflection"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  refine_topic:
    - {to: experiment, when: "The user explicitly selects experimental research after refining the topic"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  experiment:
    - {to: data_analysis, when: "The user explicitly selects data analysis"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  data_analysis:
    - {to: write_outline, when: "The user requests a new manuscript or an outline before drafting"}
    - {to: write_document, when: "The user continues drafting from the confirmed outline"}
    - {to: revise_document, when: "The user requests direct edits to an existing manuscript without peer review"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  write_outline:
    - {to: write_document, when: "Continue drafting from the confirmed outline"}
  write_document:
    - {to: revise_document, when: "The user requests direct edits to the manuscript"}
    - {to: peer_review, when: "The user explicitly selects peer review"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  peer_review:
    - {to: revise_document, when: "The user requests revision according to the current review, or explicitly requests direct edits without using the review"}
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  revise_document:
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  reading_reflection:
    - {to: finish, when: "The user explicitly chooses to finish this workflow"}
  finish:
    - {to: __end__, when: "Finish"}
steps:
  research_topic:
    label: "研究选题"
    mode: human
    route: choice
    tools_only: true
    prompt: |
      Identify the research problem, contribution, scope and feasibility from actual evidence. Compare
      alternatives and state missing evidence. Develop a topic only when requested; retain the supplied methods,
      observations and limitations. Output question text.  Read the complete pinned scenario/execution.md and this
      step method before acting. Call paper_prepare_inputs to read actual inputs, output fields and schemas; use
      paper_read_material for full source pages. You are the executing Agent: perform the reasoning, generation,
      checking and finite repair yourself. Do not call run_paper_step or ask LazyMind for model responses. Keep
      source and computation receipts. Native execution finishes through paper_submit_candidate; external
      execution uses paper_prepare_candidate and returns its exact artifact bundle to the controller for
      publication and completion. Never substitute a source filename or a summary for its content. Program
      validation does not establish scientific correctness. Stop at the current user-review boundary and do not
      claim approval.
    tools: [paper_prepare_inputs, paper_read_material, paper_knowledge_documents, paper_knowledge_read, paper_import_sources, paper_search, paper_read_paper, paper_submit_candidate, paper_read_result]
    terminal_tools: [paper_submit_candidate]
    inputs:
      - {material: research_materials, required: false, transport: path}
      - {material: seed_pool, required: false, transport: path}
      - {material: paper_input, required: false, transport: path}
      - {material: manuscript_file, required: false, transport: path}
      - {material: manuscript_text, required: false, transport: path}
      - {material: paper_topic, required: false, transport: path}
      - {material: review_request, required: false, transport: path}
      - {material: paper_source_policy, required: false, transport: path}
      - {material: paper_execution_policy, required: false, transport: path}
    outputs:
      - {material: research_topic_pool, required: true}
      - {material: research_topic_document, required: true}
      - {material: research_topic_receipt, required: true}
    acceptance_criteria: >
      All required output files and the exact signed validation receipt are accepted atomically; input versions,
      source facts and execution records are genuine. Agent provides honest semantic/visual checks; user approvals
      remain human.
  literature_review:
