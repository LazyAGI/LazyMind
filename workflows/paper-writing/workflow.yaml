ui:
  follow_mode:
    default: following
  hide_skipped_steps: true
  hide_unstarted_steps: true
  slots:
    seed_pool: {widgetType: json-block, readOnly: false, collapsed: false}
    research_topic_document: {widgetType: text-markdown, readOnly: false}
    literature_review_document: {widgetType: text-markdown, readOnly: false}
    refine_topic_document: {widgetType: text-markdown, readOnly: false}
    experiment_document: {widgetType: text-markdown, readOnly: false}
    data_analysis_document: {widgetType: text-markdown, readOnly: false}
    redrawn_manuscript_document: {widgetType: text-markdown, readOnly: true}
    write_outline_document: {widgetType: text-markdown, readOnly: false}
    write_document_document: {widgetType: text-markdown, readOnly: false}
    peer_review_document: {widgetType: text-markdown, readOnly: false}
    revise_document_document: {widgetType: text-markdown, readOnly: false}
    revision_fact_check_document: {widgetType: text-markdown, readOnly: true}
    reading_reflection_document: {widgetType: text-markdown, readOnly: false}
    finish_document: {widgetType: text-markdown, readOnly: true}
  tabs:
    - id: research_topic
      step_id: research_topic
      label: "研究选题"
      layout: list
      allow_download: true
      slots:
        - {id: research_topic_document}
    - id: literature_review
      step_id: literature_review
      label: "文献综述"
      layout: list
      allow_download: true
      slots:
        - {id: literature_review_document}
    - id: refine_topic
      hide_when_step_skipped: literature_review
      step_id: refine_topic
      label: "调整选题"
      layout: list
      allow_download: true
      slots:
        - {id: refine_topic_document}
    - id: experiment
      step_id: experiment
      label: "实验数据准备"
      layout: list
      allow_download: true
      slots:
        - {id: experiment_document}
