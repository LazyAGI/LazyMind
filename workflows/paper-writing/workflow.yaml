      never ask for model responses.
    - Read the full pinned contract, actual input versions and both launch/current requests; preserve user scope and
      approval checkpoints.
    - Register actual host-retrieved sources with paper_import_sources; use paper_search as fallback, never merely for receipts.
    - Use audited paper tools for sources and actual computations; publish the exact validated artifact bundle. Program
      checks are not scientific/visual checks.
