id: paper-writing
name: 论文写作
description: 支持选题、综述、实验、分析、写作、审稿与阅读心得；轻量实验按环境受限运行，按研究目标准备数据，结果可继续分析绘图。
when_to_use: >
  按用户明确要求且尚未完成的工作选择入口；同时要求检索、分析与写作时，先综述，再 F3 数据准备、F4 分析、论文大纲与成稿。 仅要求实验或数据分析时，先选择 experiment（F3
  实验与数据准备），再按阶段确认规则进入 data_analysis。 F3 从材料池中读取已提取的依据和完整数据表；已有结果仅整理展示，需要新计算时才运行实验。
  补传附件先提取有效信息入池，已处理的附件不重复读取，不将原文全文复制到后续上下文。 Use when the user requests the paper-writing workflow or review of
  an uploaded academic manuscript. Select the earliest unfinished stage explicitly requested by the user. For a
  new paper requiring literature retrieval, start at literature_review, even with research notes, data or a
  tentative title. Use research_topic for requested topic development, not as a mandatory first step. Literature
  reviews retain supplied papers and expand references through available academic sources and knowledge bases.
  Honor explicit source restrictions, dates, counts and focus. Frozen review handoffs use only their selection
  unless the user explicitly asks to expand it. Never substitute model knowledge for missing literature. Start
  review handoffs at literature_review with the frozen selection. New experiment execution requires explicit
  permission for this task. Bind experiment_execution to allow_local only after that permission; bind
  simulate_only for refusal. Analysis of supplied data does not authorize new experiments. No network,
  dependency installation or GPU; new experiment code is limited to 30 seconds. Never simulate when the user
  prohibits it, and never replace failed real-data results with simulation.  Execution takes place in the
  current LazyMind deployment, not necessarily the browser user's computer. For direct experiment entry, bind
  the user's stated goal to experiment_question; ask if missing for a new experiment. Existing data does not
  require a new experimental question. F1/F2 entries reuse the accumulated question and evidence. F3 returns
  final results for F4. Never separately run generated code through Chat tools. For an existing manuscript to
  review or revise, bind the exact attachment filename to manuscript_file; do not first summarize or copy the
  manuscript through Chat. Bind pasted manuscript text to manuscript_text; paper_topic and review_request are
  optional. Choose the entry stage by the user's requested unfinished work, never by attachment format.
  Requested literature search/review precedes requested data preparation/analysis, then outlining and drafting.
  A new-paper request for literature retrieval and analysis of existing results starts at literature_review,
  then experiment (organize supplied results), data_analysis, write_outline and write_document. Markdown
  materials, images or existing data do not establish that literature retrieval or analysis is complete. Enter
  write_outline directly only for an outline-only request, or when required earlier work is complete or
  explicitly out of scope. Do not skip requested research or analysis just because the final deliverable is a
  paper. Bind existing manuscripts to manuscript_file, regardless of format. Bind raw research notes, background
  and measurement attachments to research_materials, not seed_pool or manuscript_file. Do not put local file
  paths in paper_input.writing_materials. seed_pool accepts only an existing paper-material-pool.v2 JSON pool.
  Steps extract research_materials into source passages and complete tables. write_outline publishes an editable
  outline and requires user confirmation before write_document. Stop after the outline even when the launch
  request also asks for a complete manuscript or peer review. Continue only after the user confirms the outline.
  Choose peer_review only when the user requests a review; uploading or having a manuscript does not request
  review. Use write_document only to draft from the confirmed outline. Use revise_document for all
  existing-manuscript edits. Respect native approval checkpoints. On Continue, resume the earliest unfinished
  requested stage. Pass the current editing request unchanged through the existing request_context/user_input
  mechanism. Direct edits go to revise_document and use the public Writer to plan changes from that request. For
  review followed by revision, run peer_review first and honor its approval checkpoint, then proceed to
  revision. When the user requests revision according to the review, use all current issues by default; honor
  explicit issue numbers, exclusions, or categories for selective revision. Direct edits must ignore historical
  review advice. Never broaden a partial-review request to all issues; clarify only ambiguous selections.
  Missing materials or experiments remain pending and must not block other executable text edits. A manuscript
  or historical review alone does not request review-driven revision. If the request does not distinguish review
  from editing, clarify the intended action before execution. Keep the file's request; pass additions through
  request_context. review_request is for peer review. Ask which manuscript to review only when multiple
  attachments make the target ambiguous. Never substitute a filename or summary for the manuscript. For
  complete-paper tasks, call finish after the last requested stage is approved. If optional review-driven
  revision yields no accepted change, deliver the current valid manuscript. After the requested steps succeed
  and their artifacts are published, acknowledge completion in one short sentence in the user's language and
  direct them to the workflow. For the last step requested in the current turn, call the existing
  advance_step_and_hand_off tool so execution publishes its result without another Chat model round. For earlier
  requested steps, use advance_step and continue only along the requested path; do not hand off early in a
  multi-step task. Do not repeat the document, review, or JSON, or list issues, conclusions, or next-step
  options. Do not call list_artifacts, read_artifact, read_file_resource, or similar tools merely to summarize,
  repeat, or reconfirm successfully published artifacts. Read results when explicitly asked to explain them;
  continue subsequent steps when explicitly requested, then acknowledge briefly once the current request is
  fulfilled. For a review-only request, stop after successful review without automatically revising or finishing
  the workflow. On failure or missing required input, explain the actual cause and wait for user action; do not
  claim success. Never automatically retry a failed step or reread its error files to plan another attempt.
  Retry only when the user explicitly requests a retry after seeing the failure. Always relay necessary
  user_notice messages from tools.

runtime:
