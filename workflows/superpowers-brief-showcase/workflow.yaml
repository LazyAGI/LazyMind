id: superpowers-brief-showcase
name: Superpowers Brief Gate Showcase
description: A native Brief gate followed by a Codex development task and human review.
when_to_use: Only when explicitly trying the Superpowers Brief Gate demo in Codex.
tool_scripts:
- path: scripts/brief.py
  functions:
  - copy_bound_brief
  - check_showcase_brief
runtime:
  execution:
    version: '1'
    skills:
    - scenario/execution.md
    constraints:
    - Follow the shared state.yml step specification, declared output schemas and acceptance criteria; preserve the
      user request and bound input revisions.
    - Validate actual artifacts before completion, honor questions and review pauses, and report missing capabilities
      without fabricating output.
    steps:
      prepare:
        tools: []
      implement:
        tools: []
      validate_brief:
        tools: []
  post_step_checks:
  - step_id: validate_brief
    tool: check_showcase_brief
    arguments:
      candidate: admission
steps:
- id: prepare
  label: Prepare Brief
- id: validate_brief
  label: Validate Brief
- id: implement
  label: Implement and review
slots:
- id: brief
  user_visible: true
  label: Dispatch Brief
  type: json
  cardinality: single
- id: admission
  user_visible: true
  label: Checked Brief
  type: json
  cardinality: single
- id: implementation
  user_visible: true
  label: labels.py
  type: text
  cardinality: single
- id: checks
  user_visible: true
  label: Test output
  type: text
  cardinality: single
ui:
  tabs:
  - id: brief
    step_id: prepare
    label: Brief
    layout: list
    slots:
    - id: brief
  - id: admission
    step_id: validate_brief
    label: Gate
    layout: list
    slots:
    - id: admission
  - id: implementation
    step_id: implement
    label: Code and tests
    layout: list
    slots:
    - id: implementation
    - id: checks
