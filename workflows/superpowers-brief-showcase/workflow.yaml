id: superpowers-brief-showcase
name: Superpowers Brief Gate Showcase
description: A native Brief gate followed by a Codex development task and human review.
when_to_use: Only when explicitly trying the Superpowers Brief Gate demo in Codex.
tool_scripts:
- path: scripts/brief.py
  functions:
  - copy_bound_brief
  - check_showcase_brief
runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall
      back to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      prepare:
        prompt: Read scenario/external.md and its prepare step contract from this pinned package. Complete Prepare
          Brief using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - brief
        acceptance_criteria:
        - The external subagent has completed the declared objective, verified the actual outputs and reported concrete
          evidence without inventing state.
      implement:
        prompt: Read scenario/external.md and its implement step contract from this pinned package. Complete Implement
          and review using the bound evidence and the domain rules above. Generate and validate with your own host
          capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - implementation
        - checks
        acceptance_criteria:
        - Both artifacts contain the actual implementation and test output; human review is required.
      validate_brief:
        prompt: Read scenario/external.md and its validate_brief step contract from this pinned package. Complete
          Validate Brief using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - admission
        acceptance_criteria:
        - admission exactly equals the bound brief JSON; intentional invalid briefs remain invalid for the runtime
          gate.
  post_step_checks:
  - step_id: validate_brief
    tool: check_showcase_brief
    arguments:
      candidate: admission
steps:
- id: prepare
  label: Prepare Brief
- id: validate_brief
  label: Validate Brief
- id: implement
  label: Implement and review
slots:
- id: brief
  user_visible: true
  label: Dispatch Brief
  type: json
  cardinality: single
- id: admission
  user_visible: true
  label: Checked Brief
  type: json
  cardinality: single
- id: implementation
  user_visible: true
  label: labels.py
  type: text
  cardinality: single
- id: checks
  user_visible: true
  label: Test output
  type: text
  cardinality: single
ui:
  tabs:
  - id: brief
    step_id: prepare
    label: Brief
    layout: list
    slots:
    - id: brief
  - id: admission
    step_id: validate_brief
    label: Gate
    layout: list
    slots:
    - id: admission
  - id: implementation
    step_id: implement
    label: Code and tests
    layout: list
    slots:
    - id: implementation
    - id: checks
