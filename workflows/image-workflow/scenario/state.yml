initial: __start__

# {{placeholder}} substitution rules (performed by Go before launching the SubAgent):
#
#   {{user_input}}           — the user's original request text
#   {{runtime_instruction}}  — ephemeral per-run instruction for retries
#   {{<slot>}}               — value of an artifact saved by a prior step
#                              (text → text field; image → url field)

transitions:
  __start__:
    - to: analyze_subject

  analyze_subject:
    - to: collect_materials
      when: 当前请求确实依赖上传源图、知识库、联网事实或参考素材
    - to: optimize_prompt
      when: 当前文本信息足够，外部素材不会实质改变生成结果

  collect_materials:
    - to: optimize_prompt

  optimize_prompt:
    - to: generate_image
      when: 提示词已准备完成，先生成或登记一张/一组基础图

  generate_image:
    - to: enhance_image
      when: 基础图还需要编辑、生成视频/GIF 或添加确定性字幕
    - to: __end__
      when: 普通静态图已可直接交付

  enhance_image:
    - to: __end__

steps:
  analyze_subject:
    label: Analyze Subject
    route: choice
    prompt: |
      You are an expert art director and image analyst.

      The user wants to create or edit an image with this description:
      {{user_input}}

      {{runtime_instruction}}

      Your task:
      1. This step is ANALYSIS ONLY.
         Do NOT call any search tools, do NOT call kb_search, do NOT save any images.
         Do NOT save material_images, raw_source_image, image_output, prompt_used, or material_summary here.
      2. Identify the main subject(s) and sub-topics that require reference materials.
      3. Suggest a suitable artistic style (photorealistic, oil painting, anime, sticker, etc.).
      4. Note mood, lighting, and composition hints from the user text and any uploaded images.
      5. Classify the workflow internally (do NOT write routing fields into subject_analysis):
         - HIGHEST-PRIORITY POST-CAPTION/SUBTITLE OVERRIDE:
           If the requested final result is one static image and the user explicitly asks to add
           a caption/subtitle or post-layout display text (for example, "配上字幕‘收到!’",
           "加字幕", "add a caption", or "overlay this text"), classify it as
           CREATE_STATIC_MEME. This override still applies when the request also uploads/searches
           a source image or asks for a visual edit such as changing a pose: first perform the
           non-text visual edit, then add the exact caption with meme_add_caption.
           Do not treat text as a post-caption when the user explicitly wants it painted, printed,
           engraved, or otherwise integrated into a physical object/scene region such as a shirt,
           sign, cup, or tattoo; that remains FIND_AND_EDIT / EDIT_UPLOAD.
         - HIGHEST-PRIORITY SEARCH-THEN-EDIT OVERRIDE:
           If the original request explicitly says to find/search/get an existing image or
           photo first and then alter it (for example, "搜一张哈兰德的照片，然后给球衣画上必胜"),
           classify it as FIND_AND_EDIT. Preserve the user's action sequence literally.
           It is never CREATE_NEW, REFERENCE_GENERATE, or CREATE_STATIC_MEME merely because
           the requested edit adds exact text. Text painted onto a localized object in the
           found source photo is an image edit, not a generated caption overlay.
         - CREATE_NEW — brand-new still image from scratch (text-to-image).
           - KB_STYLE — user wants style/content from a selected knowledge base as reference
             (e.g. "根据知识库中的风格画图"). KB retrieval will be done in collect_materials.
           - REFERENCE_GENERATE — user wants to search/collect reference images first, then
             generate a **new** still image inspired by those refs (text-to-image, NOT editing).
           - FIND_AND_EDIT — user asks to find/search an existing photo online, then edit it.
           - EDIT_UPLOAD — user uploaded the source image for THIS still-image edit request and
             wants to edit that upload directly (not search the web for a new photo).
           - CREATE_ANIMATED — legacy generic animated GIF / 动图 that is not a meme,
             reaction image, or chat sticker.
             Includes pure text animation or finding a first frame for a generic GIF.
             generate_image first creates/stages a still base; enhance_image then runs
             video_generator → video_to_gif.
             If the user asks to find/search a photo first, collect will save it as image_output
             (first frame); generate_image then passes it via urls.
           - ANIMATE_UPLOAD — legacy generic image-to-video/GIF route for an uploaded image
             whose final deliverable is not a meme, reaction image, or chat sticker.
           - CREATE_STATIC_MEME — the final deliverable is one static meme, reaction image, or
             chat sticker. This wins over CREATE_NEW even when the input is only text.
             Also use CREATE_STATIC_MEME for any static-image request with explicit post-layout
             overlay text, captions/subtitles/labels, or requested caption position, color,
             outline/stroke, or size, including an uploaded/searched source plus another visual
             edit. The user does not need to say meme/表情包.
           - CREATE_ANIMATED_MEME — the final deliverable is one animated meme, reaction GIF,
             or animated chat sticker. This wins over CREATE_ANIMATED / ANIMATE_UPLOAD.
           - CREATE_MEME_PACK — the final deliverable is multiple distinct meme/reaction/sticker
             states ("一套", "整套", "系列", "多个不同状态", or an explicit count > 1).
             The pack may be static or animated; optimize_prompt records its delivery mode.
         Final-deliverable priority:
           0. Explicit static post-caption/subtitle, including source edit + caption
              → CREATE_STATIC_MEME (except physical-object/scene-integrated text).
           0a. Explicitly find/search an existing image and then edit it without a post-caption
               → FIND_AND_EDIT.
           1. Explicit multi-item meme/reaction/sticker pack → CREATE_MEME_PACK.
           2. One explicit animated meme/reaction/chat sticker → CREATE_ANIMATED_MEME.
           3. One explicit static meme/reaction/chat sticker, or one newly generated static
              image requiring exact display text/text layout → CREATE_STATIC_MEME.
           4. Generic non-meme animation keeps CREATE_ANIMATED / ANIMATE_UPLOAD.
         Never classify a static request with explicit post-caption/subtitle text as CREATE_NEW,
         FIND_AND_EDIT, or EDIT_UPLOAD. Image models are not responsible for rendering that text;
         CREATE_STATIC_MEME creates or edits a text-free base and meme_add_caption adds the exact
         text deterministically afterward.
         Do NOT classify a meme request as FIND_AND_EDIT merely because it first searches for
         or uploads a character image.
      6. If the runtime instruction mentions a selected knowledge base, filters.kb_id is set,
         or the user explicitly references 知识库 / knowledge base style, prefer WORKFLOW: KB_STYLE
         (unless the final deliverable is a meme or animation; those routes win).
      7. Decide whether material collection is actually needed. Make this decision from the
         request's semantic dependencies, not from a fixed subject/category keyword list.
         - An explicit request to find/search an image is always COLLECT. Do not replace it
           with the model's memorized knowledge or reinterpret it as direct generation.
         - A named real person whose likeness matters is COLLECT unless the user supplied the
           source image. Model familiarity with a celebrity is not a substitute for a source.
         - Choose COLLECT only when successful execution materially depends on information or
           media outside the request: an uploaded source/reference, selected knowledge base,
           explicit web/image search, a named real person/product/logo whose appearance matters,
           or an explicitly requested reference style/image.
         - Choose SKIP when the text already gives enough subject, action, style, composition,
           and delivery constraints for the configured media model to create the result directly.
           Generic quality might improve from random references is NOT a reason to collect.
         - If uncertain, internally test whether the missing external identity/style is necessary
           to satisfy the request. If not necessary, choose SKIP without asking the user. Never
           search merely because the workflow has a collect_materials step.
      8. Determine the exact runtime dependencies from the behavior and media source. This is
         metadata for the deterministic capability gate; do not mention configuration status in
         subject_analysis because it has not been checked yet.
         - Fresh text-to-image base: image_generator.
         - Existing source plus a non-text visual edit: image_editor.
         - Existing source that only needs a deterministic post-caption: none.
         - Any video/GIF delivery: video_generator,ffmpeg, plus image_generator only when a
           first-frame or explicitly requested last-frame image must be created from text; do
           not require image_generator when every required frame will be staged from uploads/search
           or when uploaded/collected images are sufficient for Seedance reference-only mode.
         - Static packs need image_generator for new bases, or image_editor when an authoritative
           source must be changed into multiple states. Animated packs add video_generator,ffmpeg.
         Never list a model that the selected task path will not call.
      9. Save a **user-facing** analysis (shown in the Analysis tab):
           save_artifacts(artifacts=[
             {'key': 'subject_analysis', 'content_type': 'text', 'value': <analysis text>}
           ])
         Write 100–200 words in clear natural language (Chinese if the user wrote in Chinese).
         Cover: subject, style, mood/lighting/composition, and what will happen next in plain words
         (e.g. "将先联网搜索参考图，再优化编辑指令并编辑图片",
          or "将先联网找一张底图，再生成短视频并转换成动态 GIF 表情包").
         Do NOT include machine routing lines such as WORKFLOW:, NEXT_STEPS:, SKIP_STEPS:,
         or comma-separated step ids — those belong in workflow_routing only.
      10. Save **routing metadata** separately (for ChatAgent, not shown in the Analysis tab):
           save_artifacts(artifacts=[
             {'key': 'workflow_routing', 'content_type': 'text', 'value': <routing block>}
           ])
         Use exactly this format (4 lines):
           WORKFLOW: <CREATE_NEW|KB_STYLE|REFERENCE_GENERATE|FIND_AND_EDIT|EDIT_UPLOAD|CREATE_ANIMATED|ANIMATE_UPLOAD|CREATE_STATIC_MEME|CREATE_ANIMATED_MEME|CREATE_MEME_PACK>
           REQUIRES: <comma-separated image_generator|image_editor|video_generator|ffmpeg, or none>
           NEXT_STEPS: <comma-separated step ids>
           SKIP_STEPS: <comma-separated step ids or none>
         Every route includes generate_image. The Host runs the deterministic capability check
         after this step saves workflow_routing and before this Attempt can succeed; never add a
         separate detection step id to routing.
         Build it from material need plus optional post-processing:
           - COLLECT + direct still:
             NEXT_STEPS: collect_materials,optimize_prompt,generate_image
             SKIP_STEPS: enhance_image
           - SKIP + direct still:
             NEXT_STEPS: optimize_prompt,generate_image
             SKIP_STEPS: collect_materials,enhance_image
           - COLLECT + edit/animation/caption:
             NEXT_STEPS: collect_materials,optimize_prompt,generate_image,enhance_image
             SKIP_STEPS: none
           - SKIP + edit/animation/caption:
             NEXT_STEPS: optimize_prompt,generate_image,enhance_image
             SKIP_STEPS: collect_materials
         A source-dependent route may skip collection only when the source is already available
         as a workflow artifact; otherwise choose COLLECT.
         Do NOT save raw_source_image, image_output, prompt_used, material_images, or material_summary in this step.
      11. For FIND_AND_EDIT / EDIT_UPLOAD, save the material route token:
           save_artifacts(artifacts=[
             {'key': 'edit_route', 'content_type': 'text', 'value': 'edit'}
           ])
         For generation / animated workflows, do not save edit_route; generation is the default branch.

      Stop after saving required artifacts only.
    outputs:
      - material: subject_analysis
        required: true
      - material: workflow_routing
        required: true
      - material: edit_route
        required: false
    acceptance_criteria: |
      subject_analysis must be saved (50+ words), user-facing natural language only —
      no WORKFLOW:/NEXT_STEPS:/SKIP_STEPS: lines or step-id lists.
      workflow_routing must be saved with WORKFLOW, REQUIRES, NEXT_STEPS, and SKIP_STEPS lines.
      REQUIRES must name only the media dependencies this exact behavior will call.
      NEXT_STEPS must include collect_materials only when external/uploaded/KB/reference material
      is genuinely required. A self-contained text-only request should skip collect_materials and
      continue directly to optimize_prompt.
      An explicit find/search-then-edit request must use WORKFLOW: FIND_AND_EDIT, include
      collect_materials,optimize_prompt,generate_image,enhance_image, and save
      edit_route=edit.
      Exception: when the static final result explicitly asks for a post-caption/subtitle,
      including a source visual edit plus caption, it must use WORKFLOW: CREATE_STATIC_MEME,
      continue through generate_image, and must not save edit_route. Text explicitly integrated
      into a physical object/scene remains FIND_AND_EDIT or EDIT_UPLOAD.
      Do NOT call kb_search/web_search/image_search_tool/image_search_and_validate in this step.
      Do NOT save material_images, raw_source_image, image_output, prompt_used, or material_summary in this step.

  collect_materials:
    label: Collect Reference Materials
    prompt: |
      You are a reference-material collection agent.

      Subject analysis:
      {{subject_analysis}}

      Workflow routing (internal):
      {{workflow_routing}}

      {{runtime_instruction}}

      Your task:
      - ROUTING INPUT GUARD: when there is no uploaded image, workflow_routing must contain
        one explicit `WORKFLOW: <route>` line before you do any work. If it is absent,
        unreadable, or only exposes a file/path wrapper, stop with an execution error.
        Do not infer a route from prior memories, examples, or unrelated artifacts, and do
        not save material_summary (including a failure/blocking note). Leaving the required
        output missing is intentional so Workflow Runtime marks this attempt failed.
      0. UPLOAD-FIRST OVERRIDE (highest priority):
         - User uploads are NOT workflow artifacts. Never use find_artifact/get_artifact/list_artifacts
           to discover uploaded images.
         - Inspect the conversation attachment list first. Only call find_user_attachment when
           one or more actual attachment filenames are listed. Do not treat the user's text,
           a requested subject, or a web URL to be searched as an attachment filename.
         - If attachment filenames are listed but find_user_attachment cannot resolve them, stop
           with a clear failure note instead of fabricating an upload path.
         - If the current user request contains one or more uploaded images, use
           find_user_attachment and save those uploads directly as material_images
           (sort_order=1..N, maximum 3).
         - Once any uploaded image is found, do NOT call kb_search, web_search,
           wikipedia, image_search_tool, image_search_and_validate, or validate_image_ref, and do not append
           any newly searched image to material_images.
         - For EDIT_UPLOAD / FIND_AND_EDIT, also save the first upload as raw_source_image.
         - For ANIMATE_UPLOAD / CREATE_ANIMATED / CREATE_ANIMATED_MEME, save the first upload as
           image_output with sort_order=1 only when the user asks to animate that exact image or
           explicitly designates it as the first frame. When the user supplies multiple images
           as references (especially three images) without a frame designation, keep all of them
           only in material_images so Seedance uses reference-image mode.
         - For CREATE_MEME_PACK, save uploads as material_images. Also save the first
           upload as image_output only when the user explicitly requests an animated pack.
         - For CREATE_STATIC_MEME, material_images are the source/character/style references.
           When the user asks to edit the upload and then add a caption, preserve the first upload
           as the authoritative image_editor source. Do not turn it into raw_source_image.
         - Then write material_summary describing the uploaded materials and stop.
           This override applies even if workflow_routing was classified imprecisely.
      1. When there is no uploaded image, do not require or call find_user_attachment. Read
         WORKFLOW from workflow_routing (not from subject_analysis) and continue with text
         generation, knowledge-base retrieval, or web image search as appropriate.
         - CREATE_NEW: reference images are optional (0–3). If the text request is already
           sufficient, do not search merely to obtain an image.
         - KB_STYLE: run kb_search first. Treat concrete KB text about palette, brushwork,
           composition, medium, mood, or other visual traits as sufficient reference material.
           Save those findings in material_summary and do NOT call web_search or
           image_search_and_validate merely because the KB result contains no image.
         - REFERENCE_GENERATE: collect 1–3 reference images for prompt writing.
         - FIND_AND_EDIT / EDIT_UPLOAD: prepare source image(s) for image editing.
         - CREATE_ANIMATED:
             * Parse desired sticker count N from the user request (三个→3, default 1, max 10).
             * If the user asked to find/search photo(s) first
               (e.g. "找一张XX做成动态表情包" / "找三张不同的图做成表情包"):
               web_search for context → image_search_and_validate → save selected material_images.
               Also save origin(s) as image_output with sort_order:
                 - N distinct subjects/photos requested → up to N origins, sort_order=1..N
                 - Otherwise 1 origin is enough (generate will reuse it N times), sort_order=1
             * Else (pure text sticker): optional 0–3 style refs as material_images only;
               skip heavy search if the text description is already clear.
         - ANIMATE_UPLOAD: confirm the uploaded source image as both material_images and
           image_output with sort_order=1 (first frame; generate will reuse it if N>1).
         - CREATE_STATIC_MEME: collect 0–3 optional source/character/style references. An explicit
           uploaded or searched source used for a visual edit is authoritative, not merely a style
           suggestion. Do not search when the text request already defines the character and
           expression clearly and no source search was requested.
         - CREATE_ANIMATED_MEME: collect 0–3 optional character/style references. If an upload
           or searched character image exists, also save the first one as image_output.
         - CREATE_MEME_PACK: collect at most 3 character/style references shared by the pack.
           Do not collect one web image per requested state. The states are planned later.
      - This is the ONLY step for external information/material collection.
      - You may use kb_search and web_search in this step only when the selected route needs them.
      - For KB_STYLE (or when filters.kb_id is set), run kb_search first to collect style references.
        If the KB returns enough textual style detail to write a usable generation prompt,
        save it in material_summary and stop collection. A text-only KB result is successful;
        material_images may remain empty.
      - For KB_STYLE, use web_search/image_search_and_validate only when the KB result is empty or lacks
        usable visual style information, or when the user explicitly asks for image references.
      - When web image collection is actually needed, call web_search once with one specific
        visual query, include_images=true, and max_results=15. Extract only the direct URLs from
        the returned image fields (for Tavily: the summary result's extra.images); do not use
        ordinary result-page URLs. Then call image_search_and_validate once with that exact list
        as candidate_urls, target_valid=3, max_candidates=15. Do not shorten, reconstruct, decode,
        or remove query/signature parameters from any URL.
      - **Save only 1–3 validated images total.** Use `selected[*].url` from
        image_search_and_validate verbatim, including every query/signature parameter.
      - Only when web collection is required: if web_search is unavailable, fall back to
        wikipedia once; if both are unavailable, stop with a failure note.
      - For web-sourced items, image_search_and_validate is authoritative:
          1. Read its exact candidate_count, validated_count, valid_count, invalid_count,
             selected_count, selected, and candidates fields.
          2. Save only entries from selected whose status is ok:
               save_artifacts(artifacts=[
                 {'key': 'material_images', 'content_type': 'image',
                  'value': <selected item url>}
               ])
          3. Never save an invalid/unvalidated candidate. Never claim selected_count is the
             same as valid_count; a technically valid candidate may remain unselected.
        **Hard limit: at most 3 material_images.** Do not save a 4th image.
        For FIND_AND_EDIT: 1 validated image is enough if it matches the subject; 2–3 only when
        the first candidates are poor fits.
      - For REFERENCE_GENERATE: save validated reference URLs as material_images only.
        Do NOT save raw_source_image, image_output, or prompt_used — those belong in later steps.
      - If WORKFLOW is EDIT_UPLOAD, use find_user_attachment to get the uploaded source image.
        Save the same path/URL as both material_images and raw_source_image
        (so the Materials tab reference grid is not empty). Do not web-search.
        Do NOT save prompt_used here — optimize_prompt will write the edit instruction.
      - If WORKFLOW is ANIMATE_UPLOAD, use find_user_attachment to get the uploaded source image.
        Save the same path/URL as both material_images and image_output with sort_order=1
        (first frame). Do not web-search.
        Do NOT save prompt_used here — optimize_prompt will write the motion instruction.
      - If WORKFLOW is FIND_AND_EDIT, after validating and saving the best subject photo
        as material_images, also save the same validated URL as raw_source_image.
        Do NOT save prompt_used here — optimize_prompt will write the edit instruction.
      - If WORKFLOW is CREATE_ANIMATED or CREATE_ANIMATED_MEME and the user asked to find a photo first, after
         validating the best subject photo as material_images, also save that same URL as
         image_output (first frame). Do NOT save prompt_used here.
      - Before stopping, write a concise Chinese summary (80–200 words) of what you collected:
          - HARD SUCCESS CONDITION: for FIND_AND_EDIT / EDIT_UPLOAD, do not save this summary
            unless one validated source has been saved as both material_images and
            raw_source_image. If the source cannot be obtained, stop with an execution error
            and save no material_summary; never turn a failure report into a successful output.
          - for uploaded materials: which uploads were saved (do not claim a search was performed)
          - for KB_STYLE: record the useful KB style findings, including palette, brushwork,
            composition, medium, mood, and other available visual traits; do not describe the
            absence of KB images as a failure
          - otherwise: what you searched for and key findings from web_search / wikipedia
          - for image_search_and_validate, copy its counters exactly; never estimate or write
            “about N”. Distinguish searched candidates, validated candidates, technically valid
            candidates, and finally selected/saved images
          - how many material_images were saved and which one was chosen as
            raw_source_image / image_output (if any)
          - why that image fits the user's request, or note gaps (e.g. no jersey photo found)
          save_artifacts(artifacts=[
            {'key': 'material_summary', 'content_type': 'text', 'value': <summary>}
          ])
      - Follow any "Partial retry instruction" block for sort_order on list slots.
      - Stop after all required artifacts are saved.
    tools:
      - find_user_attachment
      - kb
      - multimodal
      - web_search
      - wikipedia
      - image_search_and_validate
      - validate_image_ref
    inputs:
      - material: subject_analysis
        required: true
      - material: workflow_routing
        required: true
    outputs:
      - material: material_images
        required: false
      - material: material_summary
        required: true
      - material: raw_source_image
        required: false
      - material: image_output
        required: false
    acceptance_criteria: |
      The step must never use find_artifact/get_artifact/list_artifacts to locate user uploads.
      Uploaded files must be resolved through find_user_attachment only.
      If the current request has uploaded images, only those uploads may be saved as
      material_images; no knowledge-base or web image search may be performed or appended.
      For uploaded edit workflows, the first upload must also be raw_source_image.
      For uploaded animated workflows, the first upload must also be image_output.
      For CREATE_NEW: material_images are optional (0–3) when the text request is sufficient.
      For KB_STYLE: material_summary must preserve the useful KB style findings; material_images
      are optional (0–3). Sufficient text-only KB results must not trigger web/image search solely
      because they contain no image.
      For REFERENCE_GENERATE: 1–3 validated material_images should be saved (never more than 3).
      For CREATE_ANIMATED: if the user asked to find a photo first, 1–3 material_images and
      one image_output must be saved; otherwise material_images optional (0–3).
      material_summary should still be saved.
      For FIND_AND_EDIT: 1–3 material_images and one raw_source_image must be saved (never more than 3 images).
      For EDIT_UPLOAD: both material_images and raw_source_image must be saved from the user upload
      (same path/URL).
      For ANIMATE_UPLOAD: both material_images and image_output must be saved from the user upload
      (same path/URL, image_output sort_order=1).
      For CREATE_STATIC_MEME: material_images are optional character/style references (0–3).
      For CREATE_ANIMATED_MEME: material_images are optional; an uploaded or searched character
      reference must also be saved as image_output.
      For CREATE_MEME_PACK: save at most 3 shared character/style references; do not search for
      a separate source image for every state.
      material_summary should be saved with a concise description of search results and image selection.
      optimize_prompt writes prompt_used in the next step.

  optimize_prompt:
    label: Optimize Prompt
    mode: human
    route: choice
    prompt: |
      You are a professional prompt engineer for still images, image editing, short videos,
      and meme/reaction/sticker production.

      Subject analysis:
      {{subject_analysis}}

      Workflow routing (internal):
      {{workflow_routing}}

      Optional reference materials:
      {{material_images}}

      Material and style findings:
      {{material_summary}}

      Source image for editing (if already collected):
      {{raw_source_image}}

      First-frame image for animation (if already collected):
      {{image_output}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      Your task:
      1. Read WORKFLOW from workflow_routing (not from subject_analysis).
         It must contain one explicit `WORKFLOW: <route>` line. If the route is absent,
         unreadable, or unknown, stop with an execution error and save neither prompt_used nor
         meme_generation_plan. Never infer a meme route from stale examples or prior tasks.
         material_summary and material_images may be empty because analyze_subject deliberately
         skipped collect_materials for a self-contained request. This is expected; do not fail,
         invent search findings, or ask to run material collection unless the requested result
         truly depends on missing external information.
      2. For CREATE_NEW, KB_STYLE, or REFERENCE_GENERATE:
         Combine subject_analysis, material_summary, and any optional material images into a high-quality
         English image-generation prompt (50–200 words, rich in visible detail). Apply the shared
         Image Prompt Craft contract:
         - Put canvas/aspect ratio, final use, composition, subject placement, and intentional
           negative space before surface detail. Preserve an explicit user ratio; do not assume
           every image is square.
         - Define the subject count, appearance, action, viewpoint, scale, and spatial relationships.
           Ground the scene with 5–12 concrete visible nouns instead of adjective stacks.
         - Choose one dominant medium or capture grammar. For photography, use one coherent camera
           position/lens feel; for illustration, name the line, shape, layering, and print/paper
           behavior. Do not accidentally mix photography, watercolor, flat vector, and 3D rendering.
         - Describe materials, lighting, and palette as separate controls: surface behavior;
           light source/direction/softness; then 3–5 colors with their visual roles.
         - Use generic quality adjectives only when supported by visible evidence. Prefer crisp
           edges, believable shadows, accurate proportions, tactile micro-texture, or controlled
           depth over "beautiful, professional, high quality" keyword soup.
         - End with only 2–6 targeted avoid constraints for likely failure modes. Do not let a
           long negative list dominate the image.
         - When literal text must be painted into the scene, preserve the exact original-language
           string in double quotes and state its location. Exact post-layout captions remain on
           the deterministic CREATE_STATIC_MEME path, never inside this generation prompt.
         - Use compact prose by default. Use labeled/structured sections only for product renders
           or complex scenes with several interacting visual systems.
      3. For FIND_AND_EDIT or EDIT_UPLOAD (when raw_source_image is available):
         Write a concise English **edit instruction** for image_editor (not a generation prompt).
         The original user request is the source of truth. Follow it literally and do not add
         aesthetic improvements, corrections, or creative changes that the user did not request.
         Use the smallest possible edit scope:
         - Identify the exact target object/region and the exact requested operation.
         - For a local edit, modify only that target region. Preserve all content outside it as
           closely as the model supports, including subject identity and facial features, body
           shape and pose, background, framing, crop, perspective, lighting, shadows, colors,
           textures, existing text/logos, and image resolution unless the user explicitly asks
           to change one of them.
         - For a global edit such as an explicitly requested color grade or art style, change
           only the requested global attribute; preserve scene content, object count, geometry,
           layout, identity, pose, and camera viewpoint.
         - Never add, remove, replace, beautify, retouch, restyle, reframe, or rewrite anything
           beyond the explicit request. When the request is ambiguous, choose the narrower edit
           instead of inventing extra changes.
         Format prompt_used as one executable instruction with these four explicit clauses:
           Requested edit: <the user's requested change>.
           Edit scope: <the exact target region/object or requested global attribute>.
           Preserve: <all important unrequested content that must remain unchanged>.
           Do not: <specific likely collateral changes that are forbidden>.
         If raw_source_image is absent for either edit route, stop with an execution error and
         save no output. Do not invent a replacement generation or meme plan.
      4. For CREATE_ANIMATED or ANIMATE_UPLOAD, save prompt_used as an English four-line frame
         contract followed by no other fields:
           COUNT: <requested item count, default 1, clamp to 1–10>
           FIRST_FRAME_PROMPT: <a text-free still prompt, "use collected first frame", or
             "reference-only" when collected images are references rather than exact frames>
           LAST_FRAME_PROMPT: <a text-free final-frame prompt only when the user explicitly
             requested/designated a tail frame; otherwise "none">
           MOTION_PROMPT: <40–120 words for video_generator>
         The motion prompt describes subject, sticker/emoji aesthetic, short looping-friendly
         motion, and camera. Prefer expressive looping motion over cinematic shots. When
         image_output is present, keep that subject recognizable. The first/last prompts must
         prohibit rendered words, captions, logos, and watermarks. Do not invent a last frame
         when the user did not ask for one: the downstream UI hides absent materials.
      5. For CREATE_STATIC_MEME, CREATE_ANIMATED_MEME, or CREATE_MEME_PACK, create a structured
         meme_generation_plan in addition to prompt_used.
         - CREATE_STATIC_MEME: mode=static_meme, delivery=static, count=1.
         - CREATE_ANIMATED_MEME: mode=animated_meme, delivery=animated, count=1.
         - CREATE_MEME_PACK: mode=meme_pack. Parse the requested count; default to 3 when omitted.
           delivery=animated only when the user explicitly asks for a dynamic/GIF pack; otherwise
           delivery=static. Cap static packs at 12 items and animated packs at 10 items.
         - Each item must have: index (1-based), caption, caption_box, caption_style,
           communication_task, image_prompt, last_frame_prompt, and motion_prompt. image_prompt,
           last_frame_prompt, and motion_prompt must be English. last_frame_prompt is null unless
           the user explicitly requests/designates a tail frame for that item.
           caption preserves the user's exact requested display text and may be Chinese. If the
           user did not provide display text, generate one concise, useful caption for the
           communication_task (normally 1–8 Chinese characters or 1–4 English words).
         - caption_box is [left, top, right, bottom] in normalized 0..1 coordinates. Default to
           [0.15, 0.75, 0.85, 0.93], a centered lower rectangle. Only change it when the user
           explicitly requests another text position. This rectangle is not drawn in the result.
         - caption_style is chosen by you for each item from the requested mood and the planned
           base-image palette. It must contain text_color and stroke_color as exact #RRGGBB hex
           colors plus stroke_width_ratio as a number from 0.03 to 0.16. Prefer a strongly
           contrasting text/outline pair that remains legible over the planned background, such
           as white text with black outline; honor explicit user color or outline instructions.
         - Items in a pack must express different communication states; do not create cosmetic
           variants of the same state. If the user did not specify states, use broadly useful
           chat states such as acknowledgement, thanks, encouragement, apology, laughter,
           celebration, waiting, and good night, truncated to count.
         - image_prompt describes one readable hero frame with a recognizable character,
           strong facial/body performance, minimal sufficient props/environment response,
           and a square sticker composition. It must explicitly prohibit rendered words,
           letters, captions, logos, and watermarks. Do not ask the image model to reserve a
           blank caption area; deterministic postprocessing overlays the caption afterward.
           For CREATE_STATIC_MEME with an uploaded/searched source and an additional visual edit,
           image_prompt must be a narrow image_editor instruction for only that non-text change.
           Preserve the source identity, subject, background, layout, lighting, and all other
           unrequested content. Put the exact requested subtitle only in caption: never include
           it as text for the image model to draw inside image_prompt.
         - motion_prompt describes one short, looping-friendly causal performance for the same
           item and character; it must not invent a different state, prop, or scene. It must also
           prohibit rendered words, letters, captions, logos, and watermarks. The caption is
           added to the completed GIF by deterministic postprocessing, not by the video model.
         - prompt_used is the English shared character/style prompt used by all items.
         Save both artifacts in ONE save_artifacts call:
             save_artifacts(artifacts=[
               {'key': 'prompt_used', 'content_type': 'text', 'value': <shared prompt>},
               {'key': 'meme_generation_plan', 'content_type': 'json', 'value': {
                 'schema_version': '1.0',
                 'mode': <static_meme|animated_meme|meme_pack>,
                 'delivery': <static|animated>,
                 'count': <integer>,
                 'items': [
                   {'index': 1, 'caption': <text>,
                    'caption_box': [0.15, 0.75, 0.85, 0.93],
                    'caption_style': {'text_color': '#FFFFFF',
                                      'stroke_color': '#000000',
                                      'stroke_width_ratio': 0.08},
                    'communication_task': <text>,
                    'image_prompt': <English prompt>,
                    'last_frame_prompt': <English prompt or null>,
                    'motion_prompt': <English prompt>}
                 ]
               }}
             ])
         The items length must equal count. After this save, do not execute the generic
         prompt-only save below; continue to the route-selection call in step 8.
      6. For KB_STYLE, faithfully translate the KB findings in material_summary into visual prompt
         language, including the described color palette, brushwork, composition, medium, mood,
         and other style traits. Do not require material_images when the KB text is sufficient.
         For every still-image prompt inside a meme plan, apply the same concrete subject,
         composition, single-medium, material/light/palette, and targeted-avoid rules when they do
         not conflict with the stricter square-sticker and no-rendered-text contract above.
      7. For non-meme workflows, save the result:
           save_artifacts(artifacts=[
             {'key': 'prompt_used', 'content_type': 'text',
              'value': <prompt or edit instruction>}
           ])

      8. After the required artifacts are saved, call select_image_route exactly once with the
         exact workflow_routing text. This terminal tool always selects generate_image so every
         route first creates or stages a concrete base image. Never jump directly to enhance_image.
    tools:
      - select_image_route
    terminal_tools:
      - select_image_route
    inputs:
      - material: subject_analysis
        required: true
      - material: workflow_routing
        required: true
      - material: material_images
        required: false
      - material: material_summary
        required: false
      - material: raw_source_image
        required: false
      - material: image_output
        required: false
    outputs:
      - material: prompt_used
      - material: meme_generation_plan
        required: false
    acceptance_criteria: |
      prompt_used artifact must be saved in English.
      For generation workflows: at least 30 words, suitable for image_generator.
      Generation prompts must lead with canvas/use and composition, specify concrete subject and
      scene details, keep one coherent medium/capture grammar, and control materials, lighting,
      and palette separately. Empty quality-keyword stacks do not satisfy this criterion.
      For edit workflows (FIND_AND_EDIT / EDIT_UPLOAD): a clear image_editor instruction containing
      Requested edit, Edit scope, Preserve, and Do not clauses. It must faithfully reflect the user
      request, select the smallest sufficient edit scope, and forbid unrequested collateral changes.
      For animated workflows (CREATE_ANIMATED / ANIMATE_UPLOAD): the exact FIRST_FRAME_PROMPT,
      LAST_FRAME_PROMPT, MOTION_PROMPT contract plus COUNT in 1–10; LAST_FRAME_PROMPT is none
      unless explicitly needed.
      For CREATE_STATIC_MEME / CREATE_ANIMATED_MEME / CREATE_MEME_PACK, meme_generation_plan
      must be saved with schema_version, mode, delivery, count, and exactly count distinct items.
      Every item must contain caption, caption_box, caption_style, communication_task,
      image_prompt, last_frame_prompt, and motion_prompt. caption_style must contain valid text_color, stroke_color,
      and stroke_width_ratio fields selected by the LLM. Meme media prompts must prohibit
      model-rendered text; caption_box defaults to [0.15, 0.75, 0.85, 0.93] unless the user
      requests another placement.
      A static request such as "给这个小狗做敬礼手势，然后配上字幕‘收到!’" must produce a
      CREATE_STATIC_MEME plan whose image_prompt contains only the salute-pose edit and whose
      caption is exactly "收到!"; the caption text must not be delegated to image_editor.
      select_image_route must return generate_image as the sole control.next_step after all
      required artifacts are saved. Editing, animation and captions are downstream enhancement.

  generate_image:
    label: Generate Image
    mode: human
    route: choice
    prompt: |
      You are the base-image generation/staging agent. Every route must leave this step with at
      least one concrete text-free base image. Editing, animation, GIF conversion, and exact
      caption layout belong to the optional downstream enhance_image step.

      Optimized prompt:
      {{prompt_used}}

      Structured meme plan (present only for meme routes):
      {{meme_generation_plan}}

      Workflow routing (internal):
      {{workflow_routing}}

      Source image for editing (if collected):
      {{raw_source_image}}

      Optional first-frame image (upload or web-found):
      {{image_output}}

      Optional character/style references:
      {{material_images}}

      Original user request:
      {{user_input}}

      {{runtime_instruction}}

      1. Read exactly one WORKFLOW and one REQUIRES line from workflow_routing. The Host has
         already completed the deterministic post-analysis capability check. Never call a model
         omitted from REQUIRES.
      2. Validate a meme plan before paid calls: one static/animated meme has count=1; pack item
         length equals count; static count is 1–12; animated count is 1–10; item indexes are stable.
         For CREATE_ANIMATED / ANIMATE_UPLOAD, parse COUNT from prompt_used, default to 1, and
         reject values outside 1–10 instead of silently producing a different count.
      3. Produce/stage bases and visible generation materials by route:
         Never add the caption here; all deterministic text layout belongs to enhance_image.
         For a source-backed route, resolve its authoritative source in this order:
         raw_source_image, image_output, then the first material_images entry. If the selected
         behavior requires a source and none of those contains a real path/URL, fail instead of
         switching to generation.
         - CREATE_NEW / KB_STYLE / REFERENCE_GENERATE: call image_generator once with prompt_used.
           For REFERENCE_GENERATE, also copy every real material_images path (maximum 3) to
           generation_reference_images in its original order; never save a summary or placeholder.
         - FIND_AND_EDIT / EDIT_UPLOAD: do not call a model here. Stage raw_source_image as the
           sole base; enhance_image performs the actual edit.
         - CREATE_STATIC_MEME: if REQUIRES contains image_editor, stage the authoritative source
           unchanged; enhance_image performs that visual edit and then adds the caption. If
           REQUIRES is none, stage the caption-only source unchanged. Otherwise call
           image_generator once with items[0].image_prompt. Never edit or caption here.
         - CREATE_ANIMATED / ANIMATE_UPLOAD / CREATE_ANIMATED_MEME: stage the collected first
           frame when present. For generic CREATE_ANIMATED / ANIMATE_UPLOAD, stage/reuse or
           generate exactly COUNT first/base images in order. Otherwise call image_generator to create a text-free hero
           frame (use the meme item's image_prompt when available, else FIRST_FRAME_PROMPT).
           Exception: when FIRST_FRAME_PROMPT is "reference-only", or material_images exist while
           REQUIRES omits image_generator and no collected first frame exists, stage the first real
           material image as generated_base_image for workflow/UI pairing (repeat it COUNT times
           for generic multi-item animation), but do not save it as generated_first_frame and do
           not call image_generator.
           Save each concrete first frame to both generated_base_image and generated_first_frame
           with the same item sort_order. If the user explicitly supplied/designated a tail image,
           stage it to generated_last_frame. Otherwise generate a tail frame only when the item's
           last_frame_prompt or LAST_FRAME_PROMPT is non-null/non-"none". Do not fabricate or
           auto-generate a tail frame for a request that did not ask for one.
         - CREATE_MEME_PACK: create N text-free bases in plan order. Use each item.image_prompt
           with image_generator for new bases. When an authoritative source will be edited, stage
           or reuse it N times unchanged; enhance_image performs each planned visual edit. When
           REQUIRES contains neither image model, stage/reuse the caption-only source unchanged.
           For animated delivery, also save every base as generated_first_frame and generate/save
           an item tail only when last_frame_prompt is non-null. Do not edit, caption, or animate here.
         Calls for multiple bases/frames may be parallel, but keep exact item index → returned path mapping.
         Use image_size='1024x1024', batch_size=1 for image model calls.
      4. REFERENCE MATERIAL CONTRACT: for every animation/video route, copy all concrete
         material_images paths to generation_reference_images, preserving their 1-based order.
         In particular, if the user uploaded three images, all three must be visible here as
         references even when one is also used as the first or last frame. Do not save this slot
         when no reference exists. Reference images remain inputs; they are never mislabeled as
         generated_image_output.
      5. For every successful base, take local_path (preferred) or image_url. Never fabricate a
         path. Save bases sequentially in index order to generated_base_image. Omit sort_order on
         a first full run; use sort_order=k only for a partial retry.
         For CREATE_NEW / KB_STYLE / REFERENCE_GENERATE, save the same path in the same call as
         generated_image_output with source_tool='image_generator' and sort_order=1 so the direct
         still is visible in Result.
      6. ZERO-IMAGE FAILURE CONTRACT: if a configured image model raises an error or returns no
         local_path/image_url and no base image was successfully produced, stop with an execution
         error that preserves the model/tool name and its concrete error message. Save no fake
         path, status text, or placeholder image. generated_base_image is a required output, so
         Workflow Runtime must mark this attempt failed and Chat must tell the user why no image
         was produced. For a pack with some successes, save successful bases and report failed
         item indexes exactly.
      7. After saving at least one generated_base_image, call select_image_postprocess_route
         exactly once with the exact workflow_routing text. It returns __end__ only for ordinary
         still routes; all edit, animation, GIF, meme, and caption routes go to enhance_image.
    tools:
      - image_generator
      - select_image_postprocess_route
    terminal_tools:
      - select_image_postprocess_route
    inputs:
      - material: prompt_used
        required: true
      - material: workflow_routing
        required: true
      - material: meme_generation_plan
        required: false
      - material: raw_source_image
        required: false
      - material: image_output
        required: false
      - material: material_images
        required: false
    outputs:
      - material: generated_base_image
        required: true
      - material: generated_image_output
        required: false
      - material: generated_first_frame
        required: false
      - material: generated_last_frame
        required: false
      - material: generation_reference_images
        required: false
    acceptance_criteria: |
      At least one valid generated_base_image from this attempt is mandatory. Ordinary still
      routes also save generated_image_output and end. Animated routes save every real first frame
      to generated_first_frame, save only explicitly requested/designated tails to
      generated_last_frame, and expose all real uploaded/collected references through
      generation_reference_images. Every existing-source route stages the
      source without editing; text-free base creation for meme/animation routes uses only
      image_generator when declared by REQUIRES. No image edit, video, GIF, or caption tool may
      run here. A model error with zero
      base images is a failed step, never a successful empty result, and the concrete failure
      reason must remain available for Chat. select_image_postprocess_route owns the next branch.

  enhance_image:
    label: Enhance Image
    prompt: |
      You are the optional post-generation media agent. Consume only the concrete base images
      produced by generate_image. Depending on WORKFLOW, perform an edit, create video/GIF, or
      add exact deterministic subtitles. Never create a fresh base image in this step.

      Generated/staged base images:
      {{generated_base_image}}

      Generated/staged first frames (optional):
      {{generated_first_frame}}

      Generated/staged last frames (optional):
      {{generated_last_frame}}

      Shared generation references (optional):
      {{generation_reference_images}}

      Original user request:
      {{user_input}}

      Edit / style instruction:
      {{prompt_used}}

      Structured meme plan:
      {{meme_generation_plan}}

      Workflow routing (internal):
      {{workflow_routing}}

      {{runtime_instruction}}

      Your task:
      1. Validate route, plan, and base count before paid calls. The Host already completed the
         deterministic post-analysis capability check.
         If no base is available, fail immediately; never fall back to raw uploads, web materials, or generation.
         For CREATE_ANIMATED / ANIMATE_UPLOAD, base count must equal COUNT from prompt_used.
      2. Prepare the image consumed by the route's final postprocessor:
         - FIND_AND_EDIT / EDIT_UPLOAD: call image_editor once per selected base with prompt_used.
           It must retain the exact clause labels Requested edit:, Edit scope:, Preserve:, and
           Do not:. Follow the user literally, change the smallest possible target, preserve every
           unrequested region, identity, object, background, layout, crop, lighting, text/logo and
           resolution. Always leave ambiguity unchanged. Save only returned paths to
           enhanced_image_output; those edited paths are the final output for these routes.
         - Meme/caption routes whose REQUIRES contains image_editor: call image_editor once per
           base/item with the matching item.image_prompt. Preserve the source identity, background,
           layout, crop, lighting and all unrequested content. Keep the returned path only as the
           prepared input for the caption/video operation; do not expose an uncaptioned intermediate.
         - All other routes: use generated_base_image unchanged as the prepared input.
      3. CREATE_STATIC_MEME and static CREATE_MEME_PACK: Call meme_add_caption once per base/item,
         using the prepared image plus exact caption, caption_box and caption_style fields. Omit
         font_path. Save only captioned paths to meme_static_output in item order.
         Final-save rule: never expose the uncaptioned base as the final meme or an uncaptioned intermediate edit.
      4. CREATE_ANIMATED / ANIMATE_UPLOAD / CREATE_ANIMATED_MEME and animated CREATE_MEME_PACK:
         A. Emit N video_generator calls (up to 3 concurrent), one for each prepared image/item,
            using the matching motion_prompt or MOTION_PROMPT. Choose exactly one Seedance task
            mode per call (the API does not mix frame roles with reference-image mode):
            - Frame mode, when matching generated_first_frame exists: pass
              first_frame_url=<first>, optional last_frame_url=<last>, omit reference_urls, and
              use ratio='adaptive'.
            - Reference mode, when no generated_first_frame exists: omit both frame arguments,
              pass reference_urls=<all generation_reference_images>, and use ratio='1:1'.
            Use resolution='480p', duration=5. Do not place any of these paths in legacy urls.
            The tool maps the explicit arguments to Seedance first_frame, last_frame, and
            reference_image content roles.
         B. Emit video_to_gif for every successful video with fps=24,width=360.
         C. For meme routes, call meme_add_caption on each GIF with the matching exact caption,
            box and style; legacy generic animation keeps the converted GIF uncaptioned.
         D. Save video_output and successful gif_output sequentially in item order. Never put a
            GIF into image_output, generated_base_image, or enhanced_image_output. A failed GIF
            conversion may keep video_output as a clearly reported fallback.
      5. Omit sort_order on first full list saves; use sort_order=k only for partial replacement.
         Save only actual local_path/image_url results. If every post-processing call fails, save
         no enhancement_status and return the concrete tool/model failure so Runtime marks the
         required output missing and Chat explains the failure. Zero final outputs can never be
         reported as success.
      6. After at least one route-appropriate final output is saved, save enhancement_status in
         the same save_artifacts call as the last output (or immediately afterward) with:
           {'status':'completed','workflow':<route>,'successful_items':<count>,
            'failed_items':<exact indexes>}
         Never save completion status without a real final output.
    tools:
      - image_editor
      - video_generator
      - video_to_gif
      - meme_add_caption
    inputs:
      - material: generated_base_image
        required: true
      - material: generated_first_frame
        required: false
      - material: generated_last_frame
        required: false
      - material: generation_reference_images
        required: false
      - material: prompt_used
        required: true
      - material: workflow_routing
        required: true
      - material: meme_generation_plan
        required: false
    outputs:
      - material: enhancement_status
        required: true
      - material: enhanced_image_output
        required: false
      - material: meme_static_output
        required: false
      - material: gif_output
        required: false
      - material: video_output
        required: false
    acceptance_criteria: |
      A route-appropriate final media artifact and enhancement_status are both required. Edit
      routes save enhanced_image_output with the four-clause narrow edit contract. Meme visual
      edits also happen here, before their final caption/video operation. Static caption routes
      save meme_static_output made by meme_add_caption. Animated routes save gif_output
      when conversion succeeds and may additionally save video_output; meme GIFs are captioned.
      Each animated output keeps the same sort_order as its first/base frame so the composite UI
      renders one page per item with input on the left and GIF/video on the right.
      Every output must derive from generated_base_image. A zero-output tool/model failure is not
      acceptable and must preserve its concrete cause for Chat instead of saving a placeholder.
