id: image-workflow
name: AI Image Generation
description: >
  Generate, find, or edit images from natural language descriptions, and create
  static memes, animated GIF stickers, and multi-item meme packs. After analysis,
  a deterministic capability gate checks only the image/video models and FFmpeg
  needed by the selected behavior without launching another SubAgent. Existing-source edits
  and source-backed single static memes go directly from optimize_prompt to enhance_image.
  Other routes create or stage a concrete text-free base image in generate_image. The optional enhance_image
  step consumes that base for source edits, video/GIF generation, or deterministic
  caption layout; ordinary still generation skips enhancement. External material
  collection remains optional and runs only when the request truly depends on an
  upload, KB, explicit search, or identifiable reference.

when_to_use: >
  Trigger this workflow ONLY when the user's image request is COMPLEX and needs
  multi-step workflow support — e.g. knowledge-base style (kb_search), web/image
  search first then generate or edit, find-and-modify ("找一张XX再改成YY"),
  reference-based generation, uploaded-image editing with detailed instructions,
  static or animated meme/reaction/sticker creation, a multi-item meme pack,
  animated GIF / 动图 (text-to-video then GIF, or animate an uploaded image),
  or a rich multi-constraint description that benefits from analyze + deterministic capability check →
  optional collect → optimize → generate base → optional enhance.
  Examples that SHOULD trigger: "根据知识库中的风格画一张产品图",
  "先搜几张赛博朋克参考图再画一张类似的", "找哈兰德照片然后加上王老吉字样",
  "做一张收到的静态表情包", "给我生成一个动态表情包", "给我做一套聊天表情包",
  "给我生成三个动态表情包", "把这张图做成动态表情包", "做成动图 GIF",
  "给上传的小狗做敬礼手势，然后配上字幕‘收到!’",
  "启动绘图插件", "打开图片生成插件".
  HIGHEST-PRIORITY TEXT-OVERLAY RULE: ALWAYS trigger this workflow when a static-image
  request requires exact literal post-layout display text, a caption/subtitle/label,
  or caption layout attributes such as position, font color, outline/stroke, or size.
  This rule applies even when the request is otherwise a simple one-shot still and even
  when the user never says meme/表情包, uploads/searches a source, or also asks for a visual
  edit. The image model performs only the text-free visual generation/edit; exact captions
  require the deterministic meme_add_caption postprocessor afterward. Do not send the
  caption text to built-in image_generator/image_editor directly. Text explicitly integrated
  into a physical object or scene (shirt print, sign, engraving, tattoo) remains an image edit.
  Do NOT trigger for SIMPLE one-shot still-image requests. If the user uses casual
  short phrasing such as "直接", "给我", "随便画", "画个猫", "帮我生成一张图"
  without KB/search/edit/animated/complex constraints AND without exact display text or
  text-layout requirements, prefer the built-in image_generator / image_editor tools.
  Do NOT call video_generator / video_to_gif directly for 动态表情包 — use this
  workflow so analyze/check → generate base → enhance
  (video→GIF) runs end-to-end.
  ASK/CLARIFICATION RULE: before triggering, ask only whether essential request
  information is complete. If subject, requested change/action, and final delivery
  are already clear, trigger immediately. Ask only for truly blocking missing facts;
  never use the Ask card to present a plan, workflow analysis, or optional creative
  suggestions.
  Do NOT trigger if image generation is merely one sub-step within a larger
  multi-step task (e.g. "write a report and add an image"). Do NOT trigger
  for text content, quizzes, reports, summaries, or any non-visual task.

runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      analyze_subject:
        prompt: Read scenario/external.md and its analyze_subject step contract from this pinned package. Complete Analyze
          Subject using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - subject_analysis
        - workflow_routing
        acceptance_criteria:
        - 'subject_analysis must be saved (50+ words), user-facing natural language only —

          no WORKFLOW:/NEXT_STEPS:/SKIP_STEPS: lines or step-id lists.

          workflow_routing must be saved with WORKFLOW, REQUIRES, NEXT_STEPS, and SKIP_STEPS lines.

          REQUIRES must name only the media dependencies this exact behavior will call.

          NEXT_STEPS must include collect_materials only when external/uploaded/KB/reference material

          is genuinely required. A self-contained text-only request should skip collect_materials and

          continue directly to optimize_prompt.

          An explicit find/search-then-edit request must use WORKFLOW: FIND_AND_EDIT, include

          collect_materials,optimize_prompt,enhance_image, skip generate_image, and save

          edit_route=edit.

          Exception: when the static final result explicitly asks for a post-caption/subtitle,

          including a source visual edit plus caption, it must use WORKFLOW: CREATE_STATIC_MEME,

          skip generate_image when REQUIRES omits image_generator, and must not save edit_route. Text explicitly integrated

          into a physical object/scene remains FIND_AND_EDIT or EDIT_UPLOAD.

          Do NOT call kb_search/web_search/image_search_tool/image_search_and_validate in this step.

          Do NOT save material_images, raw_source_image, image_output, prompt_used, or material_summary in this step.'
      collect_materials:
        prompt: Read scenario/external.md and its collect_materials step contract from this pinned package. Complete Collect
          Reference Materials using the bound evidence and the domain rules above. Generate and validate with your own
          host capabilities; return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: knowledge_list_documents
          source: package
        - name: knowledge_read_document
          source: package
        required_outputs:
        - material_summary
        acceptance_criteria:
        - 'The step must never use find_artifact/get_artifact/list_artifacts to locate user uploads.

          Uploaded files must be resolved through find_user_attachment only.

          If the current request has uploaded images, only those uploads may be saved as

          material_images; saving at least one resolved upload is mandatory, even on routes where

          this slot is normally optional. A summary without the uploaded image is not success.

          No knowledge-base or web image search may be performed or appended.

          For uploaded edit workflows, the first upload must also be raw_source_image.

          For uploaded animated workflows, the first upload must also be image_output.

          For CREATE_NEW: material_images are optional (0–3) when the text request is sufficient.

          For KB_STYLE: material_summary must preserve the useful KB style findings; material_images

          are optional (0–3). Sufficient text-only KB results must not trigger web/image search solely

          because they contain no image.

          For REFERENCE_GENERATE: 1–3 validated material_images should be saved (never more than 3).

          For CREATE_ANIMATED: if the user asked to find a photo first, 1–3 material_images and

          one image_output must be saved; otherwise material_images optional (0–3).

          material_summary should still be saved.

          For FIND_AND_EDIT: 1–3 material_images and one raw_source_image must be saved (never more than 3 images).

          For EDIT_UPLOAD: both material_images and raw_source_image must be saved from the user upload

          (same path/URL).

          For ANIMATE_UPLOAD: both material_images and image_output must be saved from the user upload

          (same path/URL, image_output sort_order=1).

          For CREATE_STATIC_MEME: material_images are optional character/style references (0–3).

          For CREATE_ANIMATED_MEME: material_images are optional; an uploaded or searched character

          reference must also be saved as image_output.

          For CREATE_MEME_PACK: save at most 3 shared character/style references; do not search for

          a separate source image for every state.

          material_summary should be saved with a concise description of search results and image selection.

          optimize_prompt writes prompt_used in the next step.'
      optimize_prompt:
        prompt: Read scenario/external.md and its optimize_prompt step contract from this pinned package. Complete Optimize
          Prompt using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools: []
        required_outputs:
        - prompt_used
        acceptance_criteria:
        - 'prompt_used artifact must be saved in English.

          For generation workflows: at least 30 words, suitable for image_generator.

          Generation prompts must lead with canvas/use and composition, specify concrete subject and

          scene details, keep one coherent medium/capture grammar, and control materials, lighting,

          and palette separately. Empty quality-keyword stacks do not satisfy this criterion.

          For edit workflows (FIND_AND_EDIT / EDIT_UPLOAD): a clear image_editor instruction containing

          Requested edit, Edit scope, Preserve, and Do not clauses. It must faithfully reflect the user

          request, select the smallest sufficient edit scope, and forbid unrequested collateral changes.

          For animated workflows (CREATE_ANIMATED / ANIMATE_UPLOAD): the exact FIRST_FRAME_PROMPT,

          LAST_FRAME_PROMPT, MOTION_PROMPT contract plus COUNT in 1–10; LAST_FRAME_PROMPT is none

          unless explicitly needed.

          For CREATE_STATIC_MEME / CREATE_ANIMATED_MEME / CREATE_MEME_PACK, meme_generation_plan

          must be saved with schema_version, mode, delivery, count, and exactly count distinct items.

          Every item must contain caption, caption_box, caption_style, communication_task,

          image_prompt, last_frame_prompt, and motion_prompt. caption_style must contain valid text_color, stroke_color,

          and stroke_width_ratio fields selected by the LLM. Meme media prompts must prohibit

          model-rendered text; caption_box defaults to [0.15, 0.75, 0.85, 0.93] unless the user

          requests another placement.

          A static request such as "给这个小狗做敬礼手势，然后配上字幕‘收到!’" must produce a

          CREATE_STATIC_MEME plan whose image_prompt contains only the salute-pose edit and whose

          caption is exactly "收到!"; the caption text must not be delegated to image_editor.

          select_image_route owns control.next_step after all required artifacts are saved.

          Direct-source routes proceed to enhance_image; other routes proceed to generate_image.'
      generate_image:
        prompt: Read scenario/external.md and its generate_image step contract from this pinned package. Complete Generate
          Image using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_generator
          source: global
        required_outputs:
        - generated_base_image
        acceptance_criteria:
        - 'At least one valid generated_base_image from this attempt is mandatory. Ordinary still

          routes also save generated_image_output and end. Animated routes save every real first frame

          to generated_first_frame, save only explicitly requested/designated tails to

          generated_last_frame, and expose all real uploaded/collected references through

          generation_reference_images. Every existing-source route stages the

          source without editing; text-free base creation for meme/animation routes uses only

          image_generator when declared by REQUIRES. No image edit, video, GIF, or caption tool may

          run here. A model error with zero

          base images is a failed step, never a successful empty result, and the concrete failure

          reason must remain available for Chat. select_image_postprocess_route owns the next branch.'
      enhance_image:
        prompt: Read scenario/external.md and its enhance_image step contract from this pinned package. Complete Enhance
          Image using the bound evidence and the domain rules above. Generate and validate with your own host capabilities;
          return the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: image_editor
          source: global
        required_outputs:
        - enhancement_status
        acceptance_criteria:
        - 'A route-appropriate final media artifact and enhancement_status are both required. Edit

          routes save enhanced_image_output with the four-clause narrow edit contract. Meme visual

          edits also happen here, before their final caption/video operation. Static caption routes

          save meme_static_output made by meme_add_caption. Animated routes save gif_output

          when conversion succeeds and may additionally save video_output; meme GIFs are captioned.

          Each animated output keeps the same sort_order as its first/base frame so the composite UI

          renders one page per item with input on the left and GIF/video on the right.

          Every output must derive from the authoritative source on direct-source routes, or from

          generated_base_image on other routes. A zero-output tool/model failure is not

          acceptable and must preserve its concrete cause for Chat instead of saving a placeholder.'
  clarification_fields:
    - id: image_goal
      label: 图片主体或修改要求
      question: 想生成什么图片，或对原图做什么修改？
      reason: 需要明确主体或修改要求才能生成符合预期的图片。
      required: true
      type: text
      validation: {min_length: 1, max_length: 4000, example: '例如：一只在窗边晒太阳的橘猫，水彩风格'}
    - id: image_count
      label: 数量
      question: 希望生成多少张？
      type: text
      reason: 未指定时沿用当前路由规则：单项通常为 1，表情包合集为 3。
      patterns: ['([0-9]+)\s*(?:张|个)(?:图片|图|表情包|动图)']
      validation: {format: positive_integer, min: 1, example: '例如：3'}
    - id: caption
      label: 文案
      question: 图片上需要显示什么文字？
      type: text
      reason: 普通图片不额外添加文字，表情包沿用当前文案规划。
  post_step_checks:
    - step_id: analyze_subject
      tool: check_image_workflow_capabilities
      arguments:
        workflow_routing: workflow_routing

tool_scripts:
  - path: scripts/tools.py
    functions:
      - image_search_and_validate
      - image_search_tool
      - validate_image_ref
      - meme_add_caption
      - select_image_material_route
      - select_image_route
      - select_image_postprocess_route
      - check_image_workflow_capabilities

steps:
  - id: analyze_subject
    label: Analyze Subject

  - id: collect_materials
    label: Collect Materials

  - id: optimize_prompt
    label: Optimize Prompt

  - id: generate_image
    label: Generate Image

  - id: enhance_image
    label: Enhance Image

slots:
  - id: subject_analysis
    user_visible: true
    label: Subject Analysis
    type: text
    cardinality: single
    summary_max_chars: 300

  - id: workflow_routing
    user_visible: false
    label: Workflow Routing
    type: text
    cardinality: single
    summary_max_chars: 200

  - id: edit_route
    user_visible: false
    label: Edit Route Token
    type: text
    cardinality: single

  - id: material_images
    user_visible: false
    label: Reference Materials
    type: image
    cardinality: list
    ordered: true

  - id: material_summary
    user_visible: true
    label: Material Summary
    type: text
    cardinality: single
    summary_max_chars: 400

  - id: prompt_used
    user_visible: true
    label: Optimized Prompt
    type: text
    cardinality: single

  - id: meme_generation_plan
    user_visible: false
    label: Meme Generation Plan
    type: json
    cardinality: single

  - id: enhanced_image_output
    user_visible: true
    label: Enhanced Images
    type: image
    cardinality: list
    ordered: true

  - id: raw_source_image
    user_visible: false
    label: Raw Source Image
    type: image
    cardinality: single

  - id: generated_image_output
    user_visible: true
    label: Generated Image
    type: image
    cardinality: list
    ordered: true

  - id: generated_base_image
    user_visible: true
    label: Generated Base Image
    type: image
    cardinality: list
    ordered: true
    exposed: true

  - id: generated_first_frame
    user_visible: false
    label: Generated First Frame
    type: image
    cardinality: list
    ordered: true

  - id: generated_last_frame
    user_visible: false
    label: Generated Last Frame
    type: image
    cardinality: list
    ordered: true

  - id: generation_reference_images
    user_visible: false
    label: Generation References
    type: image
    cardinality: list
    ordered: true

  - id: enhancement_status
    user_visible: true
    label: Enhancement Status
    type: json
    cardinality: single
    exposed: true

  - id: meme_static_output
    user_visible: true
    label: Static Meme
    type: image
    cardinality: list
    ordered: true

  - id: image_output
    user_visible: true
    label: Origin Image
    type: image
    cardinality: list
    ordered: true

  - id: gif_output
    user_visible: true
    label: Animated GIF
    type: image
    cardinality: list
    ordered: true

  - id: video_output
    user_visible: true
    label: Generated Video
    type: file
    cardinality: list
    ordered: true

ui:
  follow_mode:
    default: following
  tabs:
    - id: analyze_subject
      label: Analysis
      layout: list
      slots:
        - id: subject_analysis

    - id: collect_materials
      label: Materials
      layout: grid
      slots:
        - id: material_images
        - id: material_summary
        - id: raw_source_image
        - id: image_output
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: optimize_prompt
      label: Prompt
      layout: list
      slots:
        - id: prompt_used
        - id: meme_generation_plan

    - id: generate_image
      label: Generate Image
      layout: composite
      composite_tab_position: left
      slots:
        - id: generated_image_output
        - id: generated_base_image
        - id: generated_first_frame
        - id: generated_last_frame
        - id: generation_reference_images
      composite_layout:
        direction: row
        children:
          - slot: generated_image_output
          - slot: generated_base_image
          - slot: generated_first_frame
          - slot: generated_last_frame
          - slot: generation_reference_images
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected

    - id: enhance_image
      label: Enhance Image
      layout: composite
      slot_scope: selected
      composite_tab_position: left
      slots:
        - {id: enhancement_status}
        - id: generated_first_frame
        - id: generated_last_frame
        - id: material_images
        - id: meme_static_output
        - id: gif_output
        - id: enhanced_image_output
        - id: video_output
      composite_layout:
        direction: row
        children:
          - {slot: enhancement_status}
          - weight: 1
            slot: generated_first_frame
          - weight: 1
            slot: generated_last_frame
          - weight: 1
            slot: material_images
          - weight: 1
            slot: video_output
          - weight: 1
            slot: gif_output
          - weight: 1
            slot: meme_static_output
          - weight: 1
            slot: enhanced_image_output
      composite_behavior:
        hide_empty_columns: true
        empty_column_scope: selected
        repeat_single_slots:
          - generated_first_frame
          - generated_last_frame
          - material_images
        mutually_exclusive:
          - slots:
              - generated_first_frame
              - generated_last_frame
              - material_images
            prefer:
              - generated_first_frame
              - material_images
              - generated_last_frame
          - slots:
              - gif_output
              - video_output
              - meme_static_output
              - enhanced_image_output
            prefer:
              - gif_output
              - video_output
              - meme_static_output
              - enhanced_image_output

