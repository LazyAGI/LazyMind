  - {id: stage_chain, label: 目标阶段链, type: text, cardinality: single, external: true, exposed: false}
  - {id: execution_depth, label: 当前阶段执行深度, type: text, cardinality: single, external: true, exposed: false}
  - {id: word_target, label: 文本目标篇幅, type: text, cardinality: single, external: true, exposed: false}
  - {id: reference_sample_choice, label: 参照样例选择, type: text, cardinality: single, external: true, exposed: false}
  - {id: reference_sample, label: 参照样例或模板, type: file, cardinality: single, external: true, exposed: false}
  - {id: product_materials, label: 产品输入材料, type: file, cardinality: list, external: true, exposed: false}

