id: product_solution_delivery
name: 产品方案与交付
description: >
  基于 product-solution-delivery Skill 的内置产品工作流。启动前由聊天入口补齐产品目标、
  阶段链、执行深度、文本篇幅和样例选择，再将规范参数传入可裁剪的七阶段执行链。既可只
  运行产品方向、竞品与生态位、产品方案、PRD、交互原型、方案评审或
  研发交付中的一个阶段，也可运行任意合法局部链或经用户明确授权的全量链。文本阶段复用
  LazyMind Writer 完成可编辑大纲、分章流式写作、正文审批和选区 AI 润色；资料阶段复用
  当前会话已选知识库和网页检索；竞品报告与原型交付为可预览的自包含 HTML。

when_to_use: >
  当用户希望梳理产品方向、分析竞品与生态位、设计产品机制/流程/UI、编写 PRD、制作交互
  原型、评审既有产品产物、准备研发交付，或明确要求从某阶段连续做到另一阶段时使用。
  用户点名单一阶段时只运行该阶段；明确说“连续”“从 X 到 Y”“同时生成”时选择最短合法
  阶段链；只有明确说“全流程”“七阶段”或“从零做到研发交付”时才运行全量链。调用 Workflow
  前必须确认并绑定：产品目标、规范英文阶段链（direction/competitive/design/prd/prototype/
  review/handoff）、执行深度（light/minimum-fill/full）；阶段链含文本产物时还必须确认每份
  文本目标字数，以及已提供样例或明确使用默认结构。纯竞品/原型链把字数绑定为
  not-applicable、样例绑定为 not-required。用户已经明确的值直接使用；缺少时调用 ask_user
  展示启动前交互卡：产品目标用文本题；范围用“产品方向/竞品与生态位/产品方案/PRD/交互原型/
  方案评审/研发交付/七阶段全流程/自定义连续阶段”；深度用“轻量/最小补齐/完整”；文本链再问
  每份目标字数和“已提供样例/使用默认结构”。选择已提供样例时必须绑定对应附件。尽量在一张
  卡片中一次问齐，不得先触发 Workflow 再创建“意图识别/询问参数”节点。缺少必要上游材料时
  先请求材料，除非该材料会由本次链的前序阶段生成，或用户明确授权生成标注缺口的草稿。
  不得用于单独市场
  规模测算、路线图排序、技术架构、发布运维、数据分析方案或营销文案。

runtime:
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  clarification_fields:
    - {id: product_goal, label: 产品目标, question: 请说明本次要解决的产品问题和目标用户。, type: text}
    - id: stage_chain
      label: 执行范围
      question: 请选择要执行的阶段或连续阶段。
      type: single
      choices: [产品方向, 竞品与生态位, 产品方案, PRD, 交互原型, 方案评审, 研发交付, 七阶段全流程]
    - id: execution_depth
      label: 执行深度
      question: 请选择执行深度。
      type: single
      choices: [light, minimum-fill, full]
    - {id: word_target, label: 文本篇幅, question: 请确认每份文本产物的目标字数；纯竞品或原型任务可答 not-applicable。, type: text}
    - id: reference_sample_choice
      label: 参照样例
      question: 请确认是使用已提供样例，还是使用默认结构。
      type: single
      choices: [已提供, 使用默认结构, not-required]

tool_scripts:
  - path: scripts/tools.py
    functions:
      - load_product_skill_contract
      - load_product_stage_inputs
      - normalize_product_parameters
      - write_product_artifact_file
  - path: scripts/writer_bridge.py
    functions:
      - profile_product_materials
      - product_writer_generate_outline_from_inputs
      - product_writer_generate_document_from_inputs
      - product_writer_revise_markdown
      - product_writer_preview_selection_rewrite

artifact_actions:
  rewrite_selection:
    slots:
      - direction_outline
      - direction_document
      - design_outline
      - design_document
      - prd_outline
      - prd_document
      - review_outline
      - review_document
      - handoff_outline
      - handoff_document
    preview_tool: product_writer_preview_selection_rewrite

steps:
  - {id: retrieve_product_evidence, label: 资料与知识库检索}
  - {id: build_direction_outline, label: 产品方向大纲}
  - {id: write_direction_document, label: 产品方向文档}
  - {id: analyze_competitive_position, label: 竞品与生态位}
  - {id: build_design_outline, label: 产品方案大纲}
  - {id: write_design_document, label: 产品方案文档}
  - {id: build_prd_outline, label: PRD 大纲}
  - {id: write_prd_document, label: PRD 文档}
  - {id: build_interactive_prototype, label: 交互原型}
  - {id: build_review_outline, label: 方案评审大纲}
  - {id: write_review_document, label: 方案评审报告}
  - {id: build_handoff_outline, label: 研发交付大纲}
  - {id: write_handoff_document, label: 研发交付文档}
  - {id: finalize_product_delivery, label: 交付总结}

