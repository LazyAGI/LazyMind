  - {id: skip_prd, label: 跳过 PRD, type: text, cardinality: single, exposed: false}
  - {id: skip_prototype, label: 跳过交互原型, type: text, cardinality: single, exposed: false}
  - {id: skip_review, label: 跳过方案评审, type: text, cardinality: single, exposed: false}
  - {id: skip_handoff, label: 跳过研发交付, type: text, cardinality: single, exposed: false}

