id: product_solution_delivery
name: 产品方案与交付
description: >
  两层 Router 产品工作流：父 Router 按显式阶段、确定性规则、模型推荐选择本轮唯一阶段；
  design 子 Router 按六领域和逐决定风险选择 light/heavy。七阶段在同一项目中交付同版本
  HTML 与 Markdown，文本阶段复用原生 Writer。跨阶段继续须经用户授权。

when_to_use: >
  用户需要产品方向、竞品与生态位、产品方案、PRD、交互原型、方案评审或研发交付时使用。
  首次 Ask user 明确产品目标后，尊重显式阶段或按已有材料选择最小入口；不强制从方向开始。
  已有同阶段正文直接修订，沿用同会话的材料、决定和精确上游版本。多阶段请求只登记计划，
  当前 Session 只执行 selected_stage；交付后等待继续或切换，不要求另开窗口或重复上传。
  深度默认 auto、篇幅按阶段、样例有则复用否则使用默认结构，用户可覆盖，不重复询问偏好。
  缺少事实保留草稿缺口，关键业务判断在当前窗口确认；不编造事实或批准。
  不用于单独市场规模、路线图排序、技术架构、发布运维、数据分析方案或营销文案。

runtime:
  transactional_outputs: true
  host_extensions: [product-project-v1]
  trigger_inputs: [product_goal, product_materials, requested_stage, execution_depth, word_target, reference_sample, reference_sample_choice]
  published_input_aliases: {workspace_seed: workspace_state}
  publication:
    step: finalize_product_delivery
    required_slots: [workspace_state, stage_manifest, delivery_summary]
  execution_limits:
    write_direction_document:
      rounds: 7
      timeout: 720
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "product_writer_revise_and_publish": 1, "product_writer_revise_markdown": 1, "product_writer_generate_document_from_inputs": 1}
    analyze_competitive_position:
      rounds: 7
      timeout: 600
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "write_product_artifact_bundle": 1}
    collect_design_light_evidence:
      rounds: 20
      timeout: 480
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "validate_product_stage_assessment": 2, "publish_design_heavy_evidence": 1, "publish_design_heavy_unavailable": 1}
    collect_design_heavy_evidence:
      rounds: 24
      timeout: 600
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "validate_product_stage_assessment": 2, "publish_design_heavy_evidence": 1, "publish_design_heavy_unavailable": 1}
    write_design_document:
      rounds: 7
      timeout: 720
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "product_writer_revise_and_publish": 1, "product_writer_revise_markdown": 1, "product_writer_generate_document_from_inputs": 1}
    write_prd_document:
      rounds: 7
      timeout: 720
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "product_writer_revise_and_publish": 1, "product_writer_revise_markdown": 1, "product_writer_generate_document_from_inputs": 1}
    build_interactive_prototype:
      rounds: 7
      timeout: 600
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "write_product_artifact_bundle": 1}
    write_review_document:
      rounds: 7
      timeout: 720
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "product_writer_revise_and_publish": 1, "product_writer_revise_markdown": 1, "product_writer_generate_document_from_inputs": 1}
    write_handoff_document:
      rounds: 7
      timeout: 720
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "publish_product_stage_assessment": 2, "product_writer_revise_and_publish": 1, "product_writer_revise_markdown": 1, "product_writer_generate_document_from_inputs": 1}
    finalize_product_delivery:
      rounds: 3
      timeout: 120
      tool_calls: {"load_product_skill_contract": 2, "load_product_stage_inputs": 2, "get_artifact": 3, "save_artifacts": 2, "validate_product_stage_assessment": 2, "publish_product_handoff_state": 1}
  exclusive_tool_capabilities: [writer.create, writer.revise]
  collects_knowledge: true
  # The parent Router's terminal publisher writes these slots as one validated unit. Business
  # stages keep their existing canonical publication paths and add one synchronized view slot.
  publisher_owned_slots:
    - direction_assessment
    - competitive_assessment
    - design_assessment
    - prd_assessment
    - prototype_assessment
    - review_assessment
    - handoff_assessment
    - reuse_product_structure
    - routing_record
    - execution_plan
    - routing_summary
    - hide_direction
    - hide_competitive
    - hide_design
    - hide_prd
    - hide_prototype
    - hide_review
    - hide_handoff
    - research_evidence
    - research_log
    - material_digest
    - resource_profiles
    - design_routing_record
    - design_effort_route
    - design_routing_summary
    - design_heavy_evidence
    - delivery_summary
    - stage_manifest
    - workspace_state
    - direction_task
    - direction_context
    - direction_outline
    - direction_outline_report
    - direction_context_approved
    - direction_document
    - direction_document_html
    - direction_context_final
    - direction_section_plan
    - design_task
    - design_context
    - design_outline
    - design_outline_report
    - design_context_approved
    - design_document
    - design_document_html
    - design_context_final
    - design_section_plan
    - prd_task
    - prd_context
    - prd_outline
    - prd_outline_report
    - prd_context_approved
    - prd_document
    - prd_document_html
    - prd_context_final
    - prd_section_plan
    - review_task
    - review_context
    - review_outline
    - review_outline_report
    - review_context_approved
    - review_document
    - review_document_html
    - review_context_final
    - review_section_plan
    - handoff_task
    - handoff_context
    - handoff_outline
    - handoff_outline_report
    - handoff_context_approved
    - handoff_document
    - handoff_document_html
    - handoff_context_final
    - handoff_section_plan
  clarification_fields:
    - id: product_goal
      label: 产品目标
      question: 你想解决什么产品问题，主要给谁使用？
      type: text
      binding: request_context

tool_scripts:
  - path: scripts/tools.py
    functions:
      - load_product_skill_contract
      - load_product_stage_inputs
      - validate_product_route
      - publish_product_route
      - validate_design_route
      - publish_design_route
      - publish_design_route_compact
      - publish_design_heavy_evidence
      - publish_design_heavy_unavailable
      - build_product_handoff_state
      - publish_product_handoff_state
      - validate_product_stage_assessment
      - publish_product_stage_assessment
      - validate_design_escalation
      - normalize_product_parameters
      - write_product_artifact_file
      - write_product_artifact_bundle
  - path: scripts/writer_bridge.py
    functions:
      - profile_product_materials
      - product_writer_generate_outline_from_inputs
      - product_writer_generate_document_from_inputs
      - product_writer_revise_and_publish

artifact_actions:
  rewrite_selection:
    slots:
      - direction_outline
      - direction_document
      - design_outline
      - design_document
      - prd_outline
      - prd_document
      - review_outline
      - review_document
      - handoff_outline
      - handoff_document
    preview_tool: builtin:document.rewrite_selection.v1
    execute_tool: builtin:document.rewrite_selection.v1

