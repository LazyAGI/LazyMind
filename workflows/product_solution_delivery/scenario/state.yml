  build_interactive_prototype:
    label: 交互原型生成
    mode: human
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="prototype") once, then call
      load_product_stage_inputs(stage_id="prototype") once. Use the returned material_digest and
      available approved design_document/prd_document contents; never read bound paths with generic
      file or artifact tools. Also read the returned upstream_design/upstream_prd content as the
      shared project's bound source versions. When upstream_prototype exists, it is this project's
      prior prototype: preserve unaffected interactions and apply stage_approval.request_context
      without starting a different project or asking the user to upload that prototype again.
      Selecting a source does not itself mean it has been accepted. Conflicts or missing core behavior
      must remain visible rather than being silently decided. Build a self-contained HTML/CSS/JS
      prototype with a stated fidelity level, main path, meaningful interaction, and relevant empty,
      loading, success, failure, validation, permission and recovery states.
      Preserve the prototype contract and existing information structure. Within the prototype,
      use a compact page-flow overview and a key-state gallery only when they clarify the actual
      task; reuse real bound project images when available, and never invent screenshots, dates,
      metrics or decorative visuals. The interactive screens remain the primary artifact.
      All user-visible text must be natural Chinese product copy. Do not display workflow step names,
      artifact fields, English status values, evidence grades, source-system notation or internal
      decision IDs. Explain uncertainty as “待确认” beside the affected interaction; put prototype
      fidelity, assumptions and test limits in one collapsed “原型说明” area, separate from the main
      user journey. Necessary product or engineering terms must have a short Chinese explanation.
      Produce two synchronized representations of one prototype result. The self-contained HTML is
      the default interactive experience. The Markdown companion documents the same screen list,
      main/exception flows, states, rules, assumptions, limitations and review tasks. Use GFM tables
      and fenced Mermaid flow/state/sequence diagrams in Markdown; use interactive screens plus
      accessible inline SVG/HTML flow and state visuals in HTML. Only use real bound images. Call
      write_product_artifact_bundle(html_filename="prototype.html",
      markdown_filename="prototype.md", validate_as="prototype") once with both complete bodies.
      Save html_path verbatim as prototype and markdown_path verbatim as prototype_markdown, both
      with content_type="file"; never save or repeat source bodies as file values. Preserve uncertain
      behavior as a visible limitation. Publish the assessment before stopping for approval.
      Do not claim production readiness or browser visual QA that did not occur.
      After saving both documents, call publish_product_stage_assessment(stage="prototype",
      status="draft" or "reviewable", checks=evidence-backed checks, decisions=proposed decisions,
      open_questions=remaining gaps). Pass fields directly, not inside value. It validates and saves
      prototype_assessment together. Stop after success; keep assessment and runtime trace internal.
      Each checks entry is {"status":"passed|failed|not-checked", "evidence":"source/location"}.
      Omit implementation_readiness; this stage does not assess readiness for implementation.
    tools: *html_stage_tools
    terminal_tools: *assessment_publishers
    inputs:
      - {material: execution_plan, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: prototype_assessment}
      - {material: prototype}
      - {material: prototype_markdown}
    acceptance_criteria: The synchronized HTML and Markdown map to approved upstream rules, expose the same key states and limits, and use plain Chinese product copy without workflow jargon.

