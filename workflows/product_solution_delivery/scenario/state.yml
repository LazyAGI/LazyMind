initial: __start__

transitions:
  __start__: [{to: route_product_stage}]
  route_product_stage:
    - {to: build_direction_outline, when: 父 Router 的 selected_stage 是 direction}
    - {to: analyze_competitive_position, when: 父 Router 的 selected_stage 是 competitive}
    - {to: route_design_scope, when: 父 Router 的 selected_stage 是 design}
    - {to: build_prd_outline, when: 父 Router 的 selected_stage 是 prd}
    - {to: build_interactive_prototype, when: 父 Router 的 selected_stage 是 prototype}
    - {to: build_review_outline, when: 父 Router 的 selected_stage 是 review}
    - {to: build_handoff_outline, when: 父 Router 的 selected_stage 是 handoff}
  build_direction_outline: [{to: write_direction_document}]
  write_direction_document: [{to: finalize_product_delivery}]
  analyze_competitive_position: [{to: finalize_product_delivery}]
  route_design_scope:
    - {to: collect_design_light_evidence, when: 第二层 Router 的 overall_effort 是 light}
    - {to: collect_design_heavy_evidence, when: 第二层 Router 的 overall_effort 是 heavy}
  collect_design_light_evidence: [{to: build_design_outline}]
  collect_design_heavy_evidence: [{to: build_design_outline}]
  build_design_outline: [{to: write_design_document}]
  write_design_document: [{to: finalize_product_delivery}]
  build_prd_outline: [{to: write_prd_document}]
  write_prd_document: [{to: finalize_product_delivery}]
  build_interactive_prototype: [{to: finalize_product_delivery}]
  build_review_outline: [{to: write_review_document}]
  write_review_document: [{to: finalize_product_delivery}]
  build_handoff_outline: [{to: write_handoff_document}]
  write_handoff_document: [{to: finalize_product_delivery}]
  finalize_product_delivery: [{to: __end__}]

steps:
  route_product_stage:
    route: choice
    label: 产品阶段 Router
    mode: auto
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="router") once. Apply its authoritative priority:
      explicit stage > deterministic rule > model recommendation. Route the original business request,
      not a later Continue/Confirm acknowledgement or the launcher description. "由 Router 判断" is
      not an explicit choice. Choose the smallest useful entry; a new project need not start at direction.
      Missing facts remain draft gaps, not a reason to run earlier stages. This Session executes only
      selected_stage; a shortest forward stage_chain is planning metadata and requires explicit authorization.
      Use selected_stage, route_source, route_reason, confidence (explicit/high/low), alternatives,
      stage_chain and stage_chain_authorized. The Host restores explicit intent from immutable bindings.
      For bound upstream_<selected_stage>, choose entry_action=revise_document and preserve its structure;
      use revise_outline only for an explicit structural change, otherwise create_document without a baseline.
      Reuse workspace_seed identity, exact selected versions, prior decisions and stage preferences.
      Use stage_approval.request_context as the latest change request and product_goal as the project goal.
      Do not request reuploads or new windows. Continue/document approval does not accept all proposals.
      Absent options use project defaults: auto depth, stage length, supplied reference sample or default
      structure. Do not ask the portable Skill's separate sample question or claim an upload occurred.
      The Router does no external retrieval. Call profile_product_materials once with a JSON array
      of actual bound file paths from upstream_*, product_materials and reference_sample; never slot labels,
      scalar values, embedded:// resources or read_user_attachment. When none exist, pass [] exactly.
      Preserve selected versions and fact/proposed/accepted labels. Pass its returned resource_profiles
      path unchanged to publish_product_route with the routing record and exact scalar inputs.
      Do not read or save the profiles yourself. With no file materials the publisher can also create an
      honest empty inventory if the path is omitted; never fabricate paths or successful searches.
      Omit absent optional scalars or use an empty string, never "default", "stage-specific" or placeholders.
      The terminal publisher validates and saves every Router output and returns control.next_step;
      other branches are pruned and UI hide markers are not routing. Repair all reported fields together
      and retry once if needed. After success stop, with no save_artifacts, recap or visible Skill receipt.
    tools: [load_product_skill_contract, publish_product_route, profile_product_materials]
    terminal_tools: [publish_product_route]
    inputs:
      - {material: product_goal, required: true}
      - {material: requested_stage, required: false}
      - {material: execution_depth, required: false}
      - {material: word_target, required: false}
      - {material: reference_sample_choice, required: false}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: reuse_product_structure, required: false}
      - {material: routing_record}
      - {material: execution_plan}
      - {material: routing_summary}
      - {material: hide_direction, required: false}
      - {material: hide_competitive, required: false}
      - {material: hide_design, required: false}
      - {material: hide_prd, required: false}
      - {material: hide_prototype, required: false}
      - {material: hide_review, required: false}
      - {material: hide_handoff, required: false}
      - {material: research_evidence}
      - {material: research_log}
      - {material: material_digest}
      - {material: resource_profiles}
    acceptance_criteria: |
      The parent routing record satisfies the source contract, exactly one business-stage edge is
      selected, the closed evidence handoff contains no invented retrieval, and user files are
      profiled exactly once.

  build_direction_outline:
    skip_if: {all: [{material: upstream_direction}, {material: reuse_product_structure}]}
    label: 产品方向大纲生成
    mode: auto
    rerun_when: 用户要求重新生成、调整或局部修改产品方向大纲。
    prompt: &writer_outline_prompt |
      {{runtime_instruction}}

      Call load_product_skill_contract() once without stage_id; its stage_id is S, resolved
      from the bound execution_plan. Follow that child contract and its listed packaged references;
      never pass embedded:// references to generic file tools.
      For first generation call product_writer_generate_outline_from_inputs(
      user_request="{{user_input}}", stage_id=S) once. The bridge resolves authoritative bound
      inputs, prepares context, validates the outline, and saves all five typed outputs.
      For an explicit outline revision call product_writer_revise_and_publish using the exact
      existing file/context paths, requested change and document_slot=S + "_outline".
      Preserve the user's latest Markdown and unaffected sections. Reuse an upstream same-stage
      baseline instead of recreating generic structure. For design, retain the approved scope and
      selected light/heavy evidence, including validated escalation and unresolved hard gates.
      The bridge publishes S_task, S_context, S_outline, S_outline_report and S_context_approved.
      These names mean the returned stage id plus the suffix. Never call save_artifacts,
      reconstruct paths, or pass JSON contents as a filename. Stop after successful publication;
      the Host controls subsequent execution.
    tools: &writer_outline_tools [load_product_skill_contract, product_writer_generate_outline_from_inputs, product_writer_revise_and_publish]
    terminal_tools: &outline_publishers [product_writer_generate_outline_from_inputs, product_writer_revise_and_publish]
    inputs: &writer_outline_inputs
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: resource_profiles, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: direction_task}
      - {material: direction_context}
      - {material: direction_outline}
      - {material: direction_outline_report}
      - {material: direction_context_approved}
    acceptance_criteria: One editable, structurally valid direction outline exists and is approved by the user.

  write_direction_document:
    label: 产品方向文档生成
    mode: human
    rerun_when: 用户要求修改、补充或局部重写产品方向文档。
    prompt: &writer_document_prompt |
      {{runtime_instruction}}

      Call load_product_skill_contract() once without stage_id; its stage_id is S, resolved
      from the bound execution_plan. Follow that child contract and shared presentation rules.
      Use S_outline when present; otherwise reuse upstream_S structure and revise its baseline.
      The S prefix means the returned stage id, not a literal slot name.
      For first generation call product_writer_generate_document_from_inputs(stage_id=S) once.
      For targeted revision call product_writer_revise_and_publish with exact existing file/context
      paths, the change request and document_slot=S + "_document". Preserve unaffected content
      and decisions. The bridge publishes S_section_plan, S_document, S_document_html,
      S_context_final and optional chapters; do not save these outputs again or reconstruct paths.
      HTML is deterministically rendered from the same Markdown, never rewritten by a second model.
      Non-blocking chapter warnings do not justify regeneration. Read only the returned exact
      file path when needed to ground the assessment. For design preserve the selected scope,
      evidence branch and risk gates; for handoff apply the stricter readiness checks.
      After generating/revising the document, call publish_product_stage_assessment(stage=S,
      status="draft" or "reviewable", execution_depth=resolved depth, checks=evidence-backed checks,
      decisions=proposed decisions, open_questions=remaining gaps, quality_notes=notes) once.
      Each checks entry is {"status":"passed|failed|not-checked", "evidence":"source/location"},
      not a prose string. Omit implementation_readiness outside handoff; a completed direction
      document does not mean implementation is ready. Keep unresolved facts as open_questions.
      Pass fields directly, not inside a value object. This tool validates and saves S_assessment
      together; do not call save_artifacts or a separate validator for the assessment.
      Omit optional empty collections. Unperformed checks are not-checked; missing or conflicting
      required inputs keep draft status. Never invent user approval or evidence. Only handoff
      may claim implementation readiness after its required checks and dependencies pass.
      If publication fails, repair all reported fields together and retry once. After success stop.
      Never pass artifact/workspace/Writer paths as reference_paths; omit reference_paths on the
      first load. Keep assessments and traces internal; no JSON, paths, chapter lists or recap.
    tools: &writer_document_tools [read_file, load_product_skill_contract, publish_product_stage_assessment, product_writer_generate_document_from_inputs, product_writer_revise_and_publish]
    terminal_tools: &assessment_publishers [publish_product_stage_assessment]
    inputs:
      - {material: resource_profiles, required: false}
      - {material: research_evidence, required: false}
      - {material: execution_plan, required: true}
      - {material: direction_task, required: true, alternatives: [upstream_direction]}
      - {material: direction_outline, required: true, alternatives: [upstream_direction]}
      - {material: direction_context_approved, required: true, alternatives: [upstream_direction]}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: direction_assessment}
      - {material: direction_section_plan, required: false}
      - {material: direction_chapters, required: false}
      - {material: direction_document}
      - {material: direction_document_html}
      - {material: direction_context_final}
    acceptance_criteria: The editable direction brief follows the approved outline and preserves evidence and decision status.

  analyze_competitive_position:
    label: 竞品与生态位分析
    mode: human
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="competitive") once; it returns the compact
      stage contract and never source snapshots. Then call
      load_product_stage_inputs(stage_id="competitive") once and use only its material contents;
      never call read_file, get_artifact, find_artifact, grep or list_artifacts for Workflow inputs.
      When upstream_competitive is present, revise that project's existing report according to the
      latest stage_approval.request_context, preserving unaffected findings and their original
      evidence dates; do not treat old public facts as newly verified. No re-upload or new window
      is needed to continue this shared project view.
      The returned research_evidence, material_digest and optional approved direction_document are
      the closed evidence set. The report must answer both current-product comparison and full
      ecosystem positioning across direct, indirect, substitute, status-quo and adjacent options.
      Generate one logical report with two synchronized representations: a compact responsive
      self-contained interactive HTML (the default view) and a Markdown document (the editable and
      downloadable view). Both must contain the same facts, recommendations, evidence dates,
      uncertainty and section semantics; do not independently invent or omit conclusions. Start
      with a plain-Chinese conclusion: what the market looks like, where this product should compete,
      and what the team should do next. Then show the comparison table, ecosystem position and product
      implications. Put research method, source limits and unresolved questions in one collapsed
      “依据与待确认” section at the end. Do not show workflow terms, evidence grades, tool states,
      artifact fields, English status values, or WEB-NNN/KB-NNN notation. When a real source exists,
      present its human title and link; when none exists, say only “本轮未使用外部资料，关键判断仍待验证”.
      Separate facts from recommendations through section headings and natural sentences, never by
      prefixing every paragraph with status labels. Both formats must be visually rich: use tables,
      a real SVG quadrant/coordinate chart when its axes and points are supported, and a dated event
      timeline when numeric trend data is insufficient. Markdown uses GFM tables, fenced Mermaid
      diagrams and only real bound images; HTML uses accessible inline SVG and interactive details.
      Call write_product_artifact_bundle(html_filename="competitive-analysis.html",
      markdown_filename="competitive-analysis.md", validate_as="competitive") once with both
      complete bodies. Save its returned html_path verbatim as competitive_analysis and its returned
      markdown_path verbatim as competitive_analysis_markdown, both with content_type="file"; never
      save or repeat source bodies as file values. Publish the assessment before stopping for approval.
      After saving both documents, call publish_product_stage_assessment(stage="competitive",
      status="draft" or "reviewable", checks=evidence-backed checks, decisions=proposed decisions,
      open_questions=remaining gaps). Pass fields directly, not inside value. It validates and saves
      competitive_assessment together. Stop after success; keep assessment and runtime trace internal.
      Each checks entry is {"status":"passed|failed|not-checked", "evidence":"source/location"}.
      Omit implementation_readiness; this stage does not assess readiness for implementation.
    tools: &html_stage_tools [load_product_skill_contract, publish_product_stage_assessment, load_product_stage_inputs, write_product_artifact_bundle]
    terminal_tools: *assessment_publishers
    inputs:
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: research_log, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: competitive_assessment}
      - {material: competitive_analysis}
      - {material: competitive_analysis_markdown}
    acceptance_criteria: The synchronized HTML and Markdown lead with the same readable market conclusion, use evidence-bound visuals, and keep research details separate.

  route_design_scope:
    route: choice
    label: 产品方案内部 Router
    mode: auto
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="design", reference_paths=[
      "references/boundary-and-routing.md", "references/evidence-and-effort.md",
      "references/human-in-the-loop.md", "references/multi-source-research.md"]).
      Classify actual changed objects: mechanism domains are domain_state, behavior_policy_trust,
      ia_semantics; experience domains are journey_interaction_service, ui_visual_system,
      content_communication. Assign primary and linked domains, then light/heavy per decision using
      cost/reversibility, divergence, impact/coupling and uncertainty; never average away risk.
      privacy, identity, permission, silent_write, cross_tenant and high_loss_irreversible force
      behavior_policy_trust to heavy. Parent execution_depth must not overwrite this choice.
      Preserve original request scope, heavy intent and hard gates when the latest input is Continue/Confirm.
      Use bound evidence only, with no retrieval or invented verification; uncertain trust/divergence/gates
      require heavy research next. Call publish_design_route_compact exactly once with short scalar strings:
      comma-separated canonical primary_domains, linked_domains, heavy_domains and hard_gates, plus a
      Chinese decision_summary of at most 120 characters. Omit empty fields; never use objects or arrays.
      The Host restores risk gates, validates decisions/escalation triggers, saves Chinese results and
      selects one native outgoing edge. Stop after publication; do not rewrite or save outputs yourself.
      Business decisions retain their separate confirmation boundary.
    tools: [load_product_skill_contract, publish_design_route_compact]
    terminal_tools: [publish_design_route_compact]
    inputs:
      - {material: routing_record, required: true}
      - {material: execution_plan, required: true}
      - {material: research_evidence, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: design_routing_record}
      - {material: design_effort_route}
      - {material: design_routing_summary}
    acceptance_criteria: |
      The record activates only actual primary/linked design domains, assigns every subdecision one
      validated effort, honors all hard gates, and selects exactly one light or heavy edge.

  collect_design_light_evidence:
    label: 产品方案轻量取证
    mode: auto
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="design") with reference_paths omitted. The Host loads
      all active primary/linked domain methods. Domain ids are not paths; only exact missing references/*.md
      from available_resources may be batched in one supplementary call. If explicitly offloaded, read only
      the returned file in pages (limit=80, advance offset until EOF), rather than loading the contract again.
      Follow the authorized light route, first checking bound current-product facts. Use inherited kb and
      web_search/url_fetch only where evidence can change a scoped decision; no inactive domains or future
      stages. Record actual WEB-NNN/KB-NNN sources and separate facts, inference, recommendations and unknowns.
      For sustained counterexamples, practice divergence or trust risk, call validate_design_escalation
      and save design_escalation. Preserve scope, triggering evidence and affected decisions; load their
      heavy methods and fulfill heavy requirements here, without returning to the Router. Unrelated
      light decisions stay light. A scope change or hard gate requires explicit scoped user confirmation
      and its source before a high-risk default. Save the complete packet and gaps as design_light_evidence;
      the Writer must consume the effective upgraded record.
    tools: [validate_design_escalation, load_product_skill_contract, read_file, web_search, url_fetch, kb]
    inputs: &design_evidence_inputs
      - {material: design_routing_record, required: true}
      - {material: research_evidence, required: true}
      - {material: research_log, required: true}
      - {material: material_digest, required: true}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
    outputs:
      - {material: design_escalation, required: false}
      - {material: design_light_evidence}
    acceptance_criteria: |
      Evidence stays within the approved design scope, supports each light decision at an honest
      conclusion strength, and exposes any trigger that requires escalation.

  collect_design_heavy_evidence:
    label: 产品方案重型取证
    mode: auto
    prompt: |
      {{runtime_instruction}}

      Call load_product_skill_contract(stage_id="design") with reference_paths omitted; it loads all
      active domain methods. Read the complete result. Only an explicit "Large result offloaded to file"
      with a File path authorizes read_file on that path, in pages of 80 lines through EOF. Otherwise do
      not read_file. Domain ids and available_resources are package identifiers, not runtime file paths.
      Batch only genuinely missing exact references/*.md entries in one supplementary contract call.
      Inspect callable tools: if web_search exists make at least one real attempt; otherwise attempt kb
      only when callable AND exact inherited kb_ids exist. Never enumerate, guess or substitute KB ids.
      If neither exists call publish_design_heavy_unavailable({}) immediately. A failed read_file proves
      nothing about search availability. Close a failed KB channel; url_fetch accepts only exact URLs
      from successful search or bound evidence, never invented/example URLs.
      Verify current-product facts then compare genuinely different product forms. Follow every active
      domain's heavy minimum sample/output requirements. Distinguish current fact, external fact,
      inference, proposed default, project preference and unknown. Preserve responsibility, rollback
      and human review for hard gates. Tool success alone is not completed domain research.
      Submit a Chinese packet to publish_design_heavy_evidence: a compact decisions list for a routed
      subdecision with decision_id, finding, counterevidence, conditions, remaining_gaps and source_refs.
      source_refs must be exact returned URLs, DOIs or knowledge-document ids from the live citation
      registry, never guessed WEB-NNN/KB-NNN ids or citation indices. Keep ids and proper nouns unchanged.
      Also supply actual tool_statuses and retrieval_status. Report failed/unavailable/limited honestly;
      missing evidence stays unknown/E0. Registered source bindings are at most provisional E1 until
      human semantic review; never claim E2/E3 or accept a decision. The Host validates sources and
      coverage and renders the evidence packet; do not save model-authored evidence directly.
      When no tools/sources are usable, publish_design_heavy_unavailable with {} gives a bounded gap
      packet. Do not loop, fabricate tool calls, retry malformed publication field by field, or use generic
      artifact tools to bypass the publisher. Repair all reported errors together once if necessary.
      After either terminal publisher succeeds stop immediately; no save_artifacts or extra recap.
      For zero usable locators use publish_design_heavy_unavailable() with exactly {} and no value,
      decisions, tool_statuses or source placeholders. Only when retrieval returns a usable exact
      locator call publish_design_heavy_evidence with one top-level value object under 700 characters;
      include at most one concise decision and never nest decisions inside tool_statuses. The Host
      fills missing routed decisions as unknown gaps. No retrieved counterexample is not proof of
      correctness; incomplete domain minimums cannot become “no gaps”. A plan is not completion;
      finish through one of the two publisher paths, without repeated searches after failure.
    tools: [load_product_skill_contract, read_file, web_search, url_fetch, kb, publish_design_heavy_evidence, publish_design_heavy_unavailable]
    terminal_tools: [publish_design_heavy_unavailable]
    inputs: *design_evidence_inputs
    outputs:
      - {material: design_heavy_evidence}
    acceptance_criteria: |
      Heavy evidence satisfies the activated domain contracts or explicitly lowers the conclusion
      ceiling, includes contrary evidence, and records all hard-gate confirmations and boundaries.

  build_design_outline:
    skip_if: {all: [{material: upstream_design}, {material: reuse_product_structure}]}
    label: 产品方案大纲生成
    mode: auto
    rerun_when: 用户要求重新生成、调整或局部修改产品方案大纲。
    prompt: *writer_outline_prompt
    tools: [load_product_skill_contract, read_file, product_writer_generate_outline_from_inputs, product_writer_revise_and_publish]
    terminal_tools: *outline_publishers
    inputs:
      - {material: execution_plan, required: true}
      - {material: design_routing_record, required: true}
      - {material: research_evidence, required: true}
      - {material: resource_profiles, required: true}
      - material: design_light_evidence
        required: true
        alternatives:
          - {material: design_heavy_evidence}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
      - {material: upstream_prototype, required: false}
      - {material: upstream_review, required: false}
      - {material: upstream_handoff, required: false}
      - {material: design_escalation, required: false}
    outputs:
      - {material: design_task}
      - {material: design_context}
      - {material: design_outline}
      - {material: design_outline_report}
      - {material: design_context_approved}
    acceptance_criteria: One editable design outline incorporates actual approved upstream artifacts and is approved by the user.

  write_design_document:
    label: 产品方案文档生成
    mode: human
    rerun_when: 用户要求修改、补充或局部重写产品方案文档。
    prompt: *writer_document_prompt
    tools: *writer_document_tools
