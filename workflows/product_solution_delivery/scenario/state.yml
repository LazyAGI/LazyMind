  finalize_product_delivery:
    label: 产品交付总结
    prompt: |
      {{runtime_instruction}}

      Call publish_product_handoff_state() once with exactly {} and no arguments. It consumes the
      bound selected-stage assessment, workspace_seed and host stage_approval without inventing
      acceptance events. It reads only the bound one-stage output, builds the source Skill's internal
      Artifact Manifest and shared Product Workspace snapshot, and atomically saves stage_manifest,
      workspace_state and the user-safe delivery_summary. This publisher is the sole completion path;
      never call save_artifacts and never print or reconstruct its JSON. The tool result is already the
      complete visible Chinese delivery summary, so stop immediately after it succeeds without adding
      assessment fields, paths, chapter lists, tool diagnostics or another recap. This is a hard stage boundary: the
      current Session ends in awaiting-stage-confirmation. The host's product-stage-relay operation
      handles explicit continue/switch-stage/finish, creates the next Session with exact upstream
      revisions and preserves this Session. Do not rewind a finished stage to simulate a new stage.
    tools: [publish_product_handoff_state]
    terminal_tools: [publish_product_handoff_state]
    inputs:
      - {material: routing_record, required: true}
      - {material: execution_plan, required: true}
      - {material: design_routing_record, required: false}
      - {material: direction_document, required: false}
      - {material: direction_document_html, required: false}
      - {material: competitive_analysis, required: false}
      - {material: competitive_analysis_markdown, required: false}
      - {material: design_document, required: false}
      - {material: design_document_html, required: false}
      - {material: prd_document, required: false}
      - {material: prd_document_html, required: false}
      - {material: prototype, required: false}
      - {material: prototype_markdown, required: false}
      - {material: review_document, required: false}
      - {material: review_document_html, required: false}
      - {material: handoff_document, required: false}
      - {material: handoff_document_html, required: false}
      - {material: product_materials, required: false}
      - {material: reference_sample, required: false}
      - {material: workspace_seed, required: false}
      - {material: stage_approval, required: false}
      - {material: direction_assessment, required: false}
      - {material: competitive_assessment, required: false}
      - {material: design_assessment, required: false}
      - {material: prd_assessment, required: false}
      - {material: prototype_assessment, required: false}
      - {material: review_assessment, required: false}
      - {material: handoff_assessment, required: false}
      - {material: upstream_direction, required: false}
      - {material: upstream_competitive, required: false}
      - {material: upstream_design, required: false}
      - {material: upstream_prd, required: false}
