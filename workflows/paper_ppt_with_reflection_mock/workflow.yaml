id: paper_ppt_with_reflection_mock
name: 阅读心得接续汇报 PPT
description: 核对心得与汇报 PPT 的输入串联，保留心得正文和原论文清单。下游生成能力开发中。
when_to_use: 仅用于用户选择先生成心得再制作科研 PPT 的接口联调。
steps:
- id: reflection
  label: 阅读心得输入
- id: ppt
  label: 汇报 PPT 交接
slots:
- id: task_context
  label: 任务上下文
  type: text
  cardinality: single
  external: true
  exposed: false
- id: reflection_markdown
  label: 心得正文
  type: text
  cardinality: single
- id: ppt_request
  label: PPT 输入与反馈
  type: json
  cardinality: single
runtime:
  publisher_owned_slots: [ppt_request]
  trigger_inputs:
  - task_context

tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_handoff_submit
  - academic_handoff_context
  - academic_read_paper

ui:
  tabs:
  - id: reflection
    step_id: reflection
    label: 阅读心得输入
    layout: list
    slots:
    - id: reflection_markdown
      label: 心得正文
  - id: ppt
    step_id: ppt
    label: 汇报 PPT 交接
    layout: list
    slots:
    - id: ppt_request
      label: PPT 输入与反馈
