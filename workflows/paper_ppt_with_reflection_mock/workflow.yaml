id: paper_ppt_with_reflection_mock
name: 阅读心得接续汇报 PPT
description: 核对心得与汇报 PPT 的输入串联，保留心得正文和原论文清单。下游生成能力开发中。
when_to_use: 仅用于用户选择先生成心得再制作科研 PPT 的接口联调。
steps:
- id: reflection
  label: 阅读心得输入
- id: ppt
  label: 汇报 PPT 交接
slots:
- id: task_context
  label: 任务上下文
  type: text
  cardinality: single
  external: true
  exposed: false
- id: reflection_markdown
  label: 心得正文
  type: text
  cardinality: single
- id: ppt_request
  label: PPT 输入与反馈
  type: json
  cardinality: single
runtime:
  execution:
    version: '1'
    skills:
    - scenario/execution.md
    constraints:
    - Follow the shared state.yml step specification, declared output schemas and acceptance criteria; preserve the
      user request and bound input revisions.
    - Validate actual artifacts before completion, honor questions and review pauses, and report missing capabilities
      without fabricating output.
    steps:
      reflection:
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
      ppt:
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
  publisher_owned_slots: [ppt_request]
  trigger_inputs:
  - task_context

tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_handoff_submit
  - academic_handoff_context
  - academic_read_paper

ui:
  slots:
    ppt_request:
      widgetType: json-block
      readOnly: true
      collapsed: true
  tabs:
  - id: reflection
    step_id: reflection
    label: 阅读心得输入
    layout: list
    slots:
    - id: reflection_markdown
      label: 心得正文
  - id: ppt
    step_id: ppt
    label: 汇报 PPT 交接
    layout: list
    slots:
    - id: ppt_request
      label: PPT 输入与反馈
