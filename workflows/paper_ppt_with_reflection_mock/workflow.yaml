id: paper_ppt_with_reflection_mock
name: 阅读心得接续汇报 PPT
description: 核对心得与汇报 PPT 的输入串联，保留心得正文和原论文清单。下游生成能力开发中。
when_to_use: 仅用于用户选择先生成心得再制作科研 PPT 的接口联调。
steps:
- id: reflection
  label: 阅读心得输入
- id: ppt
  label: 汇报 PPT 交接
slots:
- id: task_context
  label: 任务上下文
  type: text
  cardinality: single
  external: true
  exposed: false
- id: reflection_markdown
  label: 心得正文
  type: text
  cardinality: single
- id: ppt_request
  label: PPT 输入与反馈
  type: json
  cardinality: single
runtime:
  external_execution:
    version: '1'
    skills:
    - scenario/external.md
    constraints:
    - All generative reasoning and semantic/visual validation are performed by the external host subagent; never fall back
      to a LazyMind text or vision model.
    - Honor pinned input revisions, conditional outputs, requested scope and actual review boundaries. Missing required
      capabilities must be configured in LazyMind before retry.
    steps:
      reflection:
        prompt: Read scenario/external.md and its reflection step contract from this pinned package. Complete reflection
          using the bound evidence and the domain rules above. Generate and validate with your own host capabilities; return
          the real declared artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
        required_outputs:
        - reflection_markdown
        acceptance_criteria:
        - The external subagent has completed the declared objective, verified the actual outputs and reported concrete
          evidence without inventing state.
      ppt:
        prompt: Read scenario/external.md and its ppt step contract from this pinned package. Complete ppt using the bound
          evidence and the domain rules above. Generate and validate with your own host capabilities; return the real declared
          artifacts and verification evidence for hosted publication.
        tools:
        - name: academic_context
          source: package
        - name: academic_read_paper
          source: package
        required_outputs:
        - ppt_request
        acceptance_criteria:
        - The external subagent has completed the declared objective, verified the actual outputs and reported concrete
          evidence without inventing state.
  publisher_owned_slots: [ppt_request]
  trigger_inputs:
  - task_context

tool_scripts:
- path: scripts/tools.py
  functions:
  - academic_handoff_submit
  - academic_handoff_context
  - academic_read_paper

ui:
  slots:
    ppt_request:
      widgetType: json-block
      readOnly: true
      collapsed: true
  tabs:
  - id: reflection
    step_id: reflection
    label: 阅读心得输入
    layout: list
    slots:
    - id: reflection_markdown
      label: 心得正文
  - id: ppt
    step_id: ppt
    label: 汇报 PPT 交接
    layout: list
    slots:
    - id: ppt_request
      label: PPT 输入与反馈
